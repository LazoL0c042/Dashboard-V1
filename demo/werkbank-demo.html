  <script>
"use strict";

// SVG-Diagramme ohne Bibliothek (offline, kein Drittanbieter).
// Segmentfarben: geprüfte Palette für dunkle Flächen (dataviz-Validator gegen #211a40:
// Helligkeitsband, Farbsehschwäche-Abstand, Kontrast bestanden). Neon bleibt für die UI.
const SERIES = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"];
const OTHER_COLOR = "#6f6891";
const MAX_SLICES = 8;
const svgNs = "http://www.w3.org/2000/svg";

/** Farbe folgt dem Namen, nicht dem Rang: gleiche Liste → gleiche Farben, egal wie sortiert. */
function colorMap(names) {
  const sorted = [...new Set(names)].sort((a, b) => a.localeCompare(b, "de"));
  return Object.fromEntries(sorted.map((n, i) => [n, SERIES[i % SERIES.length]]));
}

/** Größte 7 behalten, Rest zu "Sonstige". items: [{name, value, ...}] */
function foldOther(items) {
  const sorted = [...items].sort((a, b) => b.value - a.value);
  if (sorted.length <= MAX_SLICES) return sorted;
  const keep = sorted.slice(0, MAX_SLICES - 1);
  const rest = sorted.slice(MAX_SLICES - 1);
  return [...keep, { name: `Sonstige (${rest.length})`, value: rest.reduce((s, x) => s + x.value, 0), other: true, members: rest }];
}

function arcPath(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}`;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M ${p(r1, a0)} A ${r1} ${r1} 0 ${large} 1 ${p(r1, a1)} L ${p(r0, a1)} A ${r0} ${r0} 0 ${large} 0 ${p(r0, a0)} Z`;
}

const tooltip = (() => {
  let el;
  return {
    show(html, x, y) {
      el ||= Object.assign(document.createElement("div"), { className: "chart-tip", role: "tooltip" });
      if (!el.isConnected) document.body.appendChild(el);
      el.innerHTML = html;
      el.style.display = "block";
      const w = el.offsetWidth, h = el.offsetHeight;
      el.style.left = `${Math.min(window.innerWidth - w - 8, Math.max(8, x + 14))}px`;
      el.style.top = `${Math.max(8, y - h - 12)}px`;
    },
    hide() { if (el) el.style.display = "none"; },
  };
})();

/**
 * Ringdiagramm mit Legende. items: [{name, value}], opts: {center, onSelect(item), fmt, colors}
 * Jedes Segment ist per Tastatur erreichbar; Hover/Tippen zeigt Wert und Anteil.
 */
function donut(host, items, opts = {}) {
  const fmt = opts.fmt || eur;
  const data = foldOther(items.filter((x) => x.value > 0));
  const total = data.reduce((s, x) => s + x.value, 0);
  const colors = opts.colors || colorMap(data.map((x) => x.name));
  const color = (x) => (x.other ? OTHER_COLOR : colors[x.name] || OTHER_COLOR);
  host.innerHTML = `
    <div class="donut">
      <svg viewBox="0 0 220 220" role="img" aria-label="${esc(opts.label || "Verteilung")}"></svg>
      <div class="donut-center"><small>${esc(opts.centerLabel || "Gesamt")}</small><b>${fmt(total)}</b></div>
    </div>
    <ul class="legend">${data.map((x, i) => `
      <li><button data-i="${i}" ${opts.onSelect && !x.other ? "" : "disabled"}>
        <i style="background:${color(x)}"></i><span class="grow">${esc(x.name)}</span>
        <span class="num">${fmt(x.value)}</span><span class="muted">${total ? ((x.value / total) * 100).toLocaleString("de-DE", { maximumFractionDigits: 1 }) : 0} %</span>
      </button></li>`).join("")}</ul>`;
  const svg = host.querySelector("svg");
  let a = -Math.PI / 2;
  data.forEach((x, i) => {
    const share = total ? x.value / total : 0;
    // Ein einzelnes 100-%-Segment als zwei Hälften, sonst ist der Bogen leer
    const parts = share >= 0.9999 ? [[a, a + Math.PI], [a + Math.PI, a + 2 * Math.PI]] : [[a, a + share * 2 * Math.PI]];
    parts.forEach(([a0, a1]) => {
      const path = document.createElementNS(svgNs, "path");
      path.setAttribute("d", arcPath(110, 110, 62, 100, a0, a1));
      path.setAttribute("fill", color(x));
      path.setAttribute("class", "slice");
      path.setAttribute("tabindex", "0");
      path.setAttribute("role", opts.onSelect && !x.other ? "button" : "img");
      path.setAttribute("aria-label", `${x.name}: ${fmt(x.value)}, ${Math.round(share * 1000) / 10} Prozent`);
      path.dataset.i = i;
      svg.appendChild(path);
    });
    a += share * 2 * Math.PI;
  });
  const tip = (x, ev) => {
    const share = total ? (x.value / total) * 100 : 0;
    const extra = x.members ? `<br><small>${x.members.map((m) => esc(m.name)).join(", ")}</small>` : "";
    tooltip.show(`<b>${esc(x.name)}</b><br>${fmt(x.value)} · ${share.toLocaleString("de-DE", { maximumFractionDigits: 1 })} %${extra}`,
      ev.clientX, ev.clientY);
  };
  const pick = (el) => data[+el.dataset.i];
  svg.addEventListener("pointermove", (ev) => { if (ev.target.dataset.i) tip(pick(ev.target), ev); });
  svg.addEventListener("pointerleave", () => tooltip.hide());
  svg.addEventListener("focusin", (ev) => {
    const r = ev.target.getBoundingClientRect();
    tip(pick(ev.target), { clientX: r.left + r.width / 2, clientY: r.top });
  });
  svg.addEventListener("focusout", () => tooltip.hide());
  const select = (x) => { if (opts.onSelect && x && !x.other) { tooltip.hide(); opts.onSelect(x); } };
  svg.addEventListener("click", (ev) => { if (ev.target.dataset.i) select(pick(ev.target)); });
  svg.addEventListener("keydown", (ev) => {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.dataset.i) { ev.preventDefault(); select(pick(ev.target)); }
  });
  host.querySelectorAll(".legend button").forEach((b) => b.addEventListener("click", () => select(data[+b.dataset.i])));
}

/** Runde Achsenstufen (1, 2, 2,5, 5 × 10^n), die den Bereich abdecken. */
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / (count - 1);
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((st) => st >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}

/**
 * Liniendiagramm mit Fadenkreuz. points: [{date, ...}], series: [{key, label, color, dash}]
 * Eine y-Achse; Legende immer sichtbar (2 Reihen), Werte im Tooltip.
 */
function lineChart(host, points, series, opts = {}) {
  const fmt = opts.fmt || eur;
  const W = Math.max(280, host.clientWidth || 600), H = opts.height || 240;
  const m = { t: 12, r: 12, b: 26, l: 64 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = points.flatMap((p) => series.map((s) => p[s.key]));
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = (i) => m.l + (points.length < 2 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const short = (v) => (Math.abs(v) >= 1e6 ? `${(v / 1e6).toLocaleString("de-DE", { maximumFractionDigits: 1 })} Mio`
    : Math.abs(v) >= 1e4 ? `${(v / 1e3).toLocaleString("de-DE", { maximumFractionDigits: 0 })} Tsd`
    : v.toLocaleString("de-DE", { maximumFractionDigits: 0 }));
  const nx = Math.max(2, Math.min(6, Math.floor(iw / 95)));
  const xt = Array.from({ length: nx }, (_, k) => Math.round((k / (nx - 1)) * (points.length - 1)))
    .filter((v, i, a) => a.indexOf(v) === i);
  const spanDays = points.length > 1 ? dayDiff(points[0].date, points[points.length - 1].date) : 0;
  const axisLabel = (iso) => new Date(iso + "T12:00").toLocaleDateString("de-DE",
    spanDays > 120 ? { month: "short", year: "2-digit" } : { day: "numeric", month: "short" });
  const dLabel = (iso) => new Date(iso + "T12:00").toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" });
  const line = (key) => points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(" ");
  const first = series[0];
  host.innerHTML = `
    <ul class="legend inline">${series.map((s) => `<li><i class="${s.dash ? "dash" : ""}" style="--c:${s.color}"></i>${esc(s.label)}</li>`).join("")}</ul>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(opts.label || "Verlauf")}">
      <defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="${first.color}" stop-opacity=".28"/><stop offset="1" stop-color="${first.color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${ticks.map((t) => `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>
        <text class="axis" x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("")}
      ${xt.map((i) => `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"}">${axisLabel(points[i].date)}</text>`).join("")}
      <path d="${line(first.key)} L${x(points.length - 1)} ${m.t + ih} L${x(0)} ${m.t + ih} Z" fill="url(#area)"/>
      ${series.map((s) => `<path d="${line(s.key)}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`).join("")}
      <g class="cross" style="display:none"><line y1="${m.t}" y2="${m.t + ih}"/>${series.map((s) => `<circle r="4.5" fill="${s.color}"/>`).join("")}</g>
      <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" tabindex="0"
        aria-label="Verlauf durchgehen mit Pfeiltasten"/>
    </svg>`;
  const svg = host.querySelector("svg"), cross = svg.querySelector(".cross"), hit = svg.querySelector(".hit");
  let cur = points.length - 1;
  const show = (i, cx, cy) => {
    cur = Math.max(0, Math.min(points.length - 1, i));
    const p = points[cur];
    cross.style.display = "";
    cross.querySelector("line").setAttribute("x1", x(cur));
    cross.querySelector("line").setAttribute("x2", x(cur));
    cross.querySelectorAll("circle").forEach((c, k) => { c.setAttribute("cx", x(cur)); c.setAttribute("cy", y(p[series[k].key])); });
    const diff = opts.diff ? opts.diff(p) : "";
    tooltip.show(`<b>${dLabel(p.date)}</b>${series.map((s) => `<br><i class="sw" style="background:${s.color}"></i>${esc(s.label)}: ${fmt(p[s.key])}`).join("")}${diff}`, cx, cy);
  };
  const fromEvent = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    return Math.round(((px - m.l) / iw) * (points.length - 1));
  };
  hit.addEventListener("pointermove", (ev) => show(fromEvent(ev), ev.clientX, ev.clientY));
  hit.addEventListener("pointerdown", (ev) => show(fromEvent(ev), ev.clientX, ev.clientY));
  hit.addEventListener("pointerleave", () => { cross.style.display = "none"; tooltip.hide(); });
  hit.addEventListener("keydown", (ev) => {
    const step = { ArrowLeft: -1, ArrowRight: 1, Home: -1e9, End: 1e9 }[ev.key];
    if (step === undefined) return;
    ev.preventDefault();
    const r = hit.getBoundingClientRect();
    show(cur + step, r.left + (x(Math.max(0, Math.min(points.length - 1, cur + step))) / W) * r.width, r.top + 20);
  });
  hit.addEventListener("blur", () => { cross.style.display = "none"; tooltip.hide(); });
}

</script>
  <script>
"use strict";

// ---------------------------------------------------------------- Spracheingabe (lokales Whisper)
const MIC_SVG = `<svg viewBox="0 0 16 18" shape-rendering="crispEdges" aria-hidden="true">

  <rect x="6" y="10" width="4" height="1"/><rect x="3" y="7" width="1" height="3"/><rect x="12" y="7" width="1" height="3"/>
  <rect x="4" y="10" width="1" height="1"/><rect x="11" y="10" width="1" height="1"/><rect x="5" y="11" width="6" height="1"/>

  <g fill="#ff9ade"><rect x="6" y="4" width="4" height="1"/><rect x="6" y="6" width="4" height="1"/><rect x="6" y="8" width="4" height="1"/></g>
</svg>`;
const MAX_REC_SEC = 120;
const MIME_TYPES = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"];

const Voice = {
  state: "idle", stream: null, rec: null, chunks: [], blob: null, cancelled: false,
  t0: 0, tick: null, raf: null, audioCtx: null,

  set(state, status, transcriptHtml) {
    this.state = state;
    const panel = $("#voice");
    if (!panel) return;
    panel.dataset.state = state;
    if (status !== undefined) $("#vstatus").textContent = tx(status);
    if (transcriptHtml !== undefined) $("#transcript").innerHTML = transcriptHtml;
    const mic = $("#mic");
    mic.disabled = state === "busy";
    mic.setAttribute("aria-pressed", String(state === "rec"));
    mic.setAttribute("aria-label", state === "rec" ? "Aufnahme beenden und senden" : "Aufnahme starten");
    if (state !== "rec") $("#rec-timer").textContent = `00:00 / ${fmtSec(MAX_REC_SEC)}`;
    $("#vactions").innerHTML =
      state === "rec" ? `<button class="ghost" data-voice="cancel">Abbrechen</button>`
      : state === "error" && this.blob ? `<button class="primary" data-voice="retry">Nochmal senden</button>
          <button class="ghost" data-voice="discard">Verwerfen</button>` : "";
  },

  toggle() {
    if (this.state === "rec") this.stop();
    else if (this.state !== "busy") this.start();
  },

  async start() {
    Speech.stop();
    Speech.unlock();
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      return this.fail("Das Mikrofon braucht HTTPS (tailscale serve) oder localhost.");
    }
    if (!window.MediaRecorder) return this.fail("Dieser Browser kann nicht aufnehmen.");
    try {
      this.stream = await navigator.mediaDevices.getUserMedia(
        { audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    } catch (e) {
      return this.fail(e.name === "NotAllowedError"
        ? "Mikrofon-Zugriff verweigert. In den Browser-Einstellungen erlauben." : "Kein Mikrofon gefunden.");
    }
    const mime = MIME_TYPES.find((m) => MediaRecorder.isTypeSupported?.(m)) || "";
    this.rec = new MediaRecorder(this.stream, mime ? { mimeType: mime } : undefined);
    this.chunks = []; this.cancelled = false; this.blob = null;
    this.rec.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => {
      this.release();
      if (this.cancelled) return this.set("idle", "Abgebrochen", "");
      this.blob = new Blob(this.chunks, { type: this.rec.mimeType || mime || "audio/webm" });
      this.send();
    };
    this.rec.start();
    this.t0 = Date.now();
    this.set("rec", "Jarvis hört zu …", "");
    Sfx.play("start");
    this.meter();
    this.tick = setInterval(() => {
      const s = Math.floor((Date.now() - this.t0) / 1000);
      const t = $("#rec-timer");
      if (t) t.textContent = `${fmtSec(s)} / ${fmtSec(MAX_REC_SEC)}`;
      if (s >= MAX_REC_SEC) this.stop();
    }, 250);
  },

  stop() {
    if (this.rec?.state !== "recording") return;
    Sfx.play("stop");
    this.rec.stop();
  },

  cancel() {
    if (this.rec?.state !== "recording") return;
    this.cancelled = true;
    this.rec.stop();
  },

  release() {
    clearInterval(this.tick);
    cancelAnimationFrame(this.raf);
    this.stream?.getTracks().forEach((t) => t.stop());
    this.stream = null;
    this.audioCtx?.close().catch(() => {});
    this.audioCtx = null;
    document.querySelectorAll("#meter i").forEach((i) => { i.style.height = ""; });
    $("#voice")?.style.setProperty("--lvl", "0");
  },

  meter() {
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const an = this.audioCtx.createAnalyser();
      an.fftSize = 64;
      this.audioCtx.createMediaStreamSource(this.stream).connect(an);
      const data = new Uint8Array(an.frequencyBinCount);
      const bars = [...document.querySelectorAll("#meter i")];
      const loop = () => {
        an.getByteFrequencyData(data);
        bars.forEach((b, i) => { b.style.height = `${3 + (data[i + 1] / 255) * 31}px`; });
        const lvl = data.slice(1, 12).reduce((a, v) => a + v, 0) / (11 * 255);
        $("#voice")?.style.setProperty("--lvl", Math.min(1, lvl * 2.2).toFixed(2));
        this.raf = requestAnimationFrame(loop);
      };
      loop();
    } catch { /* Pegel ist nur Deko */ }
  },

  async send() {
    this.set("busy", "Jarvis versteht …");
    try {
      const res = await fetch("/api/voice", {
        method: "POST", body: this.blob,
        headers: { Authorization: `Bearer ${token()}`, "Content-Type": this.blob.type || "audio/webm" },
      });
      if (res.status === 401) return logout("Token ungültig");
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return this.fail(data.detail || `Fehler ${res.status}`);
      this.blob = null;
      Hud.handleResult({ ...data, source: "voice" });
    } catch {
      this.fail("Server nicht erreichbar. Die Aufnahme ist noch da.");
    }
  },

  fail(msg) {
    Sfx.play("error");
    this.set("error", "Fehler", esc(msg));
    const p = $("#voice");
    if (!p) return;
    p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
  },
};

/** Dicker Balken in Bereichsfarbe: dunkle Rinne, Glanzkante; füllt sich beim Anzeigen. */
const bar = (frac, color, label = "") => `<div class="gbar" style="--c:${color}" role="meter" aria-valuemin="0" aria-valuemax="100"
  aria-valuenow="${Math.round(Math.max(0, Math.min(1, frac || 0)) * 100)}"${label ? ` aria-label="${esc(label)}"` : ""}>
  <i data-w="${(Math.max(0, Math.min(1, frac || 0)) * 100).toFixed(1)}%"></i></div>`;

/** Zahl, die beim Anzeigen kurz hochzählt (nur die ganze Zahl; Rest steht fest daneben). */
const num = (n, suffix = "", prefix = "") => `<span class="num" data-count="${Math.round(n)}">${prefix}${Math.round(n).toLocaleString("de-DE")}${suffix}</span>`;

function animateIn(root) {
  const calm = reducedMotion();
  requestAnimationFrame(() => root.querySelectorAll(".gbar i[data-w]").forEach((i) => { i.style.width = i.dataset.w; }));
  if (calm) return;
  root.querySelectorAll(".num[data-count]").forEach((el) => {
    const to = +el.dataset.count, text = el.textContent, i0 = text.search(/\d/);
    const pre = text.slice(0, i0), post = text.slice(i0).replace(/^[\d.]+/, "");
    if (!to || i0 < 0) return;
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 350);
      el.textContent = pre + Math.round(to * (1 - (1 - k) ** 3)).toLocaleString("de-DE") + post;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/** Einfaches Säulendiagramm (eine Reihe, Bereichsfarbe), Tooltip je Säule, Werte nur an der letzten. */
function columnChart(values, labels, color, fmt = (v) => String(v), title = "") {
  const W = 320, H = 130, B = 20, T = 14, max = Math.max(1, ...values), bw = W / values.length;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  return `<svg class="cchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
    <line x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" class="c-base"/>
    ${values.map((v, i) => {
      const x = i * bw + bw * 0.2, w = bw * 0.6, top = v ? y(v) : H - B - 2;
      return `<g class="c-col"><rect x="${i * bw}" y="0" width="${bw}" height="${H - B}" class="c-hit"><title>${esc(labels[i])}: ${esc(fmt(v))}</title></rect>
        <rect x="${x}" y="${top}" width="${w}" height="${H - B - top}" rx="4" fill="${v ? color : "currentColor"}" class="${v ? "c-bar" : "c-zero"}"/>
        <text x="${x + w / 2}" y="${H - 5}" class="c-lab" text-anchor="middle">${esc(labels[i])}</text>
        ${i === values.length - 1 && v ? `<text x="${x + w / 2}" y="${top - 4}" class="c-val" text-anchor="middle">${esc(fmt(v))}</text>` : ""}</g>`;
    }).join("")}</svg>`;
}

const Hud = {
  d: null, open: null, quick: false,

  async refresh() {
    const t = todayIso();
    const [today, plan, open, done, agenda, missions, projects, school, health, news, thoughts] = await Promise.all([
      api("/api/today"), api("/api/plan"), api("/api/todos?done=0"), api("/api/todos?done=1"),
      api(`/api/agenda?start=${mondayIso()}&days=7`), api("/api/missions"), api("/api/projects"), api("/api/school"),
      api("/api/wellness"), api("/api/news"), api("/api/thoughts")]);
    if (current !== "today" || !$("#hub")) return;
    this.d = { t, today, plan, open, done, agenda, missions, projects, school, health, news, thoughts, money: this.d?.money || null };
    this.player();
    this.riddles(today);
    this.tiles();
    if (this.open) this.detail(this.open, false);
    if (!this.d.money) this.money();
  },

  async money(force = false) {
    try { this.d.money = await api(`/api/portfolio${force ? "?refresh=1" : ""}`); } catch (e) { if (e.message !== "auth") this.d.money = { error: e.message }; }
    if (current !== "today" || !$("#hub")) return;
    this.tiles();
    if (this.open === "finance") this.detail("finance", false);
  },

  // ---------------------------------------------------------------- Kennzahlen je Bereich
  metric(id) {
    const { t, open, done, agenda, plan, missions, projects, today, health, news, thoughts, money } = this.d;
    const mon = mondayIso();
    switch (id) {
      case "todos": {
        const late = open.filter((x) => x.due_date && x.due_date < t).length;
        const doneWeek = done.filter((x) => (x.done_at || "") >= mon).length;
        return { value: num(open.length), sub: late ? `<b class="late">${late} überfällig</b>` : "offen",
          bar: doneWeek / Math.max(1, doneWeek + open.length), barLabel: `${doneWeek} diese Woche erledigt` };
      }
      case "week": {
        const load = plan.totals.week_load_min, free = plan.totals.week_free_min;
        return { value: num(agenda.events.length), sub: agenda.events.length === 1 ? "Termin diese Woche" : "Termine diese Woche",
          bar: free ? load / free : 0, barLabel: `${fmtMin(load)} von ${fmtMin(free)} freier Zeit verplant` };
      }
      case "learn": {
        const hs = today.habits.filter((h) => h.category === "Lernen");
        const got = hs.reduce((a, h) => a + h.week_count, 0), want = hs.reduce((a, h) => a + h.target_per_week, 0);
        const q = want ? got / want : 0;
        return { value: num(q * 100, " %"), sub: "Lernquote diese Woche", bar: q, barLabel: `${got} von ${want} Einheiten` };
      }
      case "finance": {
        if (!money) return { value: `<span class="num">…</span>`, sub: "Kurse laden", bar: 0 };
        if (money.error || !money.positions?.length) return { value: `<span class="num">–</span>`, sub: money.error ? "nicht erreichbar" : "keine Positionen", bar: 0 };
        const up = money.pnl >= 0;
        return { value: vaultOpen() ? `<span class="num">${esc(compact(money.total))} €</span>` : `<span class="num veil">•••</span>`,
          sub: vaultOpen() ? `<b class="${up ? "gain" : "loss"}">${up ? "▲" : "▼"} ${esc(pct(money.pnl_pct))}</b>` : "verdeckt, antippen",
          stack: money.allocation.portfolio };
      }
      case "projects": {
        const m = missions.find((x) => x.status === "aktiv");
        const active = projects.filter((p) => p.status === "aktiv").length;
        return m ? { value: num(m.progress.pct, " %"), sub: `${active} Projekt${active === 1 ? "" : "e"} aktiv`, bar: m.progress.pct / 100,
          barLabel: `${m.title}: ${m.progress.done} von ${m.progress.total} Schritten` }
          : { value: num(active), sub: "Projekte aktiv", bar: 0 };
      }
      case "health": {
        const s = health.sport;
        return { value: `${num(s.week_sessions)}<small>/${s.target}</small>`, sub: "Sport diese Woche",
          bar: s.target ? s.week_sessions / s.target : 0, barLabel: `${s.week_sessions} von ${s.target} Einheiten` };
      }
      case "thoughts": {
        const lastMon = (() => { const d = new Date(mon + "T12:00"); d.setDate(d.getDate() - 7); return d.toLocaleDateString("sv-SE"); })();
        const now = thoughts.filter((x) => x.created_at.slice(0, 10) >= mon).length;
        const before = thoughts.filter((x) => x.created_at.slice(0, 10) >= lastMon && x.created_at.slice(0, 10) < mon).length;
        return { value: num(now), sub: now === 1 ? "Eintrag diese Woche" : "Einträge diese Woche",
          bar: now / Math.max(1, now, before), barLabel: `Vorwoche: ${before}` };
      }
      case "news": {
        const fresh = news.categories.reduce((a, c) => a + c.headlines.filter((h) => h.published && Date.now() - new Date(h.published) < 864e5).length, 0);
        const st = Object.values(news.status), ok = st.filter((x) => x.ok).length;
        return { value: num(fresh), sub: "neue Meldungen", bar: st.length ? ok / st.length : 0, barLabel: `${ok} von ${st.length} Quellen erreichbar` };
      }
    }
    return { value: "–", sub: "", bar: 0 };
  },

  // ---------------------------------------------------------------- Spielerkarte
  player() {
    const { t, today, done, open } = this.d;
    const doneToday = done.filter((x) => (x.done_at || "").slice(0, 10) === t).length;
    const dueOpen = open.filter((x) => x.due_date && x.due_date <= t).length;
    const habitsDone = today.habits.filter((h) => h.today_done).length;
    const total = doneToday + dueOpen + today.habits.length, got = doneToday + habitsDone;
    const date = new Date(t + "T12:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
    $("#player").innerHTML = `
      <div class="pc-top"><div><b class="pc-name">${esc(playerName())}</b><span class="pc-date">${esc(date)}</span></div>
        <div class="pc-tools"><button class="icon-btn" id="sfx" aria-pressed="${Sfx.on}">${Sfx.on ? "Ton an" : "Ton aus"}</button>
          <button class="icon-btn" id="skin-toggle">${Skin.fantasy ? "Spiel-Look" : "Mittelalter"}</button></div></div>
      <div class="pc-prog"><span>Tagesfortschritt</span><b>${num(got)} von ${total}</b></div>
      ${bar(total ? got / total : 0, "var(--hub-accent)", "Tagesfortschritt")}`;
    animateIn($("#player"));
    $("#sfx").onclick = () => { Sfx.toggle(); Sfx.play("blip"); this.player(); };
    $("#skin-toggle").onclick = () => { Skin.set(Skin.fantasy ? "spiel" : "fantasy"); Sfx.play("coin"); render(); };
  },

  // ---------------------------------------------------------------- Kacheln
  tiles() {
    AREAS.forEach((a) => {
      const el = $(`#tile-${a.id}`);
      if (!el) return;
      const m = this.metric(a.id);
      const barHtml = m.stack ? this.stackBar(m.stack) : bar(m.bar, a.color, m.barLabel);
      el.innerHTML = `${emblem(a.sym, a.color, false, a.ink)}<span class="t-name">${esc(tx(a.name))}</span>
        <span class="t-val">${m.value}</span><span class="t-sub">${m.sub}</span>${barHtml}`;
      el.setAttribute("aria-label", `${tx(a.name)}: Details öffnen`);
      el.classList.toggle("active", this.open === a.id);
    });
    animateIn($("#hub"));
  },

  /** Verteilung als gestapelter Balken (geprüfte Palette, 2px Abstand zwischen Segmenten). */
  stackBar(items) {
    const total = items.reduce((a, b) => a + b.value, 0) || 1;
    return `<div class="gbar stack" role="img" aria-label="Verteilung: ${items.map((i) => `${esc(i.name)} ${i.pct} %`).join(", ")}">${
      items.slice(0, SERIES.length).map((it, i) => `<i data-w="${((it.value / total) * 100).toFixed(1)}%" style="background:${SERIES[i]}" title="${esc(it.name)}: ${it.pct.toLocaleString("de-DE")} %"></i>`).join("")}</div>`;
  },

  riddles(d) {
    $("#riddles").innerHTML = d.inbox.length
      ? `<h3 class="sub-h">! ${d.inbox.length} offen in der Inbox</h3>${d.inbox.map(inboxItem).join("")}` : "";
    const wasOpen = $("#log details")?.open;
    $("#log").innerHTML = d.recent.length ? `<details class="log-box" ${wasOpen ? "open" : ""}><summary>Verlauf (${d.recent.length})</summary><ul class="list log">${
      d.recent.map((r) => `<li><div class="grow">${esc(r.summary)}<div class="meta">${esc(r.created_at.slice(11, 16))} Uhr</div></div>
        <button class="link" data-undo-row="${r.id}">Rückgängig</button></li>`).join("")}</ul></details>` : "";
  },

  handleResult(r) {
    if (r.status === "empty") {
      Sfx.play("error");
      return Voice.set("idle", "Nichts verstanden", "Nochmal, etwas näher am Mikro?");
    }
    const said = r.transcript ? `„${esc(r.transcript)}“` : "";
    if (r.answered) {  // Frage: Antwort als Sprechblase, vorgelesen
      Voice.set("done", Skin.fantasy ? "Knorz weiß Bescheid" : "Jarvis antwortet", `${said}<span class="answer">${esc(r.reply)}</span>`);
      Speech.say(r.reply);
    } else {
      Voice.set("done", r.reply || "Gespeichert", said);
      if (r.source === "voice") Speech.say(r.reply);  // gesprochen rein → gesprochen raus
    }
    Sfx.play("coin");
    lootFor(r).forEach((x, i) => lootPop(x, i * 380));
    this.refresh().catch(showError);
  },

  // ---------------------------------------------------------------- Detailansicht (Missions-Log)
  openDetail(id) {
    this.open = id;
    this.quick = false;
    $("#hub-wrap").classList.add("detail-open");
    document.body.classList.toggle("noscroll", !window.matchMedia("(min-width: 1024px)").matches);
    this.detail(id, true);
    this.tiles();
    Sfx.play("blip");
  },

  closeDetail() {
    if (!this.open) return false;
    const was = this.open;
    this.open = null;
    $("#hub-wrap")?.classList.remove("detail-open");
    document.body.classList.remove("noscroll");
    const panel = $("#detail");
    if (panel) { panel.hidden = true; panel.innerHTML = ""; }
    this.tiles();
    $(`#tile-${was}`)?.focus({ preventScroll: true });
    return true;
  },

  detail(id, fresh) {
    const a = area(id), m = this.metric(id), panel = $("#detail");
    const quick = { todos: "Neues To-do", week: "Neuer Termin", learn: "Lernen abhaken", finance: "Position anlegen",
      projects: "Neuer Schritt", health: "Sport eintragen", thoughts: "Neuer Gedanke", news: "Jetzt abrufen" }[id];
    const scroll = panel.scrollTop;
    panel.hidden = false;
    panel.style.setProperty("--c", a.color);
    panel.innerHTML = `
      <header class="d-head">
        <button class="d-back" data-close aria-label="Zurück">${sym("back")}</button>
        ${emblem(a.sym, a.color, true, a.ink)}
        <div class="d-title"><h2>${esc(tx(a.name))}</h2><div class="d-val">${m.value}</div><div class="d-sub">${m.sub}</div></div>
        <button class="d-plus" data-quick aria-label="${esc(quick)}" title="${esc(quick)}">${sym(id === "news" ? "refresh" : "plus")}</button>
      </header>
      <div id="d-quick"></div>
      <div class="d-body">${this.body(id)}</div>
      <p class="d-more"><a href="#${a.page}">Alle Details unter ${esc(tx(a.name))} ›</a></p>`;
    if (this.quick) this.quickForm(id);
    animateIn(panel);
    if (!fresh) panel.scrollTop = scroll;
    else panel.focus({ preventScroll: true });
  },

  body(id) {
    const { t, open, done, agenda, plan, missions, projects, school, health, news, thoughts, money, today } = this.d;
    const c = area(id).color, week7 = daysBack(7), wd = (d) => WD[(new Date(d + "T12:00").getDay() + 6) % 7];
    const sum = (html) => `<p class="d-sum">${html}</p>`;
    switch (id) {
      case "todos": {
        const perDay = week7.map((d) => done.filter((x) => (x.done_at || "").slice(0, 10) === d).length);
        const late = open.filter((x) => x.due_date && x.due_date < t);
        const blocks = plan.days[0].blocks;
        return sum(`Diese Woche: <b>${done.filter((x) => (x.done_at || "") >= mondayIso()).length}</b> erledigt, <b>${open.length}</b> offen${late.length ? `, <b class="late">${late.length} überfällig</b>` : ""}.`)
          + `<h3 class="sub-h">Erledigt pro Tag</h3>${columnChart(perDay, week7.map(wd), c, String, "Erledigte To-dos der letzten 7 Tage")}`
          + `<h3 class="sub-h">Offen</h3>${open.length ? `<ul class="qlist">${open.slice(0, 12).map(questItem).join("")}</ul>` : `<p class="empty">Nichts offen.</p>`}`
          + (blocks.length ? `<h3 class="sub-h">Heute eingeplant</h3><ul class="list">${blocks.map((b) => `<li><div class="grow">${esc(b.title)}</div><span class="meta">${fmtMin(b.minutes)}</span></li>`).join("")}</ul>` : "");
      }
      case "week": {
        const load = plan.days.map((d) => d.free_min ? Math.min(1, (d.free_min - d.left_min) / d.free_min) : 0);
        const byDay = {};
        agenda.events.forEach((e) => (byDay[e.start.slice(0, 10)] ||= []).push(e));
        return sum(`Diese Woche: <b>${agenda.events.length}</b> Termine, <b>${fmtMin(plan.totals.week_load_min)}</b> Arbeit auf <b>${fmtMin(plan.totals.week_free_min)}</b> freie Zeit verplant.`)
          + `<h3 class="sub-h">Auslastung der nächsten Tage</h3><div class="d-meters">${plan.days.map((d, i) => `<div><span>${esc(d.weekday.slice(0, 2))}</span>${bar(load[i], c, `${d.weekday}: ${Math.round(load[i] * 100)} % verplant`)}<small>${d.free_min ? `${Math.round(load[i] * 100)} %` : "frei"}</small></div>`).join("")}</div>`
          + (plan.recommendations.length ? `<h3 class="sub-h">Empfehlungen</h3><ul class="list">${plan.recommendations.slice(0, 3).map((r) => `<li class="rec ${r.level}"><span class="grow">${esc(r.text)}</span></li>`).join("")}</ul>` : "")
          + `<h3 class="sub-h">Termine</h3>${Object.keys(byDay).sort().map((d) => `<div class="cal-day ${d === t ? "today" : ""}"><b>${d === t ? "Heute" : esc(fmtDate(d))}</b><ul class="evs">${byDay[d].map((e) =>
            `<li class="ev"><span class="ev-time">${e.all_day ? "ganztägig" : e.start.slice(11, 16)}</span><span class="grow">${esc(e.title)}</span></li>`).join("")}</ul></div>`).join("") || `<p class="empty">Keine Termine diese Woche.</p>`}`;
      }
      case "learn": {
        const hs = today.habits.filter((h) => h.category === "Lernen");
        const got = hs.reduce((a, h) => a + h.week_count, 0), want = hs.reduce((a, h) => a + h.target_per_week, 0);
        const labels = school.study_weeks.map((_, i) => i === school.study_weeks.length - 1 ? "diese" : `-${school.study_weeks.length - 1 - i} Wo`);
        return sum(`Diese Woche: <b>${got} von ${want}</b> Lerneinheiten, <b>${fmtMin(school.study_week_min)}</b> gelernt. Notenschnitt <b>${fmtGrade(school.avg)}</b>.`)
          + `<h3 class="sub-h">Lernzeit pro Woche</h3>${columnChart(school.study_weeks, labels, c, fmtMin, "Lernzeit der letzten Wochen")}`
          + (hs.length ? `<h3 class="sub-h">Checkliste</h3>${hs.map((h) => `<div class="habit"><button class="hbtn ${h.today_done ? "on" : ""}" data-habit="${h.id}" aria-pressed="${!!h.today_done}" aria-label="${esc(h.name)} heute"></button>
            <div class="grow"><b>${esc(h.name)}</b>${dotsRowPlain(h.week_count, h.target_per_week)}</div><span class="meta">${h.week_count}/${h.target_per_week}</span></div>`).join("")}` : "")
          + `<h3 class="sub-h">Anstehend</h3>${school.open.length ? `<ul class="list">${school.open.slice(0, 6).map((i) => `<li><div class="grow"><span class="kind-tag">${esc(KIND_LABEL[i.kind] || i.kind)}</span> ${esc(i.title)}<div class="meta">${[i.subject, i.due_date && dueLabel(i.due_date)].filter(Boolean).map(esc).join(" · ")}</div></div></li>`).join("")}</ul>` : `<p class="empty">Nichts angesetzt.</p>`}`;
      }
      case "finance": {
        if (!money || money.error || !money.positions?.length) return `<p class="empty">${money?.error ? esc(money.error) : "Noch keine Positionen. Unter Finanzen anlegen."}</p>`;
        const items = money.allocation.portfolio;
        return `<div class="d-vault ${vaultOpen() ? "" : "veiled"}">`
          + sum(`Gesamt <b class="secret">${esc(eur(money.total, money.base_currency))}</b>, eingesetzt <b class="secret">${esc(eur(money.invested, money.base_currency))}</b>,
            <b class="${money.pnl >= 0 ? "gain" : "loss"} secret">${money.pnl >= 0 ? "▲" : "▼"} ${esc(eur(money.pnl, money.base_currency))} (${esc(pct(money.pnl_pct))})</b>.`)
          + `<button class="ghost" data-money="toggle">${sym("eye")} ${vaultOpen() ? "Verbergen" : "Aufdecken"}</button>
            <h3 class="sub-h">Verteilung nach Depot</h3>${this.stackBar(items)}
            <ul class="d-legend">${items.map((it, i) => `<li><i style="background:${SERIES[i] || OTHER_COLOR}"></i><span class="grow">${Skin.portfolioIcon(it.name, money.positions.filter((p) => p.portfolio === it.name))}${esc(it.name)}</span>
              <b class="secret">${esc(eur(it.value, money.base_currency))}</b><span class="meta">${it.pct.toLocaleString("de-DE")} %</span></li>`).join("")}</ul>
            ${money.complete ? "" : `<p class="overdue">Ohne Kurs, nicht mitgezählt: ${money.missing.map(esc).join(", ")}</p>`}

      }
      case "projects": {
        const m = missions.find((x) => x.status === "aktiv");
        return (m ? sum(`<b>${esc(m.title)}</b>: ${m.progress.done} von ${m.progress.total} Schritten${m.deadline ? `, Frist ${esc(fmtDate(m.deadline))}` : ""}.`)

          + `<h3 class="sub-h">Projekte aus den To-dos</h3>${projects.length ? `<ul class="list">${projects.map((p) => `<li><div class="grow"><b>${esc(p.name)}</b>

      }
      case "health": {
        const s = health.sleep, food = health.food.today;

  /** Wischen nach rechts (oder nach unten auf dem iPhone) schließt die Detailansicht. */
  swipe(panel) {
    let x0 = null, y0 = null;
    panel.addEventListener("touchstart", (e) => { const p = e.touches[0]; x0 = p.clientX; y0 = p.clientY; }, { passive: true });
    panel.addEventListener("touchend", (e) => {
      if (x0 === null) return;
      const p = e.changedTouches[0], dx = p.clientX - x0, dy = p.clientY - y0;
      x0 = null;
      if ((dx > 70 && Math.abs(dy) < 60) || (dy > 110 && Math.abs(dx) < 50 && panel.scrollTop <= 0)) this.closeDetail();
    }, { passive: true });
  },
};

  <script>
"use strict";

// Freihändig: "Jarvis, was steht heute an?" ohne zu tippen. Der Browser erkennt, wann
// gesprochen wird (Lautstärke), und schickt jede Äußerung als WAV an den eigenen Server.
// Whisper transkribiert dort; nur was mit dem Rufnamen beginnt, wird verarbeitet, der Rest
// verworfen. Nur ein Name ("Jarvis") → "Ja?" und die nächste Äußerung gilt ohne Namen.
// Läuft nur, solange die App offen und im Vordergrund ist (iOS gibt sonst das Mikro nicht her).

const HF = { PRE_MS: 700, MIN_SPEECH_MS: 120, END_SILENCE_MS: 900, MAX_MS: 12000, MIN_MS: 450, FOLLOW_MS: 8000, RATE: 16000 };

function encodeWav(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, pcm.length * 2, true);
  pcm.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
  return new Blob([buf], { type: "audio/wav" });
}

/** Auf 16 kHz mitteln (Whisper braucht nicht mehr, halbiert bis drittelt die Datenmenge). */
function downsample(chunks, from, to) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const all = new Float32Array(total);
  let o = 0;
  for (const c of chunks) { all.set(c, o); o += c.length; }
  if (from === to) return all;
  const ratio = from / to, out = new Float32Array(Math.floor(total / ratio));
  for (let i = 0; i < out.length; i++) {
    const a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = a; j < b; j++) sum += all[j];
    out[i] = sum / Math.max(1, b - a);
  }
  return out;
}

const HandsFree = {
  on: false, stream: null, ctx: null, node: null, rate: 48000, source: "mic",
  ring: [], ringMs: 0, rec: null, recMs: 0, speechMs: 0, silenceMs: 0, noise: 0.005,
  followUntil: 0, awaitFollow: false, sending: false,

  get name() { return Skin.fantasy ? "Knorz" : "Jarvis"; },
  get wanted() { try { return localStorage.getItem("handsfree") === "1"; } catch { return false; } },
  set wanted(v) { try { localStorage.setItem("handsfree", v ? "1" : "0"); } catch { /* egal */ } },

  idleText() { return this.on ? `Sag „${this.name}“ …` : tx("Tippe aufs Licht"); },

  async toggle() {
    this.wanted = !this.on;
    if (this.on) this.stop(); else await this.start();
    Sfx.play("blip");
  },

  async start() {
    if (this.on) return;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      return Voice.fail("Freihändig braucht HTTPS (tailscale serve) oder localhost.");
    }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch {
      this.wanted = false;
      return Voice.fail("Mikrofon nicht erlaubt.");
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    this.rate = this.ctx.sampleRate;
    const src = this.ctx.createMediaStreamSource(this.stream);
    this.node = this.ctx.createScriptProcessor(4096, 1, 1);
    this.node.onaudioprocess = (e) => { if (this.source === "mic") this.feed(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(this.node);
    this.node.connect(this.ctx.destination);  // nötig, damit Safari den Knoten laufen lässt (gibt Stille aus)
    this.ctx.resume().catch(() => {});
    this.on = true;
    this.reset();
    this.paint();
  },

  stop() {
    this.on = false;
    this.node?.disconnect();
    this.stream?.getTracks().forEach((t) => t.stop());
    this.ctx?.close().catch(() => {});
    this.stream = this.ctx = this.node = null;
    this.reset();
    this.paint();
  },

  reset() { this.ring = []; this.ringMs = 0; this.rec = null; this.recMs = 0; this.speechMs = 0; this.silenceMs = 0; },

  paint() {
    const p = $("#voice");
    if (!p) return;
    p.classList.toggle("handsfree", this.on);
    p.classList.remove("hf-hear");
    const b = $("#hf");
    if (b) { b.textContent = this.on ? `Freihändig: an („${this.name}“)` : "Freihändig: aus"; b.setAttribute("aria-pressed", String(this.on)); }
    if (["idle", "done"].includes(Voice.state)) { Voice.state = "idle"; p.dataset.state = "idle"; $("#vstatus").textContent = this.idleText(); }
  },

  /** Ein Stück Mikrofon-Audio. Erkennt Anfang/Ende einer Äußerung an der Lautstärke. */
  feed(samples) {
    const panel = $("#voice");
    const busy = !panel || Voice.state === "rec" || Voice.state === "busy" || this.sending || panel.classList.contains("talking");
    if (!this.on || busy) { if (this.rec) this.reset(); return; }  // nicht sich selbst zuhören
    if (this.awaitFollow) { this.awaitFollow = false; this.followUntil = Date.now() + HF.FOLLOW_MS; }
    let sum = 0;
    for (const s of samples) sum += s * s;
    const rms = Math.sqrt(sum / samples.length);
    const ms = (samples.length / this.rate) * 1000;
    const loud = rms > Math.max(0.015, this.noise * 3);
    if (!this.rec) {
      this.ring.push(samples); this.ringMs += ms;
      while (this.ringMs - ms > HF.PRE_MS && this.ring.length > 1) this.ringMs -= (this.ring.shift().length / this.rate) * 1000;
      if (loud) {
        this.speechMs += ms;
        if (this.speechMs >= HF.MIN_SPEECH_MS) {  // Äußerung beginnt: Vorlauf mitnehmen
          this.rec = [...this.ring]; this.recMs = this.ringMs; this.silenceMs = 0;
          panel.classList.add("hf-hear");
        }
      } else {
        this.speechMs = 0;
        this.noise = this.noise * 0.95 + rms * 0.05;  // Grundrauschen nachführen
      }
      return;
    }
    this.rec.push(samples); this.recMs += ms;
    panel.style.setProperty("--lvl", Math.min(1, rms * 8).toFixed(2));
    this.silenceMs = loud ? 0 : this.silenceMs + ms;
    if (this.silenceMs >= HF.END_SILENCE_MS || this.recMs >= HF.MAX_MS) this.flush();
  },

  async flush() {
    const chunks = this.rec, speech = this.recMs - this.silenceMs;
    this.reset();
    const panel = $("#voice");
    panel?.classList.remove("hf-hear");
    panel?.style.setProperty("--lvl", "0");
    if (!chunks || speech < HF.MIN_MS) return;
    const wav = encodeWav(downsample(chunks, this.rate, HF.RATE), HF.RATE);
    const follow = Date.now() < this.followUntil;
    this.followUntil = 0;
    this.awaitFollow = false;
    this.sending = true;
    try {
      const res = await fetch(`/api/voice${follow ? "" : `?wake=${this.name.toLowerCase()}`}`, {
        method: "POST", body: wav, headers: { Authorization: `Bearer ${token()}`, "Content-Type": "audio/wav" },
      });
      if (res.status === 401) return logout("Token ungültig");
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return Voice.fail(data.detail || `Fehler ${res.status}`);
      if (data.status === "ignored") return;
      if (data.status === "wake") {  // nur der Name: kurz antworten, nächste Äußerung gilt
        Sfx.play("blip");
        Voice.set("idle", `${this.name} hört …`, "");
        Speech.say(data.reply);
        this.awaitFollow = true;  // Fenster für den Folgesatz startet, wenn "Ja?" ausgesprochen ist
        return;
      }
      Hud.handleResult({ ...data, source: "voice" });
    } catch {
      Voice.fail("Server nicht erreichbar.");
    } finally {
      this.sending = false;
    }
  },
};

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (HandsFree.on) HandsFree.stop(); }
  else if (HandsFree.wanted && current === "today" && $("#voice")) HandsFree.start();
});

          <div class="meta">${[t.created_at.slice(0, 10), t.project, t.category, t.tags].filter(Boolean).map(esc).join(", ")}</div>

    $("#search").addEventListener("submit", (e) => {

  async settings() {

      api("/api/settings/planner"), api("/api/notify"), api("/api/settings/wellness"), api("/api/news")]);

    const JOBS = { calendar: "Kalender abrufen", prices: "Kurse & Vermögens-Snapshot", backup: "Sicherung", news: "News abrufen",
      notify: "Mitteilungen", tts: "Stimme laden", whisper: "Whisper laden" };
    const sub = await Push.current().catch(() => null);
    const here = sub && nt.devices.some((d) => d.endpoint === sub.endpoint);
    const ns = nt.settings;
    const voices = Speech.voices();
    const hook = `${location.origin}/api/notify/woke`;
    const DAYS = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
    const usd = (n) => n.toLocaleString("de-DE", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
    view.innerHTML = `
      <h1>${tx("Einstellungen")}</h1>
      <div class="split">
        <section>
          <h2>Freie Zeit für Aufgaben</h2>
          <p class="muted">Daraus plant der Wochenplan. Termine in diesen Fenstern werden abgezogen.</p>
          <form class="form" id="win-form">${DAYS.map((d, i) => {
            const w = win.windows[String(i)];
            return `<div class="win-row"><label><input type="checkbox" name="on-${i}" ${w ? "checked" : ""}> ${d}</label>
              <input type="time" name="from-${i}" value="${w ? w[0] : "17:30"}" aria-label="${d} von">
              <input type="time" name="to-${i}" value="${w ? w[1] : "20:30"}" aria-label="${d} bis"></div>`;
          }).join("")}<button class="primary">Speichern</button></form>

          <h2>Mitteilungen aufs Handy</h2>
          <p class="muted">${here ? "✓ Dieses Gerät bekommt Mitteilungen." : Push.iosBrowserTab
            ? "Auf dem iPhone: erst Teilen → „Zum Home-Bildschirm“, dann die App von dort öffnen und hier aktivieren."
            : "Dieses Gerät ist noch nicht angemeldet."}
            ${nt.devices.length ? `Angemeldet: ${nt.devices.map((d) => `${esc(d.label)}${d.last_error ? ` <span class="overdue">(${esc(d.last_error)})</span>` : ""}`).join(", ")}.` : ""}</p>
          <div class="capture-row" style="justify-content:flex-start">
            ${here ? `<button class="ghost" id="push-off">Auf diesem Gerät abmelden</button>` : `<button class="primary" id="push-on">Mitteilungen aktivieren</button>`}
            <button class="ghost" id="push-test" ${nt.devices.length ? "" : "disabled"}>Test senden</button>
          </div>
          <form class="form" id="notify-form">
            <label class="check-row"><input type="checkbox" name="sleep_on" ${ns.sleep.on ? "checked" : ""}> Schlaf eintragen, <input type="number" name="delay" min="0" max="240" value="${ns.sleep.delay_min}" aria-label="Minuten nach dem Aufwachen"> Min nach dem Wecker</label>
            <div class="wake-grid">${DAYS.map((d, i) => `<label>${d.slice(0, 2)}<input type="time" name="wake-${i}" value="${ns.sleep.wake_times[String(i)] || ""}" aria-label="Weckzeit ${d}"></label>`).join("")}</div>
            <p class="meta">Feste Weckzeiten sind der Notbehelf (leer = an dem Tag keine Erinnerung). Genauer: Apple-Kurzbefehl, siehe unten.</p>
            <label class="check-row"><input type="checkbox" name="brief_on" ${ns.brief.on ? "checked" : ""}> Tagesüberblick um <input type="time" name="brief_time" value="${ns.brief.time || "06:30"}"></label>
            <label class="check-row"><input type="checkbox" name="evening_on" ${ns.evening.on ? "checked" : ""}> Essen & Sport abfragen um <input type="time" name="evening_time" value="${ns.evening.time || "21:50"}"></label>
            <label class="check-row"><input type="checkbox" name="event_on" ${ns.event.on ? "checked" : ""}> Termine <input type="number" name="lead" min="0" max="240" value="${ns.event.lead_min}"> Min vorher</label>
            <button class="primary">Erinnerungen speichern</button>
          </form>
          <details><summary>Kurzbefehl: Erinnerung genau nach dem Wecker</summary>
            <ol class="howto">
              <li>Kurzbefehle-App → Automation → + → <b>Wecker</b> → „Wird gestoppt“ → Sofort ausführen.</li>
              <li>Aktion <b>Inhalte von URL abrufen</b>: <code>${esc(hook)}</code>, Methode <b>POST</b>,
                Header <code>Authorization</code> = <code>Bearer &lt;dein API_TOKEN&gt;</code>.</li>

          </details>
          ${nt.recent.length ? `<details><summary>Zuletzt gesendet</summary><ul class="list">${nt.recent.slice(0, 8).map((n) => `<li><div class="grow">${esc(n.title || n.kind)}
            <div class="meta">${esc((n.sent_at || n.due_at).replace("T", " ").slice(0, 16))} · ${esc(n.result || "geplant")}</div></div></li>`).join("")}</ul></details>` : ""}

          <h2>Stimme</h2>
          ${Speech.supported ? `<form class="form" id="speech-form">
            <label class="check-row"><input type="checkbox" name="on" ${Speech.on ? "checked" : ""}> Antworten vorlesen</label>
            <div class="seg quality" role="radiogroup" aria-label="Woher kommt die Stimme?">
              <label><input type="radio" name="src" value="server" ${Speech.source === "server" ? "checked" : ""}><span>Server-Stimme (${Skin.fantasy ? "Knorz" : "Jarvis"})</span></label>
              <label><input type="radio" name="src" value="device" ${Speech.source === "device" ? "checked" : ""}><span>Gerätestimme</span></label>

              Sie läuft auf deinem Server, der Text geht nirgendwohin. Im Mittelalter-Design spricht Knorz: tiefer, rau, mit Mundbewegung.</p>
            <select name="voice" aria-label="Gerätestimme">${voices.length ? voices.map((v) => `<option ${v.name === Speech.pick()?.name ? "selected" : ""}>${esc(v.name)}</option>`).join("")
              : `<option value="">Standardstimme</option>`}</select>
            <div class="two"><button type="button" class="ghost" id="speech-test">Probehören</button><button class="primary">Speichern</button></div>
          </form>
          <p class="meta">Gerätestimme verbessern: iPhone-Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch (z. B. „Anna (Premium)“ laden).</p>`
            : `<p class="muted">Dieser Browser kann nicht vorlesen.</p>`}

          <h2>Gesundheit</h2>
          <form class="form" id="wellness-form"><div class="two">
            <label class="field">Schlafziel (Std)<input name="sleep_target" type="number" step="0.5" min="3" max="12" value="${hs.sleep_target}"></label>
            <label class="field">Sport pro Woche<input name="sport_per_week" type="number" min="0" max="14" value="${hs.sport_per_week}"></label></div>
            <button class="primary">Speichern</button></form>

          <h2>Claude</h2>
          <p>${h.llm ? `Sortierung mit ${esc(sys.claude_model)}, Schrittplanung mit ${esc(sys.planning_model)}.` : "Kein Anthropic-API-Key gesetzt. Eingaben werden Gedanken (außer „ToDo: …“), Fragen beantwortet Jarvis mit dem lokalen Tagesüberblick, News ohne Zusammenfassung."}</p>
          <p>Diesen Monat: ${u.calls} Aufrufe, ungefähr <b>${usd(u.cost_usd)}</b>
            ${u.per_model.length > 1 ? `<span class="muted">(${u.per_model.map((m) => `${esc(m.model)}: ${usd(m.cost_usd)}`).join(", ")})</span>` : ""}</p>
          <h2>Design</h2>
          <div class="seg skin-pick" role="group" aria-label="Design">
            <button data-skin="spiel" class="${Skin.current === "spiel" ? "on" : ""}" aria-pressed="${Skin.current === "spiel"}">Spiel-HUD mit Jarvis</button>
            <button data-skin="fantasy" class="${Skin.fantasy ? "on" : ""}" aria-pressed="${Skin.fantasy}">Mittelalter mit Knorz</button>
          </div>
          <h2>Gerät</h2>
          <div class="capture-row" style="justify-content:flex-start">
            <button class="ghost" id="sfx-toggle">${Sfx.on ? "🔊 Ton an" : "🔇 Ton aus"}</button>
            <button class="ghost" id="logout">Token von diesem Gerät entfernen</button>
          </div>
        </section>
        <section>
          <h2>Betrieb</h2>
          ${sys.jobs_enabled ? "" : `<p class="overdue">Hintergrund-Jobs sind aus (JOBS_ENABLED=0).</p>`}
          <table class="pos-table"><tbody>${Object.entries(JOBS).map(([k, label]) => {
            const j = sys.jobs[k];
            return `<tr><td>${label}</td><td>${j ? `<span class="${j.ok ? "up" : "overdue"}">${j.ok ? "✓" : "✕"}</span> ${esc(j.at.replace("T", " ").slice(0, 16))}
              <div class="meta">${esc(j.info)}</div>` : `<span class="muted">noch nicht gelaufen</span>`}</td></tr>`;
          }).join("")}</tbody></table>
          <p class="muted">Spracherkennung: Whisper „${esc(sys.whisper_model)}“ · Datenbank ${sys.db_mb} MB · ${sys.files.count} Dateien (${sys.files.mb} MB)</p>
          <h2>News-Quellen</h2>
          <p class="muted">Eine Zeile je Quelle: <code>Rubrik | Name | Link zum RSS-/Atom-Feed</code>. Jede Rubrik wird eine Spalte (höchstens 6).
            Alle ${esc(String(sys.news_hours || 3)).replace(".", ",")} Std. abgerufen.</p>
          <form class="form" id="news-form">
            <textarea name="sources" rows="9" spellcheck="false">${esc(nw.sources.map((q) => `${q.category} | ${q.name} | ${q.url}`).join("\n"))}</textarea>
            <button class="primary">Quellen speichern</button>
          </form>
          <h2>Sicherungen</h2>
          ${sys.backups.length ? `<ul class="list">${sys.backups.slice(0, 5).map((b) => `<li><div class="grow">${esc(b.name)}</div><span class="meta">${b.mb} MB</span></li>`).join("")}</ul>`
            : `<p class="overdue">Noch keine Sicherung.</p>`}
          <button class="ghost" id="backup-now">Jetzt sichern</button>
          <p class="muted">Sicherungen liegen auf demselben Server (data/backups). Gegen Plattenschaden regelmäßig woanders hin kopieren, siehe docs/BETRIEB.md.</p>
        </section>
      </div>`;
    $("#sfx-toggle").onclick = () => { Sfx.toggle(); Sfx.play("blip"); render(); };
    view.querySelectorAll("[data-skin]").forEach((b) => { b.onclick = () => { Skin.set(b.dataset.skin); Sfx.play("coin"); render(); }; });
    $("#logout").onclick = () => { localStorage.removeItem("token"); render(); };
    $("#backup-now").onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = "Sichere …";
      try { const r = await post("/api/system/backup"); toast(`Gesichert: ${r.name}`); render(); } catch (err) { toast(err.message); }
    };
    const act = (sel, fn) => { const el = $(sel); if (el) el.onclick = async (e) => { e.target.disabled = true; try { await fn(); } catch (err) { toast(err.message); Sfx.play("error"); } render(); }; };
    act("#push-on", async () => { await Push.enable(nt.public_key); toast("Mitteilungen aktiviert"); Sfx.play("coin"); });
    act("#push-off", async () => { await Push.disable(); toast("Abgemeldet"); });
    act("#push-test", async () => { const r = await post("/api/notify/test"); toast(`Gesendet an ${r.sent} Gerät(e)`); });
    $("#notify-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const body = {
        sleep: { on: !!f.get("sleep_on"), delay_min: +f.get("delay"), wake_times: Object.fromEntries(DAYS.map((_, i) => [String(i), f.get(`wake-${i}`) || null])) },
        brief: { on: !!f.get("brief_on"), time: f.get("brief_time") || null },
        evening: { on: !!f.get("evening_on"), time: f.get("evening_time") || null },
        event: { on: !!f.get("event_on"), lead_min: +f.get("lead") },
      };
      try { await api("/api/settings/notify", { method: "PUT", body }); toast("Erinnerungen gespeichert"); } catch (err) { toast(err.message); }
    });
    if ($("#speech-form")) {
      $("#speech-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        Speech.on = !!f.get("on");
        Speech.source = f.get("src") || "server";
        Speech.serverOk = true;
        if (f.get("voice")) Speech.voiceName = f.get("voice");
        toast("Stimme gespeichert");
      });
      $("#speech-test").onclick = () => {
        const f = new FormData($("#speech-form"));
        if (f.get("voice")) Speech.voiceName = f.get("voice");
        Speech.source = f.get("src") || "server";
        Speech.serverOk = true;
        Speech.unlock();
        Speech.say(Skin.fantasy ? "Knorz hier. Ich lausche und sage dir, was ansteht." : "Hallo Peter, so klinge ich. Frag mich, was heute ansteht.", true);
      };
    }
    $("#wellness-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try { await api("/api/settings/wellness", { method: "PUT", body: { sleep_target: +f.sleep_target, sport_per_week: +f.sport_per_week } }); toast("Ziele gespeichert"); }
      catch (err) { toast(err.message); }
    });
    $("#news-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const lines = new FormData(e.target).get("sources").split("\n").map((l) => l.trim()).filter(Boolean);
      const sources = lines.map((l) => { const [category, name, url] = l.split("|").map((x) => (x || "").trim()); return { category, name, url }; });
      try { await api("/api/settings/news", { method: "PUT", body: { sources } }); toast("Quellen gespeichert, Abruf beim nächsten Durchlauf"); }
      catch (err) { toast(err.message); }
    });
    $("#win-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const windows = Object.fromEntries(DAYS.map((_, i) => [String(i), fd.get(`on-${i}`) ? [fd.get(`from-${i}`), fd.get(`to-${i}`)] : null]));
      try { await api("/api/settings/planner", { method: "PUT", body: { windows } }); toast("Zeitfenster gespeichert"); } catch (err) { toast(err.message); }
    });
  },
});

</script>
  <script>
"use strict";

// Quests: Aufgaben, Deadlines, Projekte mit Aufmerksamkeit
const EFFORTS = [[15, "15 Min"], [30, "30 Min"], [60, "1 Std"], [120, "2 Std"], [240, "halber Tag"], [480, "ganzer Tag"]];
const fmtEffort = (m) => (!m ? "" : m < 60 ? `${m} Min` : `${(m / 60).toLocaleString("de-DE", { maximumFractionDigits: 1 })} Std`);
const dueLabel = (iso) => {
  const d = dayDiff(todayIso(), iso);
  return d < 0 ? `${-d} T überfällig` : d === 0 ? "heute" : d === 1 ? "morgen" : `in ${d} T`;
};

const Tasks = {
  todos: [], projects: [], editing: null,

  async load() {
    [this.todos, this.projects] = await Promise.all([api("/api/todos?done=0"), api("/api/projects")]);
  },

  item(t) {
    if (this.editing === t.id) return this.editForm(t);
    const late = t.due_date && t.due_date < todayIso();
    const meta = [t.due_date && `${fmtDate(t.due_date)} (${dueLabel(t.due_date)})`, fmtEffort(t.effort_min)].filter(Boolean);
    return `<li>
      <button class="check" data-done="${t.id}" aria-label="Erledigt: ${esc(t.title)}"></button>
      <div class="grow">${t.priority === 1 ? `<span class="prio" title="hohe Priorität">!! </span>` : ""}${esc(t.title)}
        ${meta.length ? `<div class="meta ${late ? "overdue" : ""}">${meta.map(esc).join(" · ")}</div>` : ""}
        ${t.note ? `<div class="meta">${esc(t.note)}</div>` : ""}</div>
      <button class="link" data-edit-todo="${t.id}">bearbeiten</button>
    </li>`;
  },

  effortSelect(value) {
    return `<select name="effort_min" aria-label="Aufwand"><option value="">Aufwand?</option>${EFFORTS.map(([m, l]) =>
      `<option value="${m}" ${+value === m ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  },

  fields(t = {}) {
    return `
      <input name="title" placeholder="Was ist zu tun?" required value="${esc(t.title || "")}">
      <div class="two"><input name="project" list="proj-list" placeholder="Projekt" value="${esc(t.project || "")}">
        <input name="due_date" type="date" aria-label="Deadline" value="${esc(t.due_date || "")}"></div>
      <div class="two"><select name="priority" aria-label="Priorität">${[[2, "Normal"], [1, "Hoch"], [3, "Niedrig"]].map(([v, l]) =>
        `<option value="${v}" ${(t.priority || 2) === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${this.effortSelect(t.effort_min)}</div>`;
  },

  editForm(t) {
    return `<li class="edit-row"><form class="form grow" data-todo-form="${t.id}">
      ${this.fields(t)}
      <input name="note" placeholder="Notiz" value="${esc(t.note || "")}">
      <div class="capture-row"><button class="primary">Speichern</button>
        <button type="button" class="ghost" data-cancel-edit>Abbrechen</button>
        <button type="button" class="link overdue" data-delete-todo="${t.id}">Löschen</button></div>
    </form></li>`;
  },

  read(form) {
    const f = Object.fromEntries(new FormData(form));
    return { title: f.title, project: f.project || null, due_date: f.due_date || null, priority: +f.priority,
             effort_min: f.effort_min ? +f.effort_min : null, note: f.note || null };
  },

  render() {
    const t = todayIso();
    const open = this.todos;
    const overdue = open.filter((x) => x.due_date && x.due_date < t);
    const soon = open.filter((x) => x.due_date && dayDiff(t, x.due_date) <= 14).sort((a, b) => a.due_date.localeCompare(b.due_date));
    const effort = open.reduce((s, x) => s + (x.effort_min || 0), 0);
    const attention = this.projects.filter((p) => p.attention.length);
    const byProject = {};
    open.forEach((x) => (byProject[x.project || ""] ||= []).push(x));
    const known = new Map(this.projects.map((p) => [p.name.toLowerCase(), p]));
    const sections = [...this.projects.filter((p) => p.status !== "fertig" || byProject[p.name]).map((p) => p.name),
      ...(byProject[""] ? [""] : [])];

    view.innerHTML = `
      <h1>${tx("Quests")}</h1>
      <p class="sub">${open.length} offen${overdue.length ? ` · <span class="overdue">${overdue.length} überfällig</span>` : ""}${effort ? ` · ≈ ${fmtEffort(effort)} Arbeit` : ""}</p>
      <datalist id="proj-list">${this.projects.map((p) => `<option value="${esc(p.name)}">`).join("")}</datalist>

      <div class="quest-grid">
        <section class="panel" style="--accent:var(--red)">
          <header class="ptitle"><span>☠ Deadlines · 14 Tage</span></header>
          ${soon.length ? `<ul class="qlist">${soon.map((x) => `<li>
            <span class="bcount ${x.due_date < t ? "late" : dayDiff(t, x.due_date) <= 1 ? "soon" : ""}">${esc(dueLabel(x.due_date))}</span>
            <div class="grow">${esc(x.title)}<div class="meta">${[x.project, fmtEffort(x.effort_min)].filter(Boolean).map(esc).join(" · ")}</div></div>
          </li>`).join("")}</ul>` : `<p class="empty">Keine Deadlines in den nächsten 14 Tagen.</p>`}
        </section>
        <section class="panel" style="--accent:var(--gold)">
          <header class="ptitle"><span>! Braucht Aufmerksamkeit</span></header>
          ${attention.length ? `<ul class="qlist">${attention.map((p) => `<li>
            <div class="grow"><button class="link" data-goto="${esc(p.name)}">${esc(p.name)}</button>
              <div class="chips">${p.attention.map((r) => `<span>${esc(r)}</span>`).join("")}</div></div>
            <span class="meta">${p.open} offen</span></li>`).join("")}</ul>`
            : `<p class="empty">Alle Projekte im grünen Bereich.</p>`}
        </section>
      </div>

      <details class="add-quest" ${open.length ? "" : "open"}><summary>+ Neue Quest</summary>
        <form class="form" id="todo-form">${this.fields()}<button class="primary">Hinzufügen</button></form>
      </details>

      ${sections.map((name) => {
        const p = known.get(name.toLowerCase());
        const items = byProject[name] || [];
        const total = p ? p.open + p.done : items.length;
        const pctDone = total ? Math.round(((p?.done || 0) / total) * 100) : 0;
        return `<section class="project ${p?.status === "pausiert" ? "paused" : ""}" id="proj-${esc(encodeURIComponent(name))}">
          <header class="project-head">
            <h2>${name ? esc(name) : "Ohne Projekt"}</h2>
            ${p ? `<select data-status="${esc(p.name)}" aria-label="Status ${esc(p.name)}">${["aktiv", "pausiert", "fertig"].map((st) =>
              `<option ${p.status === st ? "selected" : ""}>${st}</option>`).join("")}</select>` : ""}
          </header>
          ${p ? `<div class="bar" title="${p.done} von ${total} erledigt"><span style="width:${pctDone}%"></span></div>
            <p class="meta">${p.done}/${total} erledigt${p.effort_open_min ? ` · noch ≈ ${fmtEffort(p.effort_open_min)}` : ""}${p.attention.length ? ` · <span class="overdue">${p.attention.map(esc).join(", ")}</span>` : ""}</p>` : ""}
          ${items.length ? `<ul class="list">${items.map((x) => this.item(x)).join("")}</ul>` : `<p class="empty">Keine offenen Aufgaben.</p>`}
        </section>`;
      }).join("")}
      <details id="done-list"><summary>Erledigt</summary><div id="done-slot"><p class="empty">Lade …</p></div></details>`;

    $("#todo-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try { await post("/api/todos", this.read(e.target)); Sfx.play("coin"); toast("Quest angelegt"); await this.refresh(); }
      catch (err) { toast(err.message); }
    });

      catch (err) { toast(err.message); }

  async click(e) {

    if (!b) return;
    try {
      if (b.dataset.done || b.dataset.undone) {
        await post(`/api/todos/${b.dataset.done || b.dataset.undone}/toggle`);
        if (b.dataset.done) { burst(b, "var(--cyan)"); Sfx.play("clear"); }

    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
};

// Persönliches Projekt: Ziel → Schritte (mit Claude) → Fortschritt
const Mission = {
  list: [], editingStep: null,

  async load() { this.list = await api("/api/missions"); },

  goalForm(m) {
    return `<form class="form" data-mission-form="${m?.id || ""}">
      <input name="title" placeholder="Mein Ziel, z. B. Gartenhaus selbst bauen" required value="${esc(m?.title || "")}">

        <button class="primary">${m ? "Speichern" : "Ziel festlegen"}</button></div>
    </form>`;
  },

  step(s, m, isNext) {
    if (this.editingStep === s.id) {
      return `<li class="node edit"><form class="form grow" data-step-form="${s.id}">
        <input name="title" required value="${esc(s.title)}"><input name="detail" placeholder="Wie / worauf achten" value="${esc(s.detail || "")}">
        <div class="two">${Tasks.effortSelect(s.effort_min)}<input name="due_date" type="date" aria-label="Bis wann" value="${esc(s.due_date || "")}"></div>
        <div class="capture-row"><button class="primary">Speichern</button><button type="button" class="ghost" data-cancel-step>Abbrechen</button>
          <button type="button" class="link overdue" data-del-step="${s.id}">Löschen</button></div></form></li>`;
    }
    return `<li class="node ${s.done ? "done" : ""} ${isNext ? "next" : ""}">
      <button class="dot" data-toggle-step="${s.id}" aria-pressed="${!!s.done}" aria-label="${s.done ? "Wieder öffnen" : "Geschafft"}: ${esc(s.title)}">${s.done ? "✓" : ""}</button>
      <div class="grow">${isNext ? `<span class="next-tag">Nächster Schritt</span>` : ""}<b>${esc(s.title)}</b>
        ${s.detail ? `<div class="meta">${esc(s.detail)}</div>` : ""}
        <div class="meta">${[fmtEffort(s.effort_min), s.due_date && `bis ${fmtDate(s.due_date)}`, s.done && s.done_at && `geschafft ${fmtDate(s.done_at.slice(0, 10))}`].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="step-tools">
        <button class="link" data-move="${s.id}" data-dir="up" aria-label="Nach oben">▲</button>
        <button class="link" data-move="${s.id}" data-dir="down" aria-label="Nach unten">▼</button>
        <button class="link" data-edit-step="${s.id}">bearbeiten</button>
      </div></li>`;
  },

  card(m) {
    const days = m.deadline ? dayDiff(todayIso(), m.deadline) : null;
    const allDone = m.progress.total && m.progress.done === m.progress.total;
    return `<section class="panel mission ${m.status}" style="--accent:var(--pink)">
      <header class="ptitle"><span>◎ ${esc(m.title)}</span>
        <select data-mission-status="${m.id}" aria-label="Status">${["aktiv", "pausiert", "erreicht"].map((s) =>
          `<option ${m.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></header>
      <div class="mission-head">
        <div class="ring-pct" style="--p:${m.progress.pct}"><b>${m.progress.pct}%</b><small>${m.progress.done}/${m.progress.total}</small></div>
        <div class="grow">
          ${m.why ? `<p class="why">„${esc(m.why)}“</p>` : ""}
          ${days != null ? `<p class="meta ${days < 0 ? "overdue" : ""}">Ziel ${days < 0 ? `seit ${-days} Tagen überfällig` : days === 0 ? "heute" : `in ${days} Tagen`} (${esc(fmtDate(m.deadline))})</p>` : ""}
          ${m.next_step ? `<p>Als Nächstes: <b>${esc(m.next_step.title)}</b></p>` : allDone ? `<p class="up">Alle Schritte geschafft!</p>` : ""}
          <details><summary>Ziel bearbeiten</summary>${this.goalForm(m)}
            <button class="link overdue" data-del-mission="${m.id}">Projekt löschen</button></details>
        </div>
      </div>
      ${allDone && m.status !== "erreicht" ? `<button class="primary big" data-achieve="${m.id}">🏆 Ziel als erreicht markieren</button>` : ""}

        : `<p class="empty">Noch keine Schritte. Lass dir welche vorschlagen oder trag den ersten selbst ein.</p>`}
      <div class="capture-row">
        <button class="ghost" data-suggest="${m.id}">✨ Schritte von Claude planen lassen</button>
      </div>
      <form class="form inline" data-add-step="${m.id}"><input name="title" placeholder="Neuer Schritt" required><button class="ghost">+ Schritt</button></form>
    </section>`;
  },

  render() {
    const active = this.list.filter((m) => m.status !== "erreicht");
    const done = this.list.filter((m) => m.status === "erreicht");
    view.innerHTML = `
      <h1>${tx("Persönliches Projekt")}</h1>
      <p class="sub">Ziel formulieren, in Schritte zerlegen, dranbleiben. Per Sprache: „Fundament fürs Gartenhaus ist fertig“.</p>
      ${active.map((m) => this.card(m)).join("")}
      <details class="add-quest" ${this.list.length ? "" : "open"}><summary>+ Neues Ziel</summary>${this.goalForm()}</details>
      ${done.length ? `<h2>Erreicht 🏆</h2><ul class="list">${done.map((m) => `<li><div class="grow"><b>${esc(m.title)}</b>
        <div class="meta">${m.progress.total} Schritte · erreicht ${m.achieved_at ? esc(fmtDate(m.achieved_at.slice(0, 10))) : ""}</div></div>
        <button class="link" data-reopen="${m.id}">wieder aufnehmen</button></li>`).join("")}</ul>` : ""}`;

    view.querySelectorAll("[data-mission-form]").forEach((f) => f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(f));

      try {
        if (id) {
          const m = this.list.find((x) => x.id === +id);
          await api(`/api/missions/${id}`, { method: "PUT", body: { ...body, status: m.status } });

        await this.refresh();
      } catch (err) { toast(err.message); }
    }));
    view.querySelectorAll("[data-add-step]").forEach((f) => f.addEventListener("submit", async (e) => {
      e.preventDefault();

      await this.refresh();
    }));
    view.querySelectorAll("[data-step-form]").forEach((f) => f.addEventListener("submit", async (e) => {

  },

  async setStatus(id, status) {
    const m = this.list.find((x) => x.id === id);

  async refresh() { await this.load(); this.render(); },

  async click(e) {

      if (d.toggleStep) {
        const r = await post(`/api/steps/${d.toggleStep}/toggle`);

          const r = await post(`/api/missions/${d.suggest}/suggest`);

        } catch (err) { toast(err.message); }
        return await this.refresh();
      }
      if (d.move) { await post(`/api/steps/${d.move}/move?direction=${d.dir}`); return await this.refresh(); }
      if (d.editStep) { this.editingStep = +d.editStep; return this.render(); }
      if (b.hasAttribute("data-cancel-step")) { this.editingStep = null; return this.render(); }
      if (d.delStep && confirm("Schritt löschen?")) { await api(`/api/steps/${d.delStep}`, { method: "DELETE" }); this.editingStep = null; return await this.refresh(); }
      if (d.achieve) return await this.setStatus(+d.achieve, "erreicht");
      if (d.reopen) return await this.setStatus(+d.reopen, "aktiv");
      if (d.delMission && confirm("Projekt mit allen Schritten löschen?")) { await api(`/api/missions/${d.delMission}`, { method: "DELETE" }); return await this.refresh(); }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
};

    await Mission.load();
    Mission.render();

  },
});

  <script>

const TREND = { besser: ["▲", "up", "wird besser"], schlechter: ["▼", "down", "wird schlechter"], gleich: ["▶", "", "stabil"] };
const fmtGrade = (g) => (g == null ? "–" : g.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 2 }));

const fmtSize = (b) => (b < 1024 ? "< 1 KB" : b < 1024 * 1024 ? `${Math.round(b / 1024)} KB` : `${(b / 1024 / 1024).toLocaleString("de-DE", { maximumFractionDigits: 1 })} MB`);

    const t = todayIso();
    const nextTest = d.open.find((i) => ["test", "prüfung"].includes(i.kind) && i.due_date && i.due_date >= t);
    const tr = d.trend && TREND[d.trend];
    view.innerHTML = `
      <h1>${tx("Ausbildung · Zimmerer")}</h1>

        <div class="stat"><small>Nächster Test</small>${nextTest ? `<b>${esc(dueLabel(nextTest.due_date))}</b>

      </div>

      <div class="seg subject-filter" role="group" aria-label="Lernfeld filtern">
        <button data-filter="" class="${!f ? "on" : ""}">Alle</button>
        ${d.subjects.map((s) => `<button data-filter="${s.id}" class="${f === s.id ? "on" : ""}">${esc(s.name)}</button>`).join("")}
      </div>

      <div class="quest-grid">
        <section class="panel" style="--accent:var(--red)">

          <details><summary>+ Test / Aufgabe</summary>

              <select name="minutes" aria-label="Dauer">${[15, 30, 45, 60, 90, 120].map((m) => `<option value="${m}" ${m === 45 ? "selected" : ""}>${fmtMin(m)}</option>`).join("")}</select></div>
            <div class="two"><input name="note" placeholder="Was? z. B. Statik Aufgaben S. 40"><button class="primary">Gelernt ✓</button></div>

          ${d.recent_study.length ? `<ul class="list">${d.recent_study.filter(inFilter).slice(0, 5).map((l) => `<li><div class="grow">${fmtMin(l.minutes)}
            ${l.note ? `· ${esc(l.note)}` : ""}<div class="meta">${esc(fmtDate(l.date))} · ${esc(d.subjects.find((s) => s.id === l.subject_id)?.name || "allgemein")}</div></div>
            <button class="link" data-del-study="${l.id}" aria-label="Eintrag löschen">✕</button></li>`).join("")}</ul>` : ""}
        </section>
      </div>

      <h2>Lernfelder</h2>
      <div class="subject-grid">${d.subjects.map((s) => {
        const st = s.trend && TREND[s.trend];
        return `<button class="subject-card ${f === s.id ? "on" : ""}" data-filter="${s.id}">
          <span class="grow"><b>${esc(s.name)}</b>
            <span class="meta">${s.grades} Noten · ${s.open} offen${s.next ? ` · ${KIND_LABEL[s.next.kind]} ${dueLabel(s.next.due_date)}` : ""}</span></span>

      <div class="split">
        <section>
          <h2>Noten</h2>
          ${grades.length ? `<ul class="list">${grades.map((g) => `<li>
            <span class="grade-badge ${gradeClass(g.grade)}">${fmtGrade(g.grade)}</span>
            <div class="grow">${esc(g.title)}${g.weight !== 1 ? ` <span class="meta">×${g.weight}</span>` : ""}
              <div class="meta">${[g.subject, (g.done_at || g.due_date || "").slice(0, 10) && fmtDate((g.done_at || g.due_date).slice(0, 10))].filter(Boolean).map(esc).join(" · ")}</div></div>

            : `<p class="empty">Noch keine Noten. Per Sprache: „Test Holzverbindungen: 2“.</p>`}

        <section>
          <h2>Dateien</h2>

              <button class="primary">Hochladen</button></div>

              <div class="meta">${[x.subject, fmtSize(x.size), fmtDate(x.uploaded_at.slice(0, 10))].filter(Boolean).map(esc).join(" · ")}</div></div>
            <button class="link" data-del-file="${x.id}" aria-label="Datei löschen">✕</button></li>`).join("")}</ul>`
            : `<p class="empty">Noch keine Dateien. Zeichnungen, Arbeitsblätter, Berichtsheft …</p>`}

  bind() {
    const num = (v) => (v === "" || v == null ? null : +v);
