  async savePortfolio(form) {
    const fd = new FormData(form);
    try {
      await api(`/api/portfolios/${form.dataset.pid}`, { method: "PATCH",
        body: { name: String(fd.get("name")).trim(), is_reserve: fd.get("is_reserve") === "on", icon: fd.get("icon") || "" } });
      toast("Portfolio gespeichert");
      await VIEWS.money();
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },

  async saveReserve(form) {
    const fd = new FormData(form);
    const amount = Number(String(fd.get("amount")).trim().replace(",", "."));
    if (!Number.isFinite(amount) || amount < 0) return toast("Rücklage: bitte eine Zahl ab 0");
    try {
      await post(`/api/portfolios/${form.dataset.pid}/tax-reserve`, { amount, note: fd.get("note") || null });
      toast("Steuerrücklage gespeichert");
      await VIEWS.money();
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },

  /** Der Server lädt die Kurshistorie nach dem Speichern im Hintergrund; kurz danach neu zeichnen. */
  historySoon() {
    [5000, 15000].forEach((ms) => setTimeout(() => {
      if (current === "money" && $("#hist")) this.history().catch(() => {});
    }, ms));
  },

    toggleMax(card) {
    const on = !card.classList.contains("max");
    card.classList.toggle("max", on);
    card.querySelector("[data-fin=max]").textContent = on ? "✕ Schließen" : "⛶ Vergrößern";
    document.body.classList.toggle("noscroll", on);
    if (card.id === "card-hist") this.history().catch(showError);
  },
};

Object.assign(VIEWS, {
  async money(force = false) {
    if (current.startsWith("money/vault")) return Vault.route();  // Schatzkammer (vault.js)
    try { sessionStorage.setItem("vault", "open"); } catch { /* egal */ }  // Finanzseite bewusst geöffnet: Hub-Kachel zeigt die Summe bis Sitzungsende
    if (!Finance.data) view.innerHTML = `<h1>${tx("Finanzen")}</h1><p class="empty">Kurse werden geladen …</p>`;
    await Finance.load(force);
    const d = Finance.data;
    if (Finance.focus && !d.positions.some((p) => p.portfolio === Finance.focus)) Finance.focus = null;
    view.innerHTML = `
      <h1>${tx("Finanzen")}</h1>
      ${d.positions.length ? `<div class="nav-row">${navCard("money/vault", { sub: "Dein Vermögen als Gold, Geldbündel und Wertpapiere" })}</div>` : ""}
      <div id="fin-top"></div>
      ${d.positions.length ? `
      <details id="alloc-details"><summary>Verteilung</summary>
        <section class="panel chart-card" id="card-alloc" style="--accent:var(--orange)">
          <header class="ptitle"><span>◆ Verteilung</span><button data-fin="max">⛶ Vergrößern</button></header>
          <div id="alloc-head" class="chart-head"></div>
          <div id="alloc"></div>
        </section>
      </details>` :
      `<p class="empty">Noch keine Positionen. Lege unten die erste an oder importiere eine CSV.</p>`}
      ${Finance.plansSection()}
      <h2>Pflegen</h2>
      <details id="pos-details" ${d.positions.length ? "" : "open"}><summary>Position anlegen</summary><div id="form-slot">${Finance.form()}</div></details>
      <details><summary>CSV importieren</summary>
        <form class="form" id="csv-form"><textarea name="csv" placeholder="portfolio;name;ticker;isin;quantity;entry_price;manual_price;currency;asset_class;region;bought_at"></textarea><button class="primary">Importieren</button></form>
      </details>
      <details><summary>Steuerrücklagen importieren</summary>
        <form class="form" id="reserve-csv-form"><textarea name="csv" placeholder="portfolio;tax_reserve;note"></textarea><button class="primary">Importieren</button></form>
      </details>`;
    view.onclick = (e) => Finance.click(e);
    view.onsubmit = (e) => {
      if (e.target.matches(".reserve-form")) { e.preventDefault(); Finance.saveReserve(e.target); }
      if (e.target.matches(".pf-form")) { e.preventDefault(); Finance.savePortfolio(e.target); }
    };
    Finance.renderTop();
    Finance.startLive();
    if (d.positions.length) Finance.allocation();
    Finance.bindForm();
    Finance.bindPlanForm();
    $("#csv-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const r = await post("/api/portfolio/import", { csv: new FormData(e.target).get("csv") });
        toast(`${r.imported} Positionen importiert, Kurshistorie wird geladen`);
        await VIEWS.money();
        Finance.historySoon();
      } catch (err) { toast(err.message); }
    });
    $("#reserve-csv-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const r = await post("/api/portfolio/import-tax-reserves", { csv: new FormData(e.target).get("csv") });
        toast(`${r.imported} Steuerrücklagen übernommen`);
        await VIEWS.money();
      } catch (err) { toast(err.message); }
    });
  },
});

document.addEventListener("keydown", (e) => {
  const card = $(".chart-card.max");
  if (e.key === "Escape" && card) Finance.toggleMax(card);
});

</script>
  <script>
"use strict";

// Gesundheit in drei Ebenen: #health = Übersicht mit kurzer Zusammenfassung (Ebene 1) und je Segment
// ein Feld mit Wochentrend (Ebene 2); Antippen öffnet #health/sleep|sport|food|goals mit allen Details
// und Eingaben (Ebene 3). Aus der Push-Mitteilung öffnet /?log=sleep direkt die Detailseite. Nährwerte sind SCHÄTZUNGEN (nutrition.py).
const MEAL_LABEL = { "frühstück": "Frühstück", mittag: "Mittag", abend: "Abend", snack: "Snack", tag: "Über den Tag" };
const QUALITY = ["mies", "schlecht", "okay", "gut", "super"];
const fmtH = (h) => (h == null ? "–" : `${h.toLocaleString("de-DE", { maximumFractionDigits: 1 })} Std`);

/** Balken je Nacht mit Ziellinie. Fehlende Nächte bleiben als Lücke sichtbar (nie geschätzt). */
function sleepChart(series, target) {
  const W = 560, H = 170, L = 30, B = 22, T = 10;
  const max = Math.max(10, target + 1, ...series.map((s) => s.hours || 0));
  const y = (h) => T + (H - T - B) * (1 - h / max);
  const bw = (W - L) / series.length;
  const ticks = [0, 4, 8, 12].filter((t) => t <= max);
  return `<svg class="sleep-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schlaf der letzten ${series.length} Nächte, Ziel ${fmtH(target)}">
    ${ticks.map((t) => `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="sc-grid"/><text x="${L - 6}" y="${y(t) + 4}" class="sc-axis" text-anchor="end">${t}</text>`).join("")}
    ${series.map((s, i) => {
      const x = L + i * bw + bw * 0.18, w = bw * 0.64, d = new Date(s.date + "T12:00");
      const label = `<text x="${x + w / 2}" y="${H - 6}" class="sc-axis" text-anchor="middle">${WD[(d.getDay() + 6) % 7]}</text>`;
      if (s.hours == null) return `${label}<rect x="${x}" y="${y(0) - 2}" width="${w}" height="2" class="sc-gap"><title>${esc(fmtDate(s.date))}: nicht erfasst</title></rect>`;
      return `${label}<rect x="${x}" y="${y(s.hours)}" width="${w}" height="${y(0) - y(s.hours)}" rx="2" class="sc-bar q${s.quality || 0}">
        <title>${esc(fmtDate(s.date))}: ${fmtH(s.hours)}${s.quality ? `, ${QUALITY[s.quality - 1]}` : ""}${s.bed ? ` (${s.bed}–${s.wake})` : ""}</title></rect>`;
    }).join("")}
    <line x1="${L}" x2="${W}" y1="${y(target)}" y2="${y(target)}" class="sc-target"/>
    <text x="${W - 4}" y="${y(target) - 5}" class="sc-axis" text-anchor="end">Ziel ${fmtH(target)}</text>
  </svg>`;
}


/** Kalorien je Tag (Schätzung) als Balken, Eiweiß als Zahl darunter; Tage ohne Eintrag bleiben leer. */
function kcalChart(totals, target) {
  const W = 560, H = 150, L = 34, B = 34, T = 12;
  const max = Math.max(target || 0, 2500, ...totals.map((t) => t.kcal || 0)) * 1.08;
  const y = (v) => T + (H - T - B) * (1 - v / max), bw = (W - L) / totals.length;
  return `<svg class="sleep-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Geschätzte Kalorien der letzten 7 Tage">
    ${[0, 1000, 2000, 3000].filter((t) => t <= max).map((t) => `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="sc-grid"/><text x="${L - 6}" y="${y(t) + 4}" class="sc-axis" text-anchor="end">${t / 1000}k</text>`).join("")}
    ${totals.map((t, i) => {
      const x = L + i * bw + bw * .2, w = bw * .6, d = new Date(t.date + "T12:00");
      const lab = `<text x="${x + w / 2}" y="${H - 20}" class="sc-axis" text-anchor="middle">${WD[(d.getDay() + 6) % 7]}</text>
        <text x="${x + w / 2}" y="${H - 6}" class="sc-axis" text-anchor="middle">${t.entries ? `${Math.round(t.protein)} g` : ""}</text>`;
      if (!t.entries) return `${lab}<rect x="${x}" y="${y(0) - 2}" width="${w}" height="2" class="sc-gap"><title>${esc(fmtDate(t.date))}: nichts eingetragen</title></rect>`;
      return `${lab}<rect x="${x}" y="${y(t.kcal)}" width="${w}" height="${y(0) - y(t.kcal)}" rx="2" class="sc-bar food">
        <title>${esc(fmtDate(t.date))}: ~${Math.round(t.kcal)} kcal, ${Math.round(t.protein)} g Eiweiß (Schätzung)${t.unknown ? `, ${t.unknown} Teil(e) nicht erkannt` : ""}</title></rect>`;
    }).join("")}
    ${target ? `<line x1="${L}" x2="${W}" y1="${y(target)}" y2="${y(target)}" class="sc-target"/><text x="${W - 4}" y="${y(target) - 5}" class="sc-axis" text-anchor="end">Ziel ${target}</text>` : ""}
  </svg>`;
}

/** Messwerte eines Ziels als kleine Linie. */
function goalSpark(g) {
  const v = g.logs.map((x) => x.value);
  if (g.start_value != null) v.unshift(g.start_value);
  if (v.length < 2) return "";
  const W = 140, H = 36, lo = Math.min(...v, g.target_value), hi = Math.max(...v, g.target_value), span = hi - lo || 1;
  const pt = (x, i) => `${(i / (v.length - 1)) * W},${H - 3 - ((x - lo) / span) * (H - 6)}`;
  const ty = H - 3 - ((g.target_value - lo) / span) * (H - 6);
  return `<svg class="goal-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" class="sc-target"/>
    <polyline points="${v.map(pt).join(" ")}" fill="none" stroke="var(--c)" stroke-width="2"/></svg>`;
}

/** Fortschrittsring: Anteil am Tagesziel. Über 100 % bleibt der Ring voll und bekommt einen Warnrand. */
function ringChart(value, target, color, label, unit, size = 132) {
  const r = 42, c = 2 * Math.PI * r, p = target ? Math.min(1, (value || 0) / target) : 0, over = target && value > target * 1.1;
  return `<figure class="donut ${over ? "over" : ""}" style="--c:${color};width:${size}px">
    <svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${esc(label)}: ${fmtN(value, 0)} von ${fmtN(target, 0)} ${unit}">
      <title>${esc(label)}: ~${fmtN(value, 0)} von ${fmtN(target, 0)} ${unit} (Schätzung)</title>
      <circle cx="50" cy="50" r="${r}" class="dn-track"/>
      <circle cx="50" cy="50" r="${r}" class="dn-val" stroke-dasharray="${(p * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
      <text x="50" y="48" text-anchor="middle" class="dn-num">${value ? fmtN(value, 0) : "0"}</text>
      <text x="50" y="63" text-anchor="middle" class="dn-sub">von ${fmtN(target, 0)} ${unit}</text></svg>
    <figcaption>${esc(label)}</figcaption></figure>`;
}

/** Sieben Nächte als kleine Balken, nach Qualität gefärbt (für das Schlaf-Feld auf Ebene 2). */
function miniSleep(series, target) {
  const W = 168, H = 50, n = series.length, bw = W / n, max = Math.max(10, target + 1);
  const y = (h) => H - (H - 4) * (h / max);
  return `<svg class="mini-sleep" viewBox="0 0 ${W} ${H + 14}" aria-hidden="true">
    ${series.map((s, i) => {
      const x = i * bw + bw * .18, w = bw * .64, d = new Date(s.date + "T12:00");
      return `${s.hours == null ? `<rect x="${x}" y="${H - 2}" width="${w}" height="2" class="sc-gap"/>`
        : `<rect x="${x}" y="${y(s.hours)}" width="${w}" height="${H - y(s.hours)}" rx="2" class="sc-bar q${s.quality || 0}"/>`}
        <text x="${x + w / 2}" y="${H + 12}" text-anchor="middle" class="sc-axis">${WD[(d.getDay() + 6) % 7][0]}</text>`;
    }).join("")}
    <line x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}" class="sc-target"/></svg>`;
}

const SEGMENTS = [["sleep", "Schlaf", "var(--violet)"], ["sport", "Sport", "var(--lime)"], ["food", "Ernährung", "var(--orange)"], ["goals", "Ziele", "var(--cyan)"]];
const fmtN = (n, d = 1) => (n == null ? "–" : Number(n).toLocaleString("de-DE", { maximumFractionDigits: d }));
const avgOf = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null);

/** Trendpfeil: Vergleich mit dem Zeitraum davor. up = gut, wenn höher. Ohne Vergleichswert steht das dabei. */
function trendChip(now, prev, unit, upGood = true, eps = 0) {
  if (now == null || prev == null) return `<span class="trend none">Trend: zu wenig Daten</span>`;
  const d = now - prev;
  if (Math.abs(d) <= eps) return `<span class="trend flat">→ wie davor</span>`;
  const good = (d > 0) === upGood;
  return `<span class="trend ${good ? "good" : "bad"}">${d > 0 ? "↑" : "↓"} ${d > 0 ? "+" : "−"}${fmtN(Math.abs(d))}${unit} zur Woche davor</span>`;
}

/** Ebene 1 + 2, überall gleich (Gesundheitsseite UND Hub-Panel rufen genau diese Funktion auf):
 *  Kennzahlen mit Trend, kurze Zusammenfassung, darunter je Segment ein Feld zur Detailseite. */
function healthOverview(d) {
  const s = d.sleep, sp = d.sport, f = d.food, day = f.day, t = d.date;
  const h = s.series.slice(-14).map((x) => x.hours);
  const prevSleep = avgOf(h.slice(0, -7).filter((x) => x != null)), nowSleep = avgOf(h.slice(-7).filter((x) => x != null));
  const iso = (x) => x.toLocaleDateString("sv-SE");
  const mon = (() => { const x = new Date(t + "T12:00"); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; })();
  const weekDays = [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(x.getDate() + i); return iso(x); });
  const lastMon = new Date(mon); lastMon.setDate(lastMon.getDate() - 7);
  const lastWeekSport = sp.recent.filter((r) => r.date >= iso(lastMon) && r.date < iso(mon)).length;
  const logged = f.totals.filter((x) => x.entries);
  const active = d.goals.filter((g) => g.status === "aktiv"), top = active.slice().sort((a, b) => b.pct - a.pct)[0];
  const last = s.last?.date === t ? s.last : null;
  const stat = (label, val, sub, trend) => `<div class="stat"><small>${label}</small><b>${val}</b><span class="muted">${sub}</span>${trend || ""}</div>`;
  const lines = [
    nowSleep == null ? "Schlaf: diese Woche noch keine Nacht eingetragen." : `Schlaf Ø <b>${fmtH(nowSleep)}</b> bei Ziel ${fmtH(s.target)}${s.debt7 > 0 ? `, ${fmtH(s.debt7)} Defizit über 7 Nächte` : ""}.`,
    `Sport <b>${sp.week_sessions} von ${sp.target}</b> diese Woche${sp.days_since != null && sp.days_since > 2 ? `, zuletzt vor ${sp.days_since} Tagen` : ""}.`,
    day.entries ? `Heute ~<b>${fmtN(day.kcal, 0)} kcal</b> und <b>${fmtN(day.protein, 0)} g Eiweiß</b> von ${fmtN(day.kcal_target, 0)} kcal / ${fmtN(day.protein_target, 0)} g.` : "Heute noch nichts gegessen eingetragen.",
    top ? `${active.length} Ziel${active.length === 1 ? "" : "e"} aktiv, am weitesten: <b>${esc(top.title)}</b> ${top.pct} %.` : "Kein Sportziel aktiv.",
  ];
  const warn = day.verdict.find((v) => v.level === "warn");
  const tile = (k, body, val, sub) => {
    const p = PAGES[`health/${k}`];
    return `<a class="hseg" href="#health/${k}" style="--c:${p.color}" aria-label="${p.name}: Details und Eintragen">
      <header>${emblem(p.sym, p.color, false, p.ink)}<span>${p.name}</span><span class="hseg-go" aria-hidden="true">›</span></header>
      <div class="hseg-val num">${val}</div><div class="hseg-sub">${sub}</div><div class="hseg-body">${body}</div></a>`;
  };
  return `<div class="school-stats h-stats">
      ${stat("Letzte Nacht", fmtH(last?.hours), last ? (last.quality ? QUALITY[last.quality - 1] : "Qualität offen") : "noch nicht eingetragen")}
      ${stat("Schlaf Ø 7 Nächte", fmtH(nowSleep), `Ziel ${fmtH(s.target)}`, trendChip(nowSleep, prevSleep, " Std", true, .1))}
      ${stat("Sport diese Woche", `${sp.week_sessions} / ${sp.target}`, sp.week_minutes ? fmtMin(sp.week_minutes) : "noch nichts", trendChip(sp.week_sessions, lastWeekSport, "", true))}
      ${stat("Essen Ø 7 Tage", logged.length ? `~${fmtN(f.avg_kcal, 0)}<small> kcal</small>` : "–", logged.length ? `${fmtN(f.avg_protein, 0)} g Eiweiß · Ziel an ${f.week.protein_hit}/${f.week.days} Tagen` : "noch nichts eingetragen")}
    </div>
    <div class="h-summary">${lines.map((l) => `<p>${l}</p>`).join("")}${warn ? `<p class="h-warn">${esc(warn.text)}</p>` : ""}</div>
    <div class="hseg-grid">
      ${tile("sleep", miniSleep(s.series.slice(-7), s.target), fmtH(s.avg7), `Ø 7 Nächte${s.quality7 ? ` · Qualität ${fmtN(s.quality7)}` : ""}${last ? ` · letzte Nacht ${fmtH(last.hours)}` : ""}`)}
      ${tile("sport", `<div class="week-dots">${weekDays.map((x, i) => `<span class="${sp.recent.some((r) => r.date === x) ? "on" : ""} ${x === t ? "today" : ""}" title="${esc(fmtDate(x))}">${WD[i][0]}</span>`).join("")}</div>`,
        `${sp.week_sessions}<small>/${sp.target}</small>`, sp.week_minutes ? `${fmtMin(sp.week_minutes)} diese Woche` : "diese Woche")}
      ${tile("food", `<div class="donuts">${ringChart(day.kcal, day.kcal_target, "var(--orange)", "Kalorien", "kcal", 96)}${ringChart(day.protein, day.protein_target, "var(--cyan)", "Eiweiß", "g", 96)}</div>`,
        day.entries ? `~${fmtN(day.kcal, 0)}<small> kcal</small>` : "–", day.entries ? "heute, Schätzung" : "heute noch nichts")}
      ${tile("goals", active.length ? active.slice(0, 2).map((g) => `<div class="hseg-goal"><span>${esc(g.title)}</span><div class="gbar" style="--c:var(--cyan)"><i style="width:${g.pct}%"></i></div></div>`).join("") : `<p class="meta">Noch kein Ziel.</p>`,
        `${active.length}`, active.length === 1 ? "Ziel aktiv" : "Ziele aktiv")}
    </div>`;
}

const Health = {
  data: null, days: 14, seg: null,

  async load() { this.data = await api(`/api/wellness?days=${this.days}`); },

  render() {
    const seg = SEGMENTS.find(([k]) => k === this.seg);
    if (!seg) {
      view.innerHTML = `<h1>${tx("Gesundheit")}</h1>
        <p class="sub">Feld antippen für Details und zum Eintragen. Schneller per Sprache: „7 Stunden geschlafen, gut“, „45 Minuten laufen“, „Mittag Döner“.</p>
        ${healthOverview(this.data)}`;
    } else {
      view.innerHTML = `<h1 style="--c:${seg[2]}">${seg[1]}</h1>
        <div id="health-pane">${this[seg[0]]()}</div>`;
    }
    this.bind();
  },

  // ---------------------------------------------------------------- Schlaf
  sleep() {
    const s = this.data.sleep, t = todayIso(), last = s.last;
    const trend = s.quality_trend == null ? "zu wenig Daten" : s.quality_trend > .2 ? `besser (+${fmtN(s.quality_trend)})` : s.quality_trend < -.2 ? `schlechter (${fmtN(s.quality_trend)})` : "gleich";
    const nights = s.series.filter((x) => x.hours != null).slice().reverse();
    return `<div class="health-pane-grid">
      <section class="panel" id="sleep-card" style="--accent:var(--violet)">
        <header class="ptitle"><span>Schlaf · ${this.days} Nächte</span>
          <span class="seg mini">${[14, 30].map((n) => `<button data-days="${n}" class="${this.days === n ? "on" : ""}">${n}</button>`).join("")}</span></header>
        ${sleepChart(s.series, s.target)}
        <div class="ty-nums">
          <span><b class="num">${s.avg_bed || "–"}</b>Ø eingeschlafen</span>
          <span><b class="num">${s.avg_wake || "–"}</b>Ø aufgewacht</span>
          <span class="${s.bed_spread_min > 60 ? "warn" : ""}"><b class="num">${s.bed_spread_min == null ? "–" : `±${s.bed_spread_min}`}</b>Min Streuung Einschlafen</span>
          <span><b class="num">${s.nights_on_target}<small>/${s.nights}</small></b>Nächte mit Ziel</span>
          <span><b class="num">${fmtN(s.quality7)}</b>Qualität Ø 7 · ${esc(trend)}</span>
        </div>
        <div class="q-legend" aria-label="Schlafqualität">${QUALITY.map((q, i) => `<span class="q${i + 1}"><i></i>${i + 1} ${q} · ${s.quality_dist[i]}</span>`).join("")}
          ${s.unrated ? `<span class="q0"><i></i>unbewertet · ${s.unrated}</span>` : ""}</div>
        ${s.hours_good != null && s.hours_bad != null ? `<p class="meta"><b>Gute Nächte (4–5): Ø ${fmtH(s.hours_good)}, schlechte (1–2): Ø ${fmtH(s.hours_bad)}.</b>
          ${s.hours_good - s.hours_bad >= .75 ? "Bei dir hängt die Qualität deutlich an der Dauer." : "Die Dauer allein erklärt deine Qualität kaum: auf Einschlafzeit und Abend achten."}</p>` : ""}
        <p class="meta">Regelmäßigkeit zählt so viel wie Dauer: Streuung unter 30 Min ist gut, über 60 Min bringt den Rhythmus durcheinander.
          Bettzeit-Wecker: <a href="#wecker">im Bedienfeld</a>.</p>
      </section>
      <section class="panel" style="--accent:var(--violet)">
        <header class="ptitle"><span>Nacht eintragen</span></header>
        <form class="form" id="sleep-form">
          <div class="two">
            <label class="field">Eingeschlafen<input name="bed_time" type="time" value="${esc(last?.bed || "23:00")}" required></label>
            <label class="field">Aufgewacht<input name="wake_time" type="time" value="${esc(last?.wake || "06:30")}" required></label>
          </div>
          <div class="seg quality" role="radiogroup" aria-label="Wie erholt?">
            ${QUALITY.map((q, i) => `<label><input type="radio" name="quality" value="${i + 1}" ${i === 2 ? "checked" : ""}><span>${i + 1} · ${q}</span></label>`).join("")}
          </div>
          <input name="note" placeholder="Notiz (optional), z. B. spät Handy, Kaffee am Abend" autocomplete="off">
          <div class="two"><input name="date" type="date" value="${t}" aria-label="Aufwachtag"><button class="primary">Schlaf speichern</button></div>
        </form>
        ${nights.length ? `<ul class="list">${nights.slice(0, 7).map((n) => `<li><div class="grow">${n.date === t ? "Heute" : esc(fmtDate(n.date))} · ${fmtH(n.hours)}
          <div class="meta">${n.bed ? `${esc(n.bed)}–${esc(n.wake)}` : ""}</div>
          ${n.id ? `<div class="q-rate" role="group" aria-label="Qualität ${esc(fmtDate(n.date))}">${[1, 2, 3, 4, 5].map((q) =>
            `<button class="q${q} ${n.quality === q ? "on" : ""}" data-rate="${n.id}:${q}" aria-pressed="${n.quality === q}" title="${QUALITY[q - 1]}">${q}</button>`).join("")}</div>` : ""}</div>
          ${n.id ? `<button class="link" data-del="sleep:${n.id}" aria-label="Löschen">✕</button>` : ""}</li>`).join("")}</ul>` : ""}
      </section></div>`;
  },

  // ---------------------------------------------------------------- Sport
  sport() {
    const d = this.data.sport, t = todayIso();
    const kinds = [...new Set([...d.kinds, "Laufen", "Krafttraining", "Fußball", "Radfahren", "Schwimmen"])].slice(0, 8);
    return `<div class="health-pane-grid">
      <section class="panel" id="sport-card" style="--accent:var(--lime)">
        <header class="ptitle"><span>Training eintragen</span></header>
        <form class="form" id="sport-form">
          <div class="chips kind-chips">${kinds.map((k) => `<button type="button" data-kind="${esc(k)}">${esc(k)}</button>`).join("")}</div>
          <input name="kind" placeholder="Sportart" list="sport-kinds" required autocomplete="off" value="${esc(d.kinds[0] || "")}">
          <datalist id="sport-kinds">${kinds.map((k) => `<option value="${esc(k)}">`).join("")}</datalist>
          <label class="field dur">Dauer <b class="num" id="dur-out">45 Min</b>
            <input type="range" name="minutes" min="20" max="120" step="5" value="45" aria-label="Dauer in Minuten"></label>
          <div class="chips dur-chips">${[20, 30, 45, 60, 90, 120].map((m) => `<button type="button" data-min="${m}">${fmtMin(m)}</button>`).join("")}</div>
          <input name="note" placeholder="Notiz (optional), z. B. 3×10 Klimmzüge, 5 km" autocomplete="off">
          <div class="two"><input name="date" type="date" value="${t}" aria-label="Tag"><button class="primary">Sport speichern</button></div>
        </form>
      </section>
      <section class="panel" style="--accent:var(--lime)">
        <header class="ptitle"><span>Diese Woche ${d.week_sessions} von ${d.target}</span><span class="meta">${d.week_minutes ? fmtMin(d.week_minutes) : ""}</span></header>
        <div class="gbar" style="--c:var(--lime)"><i style="width:${Math.min(100, d.week_sessions / Math.max(1, d.target) * 100)}%"></i></div>
        ${d.recent.length ? `<ul class="list">${d.recent.slice(0, 10).map((x) => `<li><div class="grow">${esc(x.kind)}${x.minutes ? ` · ${fmtMin(x.minutes)}` : ""}
          <div class="meta">${x.date === t ? "Heute" : esc(fmtDate(x.date))}${x.note ? ` · ${esc(x.note)}` : ""}</div></div>
          <button class="link" data-del="sport:${x.id}" aria-label="Löschen: ${esc(x.kind)}">✕</button></li>`).join("")}</ul>`
          : `<p class="empty">Noch kein Sport eingetragen. Die Sport-Gewohnheit in der Checkliste wird automatisch mit abgehakt.</p>`}
      </section></div>`;
  },

  // ---------------------------------------------------------------- Ziele ("Skills")
  goals() {
    const gs = this.data.goals, t = todayIso();
    const card = (g) => `<section class="panel goal ${g.status}" style="--accent:var(--lime);--c:var(--lime)" data-goal="${g.id}">
      <header class="ptitle"><span>${esc(g.title)}</span><span class="meta">${esc(g.status)}</span></header>
      <div class="goal-top"><div><b class="num goal-val">${fmtN(g.best)}<small> / ${fmtN(g.target_value)} ${esc(g.unit)}</small></b>
        <div class="meta">${g.kind ? `${esc(g.kind)} · ` : ""}${g.lower_better ? "weniger ist besser · " : ""}${g.due_date ? `bis ${esc(fmtDate(g.due_date))}` : "ohne Frist"}</div></div>${goalSpark(g)}</div>
      <div class="gbar" style="--c:var(--lime)"><i style="width:${g.pct}%"></i></div>
      <form class="form inline goal-log" data-goal-log="${g.id}"><input name="value" type="number" step="any" required placeholder="Neuer Wert (${esc(g.unit)})" aria-label="Neuer Wert">
        <input name="date" type="date" value="${t}" aria-label="Tag"><button class="primary">Eintragen</button></form>
      ${g.help ? `<details class="goal-help" open><summary>Trainingsvorschlag · ${esc((g.help_at || "").slice(0, 10))}</summary><pre>${esc(g.help)}</pre></details>` : ""}
      <p class="d-more"><button class="ghost" data-help="${g.id}">${g.help ? "Neuen Vorschlag holen" : "Hilfe: Trainingsplan (Claude)"}</button>
        <button class="link" data-goal-status="${g.id}:${g.status === "pausiert" ? "aktiv" : "pausiert"}">${g.status === "pausiert" ? "fortsetzen" : "pausieren"}</button>
        <button class="link overdue" data-del="goal:${g.id}">löschen</button></p>
    </section>`;
    return `<div class="health-pane-grid">
      <div class="goal-list">${gs.length ? gs.map(card).join("") : `<p class="empty">Noch kein Ziel. Leg eins an, auf das du hinarbeitest, z. B. „10 Klimmzüge am Stück“ oder „5 km unter 30 Min“.</p>`}</div>
      <section class="panel" style="--accent:var(--lime)">
        <header class="ptitle"><span>Neues Ziel</span></header>
        <form class="form" id="goal-form">
          <input name="title" placeholder="z. B. 10 Klimmzüge am Stück" required autocomplete="off">
          <div class="two"><input name="kind" placeholder="Sportart (optional)" list="sport-kinds" autocomplete="off">
            <select name="unit" aria-label="Einheit">${["Wdh", "km", "min", "s", "kg", "m"].map((u) => `<option>${u}</option>`).join("")}</select></div>
          <div class="two"><input name="start_value" type="number" step="any" placeholder="Stand heute" aria-label="Stand heute">
            <input name="target_value" type="number" step="any" placeholder="Zielwert" required aria-label="Zielwert"></div>
          <label class="check-row"><input type="checkbox" name="lower_better"> Weniger ist besser (z. B. Zeit für 5 km)</label>
          <div class="two"><input name="due_date" type="date" aria-label="Bis wann (optional)"><button class="primary">Ziel anlegen</button></div>
        </form>
        <p class="meta">„Hilfe“ fragt Claude einmal nach einem Plan für die nächsten 2 Wochen. Es geht nur das Ziel mit deinen Messwerten raus.</p>
      </section></div>`;
  },

  // ---------------------------------------------------------------- Ernährung
  food() {
    const f = this.data.food, t = todayIso(), day = f.day, st = this.data.settings;
    const days = {};
    f.recent.filter((x) => x.date !== t).forEach((x) => (days[x.date] ||= []).push(x));
    const g = (v) => `${fmtN(v, 0)} g`;
    const macroRow = (label, v, share, extra = "") => `<tr><th>${label}</th><td class="num">${g(v)}</td><td class="num muted">${share == null ? "" : `${share} %`}</td><td class="muted">${extra}</td></tr>`;
    const nut = (n) => {
      const pct = n.pct ?? 0, bad = n.kind === "max" ? pct > 100 : pct < 50;
      return `<li class="${bad ? "bad" : pct >= (n.kind === "max" ? 0 : 100) ? "ok" : ""}"><span>${esc(n.label)}</span>
        <span class="num">${fmtN(n.amount, n.unit === "g" ? 1 : 0)} ${esc(n.unit)}</span>
        <div class="nbar ${n.kind}" title="${n.kind === "max" ? "höchstens" : "Richtwert"} ${n.value} ${esc(n.unit)}"><i style="width:${Math.min(100, pct)}%"></i></div>
        <span class="num muted">${pct} %${n.kind === "max" ? " v. max" : ""}</span></li>`;
    };
    const part = (m) => `<li><div class="grow"><span class="kind-tag">${esc(MEAL_LABEL[m.meal] || m.meal)}</span> ${esc(m.text)}
        ${m.items.length ? `<ul class="parts">${m.items.map((i) => `<li><span>${i.factor !== 1 ? `${fmtN(i.factor)}× ` : ""}${esc(i.label)} <span class="muted">(${esc(i.portion)}, ~${i.grams} g)</span></span>
          <span class="num">~${i.kcal} kcal · E ${fmtN(i.protein, 0)} · KH ${fmtN(i.carbs, 0)} · F ${fmtN(i.fat, 0)}</span></li>`).join("")}</ul>` : ""}
        <div class="meta">${m.manual ? `${fmtN(m.kcal, 0)} kcal eigene Angabe` : m.kcal != null ? `zusammen ~${fmtN(m.kcal, 0)} kcal` : "nicht geschätzt"}
          ${!m.manual && m.unknown.length ? ` · <span class="overdue">nicht erkannt: ${esc(m.unknown.join(", "))}</span>` : ""}</div></div>
        <button class="link" data-del="food:${m.id}" aria-label="Löschen: ${esc(m.text)}">✕</button></li>`;
    const row = (m) => `<li><div class="grow"><span class="kind-tag">${esc(MEAL_LABEL[m.meal] || m.meal)}</span> ${esc(m.text)}
        <div class="meta">${m.kcal != null ? `${m.kcal_manual ? "" : "~"}${fmtN(m.kcal, 0)} kcal` : "nicht geschätzt"}${m.protein != null && !m.kcal_manual ? ` · E ${fmtN(m.protein, 0)} g` : ""}</div></div>
        <button class="link" data-del="food:${m.id}" aria-label="Löschen: ${esc(m.text)}">✕</button></li>`;
    return `<div class="health-pane-grid">
      <section class="panel" style="--accent:var(--orange)" id="food-today">
        <header class="ptitle"><span>Heute</span><span class="meta">Schätzung aus Durchschnittswerten</span></header>
        <div class="donuts big">${ringChart(day.kcal, day.kcal_target, "var(--orange)", "Kalorien", "kcal")}${ringChart(day.protein, day.protein_target, "var(--cyan)", "Eiweiß", "g")}</div>
        <ul class="verdict">${day.verdict.map((v) => `<li class="${v.level}">${esc(v.text)}</li>`).join("")}</ul>
        <h3 class="sub-h">Makros</h3>
        <table class="nut-table"><thead><tr><th></th><th>Menge</th><th>kcal-Anteil</th><th></th></tr></thead><tbody>
          ${macroRow("Eiweiß", day.protein, day.share.protein, day.protein_per_kg != null ? `${fmtN(day.protein_per_kg, 2)} g/kg (Ziel ${fmtN(day.target_per_kg, 2)})` : "")}
          ${macroRow("Kohlenhydrate", day.carbs, day.share.carbs)}
          ${macroRow("Fett", day.fat, day.share.fat, "ohne eigenes Ziel")}
        </tbody></table>
        <h3 class="sub-h">Ballaststoffe, Zucker, Salz, Vitamine und Mineralstoffe</h3>
        <ul class="nut-list">${day.nutrients.map(nut).join("")}</ul>
        <p class="meta">Richtwerte: DGE für Männer 19–50. Zucker und gesättigte Fette höchstens je 10 % deines Kalorienziels.
          Vitamin D kommt vor allem aus Sonnenlicht, übers Essen ist es selten voll. Mikronährstoffe sind noch gröber geschätzt als Kalorien: Sie hängen an der Sorte, nicht nur an der Menge.</p>
      </section>
      <div>
        <section class="panel" id="food-card" style="--accent:var(--orange)">
          <header class="ptitle"><span>Essen eintragen</span></header>
          <form class="form" id="food-form">
            <div class="two"><select name="meal" aria-label="Mahlzeit">${Object.entries(MEAL_LABEL).map(([k, l]) =>
              `<option value="${k}" ${k === this.mealNow() ? "selected" : ""}>${l}</option>`).join("")}</select>
              <input name="date" type="date" value="${t}" aria-label="Tag"></div>
            <input name="text" placeholder="z. B. 2 Brötchen mit Käse, Apfel" required autocomplete="off">
            <div class="food-preview meta" id="food-preview">Menge davor schreiben hilft: „2 Brötchen“, „halbe Pizza“, „200 g Reis“.</div>
            <div class="two"><input name="kcal" type="number" min="0" max="5000" placeholder="eigene kcal (optional)" aria-label="Eigene Kalorien">
              <button class="primary">Essen speichern</button></div>
          </form>
        </section>
        <section class="panel" style="--accent:var(--orange)">
          <header class="ptitle"><span>Mahlzeiten heute</span><span class="meta">${day.entries} Einträge</span></header>
          ${day.parts.length ? `<ul class="list">${day.parts.map(part).join("")}</ul>` : `<p class="empty">Noch nichts eingetragen.</p>`}
        </section>
      </div>
      <section class="panel" style="--accent:var(--orange)">
        <header class="ptitle"><span>7 Tage (Schätzung)</span><span class="meta">Ø ${f.avg_kcal ? `~${fmtN(f.avg_kcal, 0)} kcal · ${fmtN(f.avg_protein, 0)} g Eiweiß` : "–"}</span></header>
        ${kcalChart(f.totals, f.kcal_target)}
        ${f.week.days ? `<p class="meta">An <b>${f.week.protein_hit} von ${f.week.days}</b> erfassten Tagen Eiweißziel erreicht, an <b>${f.week.kcal_in_range}</b> Kalorien im Zielbereich (±10 %).</p>` : ""}
        ${Object.keys(days).length ? Object.entries(days).map(([dd, ms]) => {
          const tot = f.totals.find((x) => x.date === dd);
          return `<div class="sub-h">${esc(fmtDate(dd))}${tot?.entries ? ` · ~${fmtN(tot.kcal, 0)} kcal · ${fmtN(tot.protein, 0)} g E` : ""}</div><ul class="list">${ms.map(row).join("")}</ul>`;
        }).join("") : ""}
      </section>
      <section class="panel" style="--accent:var(--orange)">
        <header class="ptitle"><span>Tagesziele</span></header>
        <form class="form" id="food-targets">
          <div class="two"><label class="field">Kalorien<input name="kcal_target" type="number" min="1000" max="6000" value="${st.kcal_target || ""}"></label>
            <label class="field">Eiweiß (g)<input name="protein_target" type="number" min="20" max="400" value="${st.protein_target || ""}"></label></div>
          <div class="two"><label class="field">Gewicht (kg)<input name="weight_kg" type="number" step="0.1" min="30" max="250" value="${st.weight_kg || ""}"></label>
            <label class="field">Größe (cm)<input name="height_cm" type="number" min="120" max="230" value="${st.height_cm || ""}"></label></div>
          <button class="primary">Ziele speichern</button></form>
        <p class="meta">Fett hat kein eigenes Ziel, wird aber mitgezählt. Die Werte sind Schätzungen (±30–50 % je Mahlzeit): gut für die Richtung, nicht fürs Grammzählen. Nichts davon geht ins Netz.</p>
      </section></div>`;
  },

  mealNow() {
    const h = new Date().getHours();
    return h < 10 ? "frühstück" : h < 15 ? "mittag" : h < 17 ? "snack" : h < 21 ? "abend" : "tag";
  },

  /** Aus der Push-Mitteilung (/?log=sleep): gleich auf die Detailseite springen, Formular hervorheben. */
  deepLink() {
    const want = new URLSearchParams(location.search).get("log");
    if (!want || !SEGMENTS.some(([k]) => k === want)) return;
    history.replaceState(null, "", location.pathname + `#health/${want}`);
    current = `health/${want}`;
    this.seg = want;
  },

  highlight(want) {
    const card = $(`#${want}-card`);
    if (!card) return;
    card.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
    card.classList.add("callout");
    card.querySelector("input:not([type=radio]):not([type=date])")?.focus({ preventScroll: true });
  },

  async reload(msg) {
    if (msg) { Sfx.play("coin"); toast(msg); }
    await this.load();
    this.render();
  },

  bind() {
    const form = (id, url, build, msg) => $(id)?.addEventListener("submit", async (e) => {
      e.preventDefault();
      try { await post(url, build(Object.fromEntries(new FormData(e.target)))); await this.reload(msg); } catch (err) { showError(err); }
    });
    form("#sleep-form", "/api/wellness/sleep", (f) => ({ ...f, quality: +f.quality, note: f.note || null }), "Schlaf gespeichert");
    form("#food-form", "/api/wellness/food", (f) => ({ ...f, kcal: f.kcal ? +f.kcal : null }), "Essen gespeichert");
    form("#sport-form", "/api/wellness/sport", (f) => ({ ...f, minutes: +f.minutes, note: f.note || null }), "Sport gespeichert");
    form("#goal-form", "/api/wellness/goals", (f) => ({ title: f.title, kind: f.kind || null, unit: f.unit,
      start_value: f.start_value === "" ? null : +f.start_value, target_value: +f.target_value,
      lower_better: !!f.lower_better, due_date: f.due_date || null }), "Ziel angelegt");
    $("#food-targets")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target)), st = this.data.settings;
      try {
        await api("/api/settings/wellness", { method: "PUT", body: { sleep_target: st.sleep_target, sport_per_week: st.sport_per_week,
          kcal_target: f.kcal_target ? +f.kcal_target : null, protein_target: f.protein_target ? +f.protein_target : null,
          weight_kg: f.weight_kg ? +f.weight_kg : null, height_cm: f.height_cm ? +f.height_cm : null } });
        await this.reload("Ziele gespeichert");
      } catch (err) { showError(err); }
    });
    view.querySelectorAll("[data-goal-log]").forEach((el) => el.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        const r = await post(`/api/wellness/goals/${el.dataset.goalLog}/log`, { value: +f.value, date: f.date });
        if (r.reached) levelUp(null, "ZIEL ERREICHT!");
        await this.reload(r.reached ? "Ziel erreicht!" : "Wert eingetragen");
      } catch (err) { showError(err); }
    }));
    // Sport: Dauer-Regler mit Anzeige, Schnellwahl und Sportart-Chips
    const range = $("#sport-form [name=minutes]");
    const showDur = () => { $("#dur-out").textContent = fmtMin(+range.value); };
    range?.addEventListener("input", showDur);
    // Ernährung: Vorschau der Schätzung beim Tippen
    const ft = $("#food-form [name=text]");
    let timer;
    ft?.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        if (!ft.value.trim()) return;
        try {
          const e = await api(`/api/wellness/estimate?text=${encodeURIComponent(ft.value)}`);
          $("#food-preview").innerHTML = e.items.length
            ? `Schätzung: ~${fmtN(e.kcal, 0)} kcal · E ${fmtN(e.protein, 0)} g · KH ${fmtN(e.carbs, 0)} g · F ${fmtN(e.fat, 0)} g
               <span class="muted">(${e.items.map((i) => `${i.factor !== 1 ? `${fmtN(i.factor)}× ` : ""}${esc(i.label)}`).join(", ")})</span>`
              + (e.unknown.length ? ` · <span class="overdue">nicht erkannt: ${esc(e.unknown.join(", "))}</span>` : "")
            : `Nicht erkannt. Mit eigenen kcal speichern oder anders beschreiben.`;
        } catch { /* Vorschau ist Beiwerk */ }
      }, 350);
    });
    view.onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.days) { this.days = +b.dataset.days; return this.reload(); }
      if (b.dataset.kind) { $("#sport-form [name=kind]").value = b.dataset.kind; return; }
      if (b.dataset.rate) {
        const [id, q] = b.dataset.rate.split(":");
        try { await api(`/api/wellness/sleep/${id}/quality`, { method: "PUT", body: { quality: +q } }); return this.reload(`Bewertet: ${QUALITY[q - 1]}`); }
        catch (err) { return showError(err); }
      }
      if (b.dataset.min) { range.value = b.dataset.min; return showDur(); }
      try {
        if (b.dataset.help) {
          b.disabled = true; b.textContent = "Jarvis plant …";
          await post(`/api/wellness/goals/${b.dataset.help}/help`);
          return this.reload("Trainingsvorschlag da");
        }
        if (b.dataset.goalStatus) {
          const [id, st] = b.dataset.goalStatus.split(":");
          await api(`/api/wellness/goals/${id}`, { method: "PUT", body: { status: st } });
          return this.reload();
        }
        const del = b.dataset.del;
        if (!del || !confirm("Eintrag löschen? Das lässt sich nicht rückgängig machen.")) return;
        const [kind, id] = del.split(":");
        await api(`/api/wellness/${kind}/${id}`, { method: "DELETE" });
        await this.reload();
      } catch (err) { showError(err); b.disabled = false; }
    };
  },
};

Object.assign(VIEWS, {
  async health() {
    const want = new URLSearchParams(location.search).get("log");
    Health.seg = current.split("/")[1] || null;
    Health.deepLink();
    await Health.load();
    Health.render();
    if (want) Health.highlight(want);
  },
});

</script>
  <script>
"use strict";

// Lexikon der Holzverbindungen (Ausbildung → Holzverbindungen). Daten und Geometrie: app/holz.py.
// #training/holz = Liste, #training/holz/<id> = Verbindung mit 3D-Modell und Schritt-für-Schritt-Ablauf.
// Der 3D-Zeichner ist bewusst klein und ohne Bibliothek: Prismen → Flächen → Tiefenpuffer (z-Buffer) auf
// einem Canvas. Kanten entstehen dort, wo im Bild die Fläche wechselt; so gibt es keine falschen Nahtlinien.

// ---------------------------------------------------------------- 3D-Zeichner
const H3 = {
  WOOD: { a: [222, 172, 112], b: [190, 136, 86], c: [128, 84, 46] },
  WASTE: [229, 72, 77],
  MARK: [229, 40, 55],

  /** Prisma → Flächen {pts, n}. Vieleck in (u, v), ausgezogen entlang axis von r[0] bis r[1]. */
  faces(pr) {
    const ax = pr.axis, [a0, a1] = pr.r;
    const P = (u, v, a) => (ax === "x" ? [a, u, v] : ax === "y" ? [u, a, v] : [u, v, a]);
    const U = ax === "x" ? [0, 1, 0] : [1, 0, 0], V = ax === "z" ? [0, 1, 0] : [0, 0, 1];
    const A = ax === "x" ? [1, 0, 0] : ax === "y" ? [0, 1, 0] : [0, 0, 1];
    let poly = pr.poly.map((p) => p.slice());
    let s = 0;
    for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; s += p[0] * q[1] - q[0] * p[1]; }
    if (s < 0) poly.reverse();
    const key = (p, q) => `${p[0]},${p[1]}>${q[0]},${q[1]}`;
    const edges = new Set(poly.map((p, i) => key(p, poly[(i + 1) % poly.length])));
    const out = [
      { pts: poly.map(([u, v]) => P(u, v, a1)), n: A },
      { pts: poly.map(([u, v]) => P(u, v, a0)), n: A.map((x) => -x) },
    ];
    poly.forEach((p, i) => {
      const q = poly[(i + 1) % poly.length];
      if (edges.has(key(q, p))) return;  // Steg im Schlüsselloch-Vieleck: keine echte Fläche
      const du = q[0] - p[0], dv = q[1] - p[1], len = Math.hypot(du, dv);
      if (len < 1e-9) return;
      const nu = dv / len, nv = -du / len;
      out.push({ pts: [P(p[0], p[1], a0), P(q[0], q[1], a0), P(q[0], q[1], a1), P(p[0], p[1], a1)],
        n: [U[0] * nu + V[0] * nv, U[1] * nu + V[1] * nv, U[2] * nu + V[2] * nv] });
    });
    return out;
  },

  /** Kanten eines Prismas (für Anrisslinien): Vieleckkanten oben/unten und Längskanten. */
  edges(pr) {
    const segs = [];
    for (const f of this.faces(pr)) f.pts.forEach((p, i) => segs.push([p, f.pts[(i + 1) % f.pts.length]]));
    return segs;
  },

  camera(yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    return { f: [cp * cy, cp * sy, sp], r: [-sy, cy, 0], u: [-cy * sp, -sy * sp, cp] };
  },

  /** items: [{prism, rgb, grain, off}], marks: [[p, q]], dims: [{a, b, label}]. */
  draw(cv, items, { yaw, pitch, center, radius, marks = [], dims = [] }) {
    const dpr = window.devicePixelRatio || 1, W = Math.round(cv.clientWidth * dpr), Hh = Math.round(cv.clientHeight * dpr);
    if (!W || !Hh) return;
    cv.width = W; cv.height = Hh;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(W, Hh), px = img.data;
    const zb = new Float32Array(W * Hh).fill(-Infinity), pid = new Int32Array(W * Hh).fill(-1);
    const cam = this.camera(yaw, pitch), s = Math.min(W, Hh) / (2.25 * radius);
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const proj = (p) => {
      const q = [p[0] - center[0], p[1] - center[1], p[2] - center[2]];
      return [W / 2 + s * dot(q, cam.r), Hh / 2 - s * dot(q, cam.u), s * dot(q, cam.f)];
    };
    const L = [-0.35, -0.55, 0.76];
    const planes = new Map();
    for (const it of items) {
      for (const f of this.faces(it.prism)) {
        if (dot(f.n, cam.f) <= 1e-6) continue;  // Rückseite
        const pts = f.pts.map((p) => proj([p[0] + it.off[0], p[1] + it.off[1], p[2] + it.off[2]]));
        // Bildebene: d = a·x + b·y + c aus drei nicht kollinearen Punkten
        let pl = null;
        for (let i = 2; i < pts.length && !pl; i++) {
          const [x0, y0, d0] = pts[0], [x1, y1, d1] = pts[1], [x2, y2, d2] = pts[i];
          const det = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
          if (Math.abs(det) < 1e-6) continue;
          const a = ((d1 - d0) * (y2 - y0) - (d2 - d0) * (y1 - y0)) / det, b = ((x1 - x0) * (d2 - d0) - (x2 - x0) * (d1 - d0)) / det;
          pl = [a, b, d0 - a * x0 - b * y0];
        }
        if (!pl) continue;
        const wp = [f.pts[0][0] + it.off[0], f.pts[0][1] + it.off[1], f.pts[0][2] + it.off[2]];
        const pk = `${f.n.map((x) => x.toFixed(3))}|${dot(f.n, wp).toFixed(2)}|${it.group}`;
        if (!planes.has(pk)) planes.set(pk, planes.size);
        const id = planes.get(pk);
        let k = 0.42 + 0.58 * Math.max(0, dot(f.n, L) / Math.hypot(...L));
        if (it.grain && Math.abs(f.n[it.grain]) > 0.9) k *= 0.8;  // Hirnholz dunkler
        const rgb = it.rgb.map((c) => Math.min(255, Math.round(c * k)));
        const ys = pts.map((p) => p[1]), y0 = Math.max(0, Math.ceil(Math.min(...ys) - 0.5)), y1 = Math.min(Hh - 1, Math.floor(Math.max(...ys) - 0.5));
        for (let y = y0; y <= y1; y++) {
          const yc = y + 0.5, xs = [];
          for (let i = 0; i < pts.length; i++) {
            const p = pts[i], q = pts[(i + 1) % pts.length];
            if ((p[1] > yc) !== (q[1] > yc)) xs.push(p[0] + (yc - p[1]) * (q[0] - p[0]) / (q[1] - p[1]));
          }
          xs.sort((m, n) => m - n);
          for (let j = 0; j + 1 < xs.length; j += 2) {
            const xa = Math.max(0, Math.ceil(xs[j] - 0.5)), xb = Math.min(W - 1, Math.floor(xs[j + 1] - 0.5));
            for (let x = xa; x <= xb; x++) {
              const d = pl[0] * (x + 0.5) + pl[1] * yc + pl[2], i = y * W + x;
              if (d > zb[i]) { zb[i] = d; pid[i] = id; px[i * 4] = rgb[0]; px[i * 4 + 1] = rgb[1]; px[i * 4 + 2] = rgb[2]; px[i * 4 + 3] = 255; }
            }
          }
        }
      }
    }
    // Kanten: wo die Fläche im Bild wechselt (auch Umriss gegen den Hintergrund)
    const ew = Math.max(1, Math.round(dpr));
    const edge = new Uint8Array(W * Hh);
    for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, a = pid[i];
      const r = x + 1 < W ? pid[i + 1] : -1, d = y + 1 < Hh ? pid[i + W] : -1;
      if ((a !== r || a !== d) && (a !== -1 || r !== -1 || d !== -1)) edge[i] = 1;
    }
    for (let i = 0; i < edge.length; i++) if (edge[i]) {
      const x = i % W, y = (i / W) | 0;
      for (let dy = 0; dy < ew; dy++) for (let dx = 0; dx < ew; dx++) {
        const j = (y + dy) * W + x + dx;
        if (y + dy >= Hh || x + dx >= W) continue;
        px[j * 4] = 38; px[j * 4 + 1] = 28; px[j * 4 + 2] = 20; px[j * 4 + 3] = 255;
      }
    }
    // Anrisslinien mit Tiefentest: nur was man wirklich sieht
    const lw = Math.max(2, Math.round(2 * dpr)), eps = 0.02 * s;
    for (const [p, q] of marks) {
      const a = proj(p), b = proj(q), n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1])) + 1;
      for (let k = 0; k <= n; k++) {
        const t = k / n, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t, d = a[2] + (b[2] - a[2]) * t;
        const xi = Math.floor(x), yi = Math.floor(y);
        if (xi < 0 || yi < 0 || xi >= W || yi >= Hh || d < zb[yi * W + xi] - eps) continue;
        for (let dy = -(lw >> 1); dy < lw - (lw >> 1); dy++) for (let dx = -(lw >> 1); dx < lw - (lw >> 1); dx++) {
          const xx = xi + dx, yy = yi + dy;
          if (xx < 0 || yy < 0 || xx >= W || yy >= Hh) continue;
          const j = yy * W + xx;
          px[j * 4] = this.MARK[0]; px[j * 4 + 1] = this.MARK[1]; px[j * 4 + 2] = this.MARK[2]; px[j * 4 + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    // Maßlinien obenauf, mit Beschriftung
    ctx.font = `${Math.round(12 * dpr)}px system-ui, sans-serif`;
    ctx.textBaseline = "middle";
    for (const dm of dims) {
      const a = proj(dm.a), b = proj(dm.b);
      ctx.strokeStyle = "#4cd3e0"; ctx.fillStyle = "#4cd3e0"; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      for (const p of [a, b]) { ctx.beginPath(); ctx.arc(p[0], p[1], 2.5 * dpr, 0, 7); ctx.fill(); }
      const mx = (a[0] + b[0]) / 2 + 8 * dpr, my = (a[1] + b[1]) / 2, tw = ctx.measureText(dm.label).width;
      ctx.fillStyle = "rgba(5,7,12,.82)"; ctx.fillRect(mx - 3 * dpr, my - 9 * dpr, tw + 6 * dpr, 18 * dpr);
      ctx.fillStyle = "#e8f6f8"; ctx.fillText(dm.label, mx, my);
    }
  },
};

// ---------------------------------------------------------------- Ansicht: Lexikon
const STAGE_LABEL = { raw: "Rohe Hölzer", dims: "Maße", marks: "Anriss (rot)", cut: "Schnitt: Abfall fällt heraus", parts: "Fertige Teile",
  assembled: "Zusammengebaut", drawing: "Originalzeichnung" };
const HOLZ_STATUS = [["neu", "neu"], ["geübt", "geübt"], ["sicher", "sicher"]];
const PHASE_SYM = { Planung: "◇", Messen: "↔", Winkel: "∟", Anreißen: "✎", Schneiden: "▤", Zusammenbau: "⊞" };

const Holz = {
  list: null, d: null, step: 0, yaw: -2.35, pitch: 0.55, filter: "Alle", q: "", together: null,

  get bh() {
    try { const v = JSON.parse(localStorage.getItem("holzBH")); if (v && v.b && v.h) return v; } catch { /* egal */ }
    return { b: 8, h: 10 };
  },
  set bh(v) { try { localStorage.setItem("holzBH", JSON.stringify(v)); } catch { /* egal */ } },

  async route() {
    const id = current.split("/")[2];
    if (id) return this.detail(id);
    this.list = await api("/api/holz");
    this.renderList();
  },

  // ---------------- Liste
  renderList() {
    const groups = ["Alle", ...this.list.groups];
    const q = this.q.toLowerCase();
    const items = this.list.items.filter((i) => (this.filter === "Alle" || i.group === this.filter) && (!q || i.name.toLowerCase().includes(q)));
    const done = this.list.items.filter((i) => i.status === "sicher").length;
    view.innerHTML = `<h1>Holzverbindungen</h1>
      <p class="sub">${this.list.items.length} Verbindungen aus deinem Werkstattheft (1. Ausbildungsjahr). ${done} sitzen sicher.
        Antippen: Schritt für Schritt mit Modell zum Drehen.</p>
      <div class="hz-tools">
        <label class="field">Suchen<input id="hz-q" type="search" placeholder="z. B. Zapfen, Blatt, Kamm" value="${esc(this.q)}" autocomplete="off"></label>
        ${this.bhForm()}
      </div>
      <div class="chips hz-groups">${groups.map((g) => `<button class="${g === this.filter ? "on" : ""}" data-group="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <div class="hz-grid">${items.map((i) => `<a class="hz-card st-${esc(i.status)}" href="#training/holz/${esc(i.id)}">
          <span class="hz-kind">${i.model ? "3D-Modell" : "Zeichnung"}</span>
          <b>${esc(i.name)}</b>
          <span class="meta">${esc(i.group)} · Auftrag ${esc(i.auftrag)} · Heft S. ${i.seite}</span>
          <span class="hz-status">${esc(i.status)}${i.notiz ? " · eigene Notiz" : ""}</span></a>`).join("") || `<p class="empty">Nichts gefunden.</p>`}</div>
      <section class="panel" style="--accent:var(--orange)">${this.versatzCalc()}</section>`;
    $("#hz-q").oninput = (e) => { this.q = e.target.value; const pos = e.target.selectionStart; this.renderList(); const n = $("#hz-q"); n.focus(); n.setSelectionRange(pos, pos); };
    view.onclick = (e) => {
      const g = e.target.closest("[data-group]");
      if (g) { this.filter = g.dataset.group; this.renderList(); }
    };
    this.bindBH(() => this.renderList());
    this.bindVersatz();
  },

  bhForm() {
    const { b, h } = this.bh;
    return `<form class="hz-bh" id="hz-bh" aria-label="Querschnitt">
      <label class="field">Breite b (cm)<input name="b" type="number" min="4" max="40" step="0.5" value="${b}"></label>
      <label class="field">Höhe h (cm)<input name="h" type="number" min="4" max="40" step="0.5" value="${h}"></label></form>`;
  },

  bindBH(after) {
    $("#hz-bh")?.addEventListener("change", (e) => {
      const f = Object.fromEntries(new FormData(e.currentTarget));
      const b = +f.b, h = +f.h;
      if (b >= 4 && b <= 40 && h >= 4 && h <= 40) { this.bh = { b, h }; after(); } else toast("Querschnitt zwischen 4 und 40 cm");
    });
  },

  versatzCalc() {
    return `<header class="ptitle"><span>Versatz-Rechner (Heft 1-H3-5)</span></header>
      <form class="form hz-versatz" id="hz-versatz">
        <div class="two"><label class="field">Anschlusswinkel α (°)<input name="alpha" type="number" min="1" max="89" value="45"></label>
          <label class="field">Balkenhöhe h (cm)<input name="h" type="number" min="4" max="40" step="0.5" value="${this.bh.h}"></label></div>
        <div class="seg mini" role="radiogroup"><label><input type="radio" name="art" value="einseitig" checked> einseitig</label>
          <label><input type="radio" name="art" value="doppelt"> doppelt</label></div>
      </form><p class="hz-vres" id="hz-vres"></p>
      <p class="meta">Tabelle aus dem Heft: einseitig bis 50° max. h/4, über 60° max. h/6, dazwischen linear; zweiseitig je Einschnitt max. h/6, tv1 = tv2 × 0,8.</p>`;
  },

  bindVersatz() {
    const f = $("#hz-versatz");
    if (!f) return;
    const calc = async () => {
      const v = Object.fromEntries(new FormData(f));
      try {
        const r = await api(`/api/holz/versatz?alpha=${encodeURIComponent(v.alpha)}&h=${encodeURIComponent(v.h)}&art=${v.art}`);
        $("#hz-vres").innerHTML = r.tv != null ? `<b class="num">tv max. = ${fmtN(r.tv, 1)} cm</b> <span class="meta">${esc(r.regel)}</span>`
          : `<b class="num">tv2 = ${fmtN(r.tv2, 1)} cm, tv1 = ${fmtN(r.tv1, 1)} cm</b> <span class="meta">${esc(r.regel)}</span>`;
      } catch (err) { $("#hz-vres").textContent = err.message; }
    };
    f.addEventListener("input", calc);
    calc();
  },

  // ---------------- Detail
  async detail(id) {
    const { b, h } = this.bh;
    const d = await api(`/api/holz/${encodeURIComponent(id)}?b=${b}&h=${h}`);
    if (!this.d || this.d.id !== d.id) { this.step = 0; this.together = null; this.yaw = -2.35; this.pitch = 0.55; this.fresh = true; }
    this.d = d;
    this.prepare();
    this.renderDetail();
  },

  /** Einmal je Modell: feste Größe/Mitte über alle Zustände, damit beim Durchklicken nichts springt. */
  prepare() {
    const m = this.d.model;
    if (!m) return;
    if (m.view && this.fresh) [this.yaw, this.pitch] = m.view;
    this.fresh = false;
    m.pieces.forEach((pc) => { pc.center = this.bbox(pc.raw).c; });
    this.placeWaste(m);
    const pts = [];
    for (const pc of m.pieces) {
      for (const pr of pc.raw) for (const f of H3.faces(pr)) for (const p of f.pts)
        for (const o of [[0, 0, 0], pc.explode]) pts.push([p[0] + o[0], p[1] + o[1], p[2] + o[2]]);
      pc.waste.forEach((pr, j) => { for (const f of H3.faces(pr)) for (const p of f.pts) pts.push(p.map((v, i) => v + pc.wasteOffs[j][i])); });
    }
    const lo = [0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), hi = [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i])));
    const c = lo.map((v, i) => (v + hi[i]) / 2);
    this.center = c;
    this.radius = Math.max(...pts.map((p) => Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2])));
  },

  bbox(prisms) {
    const pts = prisms.flatMap((pr) => H3.faces(pr).flatMap((f) => f.pts));
    const lo = [0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), hi = [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i])));
    return { lo, hi, c: lo.map((v, i) => (v + hi[i]) / 2), size: Math.max(...hi.map((v, i) => v - lo[i])) };
  },

  /** Abfall "fällt heraus": vom Holz weg in Richtung seiner Lage. Stößt er dabei in ein anderes Teil
   *  (z. B. in den Schwalbenschwanz des Gegenholzes), wird eine andere Richtung gewählt. */
  placeWaste(m) {
    const boxOf = (prisms, o) => { const b = this.bbox(prisms); return { lo: b.lo.map((v, i) => v + o[i]), hi: b.hi.map((v, i) => v + o[i]) }; };
    const hit = (a, c) => [0, 1, 2].every((i) => a.lo[i] < c.hi[i] - 1e-6 && c.lo[i] < a.hi[i] - 1e-6);
    const taken = m.pieces.flatMap((pc) => pc.keep.map((pr) => boxOf([pr], pc.explode)));
    for (const pc of m.pieces) {
      const size = this.bbox(pc.raw).size;
      pc.wasteOffs = pc.waste.map((pr) => {
        const wc = this.bbox([pr]).c, d = wc.map((v, i) => v - pc.center[i]), n = Math.hypot(...d);
        const main = n < 1e-6 ? [0, 0, 1] : d.map((x) => x / n);
        const tries = [main, main.map((x) => -x), [0, 0, 1], [0, 0, -1], [1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, -1, 0]];
        for (const k of [0.45, 0.8]) for (const v of tries) {
          const off = pc.explode.map((e, i) => e + v[i] * k * size), bb = boxOf([pr], off);
          if (!taken.some((t) => hit(bb, t))) { taken.push(bb); return off; }
        }
        return pc.explode.map((e, i) => e + main[i] * 1.2 * size);
      });
    }
  },

  stage() { return this.d.schritte[this.step]?.stage || "raw"; },

  scene() {
    const m = this.d.model, st = this.stage(), items = [], marks = [];
    const apart = this.together === null ? st !== "assembled" : !this.together;
    m.pieces.forEach((pc, k) => {
      const off = apart ? pc.explode : [0, 0, 0], rgb = H3.WOOD[pc.tone] || H3.WOOD.a, grain = { x: 0, y: 1, z: 2 }[pc.grain];
      const add = (pr, o, col, g) => items.push({ prism: pr, off: o, rgb: col, grain, group: g });
      if (["raw", "dims", "marks"].includes(st)) {
        pc.raw.forEach((pr) => add(pr, off, rgb, k));
        if (st === "marks") pc.waste.forEach((pr) => H3.edges(pr).forEach(([p, q]) => marks.push([p, q].map((x) => x.map((v, i) => v + off[i])))));
      } else {
        pc.keep.forEach((pr) => add(pr, off, rgb, k));
        if (st === "cut") pc.waste.forEach((pr, j) => add(pr, apart ? pc.wasteOffs[j] : off, H3.WASTE, 100 + k * 50 + j));
      }
    });
    const dims = st === "dims" ? m.dims.map((dm) => {
      const o = apart ? m.pieces[dm.p || 0].explode : [0, 0, 0];
      return { ...dm, a: dm.a.map((v, i) => v + o[i]), b: dm.b.map((v, i) => v + o[i]) };
    }) : [];
    return { items, marks, dims };
  },

  paint() {
    const cv = $("#hz-cv");
    if (!cv || !this.d.model) return;
    const sc = this.scene();
    H3.draw(cv, sc.items, { yaw: this.yaw, pitch: this.pitch, center: this.center, radius: this.radius, marks: sc.marks, dims: sc.dims });
  },

  renderDetail() {
    const d = this.d, s = d.schritte[this.step], st = this.stage();
    const showDrawing = !d.model || st === "drawing";
    view.innerHTML = `<h1>${esc(d.name)}</h1>
      <p class="sub">${esc(d.group)} · Auftrag ${esc(d.auftrag)} · Werkstattheft S. ${d.seite}</p>
      <div class="hz-tools">${this.bhForm()}
        <div class="hz-statusbar seg" role="radiogroup" aria-label="Mein Stand">${HOLZ_STATUS.map(([k, l]) =>
          `<button class="${d.status === k ? "on" : ""}" data-status="${k}">${l}</button>`).join("")}</div></div>
      <div class="hz-detail">
        <section class="panel hz-view" style="--accent:#c8793a">
          <header class="ptitle"><span>${showDrawing ? "Originalzeichnung" : esc(STAGE_LABEL[st] || st)}</span>
            <span class="meta">Schritt ${this.step + 1} / ${d.schritte.length}</span></header>
          ${showDrawing ? `${d.no_model ? `<p class="meta">${esc(d.no_model)}</p>` : ""}
              <a href="${esc(d.bild)}" target="_blank" rel="noopener"><img class="hz-img" src="${esc(d.bild)}" alt="Zeichnung ${esc(d.name)} aus dem Werkstattheft, Seite ${d.seite}"></a>`
            : `<canvas id="hz-cv" class="hz-cv" aria-label="3D-Modell ${esc(d.name)}, mit Finger oder Maus drehen"></canvas>
              <div class="hz-ctrl"><button class="ghost" data-hz="together">${(this.together === null ? st === "assembled" : this.together) ? "Auseinander" : "Zusammen"}</button>
                <button class="ghost" data-hz="reset">Ansicht zurücksetzen</button>
                ${d.model ? `<a class="link" href="${esc(d.bild)}" target="_blank" rel="noopener">Heftzeichnung</a>` : ""}</div>
              <p class="meta hz-legend"><i class="lg-mark"></i> Anriss · <i class="lg-waste"></i> Abfall · <i class="lg-dim"></i> Maß · ziehen = drehen</p>`}
          <div class="hz-stepnav"><button class="ghost" data-hz="prev" ${this.step === 0 ? "disabled" : ""}>‹ Zurück</button>
            <button class="primary" data-hz="next" ${this.step >= d.schritte.length - 1 ? "disabled" : ""}>Weiter ›</button></div>
        </section>
        <section class="panel hz-steps" style="--accent:#c8793a">
          <header class="ptitle"><span>Schritt für Schritt</span></header>
          <div class="hz-cur"><span class="hz-phase">${PHASE_SYM[s.phase] || ""} ${esc(s.phase)}</span><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>
          <ol class="hz-list">${d.schritte.map((x, i) => `<li><button class="${i === this.step ? "on" : ""}" data-step="${i}">
            <span class="hz-phase">${PHASE_SYM[x.phase] || ""} ${esc(x.phase)}</span>${esc(x.title)}</button></li>`).join("")}</ol>
          <p class="meta">Ablauf nach üblicher Abbund-Praxis. Macht dein Ausbilder es anders, gilt seins: unten als Notiz festhalten.</p>
        </section>
      </div>
      <div class="hz-info">
        <section class="panel"><header class="ptitle"><span>Maße für ${fmtN(d.b)}/${fmtN(d.h)}</span></header>
          <table class="nut-table"><tbody>${d.regeln.map((r) => `<tr><th>${esc(r.label)}</th><td class="muted">${esc(r.formel)}</td><td class="num">${r.wert ? esc(r.wert) : "–"}</td></tr>`).join("")}</tbody></table></section>
        <section class="panel"><header class="ptitle"><span>Anwendung</span></header><p>${esc(d.anwendung)}</p>${d.kraft ? `<p class="meta">${esc(d.kraft)}</p>` : ""}
          ${d.fehler.length ? `<h3 class="sub-h">Häufige Fehler</h3><ul class="hz-err">${d.fehler.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}</section>
        ${d.group === "Versätze" ? `<section class="panel">${this.versatzCalc()}</section>` : ""}
        <section class="panel"><header class="ptitle"><span>Eigene Notizen</span></header>
          <textarea id="hz-note" rows="4" placeholder="Was der Ausbilder anders macht, Maße aus der Praxis, Merksätze …">${esc(d.notiz)}</textarea>
          <button class="ghost" data-hz="save">Notiz speichern</button></section>
      </div>`;
    this.bind();
    requestAnimationFrame(() => this.paint());
  },

  bind() {
    view.onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.step) {
        this.step = +b.dataset.step; this.together = null; this.renderDetail();
        // Handy: Modell und Liste stehen untereinander → zum Modell springen, sonst sieht man den Schritt nicht
        if (!window.matchMedia("(min-width: 960px)").matches) $(".hz-view")?.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
        return;
      }
      if (b.dataset.status) {
        try { await api(`/api/holz/${this.d.id}`, { method: "PUT", body: { status: b.dataset.status } }); this.d.status = b.dataset.status; toast(`Stand: ${b.dataset.status}`); this.renderDetail(); }
        catch (err) { showError(err); }
        return;
      }
      const a = b.dataset.hz;
      if (a === "next" || a === "prev") { this.step += a === "next" ? 1 : -1; this.together = null; return this.renderDetail(); }
      if (a === "together") {
        const now = this.together === null ? this.stage() === "assembled" : this.together;
        this.together = !now; b.textContent = this.together ? "Auseinander" : "Zusammen"; return this.paint();
      }
      if (a === "reset") { [this.yaw, this.pitch] = this.d.model?.view || [-2.35, 0.55]; return this.paint(); }
      if (a === "save") {
        try { await api(`/api/holz/${this.d.id}`, { method: "PUT", body: { notiz: $("#hz-note").value } }); this.d.notiz = $("#hz-note").value; toast("Notiz gespeichert"); }
        catch (err) { showError(err); }
      }
    };
    this.bindBH(() => this.detail(this.d.id));
    this.bindVersatz();
    const cv = $("#hz-cv");
    if (!cv) return;
    let drag = null, raf = 0;
    cv.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", (e) => {
      if (!drag) return;
      this.yaw -= (e.clientX - drag[0]) * 0.01;
      this.pitch = Math.max(-0.2, Math.min(1.45, this.pitch + (e.clientY - drag[1]) * 0.01));
      drag = [e.clientX, e.clientY];
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; this.paint(); });
    });
    const end = () => { drag = null; };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    if (this._ro) this._ro.disconnect();
    this._ro = new ResizeObserver(() => this.paint());
    this._ro.observe(cv);
  },
};

      <div class="hz-tools"><label class="field">Suchen<input id="wz-q" type="search" placeholder="z. B. Säge, Winkel, messen" value="${esc(this.q)}" autocomplete="off"></label></div>
      <div class="chips hz-groups">${groups.map((g) => `<button class="${g === this.filter ? "on" : ""}" data-group="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <div class="hz-grid wz-grid">${items.map((i) => `<a class="hz-card wz-card st-${esc(i.status)}" href="#training/werkzeug/${esc(i.id)}">

    $("#wz-q").oninput = (e) => { this.q = e.target.value; const pos = e.target.selectionStart; this.renderList(); const n = $("#wz-q"); n.focus(); n.setSelectionRange(pos, pos); };
    view.onclick = (e) => {
      const g = e.target.closest("[data-group]");
      if (g) { this.filter = g.dataset.group; this.renderList(); }

  },

  async detail(id) {
    this.d = await api(`/api/werkzeug/${encodeURIComponent(id)}`);

  renderDetail() {
    const d = this.d;
    const li = (xs) => xs.map((x) => `<li>${esc(x)}</li>`).join("");
    view.innerHTML = `<h1>${esc(d.name)}</h1>
      <p class="sub">${esc(d.group)}${d.maschine ? " · nur nach Unterweisung" : ""}</p>
      <div class="hz-tools"><div class="hz-statusbar seg" role="radiogroup" aria-label="Mein Stand">${WZ_STATUS.map(([k, l]) =>
        `<button class="${d.status === k ? "on" : ""}" data-status="${k}">${l}</button>`).join("")}</div></div>
      <div class="hz-detail">
        <section class="panel wz-hero" style="--accent:#d9a441">
          ${wzArt(d.bild, d.name)}
          <h3 class="sub-h">Wofür</h3><p>${esc(d.wofuer)}</p>
          ${d.psa.length ? `<h3 class="sub-h">Schutzausrüstung</h3><div class="wz-psa">${d.psa.map((p) => `<span>${esc(p)}</span>`).join("")}</div>` : ""}
        </section>
        <section class="panel" style="--accent:#d9a441">
          <header class="ptitle"><span>So geht's</span></header>
          <ol class="wz-steps">${li(d.schritte)}</ol>
        </section>
      </div>
      <div class="hz-info">
        <section class="panel" style="--accent:var(--orange)"><header class="ptitle"><span>Darauf achten</span></header><ul class="hz-err">${li(d.achtung)}</ul></section>
        <section class="panel wz-nogo" style="--accent:var(--red, #e5484d)"><header class="ptitle"><span>No-Gos</span></header><ul class="hz-err">${li(d.nogos)}</ul></section>
        ${d.pflege ? `<section class="panel"><header class="ptitle"><span>Pflege</span></header><p>${esc(d.pflege)}</p></section>` : ""}
        <section class="panel"><header class="ptitle"><span>Eigene Notizen</span></header>
          <textarea id="wz-note" rows="4" placeholder="Was der Ausbilder sagt, welches Modell ihr im Betrieb habt, eigene Erfahrungen …">${esc(d.notiz)}</textarea>
          <button class="ghost" data-wz="save">Notiz speichern</button></section>
      </div>
      <p class="meta">${esc(d.hinweis)}</p>`;
    view.onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      try {
        if (b.dataset.status) {
          await api(`/api/werkzeug/${d.id}`, { method: "PUT", body: { status: b.dataset.status } });
          d.status = b.dataset.status; toast(`Stand: ${WZ_STATUS.find(([k]) => k === d.status)[1]}`); this.renderDetail();
        } else if (b.dataset.wz === "save") {
          d.notiz = $("#wz-note").value;
          await api(`/api/werkzeug/${d.id}`, { method: "PUT", body: { notiz: d.notiz } });
          toast("Notiz gespeichert");
        }
      } catch (err) { showError(err); }
    };
  },
};
