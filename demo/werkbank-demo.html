        const due = training.report_week.filter((x) => x.training && x.past), got = due.filter((x) => x.summary).length;
        const wk = training.today.training?.type || training.this_week;
        const sub = !wk ? `Start ${fmtDate(training.next_switch)}` : `${TR_ICON[wk]} ${wk === "werkstatt" ? "Werkstatt" : "Berufsschule"}`;
        return { value: `${num(got)}<small>/${due.length}</small>`, sub,
          bar: due.length ? got / due.length : 0, barLabel: `Berichtsheft: ${got} von ${due.length} Tagen` };
      }
      case "todos": {
        const late = open.filter((x) => x.due_date && x.due_date < t).length;
        const doneWeek = done.filter((x) => (x.done_at || "") >= mon).length;
        return { value: num(open.length), sub: late ? `<b class="late">${late} überfällig</b>` : "offen",
          bar: doneWeek / Math.max(1, doneWeek + open.length), barLabel: `${doneWeek} diese Woche erledigt` };
      }
      case "week": {
        const load = plan.totals.week_load_min, free = plan.totals.week_free_min;
        return { value: num(agenda.events.length), sub: agenda.events.length === 1 ? "Termin diese Woche" : "Termine diese Woche",
          bar: free ? load / free : 0, barLabel: `${fmtMin(load)} von ${fmtMin(free)} freier Zeit verplant` };
      }
      case "learn": {
        const hs = today.habits.filter((h) => h.category === "Lernen");
        const got = hs.reduce((a, h) => a + h.week_count, 0), want = hs.reduce((a, h) => a + h.target_per_week, 0);
        const q = want ? got / want : 0;
        return { value: num(q * 100, " %"), sub: "Lernquote diese Woche", bar: q, barLabel: `${got} von ${want} Einheiten` };
      }
      case "finance": {
        if (!money) return { value: `<span class="num">…</span>`, sub: "Kurse laden", bar: 0 };
        if (money.error || !money.positions?.length) return { value: `<span class="num">–</span>`, sub: money.error ? "nicht erreichbar" : "keine Positionen", bar: 0 };
        const up = money.pnl >= 0;
        return { value: vaultOpen() ? `<span class="num">${esc(compact(money.total))} €</span>` : `<span class="num veil">•••</span>`,
          sub: vaultOpen() ? `<b class="${up ? "gain" : "loss"}">${up ? "▲" : "▼"} ${esc(pct(money.pnl_pct))}</b>` : "verdeckt",
          stack: money.allocation.portfolio };
      }
      case "projects": {
        const m = missions.find((x) => x.status === "aktiv");
        const active = projects.filter((p) => p.status === "aktiv").length;
        return m ? { value: num(m.progress.pct, " %"), sub: `${active} Projekt${active === 1 ? "" : "e"} aktiv`, bar: m.progress.pct / 100,
          barLabel: `${m.title}: ${m.progress.done} von ${m.progress.total} Schritten` }
          : { value: num(active), sub: "Projekte aktiv", bar: 0 };
      }
      case "health": {
        const s = health.sport;
        return { value: `${num(s.week_sessions)}<small>/${s.target}</small>`, sub: "Sport diese Woche",
          bar: s.target ? s.week_sessions / s.target : 0, barLabel: `${s.week_sessions} von ${s.target} Einheiten` };
      }
      case "thoughts": {
        const lastMon = (() => { const d = new Date(mon + "T12:00"); d.setDate(d.getDate() - 7); return d.toLocaleDateString("sv-SE"); })();
        const now = thoughts.filter((x) => x.created_at.slice(0, 10) >= mon).length;
        const before = thoughts.filter((x) => x.created_at.slice(0, 10) >= lastMon && x.created_at.slice(0, 10) < mon).length;
        return { value: num(now), sub: now === 1 ? "Eintrag diese Woche" : "Einträge diese Woche",
          bar: now / Math.max(1, now, before), barLabel: `Vorwoche: ${before}` };
      }
      case "news": {
        const fresh = news.categories.reduce((a, c) => a + c.headlines.filter((h) => h.published && Date.now() - new Date(h.published) < 864e5).length, 0);
        const st = Object.values(news.status), ok = st.filter((x) => x.ok).length;
        return { value: num(fresh), sub: "neue Meldungen", bar: st.length ? ok / st.length : 0, barLabel: `${ok} von ${st.length} Quellen erreichbar` };
      }
    }
    return { value: "–", sub: "", bar: 0 };
  },

  // ---------------------------------------------------------------- Spielerkarte
  player() {
    const { t, today, done, open } = this.d;
    const doneToday = done.filter((x) => (x.done_at || "").slice(0, 10) === t).length;
    const dueOpen = open.filter((x) => x.due_date && x.due_date <= t).length;
    const habitsDone = today.habits.filter((h) => h.today_done).length;
    const total = doneToday + dueOpen + today.habits.length, got = doneToday + habitsDone;
    const date = new Date(t + "T12:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
    $("#player").innerHTML = `
      <div class="pc-top"><div><b class="pc-name">${esc(playerName())}</b><span class="pc-date">${esc(date)}</span></div>
        <div class="pc-tools"><button class="icon-btn" id="sfx" aria-pressed="${Sfx.on}">${Sfx.on ? "Ton an" : "Ton aus"}</button>
          <button class="icon-btn" id="skin-toggle">${Skin.fantasy ? "Jarvis" : "Knorz"}</button></div></div>
      <div class="pc-prog"><span>Tagesfortschritt</span><b>${num(got)} von ${total}</b></div>
      ${bar(total ? got / total : 0, "var(--hub-accent)", "Tagesfortschritt")}`;
    animateIn($("#player"));
    $("#sfx").onclick = () => { Sfx.toggle(); Sfx.play("blip"); this.player(); };
    $("#skin-toggle").onclick = () => { Skin.set(Skin.fantasy ? "spiel" : "fantasy"); Sfx.play("coin"); render(); };
  },

  // ---------------------------------------------------------------- Kacheln
  tiles() {
    AREAS.forEach((a) => {
      const el = $(`#tile-${a.id}`);
      if (!el) return;
      const m = this.metric(a.id);
      const barHtml = m.stack ? this.stackBar(m.stack) : bar(m.bar, a.color, m.barLabel);
      el.innerHTML = `${emblem(a.sym, a.color, false, a.ink)}<span class="t-name">${esc(tx(a.name))}</span>
        <span class="t-val">${m.value}</span><span class="t-sub">${m.sub}</span>${barHtml}`;
      el.setAttribute("aria-label", `${tx(a.name)} öffnen`);
    });
    animateIn($("#hub"));
  },

  /** Verteilung als gestapelter Balken (geprüfte Palette, 2px Abstand zwischen Segmenten). */
  stackBar(items) {
    const total = items.reduce((a, b) => a + b.value, 0) || 1;
    return `<div class="gbar stack" role="img" aria-label="Verteilung: ${items.map((i) => `${esc(i.name)} ${i.pct} %`).join(", ")}">${
      items.slice(0, SERIES.length).map((it, i) => `<i data-w="${((it.value / total) * 100).toFixed(1)}%" style="background:${SERIES[i]}" title="${esc(it.name)}: ${it.pct.toLocaleString("de-DE")} %"></i>`).join("")}</div>`;
  },

  riddles(d) {
    $("#riddles").innerHTML = d.inbox.length
      ? `<h3 class="sub-h">! ${d.inbox.length} offen in der Inbox</h3>${d.inbox.map(inboxItem).join("")}` : "";
    const wasOpen = $("#log details")?.open;
    $("#log").innerHTML = d.recent.length ? `<details class="log-box" ${wasOpen ? "open" : ""}><summary>Verlauf (${d.recent.length})</summary><ul class="list log">${
      d.recent.map((r) => `<li><div class="grow">${esc(r.summary)}<div class="meta">${esc(r.created_at.slice(11, 16))} Uhr</div></div>
        <button class="link" data-undo-row="${r.id}">Rückgängig</button></li>`).join("")}</ul></details>` : "";
  },

  handleResult(r) {
    if (r.status === "clarify") {  // Rückfrage: nichts ausgeführt, Auswahl zeigen und vorlesen
      Sfx.play("blip");
      Clarify.show(r.clarify, r.source === "voice" || HandsFree.on, r.transcript);
      return this.refresh().catch(() => {});  // Korrektur hat evtl. etwas rückgängig gemacht
    }
    if (r.status === "empty") {
      Sfx.play("error");
      return Voice.set("idle", "Nichts verstanden", "Nochmal, etwas näher am Mikro?");
    }
    const tags = (r.agents || []).filter((k) => k !== "general").map((k) => AGENT_TAG[k]).filter(Boolean);
    const said = (r.transcript ? `„${esc(r.transcript)}“` : "")
      + (tags.length ? `<span class="agent-tags">${tags.map((t) => `<span>${esc(t)}</span>`).join("")}</span>` : "");
    if (r.answered) {  // Frage: Antwort als Sprechblase, vorgelesen
      Voice.set("done", Skin.fantasy ? "Knorz weiß Bescheid" : "Jarvis antwortet", `${said}<span class="answer">${esc(r.reply)}</span>`);
      Speech.say(r.reply);
    } else {
      Voice.set("done", r.reply || "Gespeichert", said);
      if (r.source === "voice") Speech.say(r.reply);  // gesprochen rein → gesprochen raus
    }
    // Ein Tipp, wenn Jarvis danebenlag: alles rückgängig, nachfragen, Lernfall speichern
    if (r.entry_id && r.results?.some((x) => typeof x === "string"))
      $("#vactions").innerHTML = `<button class="link wrong-btn" data-wrong="${r.entry_id}">Falsch verstanden?</button>`;
    Sfx.play("coin");
    // Ampel gelb: Bestehendes wurde geändert → melden, mit Rückgängig
    if (r.changed?.length) toast(r.changed.map((c) => c.summary).join(" · "), r.changed[r.changed.length - 1].id);
    lootFor(r).forEach((x, i) => lootPop(x, i * 380));
    this.refresh().catch(showError);
  },

  // ---------------------------------------------------------------- Bedienung
  async click(e) {
    // Bereich antippen = eigener Bildschirm mit nur diesem Bereich (Hauptmenü: breit, Bereiche: Details)
    const tile = e.target.closest("[data-area]");
    if (tile) { Sfx.play("blip"); location.hash = area(tile.dataset.area).page; return; }
    if (e.target.closest("[data-alarms]")) return AlarmUI.open().catch((err) => toast(err.message));
    const b = e.target.closest("button");
    if (!b) return;
    const { voice, done, habit, inbox, id, undoRow } = b.dataset;
    try {
      if (b.id === "mic") return Voice.toggle();
      if (b.id === "whip") return Whip.crack();
      if (b.id === "hf") return await HandsFree.toggle();
      if (voice === "cancel") return Voice.cancel();
      if (voice === "retry") return Voice.send();
      if (voice === "discard") { Voice.blob = null; return Voice.set("idle", HandsFree.idleText(), ""); }
      if (done) {
        await post(`/api/todos/${done}/toggle`);
        burst(b, "var(--hub-accent)"); Sfx.play("clear"); lootPop("QUEST CLEAR!");
        return await this.refresh();
      }
      if (habit) {
        const r = await post(`/api/habits/${habit}/toggle`);
        if (r.done) { burst(b); Sfx.play("coin"); } else Sfx.play("blip");
        return await this.refresh();
      }
      if (inbox) {
        if (inbox === "accept") await post(`/api/inbox/${id}/accept`);
        else if (inbox === "dismiss") await post(`/api/inbox/${id}/dismiss`);
        else await post(`/api/inbox/${id}/as`, { type: inbox });
        Sfx.play(inbox === "dismiss" ? "blip" : "coin");
        return await this.refresh();
      }
      if (undoRow) {
        const r = await post(`/api/undo/${undoRow}`);
        toast(r.reply); Sfx.play("blip");
        return await this.refresh();
      }
    } catch (err) {
      if (err.message !== "auth") { toast(err.message); Sfx.play("error"); }
    }
  },
};

// ---------------------------------------------------------------- Rückfragen (clarify.py)
// Jarvis fragt nach, statt Unklares stumm als Gedanken abzulegen. Antworten: Knopf, oder einfach sagen/tippen
// ("Aufgabe", "das erste", "abbrechen", oder die fehlende Angabe wie "7 Stunden").
const Clarify = {
  show(c, speak, transcript, more = 0) {
    Voice.set("ask", Skin.fantasy ? "Knorz fragt nach" : "Jarvis fragt nach",
      `<span class="answer ask">${esc(c.question)}</span>`);  // die Frage zitiert den Satz schon
    $("#vactions").innerHTML = `<div class="clarify-opts" role="group" aria-label="Antwort wählen">${c.options.map((o, i) =>
      `<button class="${i === 0 ? "primary" : "ghost"}" data-clarify="${c.id}:${i}">${esc(o)}</button>`).join("")}
      <button class="link" data-clarify="${c.id}:cancel">Abbrechen</button>
      <p class="meta clarify-hint">Oder einfach antworten, z. B. „${esc(c.options[0])}“.${more ? ` Noch ${more} weitere offen.` : ""}</p></div>`;
    if (speak) Speech.say(c.question);
  },

  async pick(id, choice) {
    try {
      Hud.handleResult(await post(`/api/clarify/${id}`, { choice: choice === "cancel" ? "cancel" : +choice }));
    } catch (err) { showError(err); }
  },

  /** Nach dem Neuladen: offene Rückfrage wieder anzeigen (nicht nochmal vorlesen). */
  async restore() {
    const r = await api("/api/clarify");
    if (r.pending && $("#voice")) this.show(r.pending, false, undefined, r.open - 1);
  },
};
document.addEventListener("click", async (e) => {
  const w = e.target.closest("[data-wrong]");
  if (w) {
    w.disabled = true;
    try { const r = await post(`/api/entries/${w.dataset.wrong}/wrong`); Hud.handleResult({ ...r, source: HandsFree.on ? "voice" : "text" }); }
    catch (err) { showError(err); }
    return;
  }
  const b = e.target.closest("[data-clarify]");
  if (!b) return;
  e.preventDefault();
  const [id, choice] = b.dataset.clarify.split(":");
  b.disabled = true;
  Clarify.pick(id, choice);
});

function bindCapture() {
  $("#capture").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!text) return input.focus();
    input.value = "";

    Voice.set("busy", "Jarvis denkt nach …", `„${esc(text)}“`);

      Hud.handleResult({ ...(await post("/api/capture", { text, source: "text" })), transcript: text });

</script>
  <script>
"use strict";

// Freihändig: "Jarvis, was steht heute an?" ohne zu tippen. Der Browser erkennt, wann
// gesprochen wird (Lautstärke), und schickt jede Äußerung als WAV an den eigenen Server.
// Whisper transkribiert dort; nur was mit dem Rufnamen beginnt, wird verarbeitet, der Rest
// verworfen. Nur ein Name ("Jarvis") → "Ja?" und die nächste Äußerung gilt ohne Namen.
// Läuft nur, solange die App offen und im Vordergrund ist (iOS gibt sonst das Mikro nicht her).

const HF = { PRE_MS: 700, MIN_SPEECH_MS: 120, END_SILENCE_MS: 900, MAX_MS: 12000, MIN_MS: 450, FOLLOW_MS: 8000, RATE: 16000 };

function encodeWav(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, pcm.length * 2, true);
  pcm.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
  return new Blob([buf], { type: "audio/wav" });
}

/** Auf 16 kHz mitteln (Whisper braucht nicht mehr, halbiert bis drittelt die Datenmenge). */
function downsample(chunks, from, to) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const all = new Float32Array(total);
  let o = 0;
  for (const c of chunks) { all.set(c, o); o += c.length; }
  if (from === to) return all;
  const ratio = from / to, out = new Float32Array(Math.floor(total / ratio));
  for (let i = 0; i < out.length; i++) {
    const a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = a; j < b; j++) sum += all[j];
    out[i] = sum / Math.max(1, b - a);
  }
  return out;
}

const HandsFree = {
  on: false, stream: null, ctx: null, node: null, rate: 48000, source: "mic",
  ring: [], ringMs: 0, rec: null, recMs: 0, speechMs: 0, silenceMs: 0, noise: 0.005,
  followUntil: 0, awaitFollow: false, sending: false,

  get name() { return Skin.fantasy ? "Knorz" : "Jarvis"; },
  get wanted() { try { return localStorage.getItem("handsfree") === "1"; } catch { return false; } },
  set wanted(v) { try { localStorage.setItem("handsfree", v ? "1" : "0"); } catch { /* egal */ } },

  idleText() { return this.on ? `Sag „${this.name}“ …` : tx("Tippe aufs Licht"); },

  async toggle() {
    this.wanted = !this.on;
    if (this.on) this.stop(); else await this.start();
    Sfx.play("blip");
  },

  async start() {
    if (this.on) return;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      return Voice.fail("Freihändig braucht HTTPS (tailscale serve) oder localhost.");
    }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch {
      this.wanted = false;
      return Voice.fail("Mikrofon nicht erlaubt.");
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    this.rate = this.ctx.sampleRate;
    const src = this.ctx.createMediaStreamSource(this.stream);
    this.node = this.ctx.createScriptProcessor(4096, 1, 1);
    this.node.onaudioprocess = (e) => { if (this.source === "mic") this.feed(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(this.node);
    this.node.connect(this.ctx.destination);  // nötig, damit Safari den Knoten laufen lässt (gibt Stille aus)
    this.ctx.resume().catch(() => {});
    this.on = true;
    this.reset();
    this.paint();
  },

  stop() {
    this.on = false;
    this.node?.disconnect();
    this.stream?.getTracks().forEach((t) => t.stop());
    this.ctx?.close().catch(() => {});
    this.stream = this.ctx = this.node = null;
    this.reset();
    this.paint();
  },

  reset() { this.ring = []; this.ringMs = 0; this.rec = null; this.recMs = 0; this.speechMs = 0; this.silenceMs = 0; },

  paint() {
    const p = $("#voice");
    if (!p) return;
    p.classList.toggle("handsfree", this.on);
    p.classList.remove("hf-hear");
    const b = $("#hf");
    if (b) { b.textContent = this.on ? `Freihändig: an („${this.name}“)` : "Freihändig: aus"; b.setAttribute("aria-pressed", String(this.on)); }
    if (["idle", "done"].includes(Voice.state)) { Voice.state = "idle"; p.dataset.state = "idle"; $("#vstatus").textContent = this.idleText(); }
  },

  /** Ein Stück Mikrofon-Audio. Erkennt Anfang/Ende einer Äußerung an der Lautstärke. */
  feed(samples) {
    const panel = $("#voice");
    const busy = !panel || Voice.state === "rec" || Voice.state === "busy" || this.sending || panel.classList.contains("talking");
    if (!this.on || busy) { if (this.rec) this.reset(); return; }  // nicht sich selbst zuhören
    if (this.awaitFollow) { this.awaitFollow = false; this.followUntil = Date.now() + HF.FOLLOW_MS; }
    let sum = 0;
    for (const s of samples) sum += s * s;
    const rms = Math.sqrt(sum / samples.length);
    const ms = (samples.length / this.rate) * 1000;
    const loud = rms > Math.max(0.015, this.noise * 3);
    if (!this.rec) {
      this.ring.push(samples); this.ringMs += ms;
      while (this.ringMs - ms > HF.PRE_MS && this.ring.length > 1) this.ringMs -= (this.ring.shift().length / this.rate) * 1000;
      if (loud) {
        this.speechMs += ms;
        if (this.speechMs >= HF.MIN_SPEECH_MS) {  // Äußerung beginnt: Vorlauf mitnehmen
          this.rec = [...this.ring]; this.recMs = this.ringMs; this.silenceMs = 0;
          panel.classList.add("hf-hear");
        }
      } else {
        this.speechMs = 0;
        this.noise = this.noise * 0.95 + rms * 0.05;  // Grundrauschen nachführen
      }
      return;
    }
    this.rec.push(samples); this.recMs += ms;
    panel.style.setProperty("--lvl", Math.min(1, rms * 8).toFixed(2));
    this.silenceMs = loud ? 0 : this.silenceMs + ms;
    if (this.silenceMs >= HF.END_SILENCE_MS || this.recMs >= HF.MAX_MS) this.flush();
  },

  async flush() {
    const chunks = this.rec, speech = this.recMs - this.silenceMs;
    this.reset();
    const panel = $("#voice");
    panel?.classList.remove("hf-hear");
    panel?.style.setProperty("--lvl", "0");
    if (!chunks || speech < HF.MIN_MS) return;
    const wav = encodeWav(downsample(chunks, this.rate, HF.RATE), HF.RATE);
    const follow = Date.now() < this.followUntil;
    this.followUntil = 0;
    this.awaitFollow = false;
    this.sending = true;
    try {
      const res = await fetch(`/api/voice${follow ? "" : `?wake=${this.name.toLowerCase()}`}`, {
        method: "POST", body: wav, headers: { Authorization: `Bearer ${token()}`, "Content-Type": "audio/wav" },
      });
      if (res.status === 401) return logout("Token ungültig");
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return Voice.fail(data.detail || `Fehler ${res.status}`);
      if (data.status === "ignored") return;
      if (data.status === "wake") {  // nur der Name: kurz antworten, nächste Äußerung gilt
        Sfx.play("blip");
        Voice.set("idle", `${this.name} hört …`, "");
        Speech.say(data.reply);
        this.awaitFollow = true;  // Fenster für den Folgesatz startet, wenn "Ja?" ausgesprochen ist
        return;
      }
      Hud.handleResult({ ...data, source: "voice" });
    } catch {
      Voice.fail("Server nicht erreichbar.");
    } finally {
      this.sending = false;
    }
  },
};

const EFFORTS = [[15, "15 Min"], [30, "30 Min"], [60, "1 Std"], [120, "2 Std"], [240, "halber Tag"], [480, "ganzer Tag"]];
const fmtEffort = (m) => (!m ? "" : m < 60 ? `${m} Min` : `${(m / 60).toLocaleString("de-DE", { maximumFractionDigits: 1 })} Std`);
const dueLabel = (iso) => {
  const d = dayDiff(todayIso(), iso);
  return d < 0 ? `${-d} T überfällig` : d === 0 ? "heute" : d === 1 ? "morgen" : `in ${d} T`;
};

const Tasks = {
  todos: [], projects: [], review: {}, editing: null,

  async load() {
    [this.todos, this.projects, this.review] = await Promise.all([api("/api/todos?done=0"), api("/api/projects"),
      api("/api/review/week").catch(() => ({}))]);

      await api(`/api/projects/${encodeURIComponent(p.name)}`, { method: "PUT", body: { status: sel.value, goal: p.goal } });
      await this.refresh();
    }));

        : `<p class="empty">Noch nichts erledigt.</p>`;
    });
  },

  async refresh() { await this.load(); this.render(); },

  async click(e) {
    const b = e.target.closest("button");
    if (!b) return;
    try {
      if (b.dataset.done || b.dataset.undone) {
        await post(`/api/todos/${b.dataset.done || b.dataset.undone}/toggle`);
        if (b.dataset.done) { burst(b, "var(--cyan)"); Sfx.play("clear"); }

    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
};

    return `<section class="panel mission ${m.status}" style="--accent:var(--pink)">
      <header class="ptitle"><span>◎ ${esc(m.title)}</span>
        <select data-mission-status="${m.id}" aria-label="Status">${["aktiv", "pausiert", "erreicht"].map((s) =>
          `<option ${m.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></header>
      <div class="mission-head">
        <div class="ring-pct" style="--p:${m.progress.pct}"><b>${m.progress.pct}%</b><small>${m.progress.done}/${m.progress.total}</small></div>
        <div class="grow">
          ${m.why ? `<p class="why">„${esc(m.why)}“</p>` : ""}
          ${days != null ? `<p class="meta ${days < 0 ? "overdue" : ""}">Ziel ${days < 0 ? `seit ${-days} Tagen überfällig` : days === 0 ? "heute" : `in ${days} Tagen`} (${esc(fmtDate(m.deadline))})</p>` : ""}
          ${m.next_step ? `<p>Als Nächstes: <b>${esc(m.next_step.title)}</b></p>` : allDone ? `<p class="up">Alle Schritte geschafft!</p>` : ""}
          <details><summary>Ziel bearbeiten</summary>${this.goalForm(m)}
            <button class="link overdue" data-del-mission="${m.id}">Projekt löschen</button></details>
        </div>
      </div>
      ${allDone && m.status !== "erreicht" ? `<button class="primary big" data-achieve="${m.id}">🏆 Ziel als erreicht markieren</button>` : ""}
      ${m.steps.length ? `<ol class="path">${m.steps.map((s) => this.step(s, m, m.next_step && s.id === m.next_step.id)).join("")}</ol>`
        : `<p class="empty">Noch keine Schritte. Lass dir welche vorschlagen oder trag den ersten selbst ein.</p>`}
      <div class="capture-row">
        <button class="ghost" data-suggest="${m.id}">✨ Schritte von Claude planen lassen</button>
      </div>
      <form class="form inline" data-add-step="${m.id}"><input name="title" placeholder="Neuer Schritt" required><button class="ghost">+ Schritt</button></form>
    </section>`;
  },

  render() {
    const active = this.list.filter((m) => m.status !== "erreicht");
    const done = this.list.filter((m) => m.status === "erreicht");
    view.innerHTML = `
      <h1>${tx("Persönliches Projekt")}</h1>
      <p class="sub">Ziel formulieren, in Schritte zerlegen, dranbleiben. Per Sprache: „Fundament fürs Gartenhaus ist fertig“.</p>
      ${active.map((m) => this.card(m)).join("")}
      <details class="add-quest" ${this.list.length ? "" : "open"}><summary>+ Neues Ziel</summary>${this.goalForm()}</details>
      ${done.length ? `<h2>Erreicht 🏆</h2><ul class="list">${done.map((m) => `<li><div class="grow"><b>${esc(m.title)}</b>
        <div class="meta">${m.progress.total} Schritte · erreicht ${m.achieved_at ? esc(fmtDate(m.achieved_at.slice(0, 10))) : ""}</div></div>
        <button class="link" data-reopen="${m.id}">wieder aufnehmen</button></li>`).join("")}</ul>` : ""}`;

    view.querySelectorAll("[data-mission-form]").forEach((f) => f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(f));
      const id = f.dataset.missionForm;
      try {
        if (id) {
          const m = this.list.find((x) => x.id === +id);
          await api(`/api/missions/${id}`, { method: "PUT", body: { ...body, status: m.status } });
        } else { await post("/api/missions", body); Sfx.play("coin"); }
        await this.refresh();
      } catch (err) { toast(err.message); }
    }));
    view.querySelectorAll("[data-add-step]").forEach((f) => f.addEventListener("submit", async (e) => {
      e.preventDefault();
      await post(`/api/missions/${f.dataset.addStep}/steps`, { steps: [{ title: new FormData(f).get("title") }] });
      await this.refresh();
    }));
    view.querySelectorAll("[data-step-form]").forEach((f) => f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      await api(`/api/steps/${f.dataset.stepForm}`, { method: "PUT", body: { title: d.title, detail: d.detail || null,
        effort_min: d.effort_min ? +d.effort_min : null, due_date: d.due_date || null } });
      this.editingStep = null; await this.refresh();
    }));
    view.querySelectorAll("[data-mission-status]").forEach((sel) => sel.addEventListener("change", () => this.setStatus(+sel.dataset.missionStatus, sel.value)));
  },

  async setStatus(id, status) {
    const m = this.list.find((x) => x.id === id);
    await api(`/api/missions/${id}`, { method: "PUT", body: { title: m.title, why: m.why, deadline: m.deadline, status } });
    if (status === "erreicht") levelUp(null, "ZIEL ERREICHT!");
    await this.refresh();
  },

  async refresh() { await this.load(); this.render(); },

  async click(e) {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    try {
      if (d.toggleStep) {
        const r = await post(`/api/steps/${d.toggleStep}/toggle`);
        if (r.done) { burst(b, "var(--pink)"); Sfx.play("clear"); } else Sfx.play("blip");
        return await this.refresh();
      }
      if (d.suggest) {
        b.disabled = true; b.textContent = "Claude plant die Schritte …";
        try {
          const r = await post(`/api/missions/${d.suggest}/suggest`);
          toast(`${r.added} Schritte übernommen. Was nicht passt: bearbeiten oder löschen.`); Sfx.play("coin");
        } catch (err) { toast(err.message); }
        return await this.refresh();
      }
      if (d.move) { await post(`/api/steps/${d.move}/move?direction=${d.dir}`); return await this.refresh(); }
      if (d.editStep) { this.editingStep = +d.editStep; return this.render(); }
      if (b.hasAttribute("data-cancel-step")) { this.editingStep = null; return this.render(); }
      if (d.delStep && confirm("Schritt löschen?")) { await api(`/api/steps/${d.delStep}`, { method: "DELETE" }); this.editingStep = null; return await this.refresh(); }
      if (d.achieve) return await this.setStatus(+d.achieve, "erreicht");
      if (d.reopen) return await this.setStatus(+d.reopen, "aktiv");
      if (d.delMission && confirm("Projekt mit allen Schritten löschen?")) { await api(`/api/missions/${d.delMission}`, { method: "DELETE" }); return await this.refresh(); }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
};

Object.assign(VIEWS, {
  async mission() {
    Mission.editingStep = null;
    await Mission.load();
    Mission.render();
    view.onclick = (e) => Mission.click(e);
  },
});

  <script>
"use strict";

// Ausbildung: Überblick, anstehende Tests/Aufgaben, Lernfelder, Noten, Lernzeit, Dateien
const KIND_LABEL = { test: "Test", hausaufgabe: "Hausaufgabe", projekt: "Projekt", "prüfung": "Prüfung", bericht: "Bericht" };
const TREND = { besser: ["▲", "up", "wird besser"], schlechter: ["▼", "down", "wird schlechter"], gleich: ["▶", "", "stabil"] };
const fmtGrade = (g) => (g == null ? "–" : g.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 2 }));
const gradeClass = (g) => (g == null ? "" : g <= 2 ? "g-good" : g <= 3.5 ? "g-ok" : "g-bad");
const fmtSize = (b) => (b < 1024 ? "< 1 KB" : b < 1024 * 1024 ? `${Math.round(b / 1024)} KB` : `${(b / 1024 / 1024).toLocaleString("de-DE", { maximumFractionDigits: 1 })} MB`);

const School = {
  data: null, filter: null,

  async load() { this.data = await api("/api/school"); },

  subjectOptions(selected, empty = "ohne Lernfeld") {
    return `<option value="">${empty}</option>${this.data.subjects.map((s) =>
      `<option value="${s.id}" ${selected === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}`;
  },

  bars(weeks) {
    const max = Math.max(60, ...weeks);
    return `<div class="mini-bars" title="Lernzeit der letzten 4 Wochen">${weeks.map((m, i) =>
      `<span style="height:${Math.round((m / max) * 100)}%" aria-label="Woche ${i + 1}: ${m} Min"></span>`).join("")}</div>`;
  },

  render() {
    const d = this.data, f = this.filter;
    const inFilter = (x) => !f || x.subject_id === f;
    const open = d.open.filter(inFilter), grades = d.grades.filter(inFilter), files = d.files.filter(inFilter);
    const t = todayIso();
    const nextTest = d.open.find((i) => ["test", "prüfung"].includes(i.kind) && i.due_date && i.due_date >= t);
    const tr = d.trend && TREND[d.trend];
    view.innerHTML = `
      <h1>${tx("Lernen")}</h1>
      <div class="school-stats">
        <div class="stat"><small>Notenschnitt</small><b class="${gradeClass(d.avg)}">${fmtGrade(d.avg)}</b>
          ${tr ? `<span class="${tr[1]}">${tr[0]} ${tr[2]}</span>` : `<span class="muted">noch keine Noten</span>`}</div>
        <div class="stat"><small>Lernzeit diese Woche</small><b>${fmtMin(d.study_week_min)}</b>${this.bars(d.study_weeks)}</div>
        <div class="stat"><small>Lern-Streak</small><b>${Skin.fantasy ? "⚜" : "🔥"} ${d.study_streak}</b><span class="muted">${d.study_streak === 1 ? "Tag" : "Tage"} in Folge</span></div>
        <div class="stat"><small>Nächster Test</small>${nextTest ? `<b>${esc(dueLabel(nextTest.due_date))}</b>
          <span class="muted">${esc(nextTest.title)}</span>` : `<b>–</b><span class="muted">nichts angesetzt</span>`}</div>
      </div>

      <div class="seg subject-filter" role="group" aria-label="Lernfeld filtern">
        <button data-filter="" class="${!f ? "on" : ""}">Alle</button>
        ${d.subjects.map((s) => `<button data-filter="${s.id}" class="${f === s.id ? "on" : ""}">${esc(s.name)}</button>`).join("")}
      </div>

      <div class="quest-grid">
        <section class="panel" style="--accent:var(--red)">
          <header class="ptitle"><span>☠ Anstehend</span></header>
          ${open.length ? `<ul class="qlist">${open.map((i) => `<li>
            <button class="check" data-item-done="${i.id}" aria-label="Erledigt: ${esc(i.title)}"></button>
            <div class="grow"><span class="kind-tag k-${esc(i.kind)}">${KIND_LABEL[i.kind] || esc(i.kind)}</span> ${esc(i.title)}
              <div class="meta">${[i.subject, i.due_date && `${fmtDate(i.due_date)} (${dueLabel(i.due_date)})`].filter(Boolean).map(esc).join(" · ")}</div>
              ${["test", "prüfung", "projekt", "bericht"].includes(i.kind) ? `<form class="grade-form" data-grade-item="${i.id}">
                <input name="grade" inputmode="decimal" placeholder="Note" aria-label="Note für ${esc(i.title)}" size="4">
                <button class="ghost">eintragen</button></form>` : ""}</div>
            <button class="link" data-del-item="${i.id}" aria-label="Löschen: ${esc(i.title)}">✕</button></li>`).join("")}</ul>`
            : `<p class="empty">Nichts offen. Per Sprache: „Test Lernfeld 5 am 12., Holzverbindungen“.</p>`}
          <details><summary>+ Test / Aufgabe</summary>
            <form class="form" id="item-form">
              <input name="title" placeholder="z. B. Holzverbindungen" required>
              <div class="two"><select name="kind" aria-label="Art">${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select>
                <select name="subject_id" aria-label="Lernfeld">${this.subjectOptions(f)}</select></div>
              <div class="two"><input name="due_date" type="date" aria-label="Termin">${Tasks.effortSelect()}</div>
              <button class="primary">Anlegen</button>
            </form>
          </details>
        </section>

        <section class="panel" style="--accent:var(--lime)">
          <header class="ptitle"><span>✚ Lernzeit</span></header>
          <form class="form" id="study-form">
            <div class="two"><select name="subject_id" aria-label="Lernfeld">${this.subjectOptions(f, "allgemein")}</select>
              <select name="minutes" aria-label="Dauer">${[15, 30, 45, 60, 90, 120].map((m) => `<option value="${m}" ${m === 45 ? "selected" : ""}>${fmtMin(m)}</option>`).join("")}</select></div>
            <div class="two"><input name="note" placeholder="Was? z. B. Statik Aufgaben S. 40"><button class="primary">Gelernt ✓</button></div>
          </form>
          ${d.recent_study.length ? `<ul class="list">${d.recent_study.filter(inFilter).slice(0, 5).map((l) => `<li><div class="grow">${fmtMin(l.minutes)}
            ${l.note ? `· ${esc(l.note)}` : ""}<div class="meta">${esc(fmtDate(l.date))} · ${esc(d.subjects.find((s) => s.id === l.subject_id)?.name || "allgemein")}</div></div>
            <button class="link" data-del-study="${l.id}" aria-label="Eintrag löschen">✕</button></li>`).join("")}</ul>` : ""}
        </section>
      </div>

      <h2>Lernfelder</h2>
      <div class="subject-grid">${d.subjects.map((s) => {
        const st = s.trend && TREND[s.trend];
        return `<button class="subject-card ${f === s.id ? "on" : ""}" data-filter="${s.id}">
          <span class="grow"><b>${esc(s.name)}</b>
            <span class="meta">${s.grades} Noten · ${s.open} offen${s.next ? ` · ${KIND_LABEL[s.next.kind]} ${dueLabel(s.next.due_date)}` : ""}</span></span>
          <span class="grade-big ${gradeClass(s.avg)}">${fmtGrade(s.avg)}${st ? `<small class="${st[1]}">${st[0]}</small>` : ""}</span>
          ${this.bars(s.study_weeks)}
        </button>`;
      }).join("")}
        <form class="subject-card add" id="subject-form"><input name="name" placeholder="+ Lernfeld, z. B. LF 5 Holzkonstruktion" required aria-label="Neues Lernfeld"><button class="ghost">Anlegen</button></form>
      </div>

      <div class="split">
        <section>
          <h2>Noten</h2>
          ${grades.length ? `<ul class="list">${grades.map((g) => `<li>
            <span class="grade-badge ${gradeClass(g.grade)}">${fmtGrade(g.grade)}</span>
            <div class="grow">${esc(g.title)}${g.weight !== 1 ? ` <span class="meta">×${g.weight}</span>` : ""}
              <div class="meta">${[g.subject, (g.done_at || g.due_date || "").slice(0, 10) && fmtDate((g.done_at || g.due_date).slice(0, 10))].filter(Boolean).map(esc).join(" · ")}</div></div>
            <button class="link" data-del-item="${g.id}" aria-label="Note löschen">✕</button></li>`).join("")}</ul>`
            : `<p class="empty">Noch keine Noten. Per Sprache: „Test Holzverbindungen: 2“.</p>`}
        </section>
        <section>
          <h2>Dateien</h2>
          <form class="form" id="file-form">
            <input type="file" name="file" required aria-label="Datei wählen" multiple>
            <div class="two"><select name="subject_id" aria-label="Lernfeld">${this.subjectOptions(f)}</select>
              <button class="primary">Hochladen</button></div>
          </form>
          ${files.length ? `<ul class="list">${files.map((x) => `<li>
            <span class="file-ico">${/pdf/.test(x.mime || "") ? "PDF" : /^image/.test(x.mime || "") ? "IMG" : "DOC"}</span>
            <div class="grow"><button class="link" data-open-file="${x.id}">${esc(x.name)}</button>
              <div class="meta">${[x.subject, fmtSize(x.size), fmtDate(x.uploaded_at.slice(0, 10))].filter(Boolean).map(esc).join(" · ")}</div></div>
            <button class="link" data-del-file="${x.id}" aria-label="Datei löschen">✕</button></li>`).join("")}</ul>`
            : `<p class="empty">Noch keine Dateien. Zeichnungen, Arbeitsblätter, Berichtsheft …</p>`}
          <p class="muted">Dateien liegen nur auf deinem Server (data/files) und werden mitgesichert.</p>
        </section>
      </div>`;
    this.bind();
  },

  bind() {
    const num = (v) => (v === "" || v == null ? null : +v);
    const on = (sel, fn) => { const el = $(sel); if (el) el.addEventListener("submit", async (e) => { e.preventDefault(); try { await fn(new FormData(el)); } catch (err) { toast(err.message); } }); };
    on("#item-form", async (fd) => {
      await post("/api/school/items", { title: fd.get("title"), kind: fd.get("kind"), subject_id: num(fd.get("subject_id")),
        due_date: fd.get("due_date") || null, effort_min: num(fd.get("effort_min")) });
      Sfx.play("coin"); await this.refresh();
    });
    on("#study-form", async (fd) => {
      await post("/api/school/study", { subject_id: num(fd.get("subject_id")), minutes: +fd.get("minutes"), note: fd.get("note") || null });
      await this.refresh(); Sfx.play("coin"); lootPop("+ LERNZEIT"); toast(`${fmtMin(+fd.get("minutes"))} Lernzeit eingetragen`);
    });
    on("#subject-form", async (fd) => { await post("/api/school/subjects", { name: fd.get("name") }); await this.refresh(); });
    on("#file-form", async (fd) => {
      const sid = fd.get("subject_id");
      for (const file of fd.getAll("file")) {
        const q = new URLSearchParams({ name: file.name, ...(sid ? { subject_id: sid } : {}) });
        const res = await fetch(`/api/school/files?${q}`, { method: "POST", body: file,
          headers: { Authorization: `Bearer ${token()}`, "Content-Type": file.type || "application/octet-stream" } });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Upload fehlgeschlagen (${res.status})`);
      }
      toast("Hochgeladen"); await this.refresh();
    });
    view.querySelectorAll("[data-grade-item]").forEach((form) => form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const g = parseFloat(String(new FormData(form).get("grade")).replace(",", "."));
      const it = this.data.open.find((x) => x.id === +form.dataset.gradeItem);
      try {
        await api(`/api/school/items/${it.id}`, { method: "PUT", body: { ...it, grade: g, done: true } });
        Sfx.play(g <= 2.5 ? "clear" : "coin"); if (g <= 1.5) levelUp(null, "SPITZENNOTE!");
        await this.refresh();
      } catch (err) { toast(err.message); }
    }));
  },

  async openFile(id) {
    const res = await fetch(`/api/school/files/${id}`, { headers: { Authorization: `Bearer ${token()}` } });
    if (!res.ok) return toast("Datei nicht gefunden");
    const url = URL.createObjectURL(await res.blob());
    const name = (res.headers.get("content-disposition") || "").match(/filename\*?=(?:UTF-8'')?"?([^";]+)/)?.[1];
    const a = Object.assign(document.createElement("a"), { href: url, target: "_blank", rel: "noopener" });
    if (/attachment/.test(res.headers.get("content-disposition") || "")) a.download = decodeURIComponent(name || "Datei");
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },

  async refresh() { await this.load(); this.render(); },

  async click(e) {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    try {
      if (d.filter !== undefined) { this.filter = d.filter ? +d.filter : null; return this.render(); }
      if (d.itemDone) {
        const it = this.data.open.find((x) => x.id === +d.itemDone);
        await api(`/api/school/items/${it.id}`, { method: "PUT", body: { ...it, done: true } });
        burst(b); Sfx.play("clear"); return await this.refresh();
      }
      if (d.delItem && confirm("Eintrag löschen?")) { await api(`/api/school/items/${d.delItem}`, { method: "DELETE" }); return await this.refresh(); }
      if (d.delStudy) { await api(`/api/school/study/${d.delStudy}`, { method: "DELETE" }); return await this.refresh(); }
      if (d.openFile) return await this.openFile(d.openFile);
      if (d.delFile && confirm("Datei löschen?")) { await api(`/api/school/files/${d.delFile}`, { method: "DELETE" }); return await this.refresh(); }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
};

Object.assign(VIEWS, {
  async school() {
    await School.load();
    School.render();
    view.onclick = (e) => School.click(e);
  },
});

  <script>
"use strict";

// Ausbildung (Betrieb): Rhythmus Werkstatt/Berufsschule, Berichtsheft mit Archiv, Betriebs-To-dos,
// Vorschau auf den Lernbereich. Sprache zuerst (Berichtsheft erzählen, 🎙 = Jarvis), Knöpfe als zweiter Weg.
// Audio geht nur an den eigenen Server (Whisper lokal) und wird dort nicht gespeichert.
const REPORT_SEC = 180;
const TR_ICON = { werkstatt: "🔨", schule: "📚" };

/** Berichtsheft eines Tages: erzählen (3 Min.), Notizen, Stichpunkte zum Übernehmen. */
const Report = {
  day: null, data: null, rec: null, stream: null, chunks: [], timer: null, left: REPORT_SEC, onChange: null,

  async load(day) {
    this.data = await api(`/api/report${day ? `?day=${day}` : ""}`);
    this.day = this.data.day.date;
  },

  shift(days) {
    const d = new Date(`${this.day}T12:00:00`);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  },

  render() {
    const host = $("#rh-box");
    if (!host) return;
    const d = this.data.day;
    host.innerHTML = `
      <div class="rh-date">
        <button class="icon-link" data-rh="prev" aria-label="Tag davor">◀</button>
        <b>${esc(fmtDate(d.date))}</b>${d.label ? `<span class="kind-tag">${TR_ICON[d.kind] || ""} ${esc(d.label)}</span>` : ""}
        <button class="icon-link" data-rh="next" aria-label="Tag danach">▶</button>
      </div>
      <div class="rh-talk">
        <button class="rh-mic ${this.rec ? "on" : ""}" data-rh="rec" aria-label="${this.rec ? "Aufnahme beenden" : "Erzählen"}">${this.rec ? "■" : "🎙"}</button>
        <div class="rh-timer num">${fmtSec(this.left)}</div>
      </div>
      <label class="rh-label">Notizen<textarea id="rh-notes" rows="4">${esc(d.notes)}</textarea></label>
      <button class="primary" data-rh="sum" ${d.notes.trim() ? "" : "disabled"}>Zusammenfassen</button>
      <label class="rh-label">Für das Berichtsheft<textarea id="rh-summary" rows="6">${esc(d.summary || "")}</textarea></label>
      <button class="ghost" data-rh="copy" ${d.summary ? "" : "disabled"}>📋 Kopieren</button>`;
    host.onclick = (e) => this.click(e);
    $("#rh-notes").addEventListener("change", (e) => this.save({ notes: e.target.value }));
    $("#rh-notes").addEventListener("input", (e) => { host.querySelector("[data-rh=sum]").disabled = !e.target.value.trim(); });
    $("#rh-summary").addEventListener("change", (e) => this.save({ summary: e.target.value }));
  },

  async save(body) {
    try { this.data.day = await api(`/api/report/${this.day}`, { method: "PUT", body }); this.onChange?.(); } catch (e) { toast(e.message); }
  },

  async click(e) {
    const b = e.target.closest("[data-rh]");
    if (!b) return;
    try {
      switch (b.dataset.rh) {
        case "prev": case "next":
          if (this.rec) return;
          await this.load(this.shift(b.dataset.rh === "prev" ? -1 : 1));
          return this.render();
        case "rec": return this.rec ? this.stop() : await this.start();
        case "sum": {
          b.disabled = true;
          const notes = $("#rh-notes").value;
          if (notes !== this.data.day.notes) await this.save({ notes });  // getippt, aber noch nicht gespeichert
          await post(`/api/report/${this.day}/summarize`);
          await this.load(this.day);
          this.render();
          this.onChange?.();
          return Sfx.play("coin");
        }
        case "copy": return copyText($("#rh-summary").value);
      }
    } catch (err) { if (err.message !== "auth") toast(err.message); b.disabled = false; }
  },

  /** Jarvis fragt, dann bis zu 3 Minuten erzählen (nochmal tippen = fertig). */
  async start() {
    if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) return toast("Dieser Browser kann nicht aufnehmen.");
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MIME_TYPES.find((m) => MediaRecorder.isTypeSupported?.(m)) || "";
    this.rec = new MediaRecorder(this.stream, mime ? { mimeType: mime } : undefined);
    this.chunks = [];
    this.rec.ondataavailable = (ev) => ev.data.size && this.chunks.push(ev.data);
    this.rec.onstop = () => this.upload(new Blob(this.chunks, { type: this.rec?.mimeType || mime || "audio/webm" }));
    Speech.say(this.data.day.kind === "schule" ? "Was hattet ihr heute in der Schule?" : "Was habt ihr heute gemacht?");
    this.rec.start();
    this.left = REPORT_SEC;
    this.timer = setInterval(() => {
      this.left -= 1;
      const t = $(".rh-timer");
      if (t) t.textContent = fmtSec(Math.max(0, this.left));
      if (this.left <= 0) this.stop();
    }, 1000);
    this.render();
  },

  stop() {
    clearInterval(this.timer);
    if (this.rec?.state === "recording") this.rec.stop();
    this.stream?.getTracks().forEach((t) => t.stop());
  },

  async upload(blob) {
    this.rec = null;
    this.left = REPORT_SEC;
    toast("Jarvis schreibt mit …");
    try {
      const res = await fetch(`/api/report/${this.day}/voice`, {
        method: "POST", body: blob, headers: { Authorization: `Bearer ${token()}`, "Content-Type": blob.type },
      });
      if (res.status === 401) return logout("Token ungültig");
      const r = await res.json();
      if (!res.ok) throw new Error(r.detail || `Fehler ${res.status}`);
      if (!r.text) { toast("Nichts verstanden."); return this.render(); }
      await post(`/api/report/${this.day}/summarize`);  // gleich die Stichpunkte fürs Heft
      await this.load(this.day);
      Speech.say("Hab's notiert.");
      Sfx.play("coin");
      this.onChange?.();
    } catch (e) { toast(e.message); }
    this.render();
  },
};

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Kopiert"); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; document.body.append(t); t.select(); document.execCommand?.("copy"); t.remove();
    toast("Kopiert");
  }
}

/** Kalenderwoche nach ISO 8601. */
function isoWeek(iso) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}

/** Die Ausbildungs-Spalte. */
const Training = {
  data: null, archive: [], prog: null, proj: null, ideas: null,

  async load() {
    [this.data, { days: this.archive }, this.prog, this.proj] = await Promise.all([api("/api/training"),
      api("/api/report/archive"), api("/api/ausbildung/progress").catch(() => null), api("/api/ausbildung/projekt").catch(() => null)]);
  },

  /** Ausbildungsjahr: Jahr, Gesamtbalken mit Zielmarke (Verkürzung), drei Kennzahlen. Zahlen kommen fertig vom Server. */
  yearHead() {
    const p = this.prog;
    if (!p) return "";
    const my = (iso) => new Date(`${iso}T12:00`).toLocaleDateString("de-DE", { month: "short", year: "numeric" });
    const t = p.theorie, b = p.berichtsheft, z = p.ziel, v = p.verkuerzung;
    const grade = (x) => String(x).replace(".", ",");
    return `<section class="tr-year" aria-label="Ausbildungsjahr">
      <div class="ty-head"><b>${p.jahr ? `${p.jahr}. Ausbildungsjahr` : "Vor dem Start"}</b>
        <span class="meta">${p.jahr ? `Tag ${p.tag_im_jahr} von ${p.jahr_tage}` : `Start ${esc(fmtDate(p.start))}`}</span></div>
      ${z ? `<div class="ty-bar" role="img" aria-label="Gesamt ${p.gesamt_prozent ?? 0} Prozent, Ziel bei ${z.marke_prozent} Prozent">
          <i style="width:${p.gesamt_prozent ?? 0}%"></i><u style="left:${z.marke_prozent}%" title="Ziel: früh fertig"></u></div>
        <p class="meta">Regulär bis ${esc(my(p.ende))} · Ziel ${esc(my(z.frueh))}–${esc(my(z.spaet))} · noch ${z.monate_bis_frueh} Monate bis zum frühen Ziel</p>` : ""}
      <div class="ty-nums">
        <span><b class="num">${b.fertig}<small>/${b.tage}</small></b>Berichtsheft</span>
        <span><b class="num">${t.mit_note}<small>/${t.lernfelder}</small></b>Lernfelder mit Note</span>
        <span><b class="num">${String(t.lernstunden).replace(".", ",")}</b>Lernstunden</span>
        <span class="${v.auf_kurs === false ? "warn" : ""}"><b class="num">${t.notenschnitt != null ? grade(t.notenschnitt) : "–"}</b>
          <span title="Annahme: bei der HWK prüfen lassen">Schnitt, Ziel &lt; ${grade(v.notengrenze)}*</span></span>
      </div></section>`;
  },

  /** Ausbildungsprojekt: aktives Projekt mit Notizen und "Nächster Schritt", sonst Ideen per Knopf. */
  projectCard() {
    const p = this.proj;
    const head = `<header class="ptitle"><span>🛠 Ausbildungsprojekt</span></header>`;
    if (!p) {
      return `${head}${this.ideas ? `<ul class="list">${this.ideas.map((o, i) => `<li><div class="grow"><b>${esc(o.titel)}</b>
          <div class="meta">${esc(o.schwierigkeit || "")}${o.geschaetzte_wochen ? ` · ~${o.geschaetzte_wochen} Wochen` : ""}${o.lernfeld ? ` · ${esc(o.lernfeld)}` : ""}</div>
          <div class="meta">${esc(o.beschreibung || "")}</div></div><button class="ghost" data-take-idea="${i}">Übernehmen</button></li>`).join("")}</ul>`
        : `<p class="empty">Noch kein Projekt. Eigenes eintragen oder Ideen holen.</p>`}
        <form class="form inline tr-add" id="ty-proj"><input name="title" placeholder="Projekt, z. B. Sägebock" required autocomplete="off">
          <button class="ghost" aria-label="Anlegen">＋</button></form>
        <p class="d-more"><button class="link" data-ideas>${this.ideas ? "Andere Ideen" : "Ideen holen (Claude)"}</button></p>`;
    }
    const notes = p.notizen.slice(-3).reverse();
    return `${head}<p><b>${esc(p.title)}</b>${p.lernfeld ? ` <span class="meta">· ${esc(p.lernfeld)}</span>` : ""}</p>
      ${p.beschreibung ? `<p class="meta">${esc(p.beschreibung)}</p>` : ""}
      ${notes.length ? `<ul class="list">${notes.map((n) => `<li><span class="kind-tag">${esc(n.kategorie)}</span><div class="grow">${esc(n.text)}</div></li>`).join("")}</ul>` : ""}
      <form class="form inline tr-add" id="ty-note"><select name="kategorie" aria-label="Art">
        ${["schritt", "material", "tipp", "regel"].map((k) => `<option>${k}</option>`).join("")}</select>
        <input name="text" placeholder="Notiz" required autocomplete="off"><button class="ghost" aria-label="Notiz speichern">＋</button></form>
      <p class="d-more"><button class="primary" data-next-step>Nächster Schritt (15 Min)</button></p>`;
  },

  async refreshProject() {
    this.proj = await api("/api/ausbildung/projekt");
    $("#ty-project").innerHTML = this.projectCard();
  },

  weekHead() {
    const d = this.data, tr = d.today.training;
    const chip = (t, extra = "") => `<span class="tr-chip ${t}">${TR_ICON[t]} ${t === "werkstatt" ? "Werkstatt" : "Berufsschule"}${extra}</span>`;
    return `<div class="tr-week">${tr ? chip(tr.type, ` · ${tr.start}–${tr.end}`) : d.this_week ? chip(d.this_week) : `<span class="tr-chip">frei</span>`}
      <span class="tr-next">▸ ${d.next_switch ? `ab ${esc(fmtDate(d.next_switch))} ` : ""}${chip(d.next_week)}</span></div>
      <a class="tr-days" href="#week" aria-label="Kalender">${d.days.map((x) => {
        const day = new Date(`${x.date}T12:00`);
        return `<span class="tr-day ${x.training ? x.training.type : "frei"} ${x.date === d.today.date ? "today" : ""}">
          <small>${WD[(day.getDay() + 6) % 7]}</small><b>${day.getDate()}</b><i>${x.training ? TR_ICON[x.training.type] : "·"}</i></span>`;
      }).join("")}</a>`;
  },

  dots() {
    return `<span class="rh-dots" aria-label="Berichtsheft diese Woche">${this.data.report_week.map((w) =>
      `<i class="${w.summary ? "done" : w.notes ? "half" : w.training && w.past ? "miss" : ""}" title="${esc(fmtDate(w.date))}"></i>`).join("")}</span>`;
  },

  todos() {
    const t = this.data.todos;
    return `${t.length ? `<ul class="qlist">${t.map((x) => `<li><button class="check" data-tr-done="${x.id}" aria-label="Erledigt"></button>
        <div class="grow">${esc(x.title)}${x.due_date ? `<div class="meta ${x.due_date < todayIso() ? "overdue" : ""}">${esc(fmtDate(x.due_date))}</div>` : ""}</div></li>`).join("")}</ul>`
      : `<p class="empty">–</p>`}
      <form class="form inline tr-add" id="tr-todo"><input name="title" placeholder="Neue Aufgabe" required autocomplete="off">
        <button class="ghost" aria-label="Hinzufügen">＋</button></form>`;
  },

  school() {
    const s = this.data.school;
    return (s.length ? `<ul class="list">${s.map((i) => `<li><span class="kind-tag k-${esc(i.kind)}">${esc(KIND_LABEL?.[i.kind] || i.kind)}</span>
      <div class="grow">${esc(i.title)}${i.subject ? `<div class="meta">${esc(i.subject)}</div>` : ""}</div>
      <span class="meta">${esc(fmtDate(i.due_date))}</span></li>`).join("")}</ul>` : `<p class="empty">–</p>`);
  },

  archiveHtml() {
    if (!this.archive.length) return `<p class="empty">–</p>`;
    const weeks = {};
    this.archive.forEach((d) => (weeks[isoWeek(d.date)] ||= []).push(d));
    return Object.entries(weeks).sort((a, b) => b[1][0].date.localeCompare(a[1][0].date)).map(([kw, days], i) => {
      days.sort((a, b) => a.date.localeCompare(b.date));
      const text = days.map((d) => `${fmtDate(d.date)}${d.label ? ` (${d.label})` : ""}\n${d.summary || d.notes}`).join("\n\n");
      return `<details class="tr-arch" ${i === 0 ? "open" : ""}><summary>KW ${kw} · ${days.length} ${days.length === 1 ? "Tag" : "Tage"}</summary>
        ${days.map((d) => `<div class="rh-day"><b>${esc(fmtDate(d.date))}</b>${d.label ? ` <span class="kind-tag">${TR_ICON[d.kind] || ""} ${esc(d.label)}</span>` : ""}
          <pre>${esc(d.summary || d.notes)}</pre></div>`).join("")}
        <button class="ghost" data-copy-week="${esc(text)}">📋 Woche kopieren</button></details>`;
    }).join("");
  },

  render() {
    view.innerHTML = `
      <h1>${tx("Ausbildung")}</h1>
      ${this.yearHead()}
      ${this.weekHead()}
      <div class="nav-row">${navCard("training/holz", { sub: "Lexikon: Modelle zum Drehen, Schritt für Schritt, Maße für deinen Querschnitt" })}
        ${navCard("training/werkzeug", { sub: "Lexikon: wofür, wie benutzen, worauf achten, No-Gos" })}
        ${navCard("training/cad", { sub: "SEMA: von der Wand bis zum Haus, Dach, Bauweisen, Pläne" })}
        ${navCard("training/planer", { sub: "Maße und Wünsche → 3D, Holzliste, Anriss, Schnitte, Aufbau" })}</div>
      <section class="panel tr-report" style="--accent:#c8793a">
        <header class="ptitle"><span>📓 Berichtsheft</span>${this.dots()}</header>
        <div id="rh-box"></div>
      </section>
      <div class="tr-grid">
        <section class="panel" style="--accent:var(--cyan)" id="tr-todos">
          <header class="ptitle"><span>✔ To-dos</span><button data-tr-voice aria-label="Jarvis sagen">🎙</button></header>
          ${this.todos()}
        </section>
        <section class="panel" style="--accent:#3b82f6">
          <header class="ptitle"><span>📚 Lernen</span></header>
          ${this.school()}
        </section>
      </div>
      <section class="panel" style="--accent:var(--orange)" id="ty-project">${this.projectCard()}</section>
      <section class="panel" style="--accent:var(--gold)" id="tr-archive">
        <header class="ptitle"><span>🗂 Berichtsheft-Archiv</span><span class="num">${this.archive.length}</span></header>
        ${this.archiveHtml()}
      </section>`;
    Report.render();
    Report.onChange = () => this.refresh();
    view.onclick = (e) => this.click(e);
    view.onsubmit = (e) => this.submit(e);
  },

  /** Nach Änderungen im Berichtsheft: Punkte und Archiv neu, Berichtsheft-Kasten bleibt stehen. */
  async refresh() {
    await this.load();
    if (!$("#rh-box")) return;
    $(".tr-report .rh-dots").outerHTML = this.dots();
    $("#tr-archive").innerHTML = `<header class="ptitle"><span>🗂 Berichtsheft-Archiv</span><span class="num">${this.archive.length}</span></header>${this.archiveHtml()}`;
  },

  async click(e) {
    const b = e.target.closest("button");
    if (!b || b.closest("#rh-box")) return;  // Berichtsheft-Knöpfe regelt Report
    try {
      if (b.dataset.trVoice !== undefined) return Dock.open();
      if (b.dataset.trDone) {
        await post(`/api/todos/${b.dataset.trDone}/toggle`);
        Sfx.play("coin");
        await this.load();
        return ($("#tr-todos").innerHTML = `<header class="ptitle"><span>✔ To-dos</span><button data-tr-voice aria-label="Jarvis sagen">🎙</button></header>${this.todos()}`);
      }
      if (b.dataset.copyWeek) return copyText(b.dataset.copyWeek);
      if (b.dataset.ideas !== undefined) {
        b.disabled = true; b.textContent = "Jarvis überlegt …";
        this.ideas = (await post("/api/ausbildung/suggest")).optionen;
        if (!this.ideas.length) toast("Keine brauchbaren Ideen bekommen, nochmal versuchen");
        return ($("#ty-project").innerHTML = this.projectCard());
      }
      if (b.dataset.takeIdea) {
        const o = this.ideas[+b.dataset.takeIdea];
        await post("/api/ausbildung/projekt", { title: o.titel, beschreibung: o.beschreibung, lernfeld: o.lernfeld || null });
        this.ideas = null; Sfx.play("coin");
        return this.refreshProject();
      }
      if (b.dataset.nextStep !== undefined) {
        b.disabled = true; b.textContent = "Jarvis schneidet …";
        const r = await post("/api/ausbildung/projekt/schritt");
        toast(`Neue 15-Min-Aufgabe: ${r.title}`); Sfx.play("coin");
        await this.load();
        $("#tr-todos").innerHTML = `<header class="ptitle"><span>✔ To-dos</span><button data-tr-voice aria-label="Jarvis sagen">🎙</button></header>${this.todos()}`;
        return ($("#ty-project").innerHTML = this.projectCard());
      }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },

  async submit(e) {
    if (e.target.id === "ty-proj" || e.target.id === "ty-note") {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        if (e.target.id === "ty-proj") await post("/api/ausbildung/projekt", { title: f.title.trim() });
        else await post(`/api/ausbildung/projekt/${this.proj.id}/notiz`, { kategorie: f.kategorie, text: f.text.trim() });
        this.ideas = null;
        return this.refreshProject();
      } catch (err) { return toast(err.message); }
    }
    if (e.target.id !== "tr-todo") return;
    e.preventDefault();
    const title = new FormData(e.target).get("title").trim();
    if (!title) return;
    try {
      await post("/api/todos", { title, project: this.data.project });
      await this.load();
      $("#tr-todos").innerHTML = `<header class="ptitle"><span>✔ To-dos</span><button data-tr-voice aria-label="Jarvis sagen">🎙</button></header>${this.todos()}`;
      $("#tr-todo input").focus();
    } catch (err) { toast(err.message); }
  },
};

</script>
  <script>
"use strict";

// Finanzen: Verteilung (Ring mit Drilldown), Vermögensverlauf, Positionen pflegen
const STATUS_LABEL = { missing: "Kurs fehlt", fx_missing: "Wechselkurs fehlt", stale: "Kurs veraltet", manual: "fester Wert" };
const DIMS = { portfolio: "Portfolios", asset_class: "Anlageklasse", position: "Titel" };
const RANGES = ["1M", "6M", "1J", "MAX"];

/** Gewinn/Verlust: kleiner Chip mit Pfeil und Farbe, klar anders als der große Gesamtwert. */
const gainChip = (pnl, pctVal, big = false) => pnl == null ? "" :
  `<span class="gain-chip ${pnl >= 0 ? "up" : "down"} ${big ? "big" : ""}" title="Gewinn/Verlust" aria-label="Gewinn ${eur(pnl)}">`
  + `${pnl >= 0 ? "▲" : "▼"} ${eur(Math.abs(pnl))}${pctVal == null ? "" : `<small>${Math.abs(pctVal).toLocaleString("de-DE", { maximumFractionDigits: 1 })} %</small>`}</span>`;
const warnIcon = (title) => `<span class="warn-ico" title="${esc(title)}" aria-label="${esc(title)}">⚠</span>`;

const Finance = {
  data: null,
  focus: null, // Name des aufgeklappten Portfolios
  editing: null,

  async load(force = false) {
    [this.data, this.plans] = await Promise.all([
      api(`/api/portfolio${force ? "?refresh=1" : ""}`),
      api("/api/savings-plans").catch(() => ({ plans: [], pending: [] })),
    ]);
  },

  withReserve: false,  // nur für diesen Besuch: beim Seitenwechsel wieder aus (core.js render)

  /** Oben nur: Gesamtvermögen, Steuer-Knopf, (nur wenn nötig) Warnung "Kurs fehlt". */
  worth(d) {
    const r = d.reserve || { value: 0, portfolios: [] };
    const label = r.portfolios.map(esc).join(", ") || "Steuern";
    return `
      <div class="worth">
        <div class="big">${eur(this.withReserve ? d.total_with_reserve : d.total, d.base_currency)}</div>
        ${d.invested ? gainChip(d.pnl, d.pnl_pct, true) : ""}
        ${r.value > 0 ? `<button class="ghost tax-btn ${this.withReserve ? "on" : ""}" data-fin="with-reserve"
          aria-pressed="${this.withReserve}">${this.withReserve ? "−" : "+"} ${label}</button>` : ""}
        ${d.complete ? "" : `<p class="warn-line">${warnIcon("Kurs fehlt")} ${d.missing.map(esc).join(", ")}</p>`}
      </div>`;
  },

  openCards: new Set(),

  /** Depots als Karten: Symbol, Name, Wert. Antippen klappt Positionen und Einstellungen auf. */
  cards(d) {
    const groups = {};
    d.positions.forEach((p) => (groups[p.portfolio] ||= []).push(p));
    const sum = (ps) => ps.reduce((s, p) => s + (p.value || 0), 0);
    const gain = (ps) => {
      const ok = ps.filter((p) => p.pnl != null);
      const pnl = ok.reduce((s, p) => s + p.pnl, 0), cost = ok.reduce((s, p) => s + p.cost, 0);
      return Math.abs(pnl) < 0.005 ? "" : gainChip(pnl, cost ? (pnl / cost) * 100 : null);
    };
    const list = Object.entries(groups).sort(([, a], [, b]) => (a[0].is_reserve - b[0].is_reserve) || sum(b) - sum(a));
    return `<div class="pf-cards">${list.map(([name, ps]) => {
      const open = this.openCards.has(name);
      return `<section class="pf-card ${ps[0].is_reserve ? "is-reserve" : ""} ${open ? "open" : ""}">
        <button class="pf-head" data-pf-toggle="${esc(name)}" aria-expanded="${open}">
          ${Skin.portfolioIcon(name, ps)}<span class="pf-name">${esc(name)}</span><span class="pf-nums"><span class="pf-val num">${eur(sum(ps))}</span>${gain(ps)}</span>
        </button>
        ${open ? `<div class="pf-body">${this.positionTable(ps)}${this.portfolioForm(ps)}${ps[0].is_reserve ? "" : this.reserveForm(ps)}</div>` : ""}
      </section>`;
    }).join("")}</div>`;
  },

  // ---------------------------------------------------------------- Live-Ticker
  timer: null,
  get live() { try { return localStorage.getItem("finLive") === "1"; } catch { return false; } },
  set live(v) { try { localStorage.setItem("finLive", v ? "1" : "0"); } catch { /* egal */ } },

  /** Schalter; nur wenn an: Kurse jede Minute neu und der Graph der Vermögensentwicklung. */
  liveBlock(d) {
    return `<div class="live-row">
        <button class="ghost live-btn ${this.live ? "on" : ""}" data-fin="live" aria-pressed="${this.live}"><i class="live-dot"></i>Live-Ticker</button>
        ${this.live && d.prices_as_of ? `<span class="muted num" title="Kursstand">${esc(d.prices_as_of.slice(11, 16))}</span>` : ""}
      </div>
      ${this.live && d.positions.length ? `<section class="panel chart-card" id="card-hist" style="--accent:var(--cyan)">

  /** Oberste Ebene: nach Dimension; Drilldown: Positionen eines Portfolios. */
  allocation() {
    const d = this.data, host = $("#alloc");
    const dim = sessionStorage.getItem("dim") || "portfolio";
    const valued = d.positions.filter((p) => p.value != null);
    $("#alloc-head").innerHTML = this.focus

      : `<div class="seg" role="group" aria-label="Aufteilen nach">${Object.entries(DIMS).map(([k, v]) =>
          `<button data-dim="${k}" class="${k === dim ? "on" : ""}" aria-pressed="${k === dim}">${v}</button>`).join("")}</div>`;
    if (!valued.length) { host.innerHTML = `<p class="empty">Noch nichts bewertet.</p>`; return; }

    if (this.focus) {
      const ps = valued.filter((p) => p.portfolio === this.focus);
      donut(host, ps.map((p) => ({ name: p.name, value: p.value })),
        { label: `Positionen in ${this.focus}`, centerLabel: this.focus });
      host.insertAdjacentHTML("beforeend", this.positionTable(d.positions.filter((p) => p.portfolio === this.focus), false));

    }

    });

  /** Sparplan-Käufe desselben Titels zu einer Zeile zusammenfassen (aufklappbar), auch über
   *  Planwechsel hinweg (alter und neuer Plan in denselben ETF). Sonst wird die Liste endlos. */
  planRollup(ps) {
    const out = [], seen = {};
    for (const p of ps) {
      if (!p.plan_id) { out.push(p); continue; }
      const key = `${p.ticker}|${p.name}`;
      let g = seen[key];
      if (!g) {
        g = seen[key] = { ...p, lots: [], quantity: 0, value: 0, cost: 0, bought_at: p.bought_at, rollup: true,
          group: `g${Object.keys(seen).length}-${p.portfolio_id}` };
        out.push(g);
      }
      g.lots.push(p);
      g.quantity += p.quantity;
      g.cost += p.cost ?? NaN;
      g.value = g.value == null || p.value == null ? null : g.value + p.value;
      if (p.bought_at < g.bought_at) g.bought_at = p.bought_at;
      if (p.status !== "live") g.status = p.status;
    }
    out.filter((g) => g.rollup).forEach((g) => {
      g.entry_price = g.quantity ? g.cost / g.quantity : 0;  // Durchschnittskurs
      g.pnl = g.value == null || Number.isNaN(g.cost) ? null : g.value - g.cost;
      g.pnl_pct = g.pnl == null || !g.cost ? null : Math.round((g.pnl / g.cost) * 10000) / 100;
      g.lots.sort((a, b) => (a.bought_at < b.bought_at ? -1 : 1));
    });
    return out;
  },

  /** Eine Zeile: Titel links, rechts Wert und darunter der Gewinn-Chip. Passt auf jede Breite. */
  positionRow(p, total, actions, extra = "") {
    const lot = extra.includes("lot-row");
    const title = lot ? esc(fmtDate(p.bought_at.slice(0, 10))) : esc(p.name);
    const warn = STATUS_LABEL[p.status] && p.status !== "manual" ? ` ${warnIcon(STATUS_LABEL[p.status])}` : "";
    return `<li class="pos-row ${extra}">
        <span class="pos-title">${title}${warn}${p.rollup ? ` <span class="count-chip" title="Käufe">${p.lots.length}</span>` : ""}</span>
        <span class="pos-nums"><span class="num">${p.value == null ? "–" : eur(p.value)}</span>${gainChip(p.pnl, p.pnl_pct)}</span>
        ${actions ? (p.rollup
          ? `<button class="icon-link" data-lots="${p.group}" aria-label="Käufe" title="Käufe">▾</button>`
          : `<button class="icon-link" data-edit="${p.id}" aria-label="Bearbeiten" title="Bearbeiten">✎</button>`) : ""}
      </li>`;
  },

  positionTable(ps, actions = true) {
    const total = this.data.total;
    return `<ul class="pos-list">${this.planRollup(ps).map((p) => this.positionRow(p, total, actions)
      + (p.rollup && actions ? p.lots.map((l) => this.positionRow(l, total, actions, `lot-row lots-${p.group}`)).join("") : "")).join("")}
      </ul>`;
  },

  async planClick(b) {
    const { planEnd, planDelete, lots } = b.dataset;
    if (lots) {
      const rows = document.querySelectorAll(`.lot-row.lots-${lots}`);
      const open = ![...rows].some((r) => r.classList.contains("open"));
      rows.forEach((r) => r.classList.toggle("open", open));
      b.textContent = open ? "▴" : "▾";
      return true;
    }
    if (planEnd) {
      const today = new Date().toISOString().slice(0, 10);
      const end = prompt("Letzte Ausführung am (JJJJ-MM-TT). Spätere gebuchte Käufe fallen weg.", today);
      if (!end) return true;
      await post(`/api/savings-plans/${planEnd}/end`, { end_date: end.trim() });
      toast("Sparplan beendet");
      await VIEWS.money();
      return true;
    }
    if (planDelete) {
      const p = this.plans.plans.find((x) => x.id === +planDelete);
      if (!confirm(`Sparplan „${p?.name}“ löschen? Seine ${p?.executions ?? 0} gebuchten Käufe werden mit gelöscht.\nNur wenn er falsch angelegt war – sonst „beenden“.`)) return true;
      await api(`/api/savings-plans/${planDelete}`, { method: "DELETE" });
      toast("Sparplan gelöscht");
      await VIEWS.money();
      return true;
    }
    return false;
  },

        toast(Math.abs(r.deviation_pct) > 5
          ? `Abgeglichen, aber Abweichung ${dev} %: fehlen Ausführungen oder stimmt ein Plan nicht?`
          : `${r.lots} Käufe abgeglichen (Schätzung lag ${dev} % daneben)`);

      if (!Number.isFinite(amount) || amount <= 0) return toast("Rate: bitte eine Zahl über 0");

      });

      const change = last.total - firstP.total - (last.invested - firstP.invested);

  bindForm() {
    $("#pos-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      for (const k of ["quantity", "entry_price", "manual_price"]) f[k] = f[k] === "" ? null : +f[k];
      for (const k of ["ticker", "isin", "asset_class", "region", "bought_at"]) f[k] = f[k] || null;
      f.currency = (f.currency || "EUR").toUpperCase();
      try {
        if (this.editing) await api(`/api/positions/${this.editing}`, { method: "PUT", body: f });
        else await post("/api/positions", f);
        toast(this.editing ? "Position gespeichert, Kurshistorie wird geladen" : "Position angelegt, Kurshistorie wird geladen");
        this.editing = null;
        await VIEWS.money();
        this.historySoon();
      } catch (err) { toast(err.message); }
    });
  },

  async click(e) {
    const b = e.target.closest("button");
    if (!b) return;
    const { fin, dim, range, edit } = b.dataset;
    try {
      if (await this.planClick(b)) return;
      if (fin === "refresh") return await VIEWS.money(true);
      if (fin === "with-reserve") {
        this.withReserve = !this.withReserve;
        $(".worth").outerHTML = this.worth(this.data);
        return $("[data-fin=with-reserve]")?.focus();
      }
      if (fin === "live") {
        this.live = !this.live;
        if (this.live) this.data = await api("/api/portfolio?refresh=1");  // sofort frische Kurse
        this.renderTop();
        this.startLive();
        return $("[data-fin=live]")?.focus();
      }
      if (b.dataset.pfToggle !== undefined) {
        const name = b.dataset.pfToggle;
        this.openCards.has(name) ? this.openCards.delete(name) : this.openCards.add(name);
        $(".pf-cards").outerHTML = this.cards(this.data);
        return $(`.pf-head[data-pf-toggle="${CSS.escape(name)}"]`)?.focus();
      }
      if (fin === "up") { this.focus = null; return this.allocation(); }
      if (fin === "max") return this.toggleMax(b.closest(".chart-card"));
      if (fin === "sync") {
        b.disabled = true;
        const r = await post("/api/portfolio/history/sync");
        const errors = Object.entries(r.synced).filter(([, v]) => typeof v === "string");
        toast(errors.length ? `Fehler bei: ${errors.map(([k]) => k).join(", ")}` : "Kurshistorie aktuell");
        b.disabled = false;
        return await this.history();
      }
      if (fin === "cancel") { this.editing = null; $("#form-slot").innerHTML = this.form(); return this.bindForm(); }
      if (dim) { sessionStorage.setItem("dim", dim); return this.allocation(); }
      if (range) { sessionStorage.setItem("range", range); return await this.history(); }
      if (edit) {
        this.editing = +edit;
        $("#form-slot").innerHTML = this.form(this.data.positions.find((p) => p.id === +edit));
        this.bindForm();
        $("#pos-details").open = true;
        return $("#pos-form").scrollIntoView({ behavior: "smooth", block: "center" });
      }
      const planLot = b.dataset.delete && this.data.positions.find((p) => p.id === +b.dataset.delete)?.plan_id;
      if (b.dataset.delete && confirm(planLot
        ? "Diesen Sparplan-Kauf löschen? Er wird danach nicht wieder gebucht (z. B. wenn die Ausführung ausfiel)."
        : "Position wirklich löschen?")) {
        await api(`/api/positions/${b.dataset.delete}`, { method: "DELETE" });
        this.editing = null;
        toast("Position gelöscht");
        return await VIEWS.money();
      }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
