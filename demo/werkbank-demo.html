<title>Jarvis Werkbank</title>
<meta name="theme-color" content="#1a1733">
<style>
/* Werkbank: Arcade-HUD. Nachtviolett, Neon, harte Pixelschatten. */
:root {
  --bg: #120d24;
  --bg-2: #1b1435;
  --panel: #211a40;
  --panel-2: #2b2253;
  --edge: #07050f;
  --ink: #f1edff;
  --dim: #a9a0d6;
  --cyan: #3ee8ff;
  --pink: #ff5cc8;
  --lime: #9dff5c;
  --gold: #ffd23f;
  --red: #ff5c5c;
  --orange: #ff9f40;
  --violet: #9b7bff;
  --up: var(--lime);
  --down: var(--red);

  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 36px;
  --px: 3px;               /* Pixelkante */
  --drop: 6px 6px 0 0 var(--edge);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
  background-size: 16px 16px;
  color: var(--ink);
  font: 15px/1.45 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
/* Röhrenmonitor-Scanlines, rein dekorativ */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
a { color: var(--cyan); }

/* ---------- Gerüst ---------- */
.shell { min-height: 100dvh; }
main {
  max-width: 760px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + var(--s4)) var(--s4) calc(96px + env(safe-area-inset-bottom));
}
main.wide { max-width: 1320px; }
h1, h2, h3 { font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
h1 { font-size: 26px; line-height: 1.15; text-shadow: 3px 3px 0 var(--edge), -1px -1px 0 var(--pink); }
h2 { font-size: 16px; margin: var(--s6) 0 var(--s3); color: var(--cyan); }
h2::before { content: "▸ "; color: var(--pink); }
.sub { color: var(--dim); margin: var(--s1) 0 0; }
.muted { color: var(--dim); font-size: 13px; }

/* Navigation: unten wie ein Controller (iPhone), oben als Menüleiste (iPad, Laptop) */
.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 20;
  display: flex; justify-content: space-around; gap: 2px;
  padding: var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom));
  background: var(--edge); border-top: var(--px) solid var(--violet);
}
.tabs .brand { display: none; }
.tabs button {
  flex: 1; background: none; border: 0; padding: var(--s2) 0;
  font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
}
.tabs button.active { color: var(--edge); background: var(--gold); box-shadow: 0 3px 0 #b8901a; }
.tabs .gear { flex: 0 0 auto; padding: var(--s2) var(--s3); }

@media (min-width: 900px) {
  .tabs {
    position: sticky; top: 0; inset: auto; justify-content: flex-start; align-items: center;
    padding: var(--s2) var(--s5); border-top: 0; border-bottom: var(--px) solid var(--violet);
  }
  .tabs .brand {
    display: block; font: 900 20px var(--mono); letter-spacing: .12em; margin-right: var(--s5);
    color: var(--gold); text-shadow: 2px 2px 0 var(--pink);
  }
  .tabs button { flex: 0 0 auto; padding: var(--s2) var(--s4); font-size: 13px; }
  .tabs .gear { margin-left: auto; }
  main { padding-bottom: var(--s6); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s6); align-items: start; }
  .split h2:first-child { margin-top: var(--s5); }
}

/* ---------- Panels ---------- */
.panel {
  --accent: var(--violet);
  position: relative; min-width: 0;
  background: var(--panel);
  border: var(--px) solid var(--edge);
  box-shadow: inset 0 0 0 var(--px) color-mix(in srgb, var(--accent) 45%, transparent), var(--drop);
  padding: 0 var(--s4) var(--s4);
}
.ptitle {
  display: flex; justify-content: space-between; align-items: center; gap: var(--s2);
  margin: 0 calc(-1 * var(--s4)) var(--s3); padding: 7px var(--s4);
  background: var(--accent); color: var(--edge);
  font: 900 13px var(--mono); text-transform: uppercase; letter-spacing: .1em;
  border-bottom: var(--px) solid var(--edge);
}
.ptitle a, .ptitle button { color: var(--edge); font: 700 11px var(--mono); background: none; border: 0; padding: 0; text-decoration: underline; }
.sub-h { font: 800 11px var(--mono); color: var(--dim); letter-spacing: .12em; margin: var(--s4) 0 var(--s2); }

/* ---------- HUD-Raster ---------- */
.playerbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s4);
  margin-bottom: var(--s4); font: 700 13px var(--mono);
}
.lv {
  background: var(--gold); color: var(--edge); padding: 4px 10px; font-weight: 900;
  box-shadow: 3px 3px 0 var(--edge); letter-spacing: .08em;
}
.xpbar { flex: 1 1 180px; display: grid; gap: 3px; min-width: 150px; }
.xpbar .track { height: 12px; background: var(--edge); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px var(--violet); }
.xpbar .fill { height: 100%; background: repeating-linear-gradient(90deg, var(--cyan) 0 8px, #22b8cc 8px 10px); transition: width .6s steps(12); }
.xpbar small { color: var(--dim); font-size: 11px; }
.streak-chip { color: var(--orange); }
.icon-btn { background: var(--panel-2); border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--edge); padding: 3px 8px; font: 700 12px var(--mono); }

.hud {
  display: grid; gap: 14px 12px; grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-areas: "voice voice" "quests score" "boss cal" "habits mission" "school money" "health health" "news news";
}
.p-voice { grid-area: voice; --accent: var(--pink); }
.p-score { grid-area: score; --accent: var(--gold); }
.p-quests { grid-area: quests; --accent: var(--cyan); }
.p-boss { grid-area: boss; --accent: var(--red); }
.p-habits { grid-area: habits; --accent: var(--lime); }
.p-money { grid-area: money; --accent: var(--orange); }
.p-cal { grid-area: cal; --accent: var(--violet); }
.p-mission { grid-area: mission; --accent: var(--pink); }
.p-school { grid-area: school; --accent: var(--lime); }
.p-health { grid-area: health; --accent: var(--red); }
.p-news { grid-area: news; --accent: var(--cyan); }
@media (min-width: 720px) {
  .hud { grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas: "voice voice" "quests score" "boss cal" "habits mission" "school money" "health news"; gap: 20px 18px; }
}
@media (min-width: 1100px) {
  .hud { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr);
    grid-template-areas: "quests voice money" "boss voice score" "cal voice habits" "mission school health" "news news news"; }
}

/* ---------- Spracheingabe ---------- */
.p-voice { text-align: center; overflow: hidden; }
.mic-wrap { position: relative; width: 176px; height: 176px; margin: var(--s4) auto var(--s3); }
.mic {
  position: absolute; inset: 12px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff9ade 0 18%, var(--pink) 45%, #c2268f 100%);
  border: 6px solid var(--edge);
  box-shadow: 0 9px 0 var(--edge), inset 0 -12px 0 rgba(0, 0, 0, .25), inset 0 10px 0 rgba(255, 255, 255, .22);
  display: grid; place-items: center; padding: 0;
  transition: transform .06s, box-shadow .06s;
}
.mic svg { width: 64px; height: 72px; }
.mic:active { transform: translateY(7px); box-shadow: 0 2px 0 var(--edge), inset 0 -12px 0 rgba(0, 0, 0, .25), inset 0 10px 0 rgba(255, 255, 255, .22); }
.mic:disabled { cursor: progress; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 4px dashed transparent; }

[data-state="rec"] .mic { background: radial-gradient(circle at 35% 30%, #ffb3a8 0 18%, var(--red) 45%, #a8201f 100%); }
[data-state="rec"] .ring { border-color: var(--red); animation: pulse 1s steps(4) infinite; }
[data-state="busy"] .mic { filter: saturate(.3) brightness(.8); }
[data-state="busy"] .ring { border-color: var(--cyan); animation: spin 1.2s steps(12) infinite; }
[data-state="done"] .ring { border-color: var(--lime); border-style: solid; }
[data-state="error"] .ring { border-color: var(--red); border-style: solid; }
@keyframes pulse { 50% { transform: scale(1.08); opacity: .5; } }
@keyframes spin { to { transform: rotate(360deg); } }

.meter { display: flex; justify-content: center; align-items: flex-end; gap: 3px; height: 34px; margin: 0 auto; }
.meter i { width: 8px; height: 3px; background: var(--lime); transition: height .05s; }
.meter i:nth-child(n+7) { background: var(--gold); }
.meter i:nth-child(n+12) { background: var(--red); }
[data-state="idle"] .meter i, [data-state="done"] .meter i { opacity: .25; }
.timer { font: 800 14px var(--mono); color: var(--dim); margin-top: var(--s1); letter-spacing: .1em; }
[data-state="rec"] .timer { color: var(--red); }
.vstatus { font: 800 15px var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: var(--s2) 0 0; min-height: 1.4em; }
[data-state="rec"] .vstatus::after { content: "▌"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.transcript { color: var(--dim); font-style: italic; margin: var(--s2) auto 0; max-width: 46ch; min-height: 1.4em; }
.transcript b { color: var(--ink); font-style: normal; }
.vactions { display: flex; justify-content: center; gap: var(--s2); margin-top: var(--s2); min-height: 8px; }
.console {
  display: flex; align-items: center; gap: var(--s2); margin-top: var(--s4);
  background: var(--edge); padding: 6px 6px 6px 12px; border: 2px solid var(--violet); text-align: left;
}
.console span { color: var(--lime); font: 900 16px var(--mono); }
.console input { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; font-family: var(--mono); color: var(--lime); }
.console input::placeholder { color: #5f7a55; }
.console input:focus { outline: none; }
.console:focus-within { border-color: var(--lime); }
.keyhint { display: none; }
@media (hover: hover) and (pointer: fine) { .keyhint { display: inline; } }
kbd { font: 700 11px var(--mono); color: var(--ink); background: var(--edge); border: 2px solid var(--edge); padding: 0 5px; }

.loot-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.loot {
  position: absolute; left: 50%; top: 38%; white-space: nowrap;
  font: 900 20px var(--mono); color: var(--gold); letter-spacing: .06em;
  text-shadow: 3px 3px 0 var(--edge), -2px 0 0 var(--pink);
  animation: loot 1.8s ease-out forwards;
}
@keyframes loot {
  0% { transform: translate(-50%, 10px) scale(.6); opacity: 0; }
  15% { transform: translate(-50%, 0) scale(1.15); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(-50%, -90px) scale(1); opacity: 0; }
}

/* Inbox und Log unter dem Mikrofon */
.riddles { text-align: left; margin-top: var(--s4); }
.inbox-item { background: var(--bg-2); border: 2px solid var(--gold); padding: var(--s3); margin-bottom: var(--s2); box-shadow: 3px 3px 0 var(--edge); }
.inbox-item p { margin: 0 0 var(--s1); }
.inbox-item .actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.log { text-align: left; }
.log li { font-size: 13px; }

/* ---------- Wochenscore ---------- */
.score-main { display: flex; align-items: center; justify-content: center; gap: var(--s4); margin: var(--s2) 0 var(--s3); }
.rank {
  width: 64px; height: 64px; display: grid; place-items: center;
  font: 900 40px var(--mono); color: var(--edge); background: var(--gold);
  border: var(--px) solid var(--edge); box-shadow: 4px 4px 0 var(--edge);
}
.rank.S { background: var(--pink); } .rank.A { background: var(--lime); } .rank.B { background: var(--cyan); }
.rank.C { background: var(--gold); } .rank.D { background: var(--dim); }
.score-num { font: 900 64px/1 var(--mono); color: var(--gold); text-shadow: 4px 4px 0 var(--edge), -2px -2px 0 var(--pink); }
.score-num small { font-size: 18px; color: var(--dim); text-shadow: none; }
.parts { display: grid; gap: var(--s2); }
.part { display: grid; grid-template-columns: 1fr auto; gap: 3px var(--s2); font: 700 12px var(--mono); text-transform: uppercase; }
.part .seg-bar { grid-column: 1 / -1; }
.seg-bar { height: 14px; background: var(--edge); padding: 2px; display: grid; grid-auto-flow: column; gap: 2px; }
.seg-bar i { background: var(--panel-2); }
.seg-bar i.on { background: var(--accent-fill, var(--gold)); }
.streak-line { margin-top: var(--s3); font: 700 13px var(--mono); color: var(--orange); text-align: center; }
.xp-float { position: absolute; right: var(--s4); top: 44px; font: 900 18px var(--mono); color: var(--cyan); text-shadow: 2px 2px 0 var(--edge); animation: loot 1.6s ease-out forwards; }

/* ---------- Listen ---------- */
ul.list, ul.qlist, ul.bosses, ul.log { list-style: none; margin: 0; padding: 0; }
ul.list li, ul.qlist li {
  display: flex; gap: var(--s3); align-items: flex-start;
  padding: var(--s2) 0; border-bottom: 2px dashed var(--panel-2);
}
ul.list li:last-child, ul.qlist li:last-child { border-bottom: 0; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
.overdue { color: var(--red); }
.prio { color: var(--red); font: 900 12px var(--mono); }

.check {
  flex: 0 0 24px; height: 24px; margin-top: 1px; padding: 0;
  background: var(--edge); border: 2px solid var(--dim); box-shadow: 2px 2px 0 var(--edge);
}
.check:hover { border-color: var(--lime); }
.check.on { background: var(--lime); border-color: var(--edge); }
.check.on::after { content: "✓"; color: var(--edge); font: 900 14px var(--mono); }
.done-text { color: var(--dim); text-decoration: line-through; }

.plan-day { display: grid; grid-template-columns: 34px 1fr; gap: var(--s2); padding: 4px 0; font-size: 13px; }
.plan-day b { font: 900 11px var(--mono); color: var(--cyan); padding-top: 2px; }
.plan-day.today b { color: var(--gold); }

/* Bosskämpfe */
ul.bosses li { padding: var(--s2) 0; border-bottom: 2px dashed var(--panel-2); }
ul.bosses li:last-child { border-bottom: 0; }
.boss-row { display: flex; gap: var(--s2); align-items: flex-start; }
.bcount { font: 900 11px var(--mono); white-space: nowrap; padding: 2px 6px; background: var(--panel-2); color: var(--ink); }
.urgent .bcount { background: var(--orange); color: var(--edge); }
.slain .bcount { background: var(--red); color: var(--edge); animation: blink 1s steps(1) infinite; }
.hp { height: 10px; margin-top: 6px; background: var(--edge); padding: 2px; }
.hp span { display: block; height: 100%; background: var(--lime); }
.urgent .hp span { background: var(--orange); }
.slain .hp span { background: var(--red); }
.hp-label { font: 700 10px var(--mono); color: var(--dim); letter-spacing: .1em; }

/* Checkliste */
.habit { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; border-bottom: 2px dashed var(--panel-2); }
.habit:last-child { border-bottom: 0; }
.hbtn {
  flex: 0 0 44px; height: 44px; padding: 0; background: var(--edge);
  border: var(--px) solid var(--lime); box-shadow: 3px 3px 0 var(--edge);
  font: 900 20px var(--mono); color: var(--edge);
}
.hbtn.on { background: var(--lime); }
.hbtn.on::after { content: "✓"; }
.hbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
.pips { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.pips i { width: 12px; height: 12px; background: var(--edge); border: 2px solid var(--panel-2); }
.pips i.on { background: var(--lime); border-color: var(--edge); }
.pips i.bonus { background: var(--gold); border-color: var(--edge); }

/* Schatzkammer */
.vault { position: relative; }
.veiled .secret { filter: blur(10px); user-select: none; }
.treasure { font: 900 30px/1.1 var(--mono); color: var(--gold); text-shadow: 3px 3px 0 var(--edge); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s2) 0; font: 700 13px var(--mono); }
.chips span { background: var(--edge); padding: 3px 8px; }

/* ---------- Bausteine ---------- */
.primary {
  background: var(--gold); color: var(--edge); border: var(--px) solid var(--edge);
  font: 900 13px var(--mono); text-transform: uppercase; letter-spacing: .06em;
  padding: 8px 14px; box-shadow: 3px 3px 0 var(--edge);
}
.primary:active, .ghost:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
.ghost {
  background: var(--panel-2); border: 2px solid var(--edge); color: var(--ink);
  padding: 5px 10px; font: 700 12px var(--mono); box-shadow: 2px 2px 0 var(--edge);
}
.link { background: none; border: 0; color: var(--cyan); padding: 0; font-size: 13px; text-decoration: underline; }
.empty { color: var(--dim); padding: var(--s2) 0; font-size: 13px; }

/* ---------- Unterseiten ---------- */
.capture-row { display: flex; justify-content: space-between; align-items: center; margin-top: var(--s3); gap: var(--s3); flex-wrap: wrap; }
.tally { display: flex; gap: 3px; margin-top: var(--s1); }
.tally i { width: 6px; height: 12px; background: var(--panel-2); }
.tally i.on { background: var(--lime); }

.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
.grid th { font: 700 11px var(--mono); color: var(--dim); padding: var(--s2) 2px; }
.grid td { text-align: center; padding: 6px 2px; border-top: 2px dashed var(--panel-2); }
.grid td:first-child { text-align: left; padding-right: var(--s2); }
.grid th.today { color: var(--gold); }
.cell { width: 26px; height: 26px; border: 2px solid var(--dim); background: var(--edge); padding: 0; }
.cell.on { background: var(--lime); border-color: var(--edge); }
.day { padding: var(--s2) 0; border-bottom: 2px dashed var(--panel-2); }
.day strong { font: 800 13px var(--mono); text-transform: uppercase; }
.day.is-today strong { color: var(--gold); }
.day ul { margin: var(--s1) 0 0; padding-left: var(--s4); }

.form { display: grid; gap: var(--s2); margin-top: var(--s3); }
.form.inline { grid-template-columns: 1fr auto; }
.form input, .form select, .form textarea, .login input {
  width: 100%; background: var(--edge); border: 2px solid var(--violet); padding: 10px 12px; font-family: var(--mono);
}
.form textarea { min-height: 120px; font-size: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s2); }
.two > *, .field > input, .form.inline > input { min-width: 0; width: 100%; }
details summary { color: var(--cyan); cursor: pointer; margin-top: var(--s4); font: 700 13px var(--mono); text-transform: uppercase; }

.worth { margin-top: var(--s4); }
.worth .big { font: 900 40px/1 var(--mono); color: var(--gold); text-shadow: 3px 3px 0 var(--edge); }
.up { color: var(--up); }
.down { color: var(--down); }
.bars { display: grid; gap: var(--s2); }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); font-size: 13px; }
.bar { grid-column: 1 / -1; height: 10px; background: var(--edge); padding: 2px; }
.bar span { display: block; height: 100%; background: var(--cyan); }
.seg { display: flex; gap: var(--s1); flex-wrap: wrap; margin-bottom: var(--s3); }
.seg button { background: var(--panel-2); border: 2px solid var(--edge); padding: 3px 10px; font: 700 12px var(--mono); color: var(--dim); }
.seg button.on { background: var(--cyan); color: var(--edge); }
.pos-group { margin-bottom: var(--s5); }
.pos-group h3 { font-size: 13px; color: var(--dim); margin: 0 0 var(--s1); }
.reserve { color: var(--dim); font-size: 13px; }
.alarm-list li { flex-wrap: wrap; align-items: center; }
.alarm-list .meta { flex-basis: 100%; margin: 0 0 0 24px; }
.alarm-list li.off { opacity: .55; }

/* Fach-Agent unter Jarvis' Antwort */
.agent-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; font-style: normal; }
.agent-tags span { font: 700 11px var(--round, var(--mono)); padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--ink); }

/* Wecker-Dialog (Wochenplan, Einstellungen) */
.h1-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.alarm-btn { font-size: 20px; padding: 6px 12px; }
dialog.sheet { padding: 0; border: 2px solid var(--frame, var(--violet)); border-radius: 18px; background: var(--panel); color: var(--ink);
  width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); box-shadow: var(--drop); }
dialog.sheet::backdrop { background: rgba(5, 4, 15, .6); }
.sheet-in { padding: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; }
.sheet-voice { width: 100%; margin: var(--s3) 0; padding: 12px; font-size: 16px; }
.alarm-edit { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.alarm-edit li { background: var(--bg-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.alarm-edit li.off { opacity: .55; }
.ae-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ae-top input[type=time] { background: var(--edge); border: 2px solid var(--frame, var(--violet)); border-radius: 8px; padding: 4px 6px; font-family: var(--mono); }
.ae-top .tt { display: inline-flex; align-items: center; gap: 4px; }
.ae-snooze select, .ae-new select { background: var(--edge); border: 2px solid var(--frame, var(--violet)); border-radius: 8px; padding: 3px 6px; }
.day-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.day-chips label { position: relative; }
.day-chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.day-chips span { display: block; min-width: 34px; text-align: center; padding: 4px 6px; border-radius: 999px; background: var(--edge); color: var(--dim); font: 700 12px var(--round, var(--mono)); cursor: pointer; }
.day-chips input:checked + span { background: var(--cyan); color: #15122b; }
.day-chips input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--edge); transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
.switch input:checked + span { background: color-mix(in srgb, var(--lime) 45%, var(--edge)); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--lime); }
.switch input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Berichtsheft */
.rh-date { display: flex; align-items: center; gap: 10px; margin: var(--s3) 0; font-size: 17px; }
.rh-talk { display: grid; justify-items: center; gap: var(--s2); padding: var(--s5) var(--s4); margin-bottom: var(--s4); }
.rh-mic { width: 120px; height: 120px; border-radius: 50%; border: 0; font-size: 44px; color: #15122b;
  background: radial-gradient(circle at 35% 30%, #fff 0 10%, var(--cyan) 45%, #1767d6 100%); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
.rh-mic.on { background: radial-gradient(circle at 35% 30%, #fff 0 10%, var(--red) 45%, #a8201f 100%); animation: rh-glow 1.2s ease-in-out infinite; }
@keyframes rh-glow { 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--red) 25%, transparent), 0 8px 24px rgba(0, 0, 0, .45); } }
.rh-timer { font-size: 22px; color: var(--dim); }
.rh-label { display: grid; gap: 6px; margin: var(--s4) 0 var(--s2); font-weight: 800; }
.rh-label textarea { width: 100%; background: var(--edge); border: 2px solid var(--frame, var(--violet)); border-radius: 10px; padding: 10px 12px; font: 15px/1.5 var(--sans); color: var(--ink); }
.rh-week .rh-day { margin: var(--s3) 0; }
.rh-week pre { white-space: pre-wrap; font: 14px/1.5 var(--sans); margin: 4px 0 0; }
.rh-link { display: inline-block; text-decoration: none; margin-top: var(--s3); }
@media (prefers-reduced-motion: reduce) { .rh-mic.on { animation: none; } }

/* Wecker-Banner (aus der Mitteilung geöffnet) */
#alarm-banner { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); z-index: 90;
  display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-radius: 14px;
  background: var(--panel); border: 2px solid var(--gold); box-shadow: var(--drop); max-width: calc(100vw - 24px); }
#alarm-banner b { font-size: 16px; }

/* Gewinn: Chip mit Pfeil und Farbe, klar anders als der große Gesamtwert */
.gain-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 9px; border-radius: 999px;
  font: 800 13px var(--round, var(--mono)); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gain-chip small { font-size: 11px; opacity: .85; }
.gain-chip.up { color: var(--up); background: color-mix(in srgb, var(--up) 16%, transparent); }
.gain-chip.down { color: var(--down); background: color-mix(in srgb, var(--down) 16%, transparent); }
.gain-chip.big { font-size: 16px; padding: 4px 12px; margin-top: var(--s2); }
.warn-ico { color: var(--orange); cursor: help; }
.warn-line { color: var(--orange); font-size: 13px; margin: var(--s2) 0; }
.count-chip { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--panel-2);
  color: var(--dim); font: 800 11px var(--round, var(--mono)); text-align: center; }
.icon-link { background: none; border: 0; color: var(--cyan); font-size: 16px; padding: 2px 6px; line-height: 1; }
.icon-link.overdue { color: var(--red); }
.pos-table.simple td { vertical-align: middle; }
/* Positionen als Zeilen: Titel | Wert über Gewinn | Aktion */
.pos-list { list-style: none; margin: 0 0 var(--s2); padding: 0; }
.pos-row { display: flex; align-items: center; gap: var(--s3); padding: 8px 2px; border-top: 1px dashed var(--panel-2); }
.pos-title { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.pos-nums { display: grid; justify-items: end; gap: 3px; }
.pos-row .icon-link { flex: none; width: 30px; }
.pos-row.lot-row { display: none; padding-left: 16px; font-size: 13px; }
.pos-row.lot-row.open { display: flex; }
.pos-row.lot-row .pos-title { font-weight: 500; color: var(--dim); }
@media (max-width: 600px) {
  .pos-row .gain-chip small { display: none; }  /* Handy: Prozent nur in den Karten */
  .pf-head { padding: 10px; gap: 10px; }
  .pf-body { padding: 0 10px 10px; }
}
.pf-nums { display: grid; justify-items: end; gap: 3px; }
.d-worth { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: var(--s3); }
.d-worth > b { font-size: 26px; color: var(--gold); }
#hist-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2); }
#hist-head .seg { margin-bottom: 0; }

/* Finanzen oben: Zahl, Steuer-Knopf, Depot-Karten, Live-Ticker */
.worth { display: grid; justify-items: start; }
.worth .tax-btn { margin-top: var(--s3); }
.worth .tax-btn.on { border-color: var(--gold); color: var(--gold); }
.pf-cards { display: grid; gap: 10px; margin: var(--s5) 0 var(--s4); }
.pf-card { background: var(--panel); border: 2px solid var(--frame, var(--edge)); border-radius: 14px; box-shadow: var(--drop); overflow: hidden; }
.pf-card.is-reserve { border-style: dashed; }
.pf-head { width: 100%; display: flex; align-items: center; gap: var(--s3); padding: 10px 14px; background: none; border: 0; text-align: left; }
.pf-head:hover { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
.pf-name { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.pf-val { font-size: 17px; }
.pf-body { padding: 0 14px 14px; }
.emblem.pf-emblem { --s: 48px; }
.pf-emblem.chest { width: 48px; height: 48px; display: grid; place-items: center; flex: none; }
.pf-emblem.chest .pf-icon { width: 48px; height: 48px; margin: 0; vertical-align: 0; }
.d-legend .emblem.pf-emblem { --s: 24px; display: inline-grid; vertical-align: middle; margin-right: 6px; filter: none; }
.d-legend .pf-emblem.chest, .d-legend .pf-emblem.chest .pf-icon { width: 24px; height: 24px; }
.live-row { display: flex; align-items: center; gap: var(--s3); margin: var(--s2) 0 var(--s3); }
.live-btn { display: inline-flex; align-items: center; gap: 8px; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.live-btn.on { border-color: var(--lime); color: var(--lime); }
.live-btn.on .live-dot { background: var(--lime); box-shadow: 0 0 0 0 var(--lime); animation: live-pulse 1.6s ease-out infinite; }
@keyframes live-pulse { to { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .live-btn.on .live-dot { animation: none; } }
#alloc-details { margin-bottom: var(--s4); }
#alloc-details .chart-card { margin-top: var(--s3); }
.plan-table .plan-ended { opacity: .55; }
.pf-icon { width: 1.9em; height: 1.9em; vertical-align: -.6em; margin-right: .4em; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .5)); }
.pos-group h3 .pf-icon { width: 2.6em; height: 2.6em; vertical-align: -.95em; }
.pf-icon .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
.pf-icon .t2 { animation-delay: 1.2s; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .pf-icon .twinkle { animation: none; opacity: .8; } }
.reserve b { color: var(--gold); font-family: var(--mono); }
.reserve-edit summary { margin-top: 0; font-size: 11px; }
.reserve-edit .form { margin: var(--s2) 0 var(--s3); }
.num { text-align: right; white-space: nowrap; }

.login { max-width: 380px; margin: 14vh auto 0; text-align: center; }
.login h1 { font-size: 34px; color: var(--gold); text-shadow: 4px 4px 0 var(--pink); }
.login p { color: var(--dim); }
.login form { display: grid; gap: var(--s3); margin-top: var(--s4); }
.press-start { font: 900 14px var(--mono); color: var(--lime); letter-spacing: .2em; animation: blink 1.2s steps(1) infinite; }

/* ---------- Effekte ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--edge); color: var(--ink); border: var(--px) solid var(--gold);
  padding: 10px 14px; font: 700 13px var(--mono); max-width: 92vw; transition: all .2s steps(4);
  display: flex; gap: var(--s3); align-items: center; box-shadow: 4px 4px 0 #000;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { background: none; border: 0; color: var(--cyan); font-weight: 800; padding: 0; text-decoration: underline; }
@media (min-width: 900px) { #toast { bottom: var(--s5); } }

.px { position: fixed; width: 7px; height: 7px; z-index: 70; pointer-events: none; animation: px .7s ease-out forwards; }
@keyframes px { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

.levelup {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; pointer-events: none;
  font: 900 clamp(34px, 9vw, 84px) var(--mono); color: var(--gold); letter-spacing: .08em;
  text-shadow: 6px 6px 0 var(--edge), -3px -3px 0 var(--pink);
  animation: levelup 2.4s steps(24) forwards;
}
@keyframes levelup { 0% { opacity: 0; transform: scale(.3); } 15%, 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.shake { animation: shake .35s steps(6); }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .loot, .xp-float, .levelup, .px { display: none; }
}

/* ---------- Finanzen & Diagramme ---------- */
.warn-box { background: color-mix(in srgb, var(--red) 14%, var(--bg-2)); border: 2px solid var(--red); padding: var(--s2) var(--s3); font-size: 13px; }
.fin-grid { display: grid; gap: 22px 18px; margin-top: var(--s5); }
@media (min-width: 1000px) { .fin-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; } }
.chart-head { margin-bottom: var(--s3); min-height: 30px; font: 700 13px var(--mono); }
.chart-card.max {
  position: fixed; inset: 0; z-index: 45; overflow: auto; margin: 0;
  padding: 0 max(var(--s4), env(safe-area-inset-right)) var(--s6) max(var(--s4), env(safe-area-inset-left));
}
.chart-card.max .ptitle { position: sticky; top: 0; z-index: 1; padding-top: calc(7px + env(safe-area-inset-top)); }
.chart-card.max .donut { width: min(520px, 90vw); }
body.noscroll { overflow: hidden; }

.donut { position: relative; width: min(300px, 100%); margin: 0 auto var(--s3); aspect-ratio: 1; }
.donut svg { width: 100%; height: 100%; display: block; }
.donut .slice { stroke: var(--panel); stroke-width: 2; cursor: pointer; transition: opacity .15s; }
.donut .slice:hover, .donut .slice:focus-visible { opacity: .82; outline: none; stroke: var(--ink); }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center small { color: var(--dim); font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; }
.donut-center b { font: 900 clamp(15px, 4vw, 20px) var(--mono); }

.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.legend button {
  width: 100%; display: flex; align-items: center; gap: var(--s2); text-align: left;
  background: none; border: 0; padding: 6px 4px; font-size: 13px; border-bottom: 1px dashed var(--panel-2);
}
.legend button:not(:disabled):hover { background: var(--panel-2); }
.legend button:disabled { cursor: default; opacity: 1; }
.legend i { flex: 0 0 12px; height: 12px; border: 2px solid var(--edge); }
.legend .muted { min-width: 52px; text-align: right; }
.legend.inline { display: flex; flex-wrap: wrap; gap: var(--s4); margin-bottom: var(--s2); font: 700 12px var(--mono); }
.legend.inline li { display: flex; align-items: center; gap: 6px; }
.legend.inline i { flex: 0 0 18px; height: 0; border: 0; border-top: 3px solid var(--c); }
.legend.inline i.dash { border-top-style: dashed; }

svg .gridline { stroke: var(--panel-2); stroke-width: 1; }
svg .axis { fill: var(--dim); font: 11px var(--mono); }
svg .cross line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; }
svg .cross circle { stroke: var(--panel); stroke-width: 2; }
svg .hit { cursor: crosshair; outline: none; }
svg .hit:focus-visible { stroke: var(--gold); stroke-width: 2; }
.chart-tip {
  position: fixed; z-index: 90; pointer-events: none; display: none; max-width: 260px;
  background: var(--edge); color: var(--ink); border: 2px solid var(--gold);
  padding: 6px 10px; font: 12px/1.5 var(--mono); box-shadow: 3px 3px 0 #000;
}
.chart-tip .sw { display: inline-block; width: 8px; height: 8px; margin-right: 4px; }

.table-wrap { overflow-x: auto; margin: var(--s2) 0; }
.pos-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pos-table th { font: 700 11px var(--mono); color: var(--dim); text-transform: uppercase; text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--panel-2); white-space: nowrap; }
.pos-table td { padding: 8px; border-bottom: 1px dashed var(--panel-2); vertical-align: top; }
.pos-table th.num, .pos-table td.num { text-align: right; }
.pos-group { background: var(--panel); border: var(--px) solid var(--edge); box-shadow: var(--drop); padding: var(--s3) var(--s4); }
.pos-group h3 { color: var(--orange); }
.chart-card.max .legend, .chart-card.max .table-wrap { max-width: 900px; margin-left: auto; margin-right: auto; }

/* ---------- Quests ---------- */
.quest-grid { display: grid; gap: 22px 18px; margin: var(--s4) 0; }
@media (min-width: 900px) { .quest-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
.bcount.late { background: var(--red); color: var(--edge); }
.bcount.soon { background: var(--orange); color: var(--edge); }
.add-quest { margin: var(--s4) 0; }
.project { background: var(--panel); border: var(--px) solid var(--edge); box-shadow: var(--drop); padding: var(--s3) var(--s4); margin-top: 22px; }
.project.paused { opacity: .6; }
.project-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.project-head h2 { margin: 0; }
.project-head select { background: var(--edge); border: 2px solid var(--violet); padding: 4px 8px; font: 700 12px var(--mono); }
.project .bar { margin-top: var(--s2); }
.edit-row { display: block !important; }

/* ---------- Woche ---------- */
.bar.load { margin: var(--s2) 0 var(--s4); height: 12px; }
.bar.load span { background: var(--gold); }
.recs { margin-bottom: var(--s4); }
.rec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.rec { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2); background: var(--bg-2); border-left: 4px solid var(--cyan); font-size: 14px; }
.rec.critical { border-color: var(--red); }
.rec.warning { border-color: var(--orange); }
.rec-tag { font: 800 11px var(--mono); text-transform: uppercase; white-space: nowrap; padding-top: 2px; min-width: 88px; }
.rec.critical .rec-tag { color: var(--red); } .rec.warning .rec-tag { color: var(--orange); } .rec.info .rec-tag { color: var(--cyan); }
.week-nav { margin-bottom: var(--s3); }
.week-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .week-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1800px) { .week-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.daycard { background: var(--panel); border: var(--px) solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: var(--s2) var(--s3) var(--s3); min-width: 0; }
.daycard.today { box-shadow: inset 0 0 0 2px var(--gold), 4px 4px 0 var(--edge); }
.daycard header { display: flex; justify-content: space-between; align-items: center; font: 800 13px var(--mono); text-transform: uppercase; margin-bottom: var(--s2); }
.daycard .lv { font-size: 10px; padding: 1px 6px; }
.evs, .blocks { list-style: none; margin: 0 0 var(--s2); padding: 0; display: grid; gap: 4px; }
.ev { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: baseline; font-size: 13px;
  background: var(--bg-2); padding: 4px 6px; border-left: 3px solid var(--violet); }
.ev .grow { grid-column: 1 / -1; overflow-wrap: break-word; }
.ev > .src, .ev > button { grid-column: 2; grid-row: 1; }
.ev.own { border-color: var(--pink); } .ev.plan { border-color: var(--lime); }
.ev-time { font: 700 11px var(--mono); color: var(--dim); white-space: nowrap; }
.ev .src { font: 10px var(--mono); color: var(--dim); }
.cap { margin: var(--s2) 0; } .cap .bar { height: 6px; } .cap .bar span { background: var(--gold); }
.block { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: start; font-size: 13px;
  padding: 4px 0; border-bottom: 1px dashed var(--panel-2); }
.block .grow { overflow-wrap: break-word; hyphens: auto; }
.block .check { width: 22px; height: 22px; }
.block .mins { font: 700 11px var(--mono); color: var(--gold); white-space: nowrap; }
.block .kind { font: 700 10px var(--mono); color: var(--lime); text-transform: uppercase; }

/* ---------- Persönliches Projekt ---------- */
.mission { margin-top: 22px; }
.mission .ptitle select { background: var(--edge); color: var(--ink); border: 0; font: 700 11px var(--mono); padding: 2px 4px; }
.mission.pausiert { opacity: .65; }
.mission-head { display: flex; gap: var(--s4); align-items: flex-start; flex-wrap: wrap; }
.why { font-style: italic; color: var(--dim); margin: 0 0 var(--s2); }
.ring-pct {
  flex: 0 0 96px; height: 96px; border-radius: 50%; display: grid; place-content: center; text-align: center;
  background: conic-gradient(var(--pink) calc(var(--p) * 1%), var(--edge) 0);
  box-shadow: 4px 4px 0 var(--edge); position: relative;
}
.ring-pct::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--panel); }
.ring-pct b, .ring-pct small { position: relative; font-family: var(--mono); }
.ring-pct b { font-size: 22px; } .ring-pct small { color: var(--dim); font-size: 11px; }
.primary.big { width: 100%; padding: 12px; font-size: 15px; margin: var(--s3) 0; }
.path { list-style: none; margin: var(--s4) 0; padding: 0; position: relative; }
.path::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 4px; background: var(--panel-2); }
.node { position: relative; display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2) 0; }
.node .dot {
  position: relative; z-index: 1; flex: 0 0 34px; height: 34px; border-radius: 50%; padding: 0;
  background: var(--edge); border: 3px solid var(--dim); color: var(--edge); font: 900 16px var(--mono);
}
.node.done .dot { background: var(--pink); border-color: var(--edge); }
.node.done b { color: var(--dim); text-decoration: line-through; }
.node.next .dot { border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 30%, transparent); }
.next-tag { display: inline-block; font: 800 10px var(--mono); background: var(--gold); color: var(--edge); padding: 1px 6px; margin-right: 6px; text-transform: uppercase; }
.step-tools { display: flex; gap: var(--s2); white-space: nowrap; }

/* ---------- Ausbildung ---------- */
.school-stats { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: var(--s4) 0; }
@media (min-width: 900px) { .school-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--panel); border: var(--px) solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: var(--s3); display: grid; gap: 2px; }
.stat small { font: 700 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.stat b { font: 900 26px var(--mono); }
.g-good { color: var(--lime); } .g-ok { color: var(--gold); } .g-bad { color: var(--red); }
.mini-bars { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
.mini-bars span { flex: 1; min-height: 2px; background: var(--lime); }
.subject-filter { margin-bottom: var(--s3); }
.kind-tag { font: 800 10px var(--mono); text-transform: uppercase; padding: 1px 5px; background: var(--panel-2); }
.k-test, .k-prüfung { background: var(--red); color: var(--edge); }
.k-projekt { background: var(--violet); color: var(--edge); }
.grade-form { display: flex; gap: 6px; margin-top: 6px; }
.grade-form input { width: 64px; background: var(--edge); border: 2px solid var(--violet); padding: 3px 6px; font-family: var(--mono); }
.subject-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.subject-card {
  display: grid; grid-template-columns: 1fr auto; gap: 6px var(--s3); align-items: center; text-align: left;
  background: var(--panel); border: var(--px) solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: var(--s3);
}
.subject-card .meta { display: block; }
.subject-card .mini-bars { grid-column: 1 / -1; height: 18px; }
.subject-card.on { box-shadow: inset 0 0 0 2px var(--lime), 4px 4px 0 var(--edge); }
.subject-card.add { grid-template-columns: 1fr; }
.subject-card.add input { background: var(--edge); border: 2px solid var(--violet); padding: 8px; font-family: var(--mono); }
.grade-big { font: 900 24px var(--mono); }
.grade-big small { font-size: 13px; margin-left: 3px; }
.grade-badge { flex: 0 0 48px; text-align: center; font: 900 16px var(--mono); background: var(--edge); padding: 4px 0; }
.file-ico { flex: 0 0 38px; font: 800 10px var(--mono); text-align: center; background: var(--violet); color: var(--edge); padding: 6px 0; }

/* ---------- HUD-Zusatzkacheln ---------- */
.cal-day { margin-bottom: var(--s2); }
.cal-day > b { font: 800 12px var(--mono); text-transform: uppercase; color: var(--dim); }
.cal-day.today > b { color: var(--gold); }
.ring-pct.small { flex-basis: 64px; height: 64px; }
.ring-pct.small::before { inset: 8px; }
.ring-pct.small b { font-size: 15px; }
.hbtn.pink { border-color: var(--pink); }
.school-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-bottom: var(--s3); }
.school-mini small { display: block; font: 700 10px var(--mono); color: var(--dim); text-transform: uppercase; }
.school-mini b { font: 900 20px var(--mono); }
.p-quests .rec, .p-school .rec { margin: 0 0 var(--s3); }

/* Navigation: auf dem iPhone seitlich wischbar */
@media (max-width: 899px) {
  .tabs { justify-content: flex-start; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; padding: var(--s2) 12px; scroll-snap-align: start; }
}
.win-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 6.5em) minmax(0, 6.5em); gap: var(--s2); align-items: center; }
.win-row label { display: flex; gap: 8px; align-items: center; }
.win-row input[type=time] { padding: 8px 4px; min-width: 0; }

/* ---------- Antwort und Sprachausgabe ---------- */
.transcript .answer {
  display: block; margin: var(--s3) auto 0; padding: var(--s3); max-width: 52ch; text-align: left;
  font-style: normal; color: var(--ink); background: var(--bg-2); border: 2px solid var(--cyan);
  box-shadow: 3px 3px 0 var(--edge); position: relative;
}
.transcript .answer::before { content: ""; position: absolute; top: -9px; left: 50%; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--cyan); transform: translateX(-50%); }
.talking .ring { border-color: var(--cyan); border-style: solid; animation: pulse .5s steps(3) infinite; }
.talking .knorz .kz-smile { opacity: 0; }
.talking .knorz .kz-open { opacity: 1; animation: kz-talk .16s ease-in-out infinite alternate; }
@keyframes kz-talk { from { transform: scaleY(.2); } to { transform: scaleY(.85); } }
/* Server-Stimme: Mund folgt der echten Lautstärke */
.talking.lipsync .knorz .kz-open { animation: none; transform: scaleY(calc(.12 + var(--lvl, 0) * 1.1)); transition: transform .05s linear; }

/* ---------- Gesundheit ---------- */
@media (min-width: 1100px) { .quest-grid.health-grid { grid-template-columns: 1.3fr 1fr 1fr; } }
.sleep-chart { width: 100%; height: auto; display: block; margin: var(--s2) 0; }
.sleep-chart .sc-bar { fill: #3987e5; }
.sleep-chart .sc-gap { fill: var(--dim); opacity: .5; }
.sleep-chart .sc-grid { stroke: var(--ink); opacity: .1; }
.sleep-chart .sc-target { stroke: var(--ink); stroke-dasharray: 5 4; opacity: .7; }
.sleep-chart .sc-axis { fill: var(--dim); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
.quality { margin: 0; }
.quality label { cursor: pointer; position: relative; }
.form .quality input { position: absolute; inset: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.quality span { display: block; background: var(--panel-2); border: 2px solid var(--edge); padding: 4px 8px; font: 700 12px var(--mono); color: var(--dim); }
.quality input:checked + span { background: var(--violet); color: var(--edge); }
.quality input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.callout { animation: callout 1.6s ease-out 1; }
@keyframes callout { 0%, 40% { box-shadow: 0 0 0 4px var(--gold), var(--drop); } }
.hl-row { display: flex; align-items: center; gap: var(--s2); padding: 6px 0; border-bottom: 1px dashed color-mix(in srgb, var(--dim) 30%, transparent); }
.hl-row small { display: block; color: var(--dim); font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.hl-row b { display: block; overflow-wrap: anywhere; }
.ok-mark { color: var(--lime); font: 900 20px var(--mono); padding: 0 6px; }
.p-health .part { margin-top: var(--s3); }

/* ---------- News ---------- */
.news-grid { display: grid; gap: 22px 18px; margin: var(--s4) 0; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 720px) { .news-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1300px) { .news-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
.news-col { --accent: var(--cyan); }
.news-col:nth-child(4n+2) { --accent: var(--orange); }
.news-col:nth-child(4n+3) { --accent: var(--lime); }
.news-col:nth-child(4n+4) { --accent: var(--violet); }
.muted-inv { font: 600 11px var(--sans); text-transform: none; letter-spacing: 0; opacity: .8; }
.digest { margin: 0; padding-left: 1.3em; display: grid; gap: var(--s3); }
.digest p { margin: 0; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 12px; }
.srcs a { color: var(--dim); }
.headlines { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); font-size: 14px; }
.headlines a { color: var(--ink); text-decoration: none; }
.headlines a:hover, .headlines a:focus-visible { text-decoration: underline; }
.news-tops { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); font-size: 14px; }
.news-tops a { color: var(--ink); }
.news-tops .kind-tag { margin-right: 4px; }

/* ---------- Einstellungen: Mitteilungen ---------- */
.check-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.check-row input[type=number] { width: 4.5em; }
.check-row input[type=time] { width: auto; }
.wake-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wake-grid label { display: grid; gap: 2px; font: 700 11px var(--mono); color: var(--dim); text-align: center; }
.wake-grid input { width: 100%; min-width: 0; padding: 6px 2px; font-size: 12px; }
@media (max-width: 560px) { .wake-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.howto { padding-left: 1.2em; display: grid; gap: var(--s2); font-size: 14px; }
code { font: 12px var(--mono); background: var(--edge); padding: 1px 4px; overflow-wrap: anywhere; }

/* ---------- Jarvis: nur ein Licht (Arcade-Design) ----------
   ruhig: atmet langsam · freihändig: Halo pulst · hört: hell, wächst mit dem Pegel (--lvl)
   denkt: kreisender Lichtbogen · spricht: pulsiert mit der Stimme · fertig: grüner Blitz · Fehler: rot */
[data-skin="spiel"] .p-voice .ring, [data-skin="spiel"] .p-voice .meter { display: none; }
[data-skin="spiel"] .p-voice:not([data-state="rec"]) .timer { display: none; }
[data-skin="spiel"] .mic-wrap { width: 190px; height: 190px; }
[data-skin="spiel"] .mic, [data-skin="spiel"] .mic:active {
  inset: 0; background: none; border: 0; box-shadow: none; transform: none; border-radius: 50%;
}
.orb { --c1: #d9fbff; --c2: #3ee8ff; --c3: #1767d6; --s: 1; position: relative; width: 132px; height: 132px; display: block;
  transform: scale(var(--s)); transition: transform .08s linear; }
.orb i { position: absolute; border-radius: 50%; }
.orb-core { inset: 16.5%; background: radial-gradient(circle at 42% 38%, var(--c1) 0 12%, var(--c2) 42%, var(--c3) 78%, transparent 100%);
  box-shadow: 0 0 28px 6px color-mix(in srgb, var(--c2) 70%, transparent), 0 0 70px 16px color-mix(in srgb, var(--c3) 45%, transparent);
  animation: orb-breathe 4s ease-in-out infinite; }
.orb-halo { inset: 3%; border: 2px solid color-mix(in srgb, var(--c2) 50%, transparent); opacity: 0; }
.orb-spin { inset: 7.5%; border: 3px solid transparent; opacity: 0; }
@keyframes orb-breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: .85; transform: scale(1); } }
@keyframes orb-halo { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes orb-rot { to { transform: rotate(360deg); } }
@keyframes orb-flash { 0% { filter: brightness(1.8); } 100% { filter: none; } }

.handsfree .orb-halo { animation: orb-halo 2.4s ease-out infinite; }
.hf-hear .orb, [data-state="rec"] .orb { --c1: #ffffff; --s: calc(1 + var(--lvl, 0) * .3); }
.hf-hear .orb-core, [data-state="rec"] .orb-core { animation: none; opacity: 1; }
[data-state="rec"] .orb-halo { animation: orb-halo 1.2s ease-out infinite; }
[data-state="busy"] .orb { --c2: #7fb2ff; --c3: #6a3fd6; }
[data-state="busy"] .orb-core { animation: orb-breathe 1.2s ease-in-out infinite; }
[data-state="busy"] .orb-spin { opacity: 1; border-top-color: #d9fbff; border-right-color: color-mix(in srgb, #d9fbff 40%, transparent); animation: orb-rot .9s linear infinite; }
[data-state="done"] .orb { --c2: #7dffb0; --c3: #10a860; }
[data-state="done"] .orb-core { animation: orb-flash .8s ease-out 1, orb-breathe 4s ease-in-out .8s infinite; }
[data-state="error"] .orb { --c1: #ffd0d0; --c2: #ff5c5c; --c3: #a8201f; }
.talking[data-state] .orb { --c1: #ffffff; --c2: #3ee8ff; --c3: #1767d6; --s: calc(1 + var(--lvl, 0) * .22); }
.talking:not(.lipsync) .orb-core { animation: orb-breathe .5s ease-in-out infinite; }
.talking.lipsync .orb-core { animation: none; opacity: 1; }
.log-box { text-align: left; }
.log-box summary { margin-top: var(--s3); font-size: 12px; }
.hf-row { display: flex; justify-content: center; margin-top: var(--s2); }
.hf-row button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
@media (prefers-reduced-motion: reduce) { .orb i { animation: none !important; } }

/* =====================================================================
   Design "Spiel-HUD" (Standard): Leben als Charakterbogen.
   Verspielt in Rahmen, Symbolen und Balken, nüchtern in Zahlen und Texten.
   ===================================================================== */
/* ================= Jarvis: Personal AI Operating Layer (html[data-skin="spiel"]) =================
   Jarvis als zentraler Knoten, Bereiche als Speichen. Dunkles Navy/Schwarz, Cyan/Violett nur für
   Primäres, je Bereich eine eigene Farbe (--c aus AREAS) als Oberkante und Symbolfarbe, Zahlen in
   Monospace. Keine Metall-Embleme, keine Beute-Effekte (die bleiben dem Knorz-Design). */
html[data-skin="spiel"] {
  --bg: #05070c; --bg-2: #080b14; --panel: #0d1220; --panel-2: #141b2e; --edge: #02030a;
  --ink: #e6edf7; --dim: #8a97b0;
  --cyan: #4cd3e0; --violet: #8b7fff; --pink: #e06fc0; --lime: #5fd9a0; --gold: #f2c14e; --red: #ff6b7a; --orange: #f59e4a;
  --up: #5fd9a0; --down: #ff6b7a;
  --round: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --sans: var(--round);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --drop: 0 10px 30px rgba(0, 0, 0, .45);
  --frame: rgba(120, 150, 200, .16);
  --hub-accent: #4cd3e0;
  --glow: 0 0 0 1px rgba(76, 211, 224, .18), 0 0 24px rgba(76, 211, 224, .10);
  --grad: linear-gradient(120deg, #4cd3e0, #8b7fff);
}
[data-skin="spiel"] body {
  background:
    radial-gradient(900px 480px at 50% -10%, rgba(76, 211, 224, .10), transparent 65%),
    radial-gradient(700px 420px at 100% 110%, rgba(139, 127, 255, .10), transparent 60%),
    linear-gradient(rgba(120, 150, 200, .035) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(90deg, rgba(120, 150, 200, .035) 1px, transparent 1px) 0 0 / 32px 100%,
    var(--bg);
}
[data-skin="spiel"] body::after { display: none; }
[data-skin="spiel"] a { color: var(--cyan); }
[data-skin="spiel"] h1 { font: 700 26px/1.2 var(--sans); letter-spacing: -.01em; text-transform: none; text-shadow: none; }
[data-skin="spiel"] h2 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .16em; color: var(--dim); }
[data-skin="spiel"] h2::before { content: none; }
[data-skin="spiel"] .tabs { background: rgba(8, 11, 20, .88); border-color: var(--frame); backdrop-filter: blur(10px); }
[data-skin="spiel"] .tabs button { font: 600 12px var(--sans); text-transform: none; letter-spacing: .02em; border-radius: 9px; color: var(--dim); }
[data-skin="spiel"] .tabs button.active { background: rgba(76, 211, 224, .12); color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(76, 211, 224, .45); }
[data-skin="spiel"] .tabs .brand { font: 700 18px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0 12px rgba(76, 211, 224, .5); }
[data-skin="spiel"] .panel {
  border-radius: 14px; border: 1px solid var(--frame); border-top: 2px solid var(--accent);
  background: linear-gradient(180deg, rgba(20, 27, 46, .92), rgba(13, 18, 32, .92)); box-shadow: var(--drop);
}
[data-skin="spiel"] .ptitle {
  border-radius: 12px 12px 0 0; border-bottom: 1px solid var(--frame); background: transparent; color: var(--dim);
  font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase;
}
[data-skin="spiel"] .ptitle > span:first-child { color: color-mix(in srgb, var(--accent) 75%, var(--ink)); }
[data-skin="spiel"] .ptitle a, [data-skin="spiel"] .ptitle button { color: var(--dim); font: 600 12px var(--sans); }
[data-skin="spiel"] .primary, [data-skin="spiel"] .btn.primary {
  border: 0; border-radius: 10px; background: var(--grad); color: #04121a; font: 700 13px var(--sans);
  box-shadow: 0 0 18px rgba(76, 211, 224, .25);
}
[data-skin="spiel"] .ghost, [data-skin="spiel"] .icon-btn {
  border-radius: 10px; background: rgba(20, 27, 46, .9); border: 1px solid var(--frame); color: var(--ink); box-shadow: none; font: 600 13px var(--sans);
}
[data-skin="spiel"] .form input, [data-skin="spiel"] .form select, [data-skin="spiel"] .form textarea, [data-skin="spiel"] .console {
  border-radius: 10px; border: 1px solid var(--frame); background: #070a12;
}
[data-skin="spiel"] .form input:focus, [data-skin="spiel"] .form select:focus, [data-skin="spiel"] .form textarea:focus { border-color: var(--cyan); box-shadow: var(--glow); }
[data-skin="spiel"] .stat { border-radius: 14px; border: 1px solid var(--frame); box-shadow: var(--drop); }
[data-skin="spiel"] .stat b, [data-skin="spiel"] .num { font-family: var(--mono); font-weight: 600; letter-spacing: -.02em; }
[data-skin="spiel"] .kind-tag { border-radius: 6px; }
[data-skin="spiel"] .check, [data-skin="spiel"] .hbtn { border-radius: 7px; }
[data-skin="spiel"] .p-voice { --accent: var(--cyan); }
[data-skin="spiel"] .loot-layer, [data-skin="spiel"] .xp-float, [data-skin="spiel"] .levelup, [data-skin="spiel"] .px { display: none; }

/* Knoten statt Emblem: Ring in Bereichsfarbe, Strich-Symbol, leichter Schein */
[data-skin="spiel"] .emblem { filter: none; }
[data-skin="spiel"] .emblem::before {
  clip-path: none; border-radius: 50%; inset: 0; background: none;
  border: 1.5px solid color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 28%, transparent);
}
[data-skin="spiel"] .emblem::after {
  clip-path: none; border-radius: 50%; inset: 4px; box-shadow: none;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 18%, #0d1220), #0a0e19 75%);
}
[data-skin="spiel"] .emblem .sym { color: var(--c); width: 50%; height: 50%; }
[data-skin="spiel"] .emblem.pf-emblem .sym { color: var(--c); }

/* Speichen-Kacheln: dunkles Panel, farbige Oberkante statt Rahmen */
[data-skin="spiel"] .hub-tile {
  border-radius: 14px; border: 1px solid var(--frame); border-top: 2px solid var(--c);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, #0d1220), #0a0e19);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
}
[data-skin="spiel"] .hub-tile:hover { border-color: color-mix(in srgb, var(--c) 45%, transparent); border-top-color: var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 18%, transparent); }
[data-skin="spiel"] .hub-tile.active { outline: 1px solid var(--c); outline-offset: 2px; }
[data-skin="spiel"] .hub-tile:focus-visible { outline: 2px solid var(--cyan); }
[data-skin="spiel"] .t-name { font: 600 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
[data-skin="spiel"] .t-val { font-family: var(--mono); font-weight: 600; letter-spacing: -.03em; }
[data-skin="spiel"] .t-val small { font: 500 14px var(--mono); }

/* Balken: dünn, leuchtend, ohne Glanzkante */
[data-skin="spiel"] .gbar { height: 6px; border-radius: 3px; background: rgba(120, 150, 200, .12); box-shadow: none; }
[data-skin="spiel"] .gbar i { border-radius: 3px; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }

/* Statuszeile oben statt Spielerkarte */
[data-skin="spiel"] .player-card {
  border-radius: 14px; border: 1px solid var(--frame); background: linear-gradient(120deg, rgba(76, 211, 224, .08), rgba(139, 127, 255, .08)), #0a0e19;
  box-shadow: var(--drop);
}
[data-skin="spiel"] .pc-name { font: 700 13px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
[data-skin="spiel"] .pc-prog b { font-family: var(--mono); font-weight: 600; }

/* Jarvis-Kern in der Mitte: Ringe wie ein Knoten mit Verbindungen */
[data-skin="spiel"] .hub .p-voice { position: relative; isolation: isolate; border-top-color: var(--cyan); background: radial-gradient(circle at 50% 42%, rgba(76, 211, 224, .12), transparent 60%), #0a0e19; }
[data-skin="spiel"] .hub .p-voice::before {
  content: ""; position: absolute; inset: 12%; z-index: -1; border-radius: 50%; pointer-events: none;
  border: 1px dashed rgba(76, 211, 224, .22); box-shadow: 0 0 0 28px rgba(139, 127, 255, .03);
}

/* Zahlen: schlicht, fett, gerundet, gleich breit, ohne Effekte */
.num { font-family: var(--round, var(--mono)); font-weight: 800; font-variant-numeric: tabular-nums; }
.num.veil { letter-spacing: .12em; }

/* ---------- Embleme: abgeschrägter Metallrahmen, Innenkante, farbiger Innenbereich ---------- */
.emblem {
  --s: 52px; --cham: polygon(22% 0, 78% 0, 100% 22%, 100% 78%, 78% 100%, 22% 100%, 0 78%, 0 22%);
  position: relative; width: var(--s); height: var(--s); flex: none; display: grid; place-items: center;
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .45));
}
.emblem.big { --s: 76px; }
.emblem::before, .emblem::after { content: ""; position: absolute; clip-path: var(--cham); }
.emblem::before { inset: 0; background: linear-gradient(160deg, #c3cadc, #6a7190 42%, #373d5a); }
.emblem::after {
  inset: 4px; background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--c) 62%, #fff), var(--c) 52%, color-mix(in srgb, var(--c) 58%, #000));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .4), inset 0 -3px 0 rgba(0, 0, 0, .28);
}
.emblem .sym { position: relative; z-index: 1; width: 54%; height: 54%; color: var(--ic, #15122b); }

/* ---------- Balken: dick, abgerundet, Glanzkante, dunkle Rinne ---------- */
.gbar {
  --c: var(--hub-accent); position: relative; display: flex; width: 100%; height: 14px; border-radius: 8px; overflow: hidden;
  background: color-mix(in srgb, var(--c) 14%, #0b0a1a); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .6);
}
.gbar i {
  display: block; height: 100%; width: 0; border-radius: 8px; transition: width .35s cubic-bezier(.2, .7, .3, 1);
  background: linear-gradient(color-mix(in srgb, var(--c) 55%, #fff) 0 2px, var(--c) 2px, color-mix(in srgb, var(--c) 78%, #000));
}
.gbar.stack { gap: 2px; background: #0b0a1a; }
.gbar.stack i { border-radius: 0; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .28); }

/* ---------- Spielerkarte ---------- */
.player-card {
  margin-bottom: 16px; padding: 16px 18px; border-radius: 16px; border: 2px solid var(--frame);
  background: linear-gradient(135deg, #332b6b, #231e48 60%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), var(--drop);
  display: grid; gap: 8px;
}
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pc-name { display: block; font: 800 22px var(--round, var(--sans)); }
.pc-date { color: var(--dim); font-size: 14px; }
.pc-tools { display: flex; gap: 8px; }
.pc-prog { display: flex; justify-content: space-between; align-items: baseline; color: var(--dim); font-size: 14px; }
.pc-prog b { color: var(--ink); font-size: 18px; }
.player-card .gbar { height: 18px; border-radius: 10px; }

/* ---------- Hub-Raster: iPhone 2 Spalten, breiter 3, ab ~1000px 4 mit Jarvis in der Mitte ---------- */
.hub-main { container: hub / inline-size; min-width: 0; }
.hub { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hub .p-voice { grid-area: auto; grid-column: 1 / -1; }
.hub > .hub-tile:last-child { grid-column: 1 / -1; }  /* 9 Kacheln in 2 Spalten: die letzte über die ganze Breite */
@container hub (min-width: 640px) { .hub { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hub > .hub-tile:last-child { grid-column: auto; } }
@container hub (min-width: 980px) {
  .hub { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; }
  .hub .p-voice { grid-column: 2 / span 2; grid-row: 1 / span 3; }
  /* je drei Kacheln links und rechts von Jarvis, die letzten drei darunter (mittlere breit) */
  .hub > .hub-tile:nth-last-child(3) { grid-area: 4 / 1; }
  .hub > .hub-tile:nth-last-child(2) { grid-area: 4 / 2 / 5 / 4; }
  .hub > .hub-tile:last-child { grid-area: 4 / 4; }
}

/* Ausbildungs-Spalte */
.tr-year { margin: var(--s3) 0 var(--s4); padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 2px solid var(--frame, var(--edge)); }
.ty-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ty-head b { font: 800 16px var(--round, var(--sans)); }
.ty-bar { position: relative; height: 14px; margin: 10px 0 6px; border-radius: 7px; background: var(--edge); overflow: visible; }
.ty-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--cyan); min-width: 4px; }
.ty-bar u { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--gold); transform: translateX(-1px); }
.ty-nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
.ty-nums span { display: grid; font-size: 12px; color: var(--dim); }
.ty-nums b { font: 800 20px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; justify-self: start; text-align: left; }
.ty-nums b small { font-size: 12px; color: var(--dim); }
.ty-nums .warn b { color: var(--red); }
#ty-project { margin-bottom: 22px; }
#ty-project select { max-width: 110px; }
.tr-week { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: var(--s3) 0; }
.tr-chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; font: 800 14px var(--round, var(--mono));
  background: var(--panel-2); border: 2px solid var(--frame, var(--edge)); }
.tr-chip.werkstatt { border-color: #c8793a; }
.tr-chip.schule { border-color: #3b82f6; }
.tr-next { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
.tr-next .tr-chip { opacity: .75; font-size: 12px; padding: 3px 10px; }
.tr-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 var(--s4); text-decoration: none; color: inherit; }
.tr-day { display: grid; justify-items: center; padding: 4px 0; border-radius: 10px; background: var(--panel); border: 2px solid transparent; }
.tr-day small { font: 700 10px var(--round, var(--mono)); color: var(--dim); }
.tr-day b { font: 800 14px var(--round, var(--mono)); }
.tr-day i { font-style: normal; font-size: 13px; line-height: 1.2; }
.tr-day.werkstatt { background: color-mix(in srgb, #c8793a 22%, var(--panel)); }
.tr-day.schule { background: color-mix(in srgb, #3b82f6 22%, var(--panel)); }
.tr-day.frei { opacity: .6; }
.tr-day.today { border-color: var(--gold); }
.tr-report { margin-bottom: 22px; }
.tr-report .rh-talk { padding: var(--s3) 0; }
.tr-grid { display: grid; gap: 22px 18px; margin-bottom: 22px; }
@media (min-width: 900px) { .tr-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
.tr-add { margin-top: var(--s3); }
.ptitle [data-tr-voice] { font-size: 20px; text-decoration: none; line-height: 1; padding: 0 4px; }
.tr-arch { margin: var(--s2) 0; }
.rh-dots { display: inline-flex; gap: 5px; align-items: center; }
.rh-dots i { width: 11px; height: 11px; border-radius: 50%; background: rgba(0, 0, 0, .25); border: 2px solid rgba(0, 0, 0, .35); }
.rh-dots i.done { background: var(--lime); border-color: var(--lime); }
.rh-dots i.half { background: var(--gold); border-color: var(--gold); }
.rh-dots i.miss { border-color: var(--red); }
.rh-dots.big i { width: 18px; height: 18px; }
.detail .rh-dots i { background: var(--edge); }
.detail .rh-dots i.done { background: var(--lime); }
.detail .rh-dots i.half { background: var(--gold); }
.hub-tile {
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "em name" "val val" "sub sub" "bar bar";
  align-items: center; gap: 8px 10px; padding: 14px; text-align: left; color: var(--ink); cursor: pointer; min-width: 0;
  border-radius: 16px; border: 2px solid color-mix(in srgb, var(--c) 38%, var(--frame, #3d3872));
  background: linear-gradient(#2b2653, #221e45);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 6px 14px rgba(0, 0, 0, .35);
  transition: transform .09s ease-out, box-shadow .09s;
}
.hub-tile:hover { border-color: color-mix(in srgb, var(--c) 70%, var(--frame, #3d3872)); }
.hub-tile:active { transform: scale(.965); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 2px 6px rgba(0, 0, 0, .35); }
.hub-tile.active { outline: 3px solid var(--c); outline-offset: 2px; }
.hub-tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.hub-tile .emblem { grid-area: em; }
.t-name { grid-area: name; font: 700 15px var(--round, var(--sans)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-val { grid-area: val; font-size: 34px; line-height: 1; margin-top: 4px; white-space: nowrap; }
.t-val small { font: 700 18px var(--round, var(--sans)); color: var(--dim); margin-left: 2px; }
.t-sub { grid-area: sub; font-size: 13px; color: var(--dim); min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hub-tile .gbar { grid-area: bar; }
.late, .loss { color: var(--red); }
.gain { color: #5fd98a; }
/* Schmale Kacheln (iPhone): Emblem neben der Zahl, Name darunter, nichts abgeschnitten */
@container hub (max-width: 560px) {
  .hub-tile { grid-template-areas: "em val" "name name" "sub sub" "bar bar"; padding: 12px; gap: 6px 10px; }
  .hub-tile .emblem { --s: 48px; }
  .t-val { font-size: 32px; margin-top: 0; }
  .t-name { white-space: normal; font-size: 15px; }
}

/* ---------- Detailansicht: iPhone Vollbild von rechts, ab 1024px Seitenpanel neben dem Raster ---------- */
.detail[hidden] { display: none; }
.detail {
  position: fixed; inset: 0; z-index: 45; overflow-y: auto; overscroll-behavior: contain; outline: none;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px);
  background: var(--bg); animation: d-in .22s ease-out;
}
@keyframes d-in { from { transform: translateX(30px); opacity: 0; } }
@media (min-width: 1024px) {
  .hub-wrap.detail-open { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; align-items: start; }
  .detail {
    position: sticky; top: 72px; inset: auto; z-index: 5; max-height: calc(100dvh - 92px); padding: 16px 18px 24px;
    border-radius: 16px; border: 2px solid color-mix(in srgb, var(--c) 45%, var(--frame, #3d3872));
    background: linear-gradient(#2a2551, #1f1b40); box-shadow: var(--drop);
  }
}
.d-head { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 12px; }
.d-back, .d-plus { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 0; cursor: pointer; }
.d-back { background: #2f2a5a; color: var(--ink); }
.d-back svg, .d-plus svg { width: 24px; height: 24px; }
.d-plus {
  color: #15122b; background: linear-gradient(color-mix(in srgb, var(--c) 55%, #fff), var(--c));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 3px 0 color-mix(in srgb, var(--c) 55%, #000);
  transition: transform .08s;
}
.d-plus:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6); }
.d-plus.spin svg { animation: orb-rot .8s linear infinite; }
.d-title h2 { margin: 0; font: 800 18px var(--round, var(--sans)); }
.d-val { font-size: 48px; line-height: 1.05; }
.d-val small { font-size: 22px; color: var(--dim); }
.d-sub { color: var(--dim); font-size: 14px; }
.d-sum { font-size: 15px; margin: 4px 0 8px; }
.d-body .sub-h { margin-top: 18px; }
.d-more { margin-top: 20px; font-size: 14px; }
.d-qform { grid-template-columns: minmax(0, 1fr) auto; margin: 0 0 8px; }
.d-qform > :nth-last-child(2):not(:first-child) { grid-column: 1; }
.d-qform .primary { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; }
.d-meters { display: grid; gap: 8px; }
.d-meters > div { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) 3em; align-items: center; gap: 10px; font-size: 13px; }
.d-meters small { color: var(--dim); text-align: right; }
.d-legend { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.d-legend li { display: flex; align-items: center; gap: 10px; }
.d-legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.d-vault.veiled .secret { filter: blur(9px); user-select: none; }
.d-vault .ghost svg { width: 16px; height: 16px; vertical-align: -3px; }
.cchart { width: 100%; height: auto; display: block; color: var(--dim); }
.cchart .c-base { stroke: var(--dim); opacity: .35; }
.cchart .c-zero { opacity: .3; }
.cchart .c-hit { fill: transparent; }
.cchart .c-col:hover .c-bar { filter: brightness(1.15); }
.cchart .c-lab { fill: var(--dim); font: 600 11px var(--sans); }
.cchart .c-val { fill: var(--ink); font: 800 12px var(--round, var(--sans)); }
.d-steps .habit.done b { color: var(--dim); text-decoration: line-through; }

/* ---------- Jarvis überall: großer Knopf unten mittig, Bedienfeld als Overlay ---------- */
.jarvis-fab {
  position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 30; transform: translateX(-50%);
  width: 74px; height: 74px; border-radius: 50%; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: radial-gradient(circle at 50% 35%, #2d2860, #141129); border: 2px solid #4f47a0;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 26px rgba(82, 207, 230, .35);
}
.jarvis-fab[hidden] { display: none; }
.jarvis-fab:active { transform: translateX(-50%) scale(.95); }
.jarvis-fab .orb { width: 56px; height: 56px; }
.jarvis-fab .knorz { width: 70px; height: 74px; margin-top: 6px; }
.jarvis-fab .fab-core { display: grid; place-items: center; overflow: hidden; width: 100%; height: 100%; border-radius: 50%; }
@media (min-width: 900px) { .jarvis-fab { bottom: 28px; } }
main { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { main { padding-bottom: 120px; } }
.jarvis-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
.jarvis-overlay[hidden] { display: none; }
.jo-back { position: absolute; inset: 0; background: rgba(8, 6, 20, .72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.jo-box { position: relative; width: min(520px, 94vw); max-height: 92dvh; overflow-y: auto; }
.jo-close { display: block; margin: 12px auto 0; }

@media (prefers-reduced-motion: reduce) {
  .gbar i, .hub-tile, .detail, .d-plus { transition: none !important; animation: none !important; }
}

/* =====================================================================
   Design "Mittelalter" (html[data-skin="fantasy"]): Leder, Pergament, Gold,
   Wachssiegel. Die Spracheingabe ist Knorz, ein lebendiger Moos-Kobold.
   Nur Aussehen: gleiche Struktur, gleiche Funktionen wie das Arcade-HUD.
   ===================================================================== */
html[data-skin="fantasy"] {
  --bg: #17110c; --bg-2: #211810; --panel: #2a1f15; --panel-2: #3a2b1d;
  --edge: #0d0906; --ink: #efe3c4; --dim: #b7a37f;
  --gold: #d4a53c; --pink: #b8413a; --cyan: #5fa88f; --lime: #8fae4a;
  --red: #c4453a; --orange: #d9822b; --violet: #8a6fb0;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: var(--serif); --sans: var(--serif);
  --trim: #8a6a2a;
  --drop: 0 6px 18px rgba(0, 0, 0, .55);
}
[data-skin="fantasy"] body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(212, 165, 60, .12), transparent 60%),
    repeating-linear-gradient(92deg, rgba(255, 255, 255, .012) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 120px);
  background-size: auto;
  font-size: 16px;
  font-variant-numeric: oldstyle-nums tabular-nums;
}
[data-skin="fantasy"] body::after { display: none; }
[data-skin="fantasy"] a { color: var(--gold); }
[data-skin="fantasy"] h1, [data-skin="fantasy"] h2, [data-skin="fantasy"] h3 {
  font-family: var(--serif); text-transform: none; font-variant: small-caps; letter-spacing: .04em;
}
[data-skin="fantasy"] h1 { font-size: 30px; color: var(--gold); text-shadow: 0 2px 0 var(--edge), 0 0 18px rgba(212, 165, 60, .25); }
[data-skin="fantasy"] h2 { color: var(--gold); font-size: 19px; }
[data-skin="fantasy"] h2::before { content: "❦ "; color: var(--pink); }

/* Navigation: Holzleiste mit Messingknöpfen */
[data-skin="fantasy"] .tabs {
  background: linear-gradient(#3a2716, #22160c); border-color: var(--trim);
  box-shadow: 0 -2px 12px rgba(0, 0, 0, .5);
}
[data-skin="fantasy"] .tabs button { font: 600 13px var(--serif); text-transform: none; font-variant: small-caps; letter-spacing: .04em; }
[data-skin="fantasy"] .tabs button.active {
  color: #2a1b08; background: linear-gradient(#f0cf7a, #b98a2c); border-radius: 4px;
  box-shadow: inset 0 1px 0 #fff3c4, 0 2px 0 #5a3d10;
}
[data-skin="fantasy"] .tabs .brand { font: 700 22px var(--serif); font-variant: small-caps; color: var(--gold); text-shadow: 0 2px 0 var(--edge); }

/* Panels: Leder mit Goldrahmen und Stoffband als Titel */
[data-skin="fantasy"] .panel {
  background:
    radial-gradient(ellipse at 30% 0%, rgba(255, 220, 160, .06), transparent 60%),
    linear-gradient(#2f2317, #251a10);
  border: 2px solid var(--trim); border-radius: 10px;
  box-shadow: inset 0 0 0 1px #3a2a14, inset 0 0 0 4px var(--edge), inset 0 0 0 5px rgba(212, 165, 60, .35), var(--drop);
  padding: 0 var(--s4) var(--s4);
}
[data-skin="fantasy"] .ptitle {
  position: relative; justify-content: center; text-align: center;
  margin: -2px calc(-1 * var(--s4) + 10px) var(--s3); padding: 8px 36px 9px;
  background: linear-gradient(color-mix(in srgb, var(--accent) 80%, #fff 8%), color-mix(in srgb, var(--accent) 70%, #000 30%));
  color: #fbf1d6; border: 0; border-radius: 0 0 8px 8px;
  font: 700 15px var(--serif); text-transform: none; font-variant: small-caps; letter-spacing: .06em;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .6);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .3), 0 3px 6px rgba(0, 0, 0, .45);
}
[data-skin="fantasy"] .ptitle > a, [data-skin="fantasy"] .ptitle > button,
[data-skin="fantasy"] .ptitle > .keyhint { position: absolute; right: 12px; }
[data-skin="fantasy"] .ptitle a, [data-skin="fantasy"] .ptitle button { color: #fbf1d6; font: italic 13px var(--serif); }
/* Akzentfarben der Kacheln gedämpft wie Wappenstoffe */
[data-skin="fantasy"] .p-voice, [data-skin="fantasy"] .p-mission { --accent: #8c2f2a; }
[data-skin="fantasy"] .p-score { --accent: #9a7420; }
[data-skin="fantasy"] .p-quests { --accent: #3f7563; }
[data-skin="fantasy"] .p-boss { --accent: #7a2622; }
[data-skin="fantasy"] .p-habits, [data-skin="fantasy"] .p-school { --accent: #5a7030; }
[data-skin="fantasy"] .p-money { --accent: #9a5a1c; }
[data-skin="fantasy"] .p-cal { --accent: #5d4a80; }
