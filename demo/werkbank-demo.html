  <script>
"use strict";

// CAD im Holzbau (Ausbildung → CAD). Daten und Modelle: app/cad.py.
// #training/cad = Übersicht (Ablauf, Themen, eigene SEMA-Befehle, Glossar), #training/cad/<id> = Thema.
// Modelle bauen sich Schritt für Schritt auf; gezeichnet mit H3 aus holz.js (gleicher Zeichner, keine Bibliothek).

const CAD_NEW = [76, 211, 224];  // Teile, die im aktuellen Schritt dazukommen
const CAD_STATUS = [["neu", "neu"], ["geübt", "geübt"], ["sicher", "sicher"]];

// Dachformen als kleine Ansichten (Giebelseite links, Traufseite rechts)
const CAD_DACH = {
  Satteldach: '<path d="M8 70V40h44v30zM4 40l26-26 26 26z"/><path d="M68 70V40h56v30zM64 40l10-26h44l10 26z"/>',
  Pultdach: '<path d="M8 70V44h44v26zM4 44l52-22v22z"/><path d="M68 70V40h56v30zM64 40l4-16h56l4 16z"/>',
  Walmdach: '<path d="M8 70V40h44v30zM4 40l14-24h24l14 24z"/><path d="M68 70V40h56v30zM64 40l22-24h20l22 24z"/>',
  Krüppelwalmdach: '<path d="M8 70V40h44v30zM4 40l20-20h12l20 20z"/><path d="M68 70V40h56v30zM64 40l10-22h44l10 22z"/><path d="M24 20l6-8 6 8z"/>',
  Mansarddach: '<path d="M8 70V44h44v26zM4 44l6-20 10-8h20l10 8 6 20z"/><path d="M68 70V44h56v26zM64 44l4-20h56l4 20zM70 24l6-8h40l6 8z"/>',
  Zeltdach: '<path d="M8 70V40h44v30zM4 40l26-28 26 28z"/><path d="M68 70V40h56v30zM64 40l32-28 32 28z"/>',
};

const Cad = {
  list: null, d: null, step: 0, apart: false, yaw: -0.8, pitch: 0.4, filter: "Alle", gq: "",

  async route() {
    const id = current.split("/")[2];
    if (id) return this.detail(id);
    this.list = await api("/api/cad");
    this.renderList();
  },

  // ---------------- Übersicht
  renderList() {
    const L = this.list, groups = ["Alle", ...L.groups];
    const items = L.items.filter((i) => this.filter === "Alle" || i.group === this.filter);
    const done = L.items.filter((i) => i.status === "sicher").length;
    view.innerHTML = `<h1>CAD im Holzbau</h1>
      <p class="sub">SEMA und CAD allgemein: von der Wand bis zum Haus, Dach, Bauweisen, Werkstoffe, Pläne und Maschinendaten.
        ${L.items.length} Themen, ${done} sitzen sicher.</p>
      <section class="panel" style="--accent:#5aa9e6"><header class="ptitle"><span>Vom Plan zur Abbundmaschine</span></header>
        <ol class="cad-flow">${L.ablauf.map((a) => `<li><b>${esc(a.title)}</b><span>${esc(a.text)}</span></li>`).join("")}</ol></section>
      <div class="chips hz-groups">${groups.map((g) => `<button class="${g === this.filter ? "on" : ""}" data-group="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <div class="hz-grid">${items.map((i) => `<a class="hz-card cad-card st-${esc(i.status)}" href="#training/cad/${esc(i.id)}">
          <span class="hz-kind">${esc(i.group)} · ${i.model ? "3D-Modell" : "Wissen"}</span>
          <b>${esc(i.name)}</b><span class="meta">${esc(i.kurz)}</span>
          <span class="hz-status">${esc(i.status)}${i.notiz ? " · eigene Notiz" : ""}</span></a>`).join("")}</div>
      <div class="hz-info">
        <section class="panel" style="--accent:#5aa9e6" id="cad-bef"><header class="ptitle"><span>Meine SEMA-Befehle</span></header>${this.befehle()}</section>
        <section class="panel" style="--accent:#5aa9e6"><header class="ptitle"><span>Glossar</span><span class="meta">${L.glossar.length} Begriffe</span></header>
          <label class="field">Begriff suchen<input id="cad-gq" type="search" placeholder="z. B. Wechsel, Pfette, BTL" value="${esc(this.gq)}" autocomplete="off"></label>
          <dl class="cad-gloss" id="cad-gl">${this.glossar()}</dl></section>
      </div>
      <p class="meta">${esc(L.hinweis)}</p>`;
    $("#cad-gq").oninput = (e) => { this.gq = e.target.value; $("#cad-gl").innerHTML = this.glossar(); };
    view.onclick = async (e) => {
      const g = e.target.closest("[data-group]");
      if (g) { this.filter = g.dataset.group; return this.renderList(); }
      const ed = e.target.closest("[data-bef-edit]");
      if (ed) { this.editing = +ed.dataset.befEdit; $("#cad-bef").innerHTML = `<header class="ptitle"><span>Meine SEMA-Befehle</span></header>${this.befehle()}`; }
    };
    view.onsubmit = async (e) => {
      if (e.target.id !== "cad-bef-form") return;
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try {
        if (this.editing) await api(`/api/cad/befehle/${this.editing}`, { method: "PUT", body });
        else await api("/api/cad/befehle", { method: "POST", body });
        toast(this.editing ? "Befehl geändert" : "Befehl gespeichert");
        this.editing = null;
        this.list = await api("/api/cad");
        $("#cad-bef").innerHTML = `<header class="ptitle"><span>Meine SEMA-Befehle</span></header>${this.befehle()}`;
      } catch (err) { showError(err); }
    };
  },

  befehle() {
    const B = this.list.befehle, cur = B.find((b) => b.id === this.editing) || {};
    return `${B.length ? `<table class="nut-table cad-bef"><thead><tr><th>Befehl</th><th>Wo / Taste</th><th>Wofür</th><th></th></tr></thead><tbody>
        ${B.map((b) => `<tr><th>${esc(b.befehl)}</th><td>${esc(b.weg)}</td><td class="muted">${esc(b.wofuer)}</td>
          <td><button class="ghost small" data-bef-edit="${b.id}" aria-label="${esc(b.befehl)} ändern">✎</button></td></tr>`).join("")}</tbody></table>`
      : `<p class="meta">Noch leer. Trag hier ein, wie ein Befehl in deinem SEMA heißt und wo er sitzt (Menü, Symbol, Taste). So entsteht dein eigener Spickzettel.</p>`}
      <form id="cad-bef-form" class="cad-bef-form">
        <label class="field">Befehl<input name="befehl" required maxlength="200" placeholder="z. B. Wand zeichnen" value="${esc(cur.befehl || "")}"></label>
        <label class="field">Wo / Taste<input name="weg" maxlength="200" placeholder="Menü, Symbol oder Taste" value="${esc(cur.weg || "")}"></label>
        <label class="field">Wofür<input name="wofuer" maxlength="500" placeholder="kurz" value="${esc(cur.wofuer || "")}"></label>
        <button class="primary">${this.editing ? "Ändern" : "Speichern"}</button></form>`;
  },

  glossar() {
    const q = this.gq.trim().toLowerCase();
    const G = this.list.glossar.filter((g) => !q || g.wort.toLowerCase().includes(q) || g.text.toLowerCase().includes(q));
    return G.map((g) => `<dt>${esc(g.wort)}</dt><dd>${esc(g.text)} <a class="link" href="#training/cad/${esc(g.thema)}">${esc(g.thema_name)}</a></dd>`).join("")
      || `<dd class="empty">Nichts gefunden.</dd>`;
  },

  // ---------------- Thema
  async detail(id) {
    const d = await api(`/api/cad/${encodeURIComponent(id)}`);
    if (!this.d || this.d.id !== d.id) {
      this.step = 0; this.apart = !!d.model?.apart;
      [this.yaw, this.pitch] = d.model?.view || [-0.8, 0.4];
    }
    this.d = d;
    if (d.model) this.bounds();
    this.renderDetail();
  },

  /** Feste Mitte/Größe über alle Teile (auch auseinandergezogen), damit beim Durchklicken nichts springt. */
  bounds() {
    const pts = [];
    for (const p of this.d.model.parts) for (const pr of p.prisms) for (const f of H3.faces(pr)) for (const q of f.pts)
      for (const o of [[0, 0, 0], p.explode]) pts.push(q.map((v, i) => v + o[i]));
    const lo = [0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), hi = [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i])));
    this.center = lo.map((v, i) => (v + hi[i]) / 2);
    this.radius = Math.max(...pts.map((p) => Math.hypot(...p.map((v, i) => v - this.center[i]))));
  },

  paint() {
    const cv = $("#cad-cv");
    if (!cv) return;
    const m = this.d.model, items = [];
    m.parts.forEach((p, k) => {
      if (p.step > this.step) return;
      const base = m.farben[p.farbe], isNew = p.step === this.step && this.step > 0;
      const rgb = isNew ? base.map((c, i) => Math.round(c * 0.55 + CAD_NEW[i] * 0.45)) : base;
      const off = this.apart ? p.explode : [0, 0, 0];
      p.prisms.forEach((pr) => items.push({ prism: pr, off, rgb, grain: null, group: k }));
    });
    const dims = m.dims.filter((d) => d.step === this.step);
    H3.draw(cv, items, { yaw: this.yaw, pitch: this.pitch, center: this.center, radius: this.radius, dims });
  },

  renderDetail() {
    const d = this.d, m = d.model, s = d.schritte[this.step];
    const neu = m ? [...new Set(m.parts.filter((p) => p.step === this.step).map((p) => p.name))] : [];
    const canApart = m && m.parts.some((p) => p.explode.some((v) => v));
    const li = (xs) => xs.map((x) => `<li>${esc(x)}</li>`).join("");
    view.innerHTML = `<h1>${esc(d.name)}</h1>
      <p class="sub">${esc(d.group)} · ${esc(d.kurz)}</p>
      <div class="hz-tools"><div class="hz-statusbar seg" role="radiogroup" aria-label="Mein Stand">${CAD_STATUS.map(([k, l]) =>
        `<button class="${d.status === k ? "on" : ""}" data-status="${k}">${l}</button>`).join("")}</div></div>
      <div class="hz-detail">
        ${m ? `<section class="panel hz-view cad-view" style="--accent:#5aa9e6">
          <header class="ptitle"><span>${esc(s.title)}</span><span class="meta">Schritt ${this.step + 1} / ${d.schritte.length}</span></header>
          <canvas id="cad-cv" class="hz-cv" aria-label="3D-Modell ${esc(d.name)}, mit Finger oder Maus drehen"></canvas>
          <p class="meta cad-new">${this.step > 0 ? `<i class="lg-new"></i> Neu: ${esc(neu.join(", "))}` : `Start: ${esc(neu.join(", "))}`} · ziehen = drehen</p>
          <div class="hz-ctrl">${canApart ? `<button class="ghost" data-cad="apart">${this.apart ? "Zusammen" : "Auseinander"}</button>` : ""}
            <button class="ghost" data-cad="reset">Ansicht zurücksetzen</button></div>
          <div class="hz-stepnav"><button class="ghost" data-cad="prev" ${this.step === 0 ? "disabled" : ""}>‹ Zurück</button>
            <button class="primary" data-cad="next" ${this.step >= d.schritte.length - 1 ? "disabled" : ""}>Weiter ›</button></div>
        </section>` : d.id === "dachformen" ? `<section class="panel" style="--accent:#5aa9e6"><header class="ptitle"><span>Dachformen</span><span class="meta">Giebel- und Traufseite</span></header>
          <div class="cad-roofs">${Object.entries(CAD_DACH).map(([n, svg]) => `<figure><svg viewBox="0 0 132 76" role="img" aria-label="${esc(n)}">${svg}</svg><figcaption>${esc(n)}</figcaption></figure>`).join("")}</div></section>` : ""}
        <section class="panel hz-steps" style="--accent:#5aa9e6">
          <header class="ptitle"><span>${m ? "Schritt für Schritt" : "So gehst du vor"}</span></header>
          <p class="cad-ziel"><b>Ziel:</b> ${esc(d.ziel)}</p>
          ${m ? `<div class="hz-cur"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>
            <ol class="hz-list">${d.schritte.map((x, i) => `<li><button class="${i === this.step ? "on" : ""}" data-step="${i}">${i + 1}. ${esc(x.title)}</button></li>`).join("")}</ol>`
          : `<ol class="wz-steps">${d.schritte.map((x) => `<li><b>${esc(x.title)}:</b> ${esc(x.text)}</li>`).join("")}</ol>`}
        </section>
      </div>
      <div class="hz-info">
        <section class="panel"><header class="ptitle"><span>Begriffe</span></header>
          <dl class="cad-gloss">${d.begriffe.map((b) => `<dt>${esc(b.wort)}</dt><dd>${esc(b.text)}</dd>`).join("")}</dl></section>
        <section class="panel wz-nogo" style="--accent:var(--orange)"><header class="ptitle"><span>Häufige Fehler</span></header><ul class="hz-err">${li(d.fehler)}</ul></section>
        <section class="panel" style="--accent:var(--lime)"><header class="ptitle"><span>Übung am Rechner</span></header><p>${esc(d.uebung)}</p></section>
        <section class="panel"><header class="ptitle"><span>Eigene Notizen</span></header>
          <textarea id="cad-note" rows="4" placeholder="Wie es in deinem SEMA geht, Vorlagen im Betrieb, Tipps vom Ausbilder …">${esc(d.notiz)}</textarea>
          <button class="ghost" data-cad="save">Notiz speichern</button></section>
      </div>
      <p class="meta">${esc(d.hinweis)}</p>`;
    this.bind();
    if (m) requestAnimationFrame(() => this.paint());
  },

  bind() {
    const d = this.d;
    view.onsubmit = null;
    view.onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.step) {
        this.step = +b.dataset.step; this.renderDetail();
        if (!window.matchMedia("(min-width: 960px)").matches) $(".cad-view")?.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
        return;
      }
      try {
        if (b.dataset.status) {
          await api(`/api/cad/${d.id}`, { method: "PUT", body: { status: b.dataset.status } });
          d.status = b.dataset.status; toast(`Stand: ${d.status}`); return this.renderDetail();
        }
        const a = b.dataset.cad;
        if (a === "next" || a === "prev") { this.step += a === "next" ? 1 : -1; return this.renderDetail(); }
        if (a === "apart") { this.apart = !this.apart; b.textContent = this.apart ? "Zusammen" : "Auseinander"; return this.paint(); }
        if (a === "reset") { [this.yaw, this.pitch] = d.model.view; return this.paint(); }
        if (a === "save") {
          d.notiz = $("#cad-note").value;
          await api(`/api/cad/${d.id}`, { method: "PUT", body: { notiz: d.notiz } });
          toast("Notiz gespeichert");
        }
      } catch (err) { showError(err); }
    };
    const cv = $("#cad-cv");
    if (!cv) return;
    let drag = null, raf = 0;
    cv.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", (e) => {
      if (!drag) return;
      this.yaw -= (e.clientX - drag[0]) * 0.01;
      this.pitch = Math.max(-0.2, Math.min(1.45, this.pitch + (e.clientY - drag[1]) * 0.01));
      drag = [e.clientX, e.clientY];
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; this.paint(); });
    });
    const end = () => { drag = null; };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    if (this._ro) this._ro.disconnect();
    this._ro = new ResizeObserver(() => this.paint());
    this._ro.observe(cv);
  },
};

  <script>
"use strict";

// Bauplaner (Ausbildung → Bauplaner). Daten und Geometrie: app/planer.py.
// #training/planer = Vorlagen und Projekte, #training/planer/neu-<typ> = neue Planung, #training/planer/<id> = gespeichert.
// Maße ändern rechnet sofort neu (Modell, Holzliste, Anleitung). Gezeichnet mit H3 aus holz.js.

const PL_PHASE_SYM = { Planung: "◇", Material: "▦", Anriss: "✎", Schnitte: "▤", Aufbau: "⊞" };

const Planer = {
  meta: null, pid: null, typ: null, name: "", wuensche: "", params: {}, d: null, err: null,
  step: 0, phase: "Alle", yaw: -0.75, pitch: 0.42, archiv: false, timer: 0,

  async route() {
    const sub = current.split("/")[2];
    this.meta = await api(`/api/planer${this.archiv && !sub ? "?archiv=1" : ""}`);
    if (!sub) return this.renderList();
    if (sub.startsWith("neu-")) {
      const typ = sub.slice(4);
      if (this.pid !== null || this.typ !== typ || !this.d) {
        this.pid = null; this.typ = typ; this.name = ""; this.wuensche = "";
        this.params = Object.fromEntries(this.type().params.map((p) => [p.key, p.default]));
        this.step = 0; this.fresh = true;
      }
    } else {
      const r = await api(`/api/planer/projekte/${encodeURIComponent(sub)}`);
      if (this.pid !== r.id) { this.step = 0; this.fresh = true; }
      Object.assign(this, { pid: r.id, typ: r.typ, name: r.name, wuensche: r.wuensche, params: r.params, archiviert: r.archiviert });
    }
    await this.calc();
    this.renderEditor();
  },

  type() { return this.meta.typen.find((t) => t.id === this.typ) || { params: [], name: this.typ }; },

  // ---------------- Übersicht
  renderList() {
    const M = this.meta;
    view.innerHTML = `<h1>Bauplaner</h1>
      <p class="sub">Maße und Wünsche eingeben, Jarvis rechnet 3D-Modell, Holzliste und Anleitung mit Anriss, Schnitten und Aufbau.</p>
      <h2>Neu planen</h2>
      <div class="hz-grid">${M.typen.map((t) => `<a class="hz-card pl-card" href="#training/planer/neu-${esc(t.id)}">
        <span class="hz-kind">Vorlage</span><b>${esc(t.name)}</b><span class="meta">${esc(t.kurz)}</span></a>`).join("")}</div>
      <h2>${this.archiv ? "Archiv" : "Meine Planungen"}</h2>
      ${M.projekte.length ? `<div class="hz-grid">${M.projekte.map((p) => `<a class="hz-card pl-card" href="#training/planer/${p.id}">
        <span class="hz-kind">${esc(M.typen.find((t) => t.id === p.typ)?.name || p.typ)}</span><b>${esc(p.name)}</b>
        <span class="meta">${esc((p.wuensche || "").slice(0, 90))}</span><span class="hz-status">geändert ${esc((p.updated_at || "").slice(0, 10))}</span></a>`).join("")}</div>`
        : `<p class="empty">${this.archiv ? "Nichts archiviert." : "Noch keine Planung gespeichert. Wähle oben eine Vorlage."}</p>`}
      <button class="ghost" data-pl="archiv">${this.archiv ? "Zurück zu meinen Planungen" : "Archiv anzeigen"}</button>
      <p class="meta">${esc(M.hinweis)}</p>`;
    view.onclick = (e) => { if (e.target.closest("[data-pl=archiv]")) { this.archiv = !this.archiv; this.route(); } };
    view.oninput = null;
  },

  // ---------------- Rechnen
  async calc() {
    try {
      this.d = await api("/api/planer/berechnen", { method: "POST", body: { typ: this.typ, params: this.params } });
      this.err = null;
      if (this.fresh) { [this.yaw, this.pitch] = this.d.model.view; this.fresh = false; }
      this.step = Math.min(this.step, this.d.schritte.length - 1);
      this.bounds();
    } catch (err) { this.err = err.message; }
  },

  bounds() {
    const pts = [];
    for (const p of this.d.model.parts) for (const pr of p.prisms) for (const f of H3.faces(pr)) for (const q of f.pts) pts.push(q);
    const lo = [0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), hi = [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i])));
    this.center = lo.map((v, i) => (v + hi[i]) / 2);
    this.radius = Math.max(...pts.map((p) => Math.hypot(...p.map((v, i) => v - this.center[i]))));
  },

  // ---------------- Editor
  form() {
    const ps = this.type().params, groups = [...new Set(ps.map((p) => p.group || ""))];
    const field = (p) => p.options
      ? `<label class="field">${esc(p.label)}<select name="${esc(p.key)}">${p.options.map((o) =>
          `<option value="${esc(o.value)}" ${String(this.params[p.key]) === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></label>`
      : `<label class="field"><span>${esc(p.label)}${p.unit ? ` <span class="meta">(${esc(p.unit)})</span>` : ""}</span>
          <input name="${esc(p.key)}" type="number" inputmode="decimal" min="${p.min}" max="${p.max}" step="${p.step}" value="${esc(this.params[p.key])}"></label>`;
    return groups.map((g) => `${g ? `<h3 class="sub-h">${esc(g)}</h3>` : ""}<div class="pl-fields">${ps.filter((p) => (p.group || "") === g).map(field).join("")}</div>`).join("");
  },

  renderEditor() {
    const t = this.type();
    view.innerHTML = `<h1>${esc(this.name || t.name)}</h1>
      <p class="sub">${esc(t.name)} · ${this.pid ? "gespeichert" : "noch nicht gespeichert"}${this.archiviert ? " · archiviert" : ""}</p>
      <div class="hz-detail pl-detail">
        <section class="panel pl-form" style="--accent:#8bc34a">
          <header class="ptitle"><span>Maße und Wünsche</span></header>
          <form id="pl-form" autocomplete="off">
            <label class="field">Name der Planung<input name="__name" maxlength="120" placeholder="z. B. Carport Oma" value="${esc(this.name)}"></label>
            ${this.form()}
            <label class="field">Wünsche und Notizen<textarea name="__wuensche" rows="3" placeholder="z. B. Platz für zwei Fahrräder, Dach mit Stegplatten, Holz Lärche">${esc(this.wuensche)}</textarea></label>
            <div class="pl-actions"><button class="primary" type="submit">${this.pid ? "Speichern" : "Planung speichern"}</button>
              ${this.pid ? `<button class="ghost" type="button" data-pl="archivieren">${this.archiviert ? "Aus dem Archiv holen" : "Archivieren"}</button>` : ""}</div>
          </form>
        </section>
        <section class="panel hz-view pl-view" style="--accent:#8bc34a" id="pl-view"></section>
      </div>
      <div id="pl-out"></div>`;
    this.renderOut();
    this.bind();
  },

  steps() { return this.d ? this.d.schritte : []; },

  renderView() {
    const box = $("#pl-view");
    if (!box) return;
    if (this.err || !this.d) {
      box.innerHTML = `<header class="ptitle"><span>3D-Modell</span></header><p class="warn-line">⚠ ${esc(this.err || "Lädt …")}</p>`;
      return;
    }
    const S = this.steps(), s = S[this.step];
    box.innerHTML = `<header class="ptitle"><span>${esc(PL_PHASE_SYM[s.phase] || "")} ${esc(s.phase)}: ${esc(s.title)}</span><span class="meta">${this.step + 1} / ${S.length}</span></header>
      <canvas id="pl-cv" class="hz-cv" aria-label="3D-Modell der Planung, mit Finger oder Maus drehen"></canvas>
      <div class="hz-cur pl-cur"><p>${esc(s.text)}</p></div>
      <div class="hz-stepnav"><button class="ghost" data-pl="prev" ${this.step === 0 ? "disabled" : ""}>‹ Zurück</button>
        <button class="primary" data-pl="next" ${this.step >= S.length - 1 ? "disabled" : ""}>Weiter ›</button></div>`;
    this.bindCanvas();
    requestAnimationFrame(() => this.paint());
  },

  renderOut() {
    this.renderView();
    const out = $("#pl-out");
    if (!out) return;
    if (!this.d) { out.innerHTML = ""; return; }
    const d = this.d, phases = ["Alle", ...this.meta.phases];
    const list = d.holzliste.map((g) => `<tr><td class="num">${g.pos}</td><th>${esc(g.bauteil)}</th><td class="num">${esc(g.qs)}</td>
      <td class="num">${fmtN(g.laenge)} cm</td><td class="num">${g.stueck}</td><td class="muted">${esc(g.bearb)}</td></tr>`).join("");
    out.innerHTML = `${d.warnungen.length || this.err ? `<section class="panel pl-warn" style="--accent:var(--orange)"><header class="ptitle"><span>Bitte prüfen</span></header>
        <ul class="hz-err">${this.err ? `<li><b>${esc(this.err)}</b> Modell und Listen zeigen den letzten gültigen Stand.</li>` : ""}${d.warnungen.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></section>` : ""}
      <section class="panel" style="--accent:#8bc34a"><header class="ptitle"><span>Schritt für Schritt</span>
        <button class="ghost small" data-pl="copy-steps">Anleitung kopieren</button></header>
        <div class="chips hz-groups">${phases.map((p) => `<button class="${p === this.phase ? "on" : ""}" data-phase="${esc(p)}">${esc(PL_PHASE_SYM[p] || "")} ${esc(p)}</button>`).join("")}</div>
        <ol class="hz-list pl-steps">${d.schritte.map((s, i) => this.phase !== "Alle" && s.phase !== this.phase ? "" : `<li><button class="${i === this.step ? "on" : ""}" data-step="${i}">
          <span class="hz-phase">${esc(PL_PHASE_SYM[s.phase] || "")} ${esc(s.phase)}</span><b>${esc(s.title)}</b><span class="pl-steptext">${esc(s.text)}</span></button></li>`).join("")}</ol></section>
      <section class="panel" style="--accent:#8bc34a"><header class="ptitle"><span>Holzliste</span><button class="ghost small" data-pl="copy-list">Liste kopieren</button></header>
        <div class="pl-table"><table class="nut-table"><thead><tr><th>Pos.</th><th>Bauteil</th><th>b/h cm</th><th>Länge</th><th>Stück</th><th>Bearbeitung</th></tr></thead>
        <tbody>${list}</tbody></table></div>
        <p class="meta">Summe ${fmtN(d.summe.lfm, 2)} lfm · ${fmtN(d.summe.m3, 3)} m³ Holz. Längen sind Fertigmaße, beim Bestellen Zugabe einplanen.</p>
        ${d.extra.length ? `<ul class="pl-extra">${d.extra.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</section>
      <p class="meta">${esc(d.hinweis)}</p>`;
  },

  paint() {
    const cv = $("#pl-cv");
    if (!cv || !this.d) return;
    const m = this.d.model, s = this.steps()[this.step], items = [];
    const focus = s.focus ? new Set(s.focus) : null, newOnes = s.phase === "Aufbau" && s.step > 0;
    m.parts.forEach((p, k) => {
      if (p.step > s.step) return;
      const base = m.farben[p.farbe], hot = focus ? focus.has(p.name) : newOnes && p.step === s.step;
      const rgb = hot ? base.map((c, i) => Math.round(c * 0.55 + CAD_NEW[i] * 0.45)) : base;
      p.prisms.forEach((pr) => items.push({ prism: pr, off: [0, 0, 0], rgb, grain: null, group: k }));
    });
    H3.draw(cv, items, { yaw: this.yaw, pitch: this.pitch, center: this.center, radius: this.radius,
      dims: m.dims.filter((dm) => dm.step === s.step || (s.phase === "Planung" && dm.step === 0)) });
  },

  // ---------------- Bedienung
  bind() {
    const f = $("#pl-form");
    f.oninput = (e) => {
      const el = e.target;
      if (el.name === "__name") { this.name = el.value; return; }
      if (el.name === "__wuensche") { this.wuensche = el.value; return; }
      this.params[el.name] = el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value;
      clearTimeout(this.timer);
      this.timer = setTimeout(async () => { await this.calc(); this.renderOut(); }, 300);
    };
    f.onsubmit = async (e) => {
      e.preventDefault();
      try {
        if (!this.name.trim()) { toast("Gib der Planung einen Namen"); f.__name?.focus(); return; }
        if (this.pid) {
          await api(`/api/planer/projekte/${this.pid}`, { method: "PUT", body: { name: this.name, params: this.params, wuensche: this.wuensche } });
          toast("Gespeichert");
        } else {
          const r = await api("/api/planer/projekte", { method: "POST", body: { name: this.name, typ: this.typ, params: this.params, wuensche: this.wuensche } });
          this.pid = r.id; toast("Planung gespeichert");
          history.replaceState(null, "", `#training/planer/${r.id}`); current = `training/planer/${r.id}`;
          $(".sub").textContent = `${this.type().name} · gespeichert`;
        }
      } catch (err) { showError(err); }
    };
    view.onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.step) {
        this.step = +b.dataset.step; this.renderOut();
        if (!window.matchMedia("(min-width: 960px)").matches) $("#pl-view")?.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
        return;
      }
      if (b.dataset.phase) {
        this.phase = b.dataset.phase;
        const first = this.steps().findIndex((s) => this.phase === "Alle" || s.phase === this.phase);
        if (first >= 0) this.step = first;
        return this.renderOut();
      }
      const a = b.dataset.pl;
      if (a === "next" || a === "prev") { this.step += a === "next" ? 1 : -1; return this.renderOut(); }
      if (a === "copy-list" || a === "copy-steps") return this.copy(a === "copy-list");
      if (a === "archivieren") {
        try {
          await api(`/api/planer/projekte/${this.pid}`, { method: "PUT", body: { archiviert: !this.archiviert } });
          this.archiviert = !this.archiviert; toast(this.archiviert ? "Archiviert" : "Zurück aus dem Archiv"); this.renderEditor();
        } catch (err) { showError(err); }
      }
    };
  },

  async copy(isList) {
    const d = this.d;
    if (!d) return;
    const title = this.name || this.type().name;
    const text = isList
      ? [`Holzliste ${title}`, ...d.holzliste.map((g) => `${g.pos}. ${g.bauteil} ${g.qs} cm, ${fmtN(g.laenge)} cm, ${g.stueck} Stück${g.bearb ? `, ${g.bearb}` : ""}`),
        `Summe ${fmtN(d.summe.lfm, 2)} lfm, ${fmtN(d.summe.m3, 3)} m³`, ...d.extra].join("\n")
      : [`Anleitung ${title}`, ...d.schritte.map((s, i) => `${i + 1}. ${s.phase}: ${s.title}\n   ${s.text}`)].join("\n");
    try { await navigator.clipboard.writeText(text); toast("Kopiert"); } catch { toast("Kopieren ging nicht"); }
  },

  bindCanvas() {
    const cv = $("#pl-cv");
    if (!cv) return;
    let drag = null, raf = 0;
    cv.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", (e) => {
      if (!drag) return;
      this.yaw -= (e.clientX - drag[0]) * 0.01;
      this.pitch = Math.max(-0.2, Math.min(1.45, this.pitch + (e.clientY - drag[1]) * 0.01));
      drag = [e.clientX, e.clientY];
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; this.paint(); });
    });
    const end = () => { drag = null; };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    if (this._ro) this._ro.disconnect();
    this._ro = new ResizeObserver(() => this.paint());
    this._ro.observe(cv);
  },
};

</script>
  <script>
"use strict";

// Schatzkammer (Finanzen → Schatzkammer): das Vermögen als Raum. Edelmetalle als Münzen in der Truhe und
// Barren davor, Bargeld als Geldbündel, Wertpapiere als Tafel mit Positionen und Kursgraphen und ein Haufen
// Zertifikate davor. Mengen wachsen mit dem Anteil am Vermögen. Daten: /api/portfolio/vault (rein lokal).
// Gezeichnet auf einem Canvas ohne Bibliothek; Einfüll-Animation beim Betreten, danach nur Fackeln und Glanz.

const VK = {
  gold: { label: "Gold", c: ["#fff1a8", "#f2c94c", "#b8871f", "#6e4c0c"] },
  silver: { label: "Silber", c: ["#ffffff", "#d9dee4", "#9aa3ad", "#535b64"] },
  cash: { label: "Bargeld", c: ["#e9f3df", "#a9c99a", "#6f9a63", "#3d5c37"] },
  paper: { label: "Wertpapiere", c: ["#fffdf6", "#efe8d6", "#c9bfa6", "#7d735c"] },
};
const VAULT_GROUPS = [
  { key: "metal", kinds: ["gold", "silver"], label: "Edelmetalle", sub: "Münzen und Barren" },
  { key: "cash", kinds: ["cash"], label: "Bargeld", sub: "Geldbündel" },
  { key: "paper", kinds: ["paper"], label: "Wertpapiere", sub: "Tafel und Zertifikate" },
];

function vRand(seed) {  // feste Zufallsfolge: gleiche Daten → gleiche Schatzkammer
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const vClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const vEase = (t) => 1 - Math.pow(1 - vClamp(t, 0, 1), 3);
function vBounce(t) {
  t = vClamp(t, 0, 1);
  if (t < 1 / 2.75) return 7.5625 * t * t;
  if (t < 2 / 2.75) return 7.5625 * (t -= 1.5 / 2.75) * t + 0.75;
  if (t < 2.5 / 2.75) return 7.5625 * (t -= 2.25 / 2.75) * t + 0.9375;
  return 7.5625 * (t -= 2.625 / 2.75) * t + 0.984375;
}

const Vault = {
  d: null, sel: null, hover: null, t0: 0, raf: 0, scene: null,

  async route() {
    try { sessionStorage.setItem("vault", "open"); } catch { /* egal */ }
    view.innerHTML = `<h1>Schatzkammer</h1><p class="empty">Die Truhe wird geöffnet …</p>`;
    this.d = await api("/api/portfolio/vault");
    this.render();
  },

  sum(kinds) { return kinds.reduce((s, k) => s + this.d.kinds[k].value, 0); },
  pct(kinds) { return kinds.reduce((s, k) => s + this.d.kinds[k].pct, 0); },

  render() {
    const d = this.d;
    if (!d.items.length) {
      view.innerHTML = `<h1>Schatzkammer</h1><p class="empty">Die Kammer ist noch leer. Lege unter Finanzen Positionen an, dann füllt sie sich.</p>`;
      return;
    }
    view.innerHTML = `<h1>Schatzkammer</h1>
      <p class="sub">${eur(d.total, d.base_currency)} in der Kammer.${d.reserve ? ` Rücklagen (${eur(d.reserve, d.base_currency)}) liegen wie im Gesamtvermögen nicht mit drin.` : ""}
        ${d.missing.length ? ` Ohne Kurs und darum nicht zu sehen: ${d.missing.map(esc).join(", ")}.` : ""}</p>
      <section class="panel vault-stage">
        <canvas id="vault-cv" aria-label="Schatzkammer: Edelmetalle, Bargeld und Wertpapiere als Bild. Antippen zeigt die Positionen."></canvas>
        <button class="ghost vault-replay" data-vault="replay">↻ Nochmal einfüllen</button>
      </section>
      <div class="vault-tiles">${VAULT_GROUPS.map((g) => `<button class="vault-tile ${this.sel === g.key ? "on" : ""}" data-vgroup="${g.key}">
          <span class="vt-label">${esc(g.label)}</span><b class="num">${eur(this.sum(g.kinds), d.base_currency)}</b>
          <span class="meta">${fmtN(this.pct(g.kinds))} % · ${esc(g.sub)}</span></button>`).join("")}</div>
      <section class="panel" id="vault-list">${this.list()}</section>`;
    view.onclick = (e) => {
      const g = e.target.closest("[data-vgroup]");
      if (g) return this.select(g.dataset.vgroup);
      if (e.target.closest("[data-vault=replay]")) { this.t0 = performance.now(); this.loop(); }
    };
    this.bind();
    this.t0 = reducedMotion() ? -1e9 : performance.now();
    this.loop();
  },

  list() {
    const g = VAULT_GROUPS.find((x) => x.key === this.sel);
    if (!g) return `<p class="meta">Tippe in der Kammer auf die Truhe, das Geld oder die Tafel, um die Positionen zu sehen.</p>`;
    const items = this.d.items.filter((i) => g.kinds.includes(i.kind));
    return `<header class="ptitle"><span>${esc(g.label)}</span><span class="meta">${items.length} Positionen</span></header>
      ${items.length ? `<table class="nut-table vault-table"><tbody>${items.map((i) => `<tr>
        <th>${esc(i.name)}<span class="meta"> · ${esc(i.portfolio)}${g.key === "metal" ? ` · ${VK[i.kind].label}` : ""}</span></th>
        <td class="num">${eur(i.value, this.d.base_currency)}</td>
        <td class="num ${i.pnl_pct == null ? "muted" : i.pnl_pct >= 0 ? "up" : "down"}">${i.pnl_pct == null ? "–" : `${i.pnl_pct >= 0 ? "+" : ""}${fmtN(i.pnl_pct)} %`}</td></tr>`).join("")}
      </tbody></table>` : `<p class="meta">Hier liegt noch nichts.</p>`}`;
  },

  select(key) {
    this.sel = this.sel === key ? null : key;
    $("#vault-list").innerHTML = this.list();
    document.querySelectorAll(".vault-tile").forEach((b) => b.classList.toggle("on", b.dataset.vgroup === this.sel));
    this.draw();
  },

  bind() {
    const cv = $("#vault-cv");
    const pick = (e) => {
      const r = cv.getBoundingClientRect(), S = this.scene;
      if (!S) return null;
      const x = (e.clientX - r.left) / r.width * S.W, y = (e.clientY - r.top) / r.height * S.H;
      return S.hits.find((h) => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1)?.key || null;
    };
    cv.addEventListener("pointermove", (e) => {
      const h = pick(e);
      if (h !== this.hover) { this.hover = h; cv.style.cursor = h ? "pointer" : "default"; this.draw(); }
    });
    cv.addEventListener("pointerleave", () => { this.hover = null; this.draw(); });
    cv.addEventListener("click", (e) => { const h = pick(e); if (h) this.select(h); });
    if (this._ro) this._ro.disconnect();
    this._ro = new ResizeObserver(() => { this.scene = null; this.draw(); });
    this._ro.observe(cv);
  },

  // ---------------------------------------------------------------- Szene aufbauen (einmal je Größe)
  build(cv) {
    const portrait = cv.clientWidth < 640;
    const W = 1000, H = portrait ? 1250 : 600, d = this.d, R = vRand(d.items.length * 7919 + Math.round(d.total));
    const k = d.kinds, sh = (x) => x.pct / 100;
    const S = { W, H, portrait, floor: portrait ? 520 : 380, bs: portrait ? 1.5 : 1.25, coins: [], bars: [], silverCoins: [], bundles: [], sheets: [], sparkles: [] };
    // Anker der drei Ecken
    const L = portrait
      ? { chest: [260, 960, 1.35], bars: [260, 1185], cash: [760, 1185], board: [50, 40, 950, 470], pile: [500, 575, 1.5], torches: [[25, 300], [975, 300]] }
      : { chest: [200, 355, 1], bars: [215, 578], cash: [470, 578], board: [545, 40, 975, 320], pile: [790, 470, 1], torches: [[500, 150], [30, 120]] };
    S.L = L;
    // Gold: Münzen in der Truhe, Barren davor; Silber: Barren und Münzstapel daneben
    const [cx, cy, cs] = L.chest;
    const nCoins = k.gold.value > 0 ? Math.round(vClamp(12 + sh(k.gold) * 150, 12, 95)) : 0;
    const mound = 14 + nCoins * 0.5;
    for (let i = 0; i < nCoins; i++) {
      const u = R() * 2 - 1, h = mound * (1 - u * u) * Math.sqrt(R());
      S.coins.push({ x: cx + u * 105 * cs, y: cy - 8 * cs - h * cs + R() * 10 * cs, r: (8 + R() * 3) * cs, t: 0.45 + i * 0.018, rot: R() });
    }
    S.coins.sort((a, b) => a.y - b.y);
    const place = (n, x0, y0, w, h, perRow) => {
      const out = [];
      for (let row = 0, left = n; left > 0; row++) {
        const cnt = Math.min(left, Math.max(1, perRow - row));
        for (let j = 0; j < cnt; j++) out.push({ x: x0 + (j - (cnt - 1) / 2) * (w + 4) + row * 0, y: y0 - row * (h + 2) });
        left -= cnt;
      }
      return out;
    };
    const [bx, by] = L.bars;
    const nGold = k.gold.value > 0 ? Math.round(vClamp(sh(k.gold) * 26, 1, 14)) : 0;
    const nSilver = k.silver.value > 0 ? Math.round(vClamp(sh(k.silver) * 26, 1, 10)) : 0;
    place(nGold, bx - (nSilver ? 60 * S.bs : 0), by, 52 * S.bs, 16 * S.bs, 4).forEach((p, i) => S.bars.push({ ...p, metal: "gold", t: 0.9 + i * 0.13 }));
    place(nSilver, bx + (nGold ? 120 * S.bs : 0), by, 52 * S.bs, 16 * S.bs, 3).forEach((p, i) => S.bars.push({ ...p, metal: "silver", t: 1.1 + i * 0.13 }));
    const nSc = k.silver.value > 0 ? Math.round(vClamp(sh(k.silver) * 70, 4, 36)) : 0;
    for (let i = 0; i < nSc; i++) {
      const col = i % 3, lvl = Math.floor(i / 3);
      S.silverCoins.push({ x: bx + (nGold ? 205 : 90) * S.bs * 0.8 + col * 30 * S.bs, y: by - 4 - lvl * 6 * S.bs, t: 1.3 + i * 0.03 });
    }
    // Bargeld: Bündel in Stapeln zu höchstens 6
    const [mx, my] = L.cash;
    const nB = k.cash.value > 0 ? Math.round(vClamp(sh(k.cash) * 32, 1, 24)) : 0, cols = Math.ceil(nB / 6);
    for (let i = 0; i < nB; i++) {
      const c = Math.floor(i / 6), lvl = i % 6;
      S.bundles.push({ x: mx + (c - (cols - 1) / 2) * 112 + (lvl % 2 ? 3 : -2), y: my - lvl * 20, t: 1.0 + i * 0.09, tone: R() < 0.5 ? 0 : 1 });
    }
    // Wertpapiere: Zettel auf dem Boden vor der Tafel
    const [px, py, ps] = L.pile;
    const papers = d.items.filter((i) => i.kind === "paper");
    const nS = k.paper.value > 0 ? Math.round(vClamp(sh(k.paper) * 30 + papers.length * 2, 4, 44)) : 0;
    for (let i = 0; i < nS; i++) {
      const a = R() * Math.PI * 2, rr = Math.sqrt(R());
      S.sheets.push({ x: px + Math.cos(a) * rr * 150 * ps, y: py + Math.sin(a) * rr * 45 * ps + 40 * ps, rot: (R() - 0.5) * 1.6,
        kind: i % 3, t: 0.5 + i * 0.045, sway: R() * 6, s: ps });
    }
    S.sheets.sort((a, b) => a.y - b.y);
    for (let i = 0; i < 9 && nCoins; i++) S.sparkles.push({ x: cx + (R() * 2 - 1) * 90 * cs, y: cy - 10 * cs - R() * mound * cs, ph: R() * 6 });
    // Klickflächen
    const [b0, b1, b2, b3] = L.board;
    S.hits = [
      { key: "metal", x0: cx - 140 * cs, y0: cy - 140 * cs, x1: Math.max(cx + 140 * cs, bx + 230 * S.bs), y1: by + 25 },
      { key: "cash", x0: mx - cols * 60 - 10, y0: my - 150, x1: mx + cols * 60 + 10, y1: my + 30 },
      { key: "paper", x0: Math.min(b0, px - 170 * ps), y0: b1, x1: Math.max(b2, px + 170 * ps), y1: py + 110 * ps },
    ];
    if (!nB) S.hits[1] = { key: "cash", x0: mx - 70, y0: my - 60, x1: mx + 70, y1: my + 20 };
    S.bg = this.background(W, H, S.floor);
    return S;
  },

  background(W, H, floor) {
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d"), R = vRand(42);
    let gr = g.createLinearGradient(0, 0, 0, floor);
    gr.addColorStop(0, "#1b1712"); gr.addColorStop(1, "#2c241b");
    g.fillStyle = gr; g.fillRect(0, 0, W, floor);
    for (let y = 0, row = 0; y < floor; y += 34, row++) {  // Mauersteine
      for (let x = (row % 2) * -45; x < W; x += 90) {
        const v = 30 + R() * 18;
        g.fillStyle = `rgb(${v + 14},${v + 8},${v})`;
        g.fillRect(x + 2, y + 2, 86, 30);
      }
    }
    gr = g.createLinearGradient(0, floor, 0, H);
    gr.addColorStop(0, "#3a3026"); gr.addColorStop(1, "#1a1510");
    g.fillStyle = gr; g.fillRect(0, floor, W, H - floor);
    g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2;
    for (let i = 1; i < 6; i++) { const y = floor + (H - floor) * (i / 6) ** 1.6; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    for (let i = -6; i <= 6; i++) { g.beginPath(); g.moveTo(W / 2 + i * 60, floor); g.lineTo(W / 2 + i * 200, H); g.stroke(); }
    gr = g.createLinearGradient(0, floor - 30, 0, floor + 10);  // Schatten Wand/Boden
    gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.45)");
    g.fillStyle = gr; g.fillRect(0, floor - 30, W, 40);
    return c;
  },

  // ---------------------------------------------------------------- Zeichnen
  loop() {
    cancelAnimationFrame(this.raf);
    const tick = () => {
      if (!$("#vault-cv") || !current.startsWith("money/vault")) return;
      if (!document.hidden) this.draw();
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },

  draw() {
    const cv = $("#vault-cv");
    if (!cv || !cv.clientWidth) return;
    if (!this.scene || this.scene.portrait !== cv.clientWidth < 640) this.scene = this.build(cv);
    const S = this.scene, dpr = window.devicePixelRatio || 1;
    const wantH = Math.round(cv.clientWidth * S.H / S.W);
    if (cv.style.height !== `${wantH}px`) cv.style.height = `${wantH}px`;
    const pw = Math.round(cv.clientWidth * dpr), ph = Math.round(wantH * dpr);
    if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
    const g = cv.getContext("2d"), t = (performance.now() - this.t0) / 1000, now = performance.now() / 1000;
    g.setTransform(pw / S.W, 0, 0, ph / S.H, 0, 0);
    g.drawImage(S.bg, 0, 0);
    for (const [x, y] of S.L.torches) this.torch(g, x, y, now);
    this.board(g, S, t);
    this.chest(g, S, t, now);
    this.barsAndSilver(g, S, t);
    this.cash(g, S, t);
    this.sheets(g, S, t);
    this.labels(g, S, t);
    const hl = this.hover || this.sel;
    if (hl) {
      const h = S.hits.find((x) => x.key === hl);
      g.save(); g.strokeStyle = this.sel === hl ? "rgba(255,214,102,.9)" : "rgba(255,214,102,.5)"; g.lineWidth = 3; g.setLineDash([10, 8]);
      g.strokeRect(h.x0, h.y0, h.x1 - h.x0, h.y1 - h.y0); g.restore();
    }
  },

  torch(g, x, y, now) {
    const f = 0.85 + 0.1 * Math.sin(now * 9 + x) + 0.05 * Math.sin(now * 23 + y);
    const gr = g.createRadialGradient(x, y, 4, x, y, 260 * f);
    gr.addColorStop(0, "rgba(255,180,80,.38)"); gr.addColorStop(1, "rgba(255,140,40,0)");
    g.fillStyle = gr; g.fillRect(x - 280, y - 280, 560, 560);
    g.fillStyle = "#3b2a1c"; g.fillRect(x - 6, y + 4, 12, 46);
    g.fillStyle = "#5a4a3a"; g.fillRect(x - 12, y, 24, 8);
    g.fillStyle = "#ffcf6b"; g.beginPath(); g.ellipse(x, y - 10 * f, 8, 16 * f, 0, 0, 7); g.fill();
    g.fillStyle = "#fff4c2"; g.beginPath(); g.ellipse(x, y - 6, 4, 8 * f, 0, 0, 7); g.fill();
  },

  coin(g, x, y, r, pal, flat = 0.42) {
    g.fillStyle = pal[3]; g.beginPath(); g.ellipse(x, y + r * 0.18, r, r * flat, 0, 0, 7); g.fill();
    const gr = g.createLinearGradient(x - r, y - r, x + r, y + r);
    gr.addColorStop(0, pal[0]); gr.addColorStop(0.5, pal[1]); gr.addColorStop(1, pal[2]);
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * flat, 0, 0, 7); g.fill();
    g.strokeStyle = pal[2]; g.lineWidth = 1; g.beginPath(); g.ellipse(x, y, r * 0.7, r * flat * 0.7, 0, 0, 7); g.stroke();
  },

  chest(g, S, t, now) {
    const [cx, cy, s] = S.L.chest, w = 125 * s, pal = VK.gold.c;
    // Deckel (offen, nach hinten gekippt)
    g.fillStyle = "#5b3a1e"; g.beginPath();
    g.moveTo(cx - w, cy - 22 * s); g.lineTo(cx + w, cy - 22 * s); g.lineTo(cx + w - 10 * s, cy - 125 * s); g.lineTo(cx - w + 10 * s, cy - 125 * s); g.closePath(); g.fill();
    g.strokeStyle = "#2e1d0e"; g.lineWidth = 3; g.stroke();
    g.fillStyle = "#8a8f96"; for (const f of [-0.6, 0.6]) g.fillRect(cx + f * w - 7 * s, cy - 124 * s, 14 * s, 102 * s);
    // Innenraum
    g.fillStyle = "#1a100a"; g.beginPath();
    g.moveTo(cx - w, cy - 22 * s); g.lineTo(cx + w, cy - 22 * s); g.lineTo(cx + w, cy); g.lineTo(cx - w, cy); g.closePath(); g.fill();
    // Goldberg: wächst mit den gelandeten Münzen
    if (S.coins.length) {
      const landed = S.coins.filter((c) => t - c.t > 0.7).length / S.coins.length, top = Math.min(...S.coins.map((c) => c.y));
      if (landed > 0) {
        const hgt = (cy - 6 * s - top) * landed, gr = g.createLinearGradient(0, cy - hgt, 0, cy);
        gr.addColorStop(0, pal[1]); gr.addColorStop(1, pal[3]);
        g.fillStyle = gr; g.beginPath(); g.moveTo(cx - w + 4, cy);
        g.quadraticCurveTo(cx - w * 0.5, cy - hgt * 1.1, cx, cy - hgt * 1.15); g.quadraticCurveTo(cx + w * 0.5, cy - hgt * 1.1, cx + w - 4, cy); g.closePath(); g.fill();
      }
    }
    // Goldmünzen: fallen in die Truhe
    for (const c of S.coins) {
      const p = (t - c.t) / 0.7;
      if (p <= 0) continue;
      const y = p >= 1 ? c.y : -40 + (c.y + 40) * vBounce(p), x = p >= 1 ? c.x : cx + (c.x - cx) * vEase(p);
      this.coin(g, x, y, c.r, pal, p >= 1 ? 0.42 : 0.42 + 0.5 * Math.abs(Math.sin(p * 9 + c.rot * 6)));
    }
    // Glanz auf dem Gold
    if (t > 2) for (const sp of S.sparkles) {
      const a = Math.max(0, Math.sin(now * 2 + sp.ph)) ** 8;
      if (a < 0.05) continue;
      g.save(); g.globalAlpha = a; g.strokeStyle = "#fffbe0"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(sp.x - 9, sp.y); g.lineTo(sp.x + 9, sp.y); g.moveTo(sp.x, sp.y - 9); g.lineTo(sp.x, sp.y + 9); g.stroke(); g.restore();
    }
    // Truhe vorne
    const gr = g.createLinearGradient(0, cy, 0, cy + 115 * s);
    gr.addColorStop(0, "#8b5a2b"); gr.addColorStop(1, "#5b3a1e");
    g.fillStyle = gr; g.fillRect(cx - w, cy, 2 * w, 115 * s);
    g.strokeStyle = "rgba(40,22,10,.55)"; g.lineWidth = 2;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(cx - w, cy + i * 28 * s); g.lineTo(cx + w, cy + i * 28 * s); g.stroke(); }
    g.fillStyle = "#9aa1a9"; for (const f of [-0.6, 0.6]) g.fillRect(cx + f * w - 7 * s, cy, 14 * s, 115 * s);
    g.fillRect(cx - w, cy - 3 * s, 2 * w, 8 * s);
    g.fillStyle = "#d4a531"; g.fillRect(cx - 14 * s, cy + 18 * s, 28 * s, 32 * s);
    g.fillStyle = "#3a2a10"; g.beginPath(); g.arc(cx, cy + 30 * s, 5 * s, 0, 7); g.fill(); g.fillRect(cx - 2 * s, cy + 30 * s, 4 * s, 12 * s);
  },

  bar(g, x, y, pal, k = 1) {
    const w = 52 * k, h = 16 * k, d = 9 * k;
    g.fillStyle = pal[1]; g.beginPath(); g.moveTo(x - w / 2 + 6, y - h - d); g.lineTo(x + w / 2 - 6, y - h - d); g.lineTo(x + w / 2, y - h); g.lineTo(x - w / 2, y - h); g.closePath(); g.fill();
    const gr = g.createLinearGradient(0, y - h, 0, y);
    gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[2]);
    g.fillStyle = gr; g.fillRect(x - w / 2, y - h, w, h);
    g.strokeStyle = pal[3]; g.lineWidth = 1; g.strokeRect(x - w / 2, y - h, w, h);
    g.strokeRect(x - w / 2 + 10, y - h + 4, w - 20, h - 8);
  },

  barsAndSilver(g, S, t) {
    for (const b of S.bars) {
      const p = (t - b.t) / 0.6;
      if (p <= 0) continue;
      this.bar(g, b.x, b.y - (1 - vBounce(p)) * 260, VK[b.metal].c, S.bs);
    }
    for (const c of S.silverCoins) {
      const p = (t - c.t) / 0.4;
      if (p <= 0) continue;
      this.coin(g, c.x, c.y - (1 - vBounce(p)) * 200, 12 * S.bs, VK.silver.c, 0.38);
    }
  },

  bundle(g, x, y, tone) {
    const w = 100, h = 18, d = 12, pal = tone ? ["#dfe9f5", "#a8bfdc", "#6d88ad", "#3a4f6e"] : VK.cash.c;
    g.fillStyle = pal[1]; g.beginPath(); g.moveTo(x - w / 2 + 10, y - h - d); g.lineTo(x + w / 2 + 10, y - h - d); g.lineTo(x + w / 2, y - h); g.lineTo(x - w / 2, y - h); g.closePath(); g.fill();
    g.fillStyle = pal[2]; g.beginPath(); g.moveTo(x + w / 2, y - h); g.lineTo(x + w / 2 + 10, y - h - d); g.lineTo(x + w / 2 + 10, y - d); g.lineTo(x + w / 2, y); g.closePath(); g.fill();
    g.fillStyle = pal[1]; g.fillRect(x - w / 2, y - h, w, h);
    g.strokeStyle = pal[3]; g.lineWidth = 0.8;
    for (let i = 3; i < h; i += 3) { g.beginPath(); g.moveTo(x - w / 2, y - h + i); g.lineTo(x + w / 2, y - h + i); g.stroke(); }
    g.fillStyle = "#f6edd0"; g.fillRect(x - 9, y - h, 18, h);  // Banderole
    g.beginPath(); g.moveTo(x - 9 + 10, y - h - d); g.lineTo(x + 9 + 10, y - h - d); g.lineTo(x + 9, y - h); g.lineTo(x - 9, y - h); g.closePath(); g.fill();
    g.fillStyle = pal[3]; g.font = "bold 10px system-ui, sans-serif"; g.textAlign = "center"; g.fillText("€", x, y - 5);
  },

  cash(g, S, t) {
    for (const b of S.bundles) {
      const p = (t - b.t) / 0.55;
      if (p <= 0) continue;
      this.bundle(g, b.x, b.y - (1 - vBounce(p)) * 300, b.tone);
    }
  },

  sheets(g, S, t) {
    for (const sh of S.sheets) {
      const p = (t - sh.t) / 1.3;
      if (p <= 0) continue;
      const e = vEase(p), x = sh.x + Math.sin(p * 9 + sh.sway) * 30 * (1 - e), y = -60 + (sh.y + 60) * e;
      g.save(); g.translate(x, y); g.rotate(sh.rot * e + Math.sin(p * 7) * 0.5 * (1 - e)); g.scale(sh.s, sh.s * (0.55 + 0.45 * (1 - e) ** 2));
      g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(-33, -21, 70, 46);
      g.fillStyle = VK.paper.c[sh.kind === 1 ? 0 : 1]; g.fillRect(-35, -24, 70, 46);
      g.strokeStyle = VK.paper.c[3]; g.lineWidth = 1;
      if (sh.kind === 1) {  // Zertifikat mit Siegel
        g.strokeRect(-31, -20, 62, 38); g.fillStyle = "#c9a227"; g.beginPath(); g.arc(20, 8, 7, 0, 7); g.fill();
        for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-24, -12 + i * 7); g.lineTo(8, -12 + i * 7); g.stroke(); }
      } else if (sh.kind === 2) {  // Kursgraph
        g.strokeStyle = "#2f7d5b"; g.lineWidth = 2; g.beginPath(); g.moveTo(-28, 12);
        [[-18, 4], [-8, 8], [2, -4], [12, 0], [26, -14]].forEach(([a, b]) => g.lineTo(a, b)); g.stroke();
      } else {
        for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(-28, -16 + i * 7); g.lineTo(i % 2 ? 18 : 28, -16 + i * 7); g.stroke(); }
      }
      g.restore();
    }
  },

  board(g, S, t) {
    const [x0, y0, x1, y1] = S.L.board, d = this.d;
    g.fillStyle = "#5b3a1e"; g.fillRect(x0 - 12, y0 - 12, x1 - x0 + 24, y1 - y0 + 24);
    g.fillStyle = "#1e3329"; g.fillRect(x0, y0, x1 - x0, y1 - y0);
    g.fillStyle = "rgba(255,255,255,.04)"; g.fillRect(x0 + 20, y0 + 30, (x1 - x0) * 0.6, 8);
    const chalk = "rgba(240,244,235,.92)", rows = d.items.filter((i) => i.kind === "paper");
    const maxRows = S.portrait ? 7 : 6, fs = S.portrait ? 30 : 17, rh = (y1 - y0 - 64) / maxRows;
    g.fillStyle = chalk; g.textAlign = "left"; g.font = `600 ${fs + 3}px "Segoe Print", "Bradley Hand", system-ui, sans-serif`;
    g.fillText("Wertpapiere", x0 + 18, y0 + 34);
    g.textAlign = "right"; g.fillText(eur(d.kinds.paper.value, d.base_currency), x1 - 18, y0 + 34);
    g.strokeStyle = "rgba(240,244,235,.5)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x0 + 16, y0 + 46); g.lineTo(x1 - 16, y0 + 46); g.stroke();
    if (!rows.length) { g.textAlign = "left"; g.font = `${fs}px system-ui, sans-serif`; g.fillText("Noch keine Wertpapiere.", x0 + 18, y0 + 90); return; }
    const shown = rows.slice(0, rows.length > maxRows ? maxRows - 1 : maxRows);
    const sw = S.portrait ? 170 : 80, sx = x1 - 16 - sw, colP = sx - 12, colN = x0 + 18;
    g.font = `${fs}px system-ui, sans-serif`;
    const pw = g.measureText("+100 %").width, colV = colP - pw - 14;
    const fit = (txt, max) => { if (g.measureText(txt).width <= max) return txt; while (txt.length > 1 && g.measureText(`${txt}…`).width > max) txt = txt.slice(0, -1); return `${txt}…`; };
    shown.forEach((r, i) => {
      const p = vClamp((t - 1.0 - i * 0.22) / 0.6, 0, 1);
      if (p <= 0) return;
      const y = y0 + 64 + i * rh + rh / 2;
      g.save(); g.globalAlpha = p;
      g.font = `${fs}px system-ui, sans-serif`; g.fillStyle = chalk; g.textAlign = "left";
      const val = eur(r.value, d.base_currency).replace(/,\d\d\s/, " ");
      g.fillText(fit(r.name, colV - g.measureText(val).width - 14 - colN), colN, y + fs * 0.35);
      g.textAlign = "right"; g.fillText(val, colV, y + fs * 0.35);
      if (r.pnl_pct != null) { g.fillStyle = r.pnl_pct >= 0 ? "#9be58a" : "#ff9b8f"; g.fillText(`${r.pnl_pct >= 0 ? "+" : ""}${fmtN(r.pnl_pct, 0)} %`, colP, y + fs * 0.35); }
      g.restore();
      const sp = r.spark;
      if (sp.length > 1) {  // Kursgraph mit Kreide, wird gezogen
        const lo = Math.min(...sp), hi = Math.max(...sp), bx = sx, bh = rh * 0.62, n = Math.max(2, Math.ceil(sp.length * p));
        g.strokeStyle = sp[sp.length - 1] >= sp[0] ? "#b9f0a8" : "#ffb3a8"; g.lineWidth = S.portrait ? 3 : 2; g.beginPath();
        for (let j = 0; j < n; j++) {
          const xx = bx + (j / (sp.length - 1)) * sw, yy = y + bh / 2 - (hi > lo ? (sp[j] - lo) / (hi - lo) : 0.5) * bh;
          j ? g.lineTo(xx, yy) : g.moveTo(xx, yy);
        }
        g.stroke();
      }
    });
    if (rows.length > shown.length && t > 2) {
      g.font = `italic ${fs}px system-ui, sans-serif`; g.fillStyle = "rgba(240,244,235,.7)"; g.textAlign = "left";
      g.fillText(`+ ${rows.length - shown.length} weitere`, colN, y0 + 64 + shown.length * rh + rh / 2 + fs * 0.35);
    }
  },

  labels(g, S, t) {
    if (t < 1.5) return;
    const d = this.d, a = vClamp((t - 1.5) / 0.6, 0, 1), fs = S.portrait ? 28 : 17;
    const tag = (x, y, title, val) => {
      g.save(); g.globalAlpha = a; g.font = `600 ${fs}px system-ui, sans-serif`; g.textAlign = "center";
      const txt = `${title} · ${val}`, w = g.measureText(txt).width + 24;
      g.fillStyle = "rgba(12,9,6,.72)"; g.fillRect(x - w / 2, y - fs, w, fs * 1.6);
      g.strokeStyle = "rgba(224,179,65,.6)"; g.strokeRect(x - w / 2, y - fs, w, fs * 1.6);
      g.fillStyle = "#f4e3b0"; g.fillText(txt, x, y + fs * 0.12); g.restore();
    };
    const metal = d.kinds.gold.value + d.kinds.silver.value, pc = (v) => `${fmtN(d.total ? v / d.total * 100 : 0, 0)} %`;
    const [cx, cy, cs] = S.L.chest, [mx, my] = S.L.cash;
    if (S.portrait) tag(cx + 60, S.L.bars[1] + 45, "Edelmetalle", pc(metal));
    else tag(cx + 40, cy - 150 * cs, "Edelmetalle", pc(metal));
    tag(mx, my - Math.min(6, Math.max(1, S.bundles.length)) * 20 - 48, "Bargeld", pc(d.kinds.cash.value));
    const [px, py, ps] = S.L.pile;
    tag(px, py + (S.portrait ? 110 : 115) * ps, "Wertpapiere", pc(d.kinds.paper.value));
  },
};

</script>
  <script>
"use strict";

// News: je Rubrik eine Spalte. Oben die Zusammenfassung (Claude, jeder Punkt mit Quellen),
// darunter die neuesten Schlagzeilen. Links öffnen die Originalseite in einem neuen Tab.
const ago = (iso) => {
  if (!iso) return "";
  const min = Math.round((Date.now() - new Date(iso.replace(" ", "T"))) / 60000);  // Safari: "T" statt Leerzeichen
  if (Number.isNaN(min)) return "";
  return min < 60 ? `vor ${Math.max(1, min)} Min` : min < 24 * 60 ? `vor ${Math.round(min / 60)} Std` : fmtDate(iso.slice(0, 10));
};
const extLink = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`;

const News = {
  data: null,

  async load() { this.data = await api("/api/news"); },

  column(c) {
    const pts = c.digest?.points || [];
    return `<section class="panel news-col">
      <header class="ptitle"><span>${esc(c.name)}</span>${c.digest ? `<span class="muted-inv">${esc(ago(c.digest.created_at))}</span>` : ""}</header>
      ${pts.length ? `<ol class="digest">${pts.map((p) => `<li><p>${esc(p.text)}</p>
        <div class="srcs">${p.sources.map((s) => extLink(s.url, esc(s.source))).join("")}</div></li>`).join("")}</ol>`
        : `<p class="empty">${this.data.summaries ? "Noch keine Zusammenfassung – kommt mit dem nächsten Abruf." : "Zusammenfassung braucht den Anthropic-API-Key. Schlagzeilen gibt es trotzdem:"}</p>`}
      <div class="sub-h">Schlagzeilen</div>
      ${c.headlines.length ? `<ul class="headlines">${c.headlines.map((h) => `<li>${extLink(h.url, esc(h.title))}
        <div class="meta">${esc(h.source)} · ${esc(ago(h.published))}</div></li>`).join("")}</ul>`
        : `<p class="empty">Noch nichts abgerufen.</p>`}
    </section>`;
  },

  render() {
    const d = this.data;
    const st = Object.entries(d.status);
    const bad = st.filter(([, v]) => !v.ok);
    const lastAt = st.map(([, v]) => v.at).sort().pop();
    view.innerHTML = `
      <h1>${tx("News")}</h1>
      <p class="sub">${lastAt ? `Abgerufen ${esc(ago(lastAt))} aus ${st.length - bad.length} von ${st.length} Quellen.` : "Noch kein Abruf."}
        <button class="link" id="news-refresh">Jetzt abrufen</button></p>
        <div class="nav-row">${navCard("settings", { small: true, title: "News-Quellen", kicker: "Ändern in Einstellungen" })}</div>
      ${bad.length ? `<p class="rec warning"><span class="grow">Nicht erreichbar: ${bad.map(([k, v]) => `${esc(k)} (${esc(v.error)})`).join("; ")}</span></p>` : ""}
      <div class="news-grid">${d.categories.map((c) => this.column(c)).join("")}</div>`;
    $("#news-refresh").onclick = async (e) => {
      e.target.disabled = true;
      e.target.textContent = "ruft ab …";
      try {
        await post("/api/news/refresh");
        await this.load();
        this.render();
      } catch (err) { showError(err); e.target.disabled = false; e.target.textContent = "Jetzt abrufen"; }
    };
  },
};

Object.assign(VIEWS, {
  async news() {
    await News.load();
    News.render();
  },
});

</script>
  <script>
"use strict";

// Bedienfeld "Wecker & Erinnerungen": alles, was klingelt oder erinnert, an einem Ort.
// Heute als Zeitstrahl (Wecker, feste Erinnerungen, Kipppunkt, Aufgaben mit Uhrzeit), darunter die
// nächsten 7 Tage; rechts Wecker bearbeiten (AlarmUI eingebettet), Erinnerungen an/aus, Geräte, Verlauf.
const CTL_ICON = {
  alarm: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M4.5 4.5l3 -2M19.5 4.5l-3-2"/>',
  sleep: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  brief: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  evening: '<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2.5 5-2.5 8H17v10"/>',
  tipping: '<path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/>',
  todo: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
};
const ctlIcon = (k) => `<svg class="ctl-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CTL_ICON[k] || CTL_ICON.todo}</svg>`;
const CTL_STATE = { geplant: "plan", gesendet: "ok", erledigt: "ok", reagiert: "ok", "nicht nötig": "ok", übergangen: "bad",
  "nicht zugestellt": "bad", verpasst: "bad", vorbei: "dim", aus: "dim", "heute nicht": "dim" };

const Control = {
  plan: null, nt: null,

  async load() {
    [this.plan, this.nt] = await Promise.all([api("/api/reminders/today"), api("/api/notify")]);
  },

  timeline() {
    const now = new Date().toTimeString().slice(0, 5);
    let marked = false;
    const row = (x) => {
      const mark = !marked && x.time && x.time >= now ? (marked = true, `<li class="ctl-now" aria-label="Jetzt"><span>${now}</span></li>`) : "";
      return `${mark}<li class="ctl-item k-${x.kind} s-${CTL_STATE[x.state] || "plan"}">
        <span class="ctl-time num">${esc(x.time || "–")}</span>${ctlIcon(x.kind)}
        <div class="grow"><b>${esc(x.title)}</b>${x.sub ? `<div class="meta">${esc(x.sub)}</div>` : ""}</div>
        <span class="ctl-state">${esc(x.state)}</span></li>`;
    };
    const items = this.plan.items.map(row).join("");
    return `<ul class="ctl-line">${items}${marked ? "" : `<li class="ctl-now"><span>${now}</span></li>`}</ul>`;
  },

  upcoming() {
    const u = this.plan.upcoming;
    return u.length ? `<ul class="list">${u.map((t) => `<li>${ctlIcon("todo")}<div class="grow">${esc(t.title)}
        <div class="meta">${esc(fmtDate(t.due_date))} · ${esc(t.due_time)}</div></div></li>`).join("")}</ul>`
      : `<p class="empty">Keine Aufgaben mit Uhrzeit. „Erinnere mich morgen um 14 Uhr an …“ sagen.</p>`;
  },

  async devices() {
    const nt = this.nt;
    // ohne Service Worker (Demo, manche Browser) antwortet die Push-Abfrage nie: nach 1,5 s aufgeben
    const sub = await Promise.race([Push.current().catch(() => null), new Promise((r) => setTimeout(() => r(null), 1500))]);
    const here = sub && nt.devices.some((d) => d.endpoint === sub.endpoint);
    return `<div class="ctl-dev ${here ? "ok" : "bad"}"><b>${here ? "Dieses Gerät bekommt Mitteilungen" : "Dieses Gerät bekommt keine Mitteilungen"}</b>
      <span class="meta">${nt.devices.length ? `Angemeldet: ${nt.devices.map((d) => esc(d.label) + (d.last_error ? ` (${esc(d.last_error)})` : "")).join(", ")}`
        : Push.iosBrowserTab ? "iPhone: Teilen → „Zum Home-Bildschirm“, dann die App von dort öffnen." : "Noch kein Gerät angemeldet."}</span>
      <div class="capture-row" style="justify-content:flex-start">
        ${here ? `<button class="ghost" data-push="off">Abmelden</button>` : `<button class="primary" data-push="on">Mitteilungen aktivieren</button>`}
        <button class="ghost" data-push="test" ${nt.devices.length ? "" : "disabled"}>Test senden</button></div></div>`;
  },

  settingsForm() {
    const ns = this.nt.settings;
    const DAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
    const sw = (name, on, label, extra = "") => `<div class="ctl-set"><label class="switch"><input type="checkbox" name="${name}" ${on ? "checked" : ""}
      aria-label="${esc(label)}"><span></span></label><span class="grow">${label}</span>${extra}</div>`;
    return `<form class="form" id="notify-form">
      ${sw("brief_on", ns.brief.on, "Tagesüberblick", `<input type="time" name="brief_time" value="${ns.brief.time || "06:30"}" aria-label="Uhrzeit Tagesüberblick">`)}
      ${sw("tipping_on", ns.tipping.on, "Kipppunkt: 15-Min-Aufgabe nach der Ausbildung",
        `<input type="number" name="tipping_offset" min="0" max="240" value="${ns.tipping.offset_min}" aria-label="Minuten nach Ausbildungsende"><span class="meta">Min</span>`)}
      ${sw("event_on", ns.event.on, "Termine vorher", `<input type="number" name="lead" min="0" max="240" value="${ns.event.lead_min}" aria-label="Minuten vorher"><span class="meta">Min</span>`)}
      ${sw("evening_on", ns.evening.on, "Essen & Sport abfragen", `<input type="time" name="evening_time" value="${ns.evening.time || "21:50"}" aria-label="Uhrzeit Abendfrage">`)}
      ${sw("sleep_on", ns.sleep.on, "Schlaf eintragen nach dem Aufwachen",
        `<input type="number" name="delay" min="0" max="240" value="${ns.sleep.delay_min}" aria-label="Minuten nach dem Wecker"><span class="meta">Min</span>`)}
      <details><summary>Feste Weckzeiten (nur ohne Aufstehwecker)</summary>
        <div class="wake-grid">${DAYS.map((d, i) => `<label>${d}<input type="time" name="wake-${i}" value="${ns.sleep.wake_times[String(i)] || ""}" aria-label="Weckzeit ${d}"></label>`).join("")}</div></details>
      <p class="meta">Aufgaben mit Uhrzeit erinnern immer: zur Uhrzeit, nach 10 und 20 Minuten, dann Stopp.</p>
      <button class="primary">Erinnerungen speichern</button></form>`;
  },

  history() {
    const r = this.nt.recent;
    return r.length ? `<ul class="list">${r.slice(0, 10).map((n) => `<li><div class="grow">${esc(n.title || n.kind)}
      <div class="meta">${esc((n.sent_at || n.due_at).replace("T", " ").slice(0, 16))} · ${esc(n.result || "geplant")}</div></div></li>`).join("")}</ul>`
      : `<p class="empty">Noch nichts gesendet.</p>`;
  },

  async render() {
    view.innerHTML = `
      <h1>Wecker & Erinnerungen</h1>
      <p class="sub">Heute ${esc(fmtDate(this.plan.date))} · <button class="link" data-voice>Jarvis sagen</button>, z. B. „Weck mich morgen um halb fünf“</p>
      <div class="ctl-grid">
        <div>
          <section class="panel" style="--accent:var(--cyan)" id="ctl-today">
            <header class="ptitle"><span>Heute</span><span class="meta">${this.plan.items.filter((x) => x.time).length} Punkte</span></header>
            ${this.timeline()}
          </section>
          <section class="panel" style="--accent:var(--violet)">
            <header class="ptitle"><span>Aufgaben mit Uhrzeit · 7 Tage</span></header>
            ${this.upcoming()}
          </section>
        </div>
        <div>
          <section class="panel" style="--accent:#b366f2" id="ctl-alarms">
            <header class="ptitle"><span>Wecker</span></header><div id="ctl-alarm-box"></div>
          </section>
          <section class="panel" style="--accent:var(--gold)">
            <header class="ptitle"><span>Erinnerungen</span></header>
            ${this.settingsForm()}
          </section>
          <section class="panel" style="--accent:var(--lime)">
            <header class="ptitle"><span>Geräte</span></header>
            <div id="ctl-dev"></div>
            <details><summary>Apple-Kurzbefehl: Schlaf-Erinnerung genau nach dem Wecker</summary>
              <ol class="howto"><li>Kurzbefehle → Automation → + → <b>Wecker</b> → „Wird gestoppt“ → Sofort ausführen.</li>
                <li><b>Inhalte von URL abrufen</b>: <code>${esc(location.origin)}/api/notify/woke</code>, Methode <b>POST</b>,
                  Header <code>Authorization</code> = <code>Bearer &lt;API_TOKEN&gt;</code>.</li></ol></details>
            <details><summary>Zuletzt gesendet</summary>${this.history()}</details>
          </section>
        </div>
      </div>`;
    view.onclick = (e) => this.click(e);
    $("#notify-form").onsubmit = (e) => this.save(e);
    await AlarmUI.mount($("#ctl-alarm-box"), () => this.refreshToday());
    $("#ctl-dev").innerHTML = await this.devices();
  },

  /** Nach Änderungen an Weckern: nur den Zeitstrahl neu. */
  async refreshToday() {
    if (!$("#ctl-today")) return;
    this.plan = await api("/api/reminders/today");
    $("#ctl-today .ctl-line").outerHTML = this.timeline();
  },

  async click(e) {
    const b = e.target.closest("button");
    if (!b || b.closest("#ctl-alarm-box")) return;
    if (b.dataset.voice !== undefined) return Dock.open();
    if (!b.dataset.push) return;
    b.disabled = true;
    try {
      if (b.dataset.push === "on") { await Push.enable(this.nt.public_key); toast("Mitteilungen aktiviert"); Sfx.play("coin"); }
      if (b.dataset.push === "off") { await Push.disable(); toast("Abgemeldet"); }
      if (b.dataset.push === "test") { const r = await post("/api/notify/test"); toast(`Gesendet an ${r.sent} Gerät(e)`); }
      this.nt = await api("/api/notify");
      $("#ctl-dev").innerHTML = await this.devices();
    } catch (err) { toast(err.message); Sfx.play("error"); b.disabled = false; }
  },

  async save(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const ns = this.nt.settings;
    const body = {
      sleep: { on: !!f.get("sleep_on"), delay_min: +f.get("delay"),
        wake_times: Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map((i) => [String(i), f.get(`wake-${i}`) || null])) },
      brief: { on: !!f.get("brief_on"), time: f.get("brief_time") || null },
      evening: { on: !!f.get("evening_on"), time: f.get("evening_time") || null },
      event: { on: !!f.get("event_on"), lead_min: +f.get("lead") },
      tipping: { on: !!f.get("tipping_on"), offset_min: +f.get("tipping_offset") },
    };
    try {
      this.nt.settings = { ...ns, ...(await api("/api/settings/notify", { method: "PUT", body })) };
      toast("Erinnerungen gespeichert"); Sfx.play("coin");
      await this.refreshToday();
    } catch (err) { toast(err.message); }
  },
};

Object.assign(VIEWS, {
  async wecker() {
    await Control.load();
    await Control.render();
  },
});

</script>

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#jarvis-overlay").hidden) { Dock.close(); return; }  // schließt das Jarvis-Overlay
  if (current !== "today" || !$("#mic") || e.target.closest("input, textarea, select, button, [contenteditable]")) return;
  if (e.code === "Space") { e.preventDefault(); Voice.toggle(); }
  if (e.key === "Escape") Voice.cancel();
});
window.addEventListener("hashchange", () => { current = location.hash.slice(1) || "today"; render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && current === "money") render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
render();
AlarmLink.handle();
TodoLink.handle();

</script>
