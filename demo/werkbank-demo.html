    on("#item-form", async (fd) => {
      await post("/api/school/items", { title: fd.get("title"), kind: fd.get("kind"), subject_id: num(fd.get("subject_id")),
        due_date: fd.get("due_date") || null, effort_min: num(fd.get("effort_min")) });
      Sfx.play("coin"); await this.refresh();
    });
    on("#study-form", async (fd) => {
      await post("/api/school/study", { subject_id: num(fd.get("subject_id")), minutes: +fd.get("minutes"), note: fd.get("note") || null });
      await this.refresh(); Sfx.play("coin"); lootPop("+ LERNZEIT"); toast(`${fmtMin(+fd.get("minutes"))} Lernzeit eingetragen`);
    });
    on("#subject-form", async (fd) => { await post("/api/school/subjects", { name: fd.get("name") }); await this.refresh(); });
    on("#file-form", async (fd) => {
      const sid = fd.get("subject_id");
      for (const file of fd.getAll("file")) {
        const q = new URLSearchParams({ name: file.name, ...(sid ? { subject_id: sid } : {}) });
        const res = await fetch(`/api/school/files?${q}`, { method: "POST", body: file,
          headers: { Authorization: `Bearer ${token()}`, "Content-Type": file.type || "application/octet-stream" } });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Upload fehlgeschlagen (${res.status})`);
      }
      toast("Hochgeladen"); await this.refresh();
    });
    view.querySelectorAll("[data-grade-item]").forEach((form) => form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const g = parseFloat(String(new FormData(form).get("grade")).replace(",", "."));
      const it = this.data.open.find((x) => x.id === +form.dataset.gradeItem);
      try {
        await api(`/api/school/items/${it.id}`, { method: "PUT", body: { ...it, grade: g, done: true } });
        Sfx.play(g <= 2.5 ? "clear" : "coin"); if (g <= 1.5) levelUp(null, "SPITZENNOTE!");
        await this.refresh();
      } catch (err) { toast(err.message); }
    }));
  },

  async openFile(id) {
    const res = await fetch(`/api/school/files/${id}`, { headers: { Authorization: `Bearer ${token()}` } });
    if (!res.ok) return toast("Datei nicht gefunden");
    const url = URL.createObjectURL(await res.blob());
    const name = (res.headers.get("content-disposition") || "").match(/filename\*?=(?:UTF-8'')?"?([^";]+)/)?.[1];
    const a = Object.assign(document.createElement("a"), { href: url, target: "_blank", rel: "noopener" });
    if (/attachment/.test(res.headers.get("content-disposition") || "")) a.download = decodeURIComponent(name || "Datei");
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },

  async refresh() { await this.load(); this.render(); },

  async click(e) {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    try {
      if (d.filter !== undefined) { this.filter = d.filter ? +d.filter : null; return this.render(); }
      if (d.itemDone) {
        const it = this.data.open.find((x) => x.id === +d.itemDone);
        await api(`/api/school/items/${it.id}`, { method: "PUT", body: { ...it, done: true } });
        burst(b); Sfx.play("clear"); return await this.refresh();
      }
      if (d.delItem && confirm("Eintrag löschen?")) { await api(`/api/school/items/${d.delItem}`, { method: "DELETE" }); return await this.refresh(); }
      if (d.delStudy) { await api(`/api/school/study/${d.delStudy}`, { method: "DELETE" }); return await this.refresh(); }
      if (d.openFile) return await this.openFile(d.openFile);
      if (d.delFile && confirm("Datei löschen?")) { await api(`/api/school/files/${d.delFile}`, { method: "DELETE" }); return await this.refresh(); }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },
};

    School.render();
    view.onclick = (e) => School.click(e);
  },

  <script>
"use strict";

// Finanzen: Verteilung (Ring mit Drilldown), Vermögensverlauf, Positionen pflegen
const STATUS_LABEL = { missing: "Kurs fehlt", fx_missing: "Wechselkurs fehlt", stale: "Kurs veraltet", manual: "fester Wert" };
const DIMS = { portfolio: "Portfolios", asset_class: "Anlageklasse", position: "Titel" };
const RANGES = ["1M", "6M", "1J", "MAX"];

const Finance = {
  data: null,
  focus: null, // Name des aufgeklappten Portfolios
  editing: null,

  async load(force = false) {
    [this.data, this.plans] = await Promise.all([
      api(`/api/portfolio${force ? "?refresh=1" : ""}`),
      api("/api/savings-plans").catch(() => ({ plans: [], pending: [] })),
    ]);
  },

  worth(d) {
    return `
      <div class="worth">
        <div class="big">${eur(d.total, d.base_currency)}</div>
        <p class="sub"><span class="${cls(d.pnl)}">${d.pnl >= 0 ? "▲ +" : "▼ "}${eur(d.pnl, d.base_currency)} (${pct(d.pnl_pct)})</span>
          auf ${eur(d.invested, d.base_currency)} investiert</p>
        ${d.tax_reserve > 0 ? `<p class="reserve">Steuern zurückgelegt: <b>${eur(d.tax_reserve, d.base_currency)}</b>
          · verfügbar <b>${eur(d.available_total, d.base_currency)}</b></p>` : ""}
        <p class="muted">${d.prices_as_of ? `Kurse von ${esc(d.prices_as_of.replace("T", " ").slice(0, 16))} Uhr` : "Noch keine Live-Kurse"}
          · <button class="link" data-fin="refresh">Kurse aktualisieren</button></p>
        ${d.complete ? "" : `<p class="warn-box">⚠ Nicht mitgezählt, weil ein Kurs fehlt: ${d.missing.map(esc).join(", ")}.
          Summe und Diagramme zeigen nur, was sicher bewertet ist.</p>`}
      </div>`;
  },

  /** Oberste Ebene: nach Dimension; Drilldown: Positionen eines Portfolios. */
  allocation() {
    const d = this.data, host = $("#alloc");
    const dim = sessionStorage.getItem("dim") || "portfolio";
    const valued = d.positions.filter((p) => p.value != null);
    $("#alloc-head").innerHTML = this.focus
      ? `<button class="link" data-fin="up">Alle Portfolios</button> › <b>${esc(this.focus)}</b>`
      : `<div class="seg" role="group" aria-label="Aufteilen nach">${Object.entries(DIMS).map(([k, v]) =>
          `<button data-dim="${k}" class="${k === dim ? "on" : ""}" aria-pressed="${k === dim}">${v}</button>`).join("")}</div>`;
    if (!valued.length) { host.innerHTML = `<p class="empty">Noch nichts bewertet.</p>`; return; }

    if (this.focus) {
      const ps = valued.filter((p) => p.portfolio === this.focus);
      donut(host, ps.map((p) => ({ name: p.name, value: p.value })),
        { label: `Positionen in ${this.focus}`, centerLabel: this.focus });
      host.insertAdjacentHTML("beforeend", this.positionTable(d.positions.filter((p) => p.portfolio === this.focus), false));
      return;
    }
    const items = d.allocation[dim].map((a) => ({ name: a.name, value: a.value }));
    donut(host, items, {
      label: `Vermögen nach ${DIMS[dim]}`,
      onSelect: dim === "portfolio" ? (x) => { this.focus = x.name; this.allocation(); } : null,
    });
    if (dim === "portfolio") host.insertAdjacentHTML("beforeend", `<p class="muted">Portfolio antippen für die einzelnen Positionen.</p>`);
  },

  /** Sparplan-Käufe desselben Titels zu einer Zeile zusammenfassen (aufklappbar), auch über
   *  Planwechsel hinweg (alter und neuer Plan in denselben ETF). Sonst wird die Liste endlos. */
  planRollup(ps) {
    const out = [], seen = {};
    for (const p of ps) {
      if (!p.plan_id) { out.push(p); continue; }
      const key = `${p.ticker}|${p.name}`;
      let g = seen[key];
      if (!g) {
        g = seen[key] = { ...p, lots: [], quantity: 0, value: 0, cost: 0, bought_at: p.bought_at, rollup: true,
          group: `g${Object.keys(seen).length}-${p.portfolio_id}` };
        out.push(g);
      }
      g.lots.push(p);
      g.quantity += p.quantity;
      g.cost += p.cost ?? NaN;
      g.value = g.value == null || p.value == null ? null : g.value + p.value;
      if (p.bought_at < g.bought_at) g.bought_at = p.bought_at;
      if (p.status !== "live") g.status = p.status;
    }
    out.filter((g) => g.rollup).forEach((g) => {
      g.entry_price = g.quantity ? g.cost / g.quantity : 0;  // Durchschnittskurs
      g.pnl = g.value == null || Number.isNaN(g.cost) ? null : g.value - g.cost;
      g.pnl_pct = g.pnl == null || !g.cost ? null : Math.round((g.pnl / g.cost) * 10000) / 100;
      g.lots.sort((a, b) => (a.bought_at < b.bought_at ? -1 : 1));
    });
    return out;
  },

  positionRow(p, total, actions, extra = "") {
    const lotsInfo = p.rollup ? `Sparplan · ${p.lots.length} ${p.lots.length === 1 ? "Kauf" : "Käufe"} · Ø-Kurs` : "";
    return `<tr class="${extra}">
        <td>${esc(p.name)}<div class="meta">${[lotsInfo, p.ticker, p.bought_at && `seit ${fmtDate(p.bought_at.slice(0, 10))}`,
          p.plan_id && !p.rollup && "Sparplan, Stück geschätzt"].filter(Boolean).map(esc).join(" · ")}
          ${STATUS_LABEL[p.status] && p.status !== "manual" ? ` · <span class="overdue">${STATUS_LABEL[p.status]}</span>` : ""}</div></td>
        <td class="num">${p.quantity.toLocaleString("de-DE", { maximumFractionDigits: 4 })}</td>
        <td class="num">${eur(p.entry_price, p.currency)}</td>
        <td class="num">${p.price == null ? "–" : eur(p.price, p.price_currency || p.currency)}</td>
        <td class="num">${p.value == null ? "–" : eur(p.value)}</td>
        <td class="num ${cls(p.pnl)}">${p.pnl == null ? "–" : `${eur(p.pnl)}<div class="meta ${cls(p.pnl)}">${pct(p.pnl_pct)}</div>`}</td>
        <td class="num">${p.value != null && total ? `${((p.value / total) * 100).toLocaleString("de-DE", { maximumFractionDigits: 1 })} %` : "–"}</td>
        ${actions ? `<td class="num">${p.rollup ? `<button class="link" data-lots="${p.group}">Käufe</button>`
          : `<button class="link" data-edit="${p.id}">bearbeiten</button>`}</td>` : ""}
      </tr>`;
  },

  positionTable(ps, actions = true) {
    const total = this.data.total;
    return `<div class="table-wrap"><table class="pos-table">
      <thead><tr><th>Titel</th><th class="num">Stück</th><th class="num">Einstieg</th><th class="num">Kurs</th>
        <th class="num">Wert</th><th class="num">G/V</th><th class="num">Anteil gesamt</th>${actions ? "<th></th>" : ""}</tr></thead>
      <tbody>${this.planRollup(ps).map((p) => this.positionRow(p, total, actions)
        + (p.rollup && actions ? p.lots.map((l) => this.positionRow(l, total, actions, `lot-row lots-${p.group}`)).join("") : "")).join("")}
      </tbody></table></div>`;
  },

  // ---------------------------------------------------------------- Sparpläne
  plans: { plans: [], pending: [] },

  plansSection() {
    const { plans, pending } = this.plans;
    const day = (n) => `${n}.`;
    return `<h2>Sparpläne</h2>
      <p class="muted">Jede Ausführung wird als Kauf zum Schlusskurs des Tages gebucht (Wochenende: nächster Handelstag).
        Die Stückzahl ist geschätzt; weicht die Abrechnung ab, den Kauf unter „Käufe“ bearbeiten.
        Wechsel (anderer Betrag oder ETF): alten Plan beenden, neuen anlegen.</p>
      ${plans.length ? `<div class="table-wrap"><table class="pos-table plan-table">
        <thead><tr><th>Plan</th><th class="num">Rate</th><th class="num">Tag</th><th>Laufzeit</th><th class="num">Eingezahlt</th><th></th></tr></thead>
        <tbody>${plans.map((p) => `<tr class="${p.active ? "" : "plan-ended"}">
          <td>${esc(p.name)}<div class="meta">${[p.portfolio, p.ticker, p.isin].filter(Boolean).map(esc).join(" · ")}</div></td>
          <td class="num">${eur(p.amount)}</td>
          <td class="num">${day(p.day_of_month)}</td>
          <td>${esc(fmtDate(p.start_date))} – ${p.end_date ? esc(fmtDate(p.end_date)) : "läuft"}
            ${p.next_date ? `<div class="meta">nächste: ${esc(fmtDate(p.next_date))}</div>` : ""}</td>
          <td class="num">${eur(p.invested)}<div class="meta">${p.executions} ${p.executions === 1 ? "Kauf" : "Käufe"}</div></td>
          <td class="num">${p.active ? `<button class="link" data-plan-end="${p.id}">beenden</button> · ` : ""}<button class="link overdue" data-plan-delete="${p.id}">löschen</button></td>
        </tr>`).join("")}</tbody></table></div>` : `<p class="empty">Noch kein Sparplan.</p>`}
      ${pending.length ? `<p class="warn-box">Noch nicht gebucht (kein Kurs, wird nachgeholt):
        ${pending.map((x) => `${esc(x.plan)} ${esc(fmtDate(x.date))}${x.reason === "Kurs fehlt noch" ? "" : ` – ${esc(x.reason)}`}`).join(", ")}</p>` : ""}
      <details id="plan-details"><summary>Sparplan anlegen</summary>
        <form class="form" id="plan-form">
          <div class="two"><input name="portfolio" list="pf-list" placeholder="Portfolio, z. B. DKB" required>
            <input name="name" placeholder="Name, z. B. Asien-ETF" required></div>
          <div class="two"><input name="ticker" placeholder="Yahoo-Symbol in EUR, z. B. EUNL.DE" required><input name="isin" placeholder="ISIN"></div>
          <div class="two"><input name="amount" inputmode="decimal" placeholder="Rate in €" required>
            <input name="day_of_month" type="number" min="1" max="31" placeholder="Tag im Monat (1–31)" required></div>
          <div class="two"><label>Erste Ausführung ab<input name="start_date" type="date" required></label>
            <label>Letzte Ausführung (leer = läuft)<input name="end_date" type="date"></label></div>
          <div class="two"><input name="region" placeholder="Region, z. B. Asien"><input name="note" placeholder="Notiz"></div>
          <button class="primary">Sparplan anlegen</button>
        </form>
      </details>
      ${plans.length ? `<details><summary>Stückzahl mit Depot abgleichen</summary>
        <p class="muted">Die Käufe sind zum Schlusskurs geschätzt. Trag die Stückzahl aus der Depot-App ein:
          alle Sparplan-Käufe dieses Titels werden im selben Verhältnis angepasst, die eingezahlten Beträge bleiben.</p>
        <form class="form" id="reconcile-form">
          <select name="key" required>${[...new Map(plans.map((p) => [`${p.portfolio}|${p.ticker}`, p])).values()]
            .map((p) => `<option value="${esc(`${p.portfolio}|${p.ticker}`)}">${esc(p.portfolio)} · ${esc(p.name)} (${esc(p.ticker)})</option>`).join("")}</select>
          <div class="two"><input name="quantity" inputmode="decimal" placeholder="Stück laut Depot, z. B. 12,3456" required>
            <label>Stand vom<input name="as_of" type="date"></label></div>
          <button class="primary">Abgleichen</button>
        </form></details>` : ""}
      <details><summary>Sparpläne importieren</summary>
        <p class="muted">Spalten: portfolio;name;ticker;isin;amount;day_of_month;start_date;end_date;asset_class;region;note
          (Datum JJJJ-MM-TT, end_date leer = läuft). Ein Fehler in einer Zeile bricht den ganzen Import ab.</p>
        <form class="form" id="plan-csv-form"><textarea name="csv" placeholder="CSV hier einfügen"></textarea><button class="primary">Importieren</button></form>
      </details>`;
  },

  async planClick(b) {
    const { planEnd, planDelete, lots } = b.dataset;
    if (lots) {
      const rows = document.querySelectorAll(`.lot-row.lots-${lots}`);
      const open = ![...rows].some((r) => r.classList.contains("open"));
      rows.forEach((r) => r.classList.toggle("open", open));
      b.textContent = open ? "zuklappen" : "Käufe";
      return true;
    }
    if (planEnd) {
      const today = new Date().toISOString().slice(0, 10);
      const end = prompt("Letzte Ausführung am (JJJJ-MM-TT). Spätere gebuchte Käufe fallen weg.", today);
      if (!end) return true;
      await post(`/api/savings-plans/${planEnd}/end`, { end_date: end.trim() });
      toast("Sparplan beendet");
      await VIEWS.money();
      return true;
    }
    if (planDelete) {
      const p = this.plans.plans.find((x) => x.id === +planDelete);
      if (!confirm(`Sparplan „${p?.name}“ löschen? Seine ${p?.executions ?? 0} gebuchten Käufe werden mit gelöscht.\nNur wenn er falsch angelegt war – sonst „beenden“.`)) return true;
      await api(`/api/savings-plans/${planDelete}`, { method: "DELETE" });
      toast("Sparplan gelöscht");
      await VIEWS.money();
      return true;
    }
    return false;
  },

  bindPlanForm() {
    $("#reconcile-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const [portfolio, ticker] = fd.key.split("|");
      const quantity = Number(String(fd.quantity).trim().replace(",", "."));
      if (!Number.isFinite(quantity) || quantity <= 0) return toast("Stückzahl: bitte eine Zahl über 0");
      try {
        const r = await post("/api/savings-plans/reconcile", { portfolio, ticker, quantity, as_of: fd.as_of || null });
        const dev = r.deviation_pct.toLocaleString("de-DE");
        toast(Math.abs(r.deviation_pct) > 5
          ? `Abgeglichen, aber Abweichung ${dev} %: fehlen Ausführungen oder stimmt ein Plan nicht?`
          : `${r.lots} Käufe abgeglichen (Schätzung lag ${dev} % daneben)`);
        await VIEWS.money();
      } catch (err) { if (err.message !== "auth") toast(err.message); }
    });
    $("#plan-csv-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const r = await post("/api/savings-plans/import", { csv: new FormData(e.target).get("csv") });
        toast(`${r.imported} Sparpläne angelegt${r.booked ? `, ${r.booked} Käufe gebucht` : ", Kurse werden geladen"}`);
        await VIEWS.money();
        Finance.historySoon();
      } catch (err) { if (err.message !== "auth") toast(err.message); }
    });
    $("#plan-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const amount = Number(String(fd.amount).trim().replace(",", "."));
      if (!Number.isFinite(amount) || amount <= 0) return toast("Rate: bitte eine Zahl über 0");
      try {
        const r = await post("/api/savings-plans", { ...fd, amount, day_of_month: +fd.day_of_month, end_date: fd.end_date || null });
        toast(r.booked ? `Sparplan angelegt, ${r.booked} Käufe gebucht` : "Sparplan angelegt, Kurse werden geladen");
        await VIEWS.money();
        Finance.historySoon();
        // Der Server holt fehlende Kurse im Hintergrund und bucht dann; danach einmal neu zeichnen
        setTimeout(() => { if (current === "money" && !view.contains(document.activeElement?.closest("form"))) VIEWS.money().catch(() => {}); }, 8000);
      } catch (err) { if (err.message !== "auth") toast(err.message); }
    });
  },

  async history() {
    const range = sessionStorage.getItem("range") || "1J";
    $("#hist-head").innerHTML = `<div class="seg" role="group" aria-label="Zeitraum">${RANGES.map((r) =>
      `<button data-range="${r}" class="${r === range ? "on" : ""}" aria-pressed="${r === range}">${r === "MAX" ? "Max" : r}</button>`).join("")}</div>`;
    const host = $("#hist");
    const h = await api(`/api/portfolio/history?range=${range}`);
    const notes = [];
    if (h.without_date.length) notes.push(`Ohne Kaufdatum, daher nicht im Verlauf: ${h.without_date.map(esc).join(", ")}`);
    if (h.incomplete_days) notes.push(`${h.incomplete_days} Tage ohne vollständige Kurse ausgelassen`);
    if (!h.points.length) {
      host.innerHTML = `<p class="empty">Noch kein Verlauf. Positionen brauchen ein Kaufdatum, dann „Kurshistorie laden“.</p>`;
    } else {
      lineChart(host, h.points, [
        { key: "total", label: "Vermögen", color: "#3ee8ff" },
        { key: "invested", label: "Investiert", color: "#a9a0d6", dash: true },
      ], {
        label: "Vermögensverlauf",
        height: $("#card-hist").classList.contains("max") ? Math.max(300, window.innerHeight - 260) : 240,
        diff: (p) => `<br>G/V: <span class="${cls(p.total - p.invested)}">${eur(p.total - p.invested)}</span>`,
      });
      const last = h.points[h.points.length - 1], firstP = h.points[0];
      const change = last.total - firstP.total - (last.invested - firstP.invested);
      host.insertAdjacentHTML("afterbegin", `<p class="sub">Im Zeitraum: <span class="${cls(change)}">${change >= 0 ? "+" : ""}${eur(change)}</span>
        Kursgewinn (ohne neu investiertes Geld)</p>`);
      host.insertAdjacentHTML("beforeend", `<details><summary>Als Tabelle</summary><div class="table-wrap"><table class="pos-table">
        <thead><tr><th>Datum</th><th class="num">Vermögen</th><th class="num">Investiert</th></tr></thead>
        <tbody>${h.points.filter((_, i, a) => i % Math.max(1, Math.round(a.length / 24)) === 0 || i === a.length - 1).reverse()
          .map((p) => `<tr><td>${esc(fmtDate(p.date))}</td><td class="num">${eur(p.total)}</td><td class="num">${eur(p.invested)}</td></tr>`).join("")}</tbody>
      </table></div></details>`);
    }
    $("#hist-notes").innerHTML = notes.map((n) => `<p class="muted">${n}</p>`).join("");
  },

  form(p) {
    const v = (k, def = "") => esc(p?.[k] ?? def);
    return `
      <form class="form" id="pos-form">
        <div class="two"><input name="portfolio" list="pf-list" placeholder="Portfolio, z. B. Trade Republic" required value="${v("portfolio")}">
          <input name="name" placeholder="Name" required value="${v("name")}"></div>
        <datalist id="pf-list">${[...new Set(["DKB", "Trade Republic", ...this.data.positions.map((x) => x.portfolio)])].map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
        <div class="two"><input name="ticker" placeholder="Yahoo-Symbol, z. B. EUNL.DE" value="${v("ticker")}"><input name="isin" placeholder="ISIN" value="${v("isin")}"></div>
        <div class="two"><input name="quantity" type="number" step="any" placeholder="Stückzahl" required value="${v("quantity")}">
          <input name="entry_price" type="number" step="any" placeholder="Einstiegskurs je Stück" required value="${v("entry_price")}"></div>
        <div class="two"><input name="currency" value="${v("currency", "EUR")}" aria-label="Währung" placeholder="Währung">
          <input name="bought_at" type="date" aria-label="Kaufdatum" value="${v("bought_at")}"></div>
        <div class="two"><input name="asset_class" list="ac-list" placeholder="Anlageklasse (ETF, Aktie, Krypto, Cash)" value="${v("asset_class")}">
          <input name="region" placeholder="Region" value="${v("region")}"></div>
        <datalist id="ac-list"><option value="ETF"><option value="Aktie"><option value="Krypto"><option value="Cash"><option value="Anleihe"><option value="Rohstoff"></datalist>
        <input name="manual_price" type="number" step="any" placeholder="Fester Wert je Stück (nur ohne Symbol, z. B. Tagesgeld)" value="${v("manual_price")}">
        <div class="capture-row">
          <button class="primary">${p ? "Änderung speichern" : "Position anlegen"}</button>
          ${p ? `<button type="button" class="ghost" data-fin="cancel">Abbrechen</button>
            <button type="button" class="link overdue" data-delete="${p.id}">Position löschen</button>` : ""}
        </div>
      </form>`;
  },

  bindForm() {
    $("#pos-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      for (const k of ["quantity", "entry_price", "manual_price"]) f[k] = f[k] === "" ? null : +f[k];
      for (const k of ["ticker", "isin", "asset_class", "region", "bought_at"]) f[k] = f[k] || null;
      f.currency = (f.currency || "EUR").toUpperCase();
      try {
        if (this.editing) await api(`/api/positions/${this.editing}`, { method: "PUT", body: f });
        else await post("/api/positions", f);
        toast(this.editing ? "Position gespeichert, Kurshistorie wird geladen" : "Position angelegt, Kurshistorie wird geladen");
        this.editing = null;
        await VIEWS.money();
        this.historySoon();
      } catch (err) { toast(err.message); }
    });
  },

  async click(e) {
    const b = e.target.closest("button");
    if (!b) return;
    const { fin, dim, range, edit } = b.dataset;
    try {
      if (await this.planClick(b)) return;
      if (fin === "refresh") return await VIEWS.money(true);
      if (fin === "up") { this.focus = null; return this.allocation(); }
      if (fin === "max") return this.toggleMax(b.closest(".chart-card"));
      if (fin === "sync") {
        b.disabled = true; b.textContent = "Lade Kurshistorie …";
        const r = await post("/api/portfolio/history/sync");
        const errors = Object.entries(r.synced).filter(([, v]) => typeof v === "string");
        toast(errors.length ? `Fehler bei: ${errors.map(([k]) => k).join(", ")}` : "Kurshistorie aktuell");
        b.disabled = false; b.textContent = "Kurshistorie laden";
        return await this.history();
      }
      if (fin === "cancel") { this.editing = null; $("#form-slot").innerHTML = this.form(); return this.bindForm(); }
      if (dim) { sessionStorage.setItem("dim", dim); return this.allocation(); }
      if (range) { sessionStorage.setItem("range", range); return await this.history(); }
      if (edit) {
        this.editing = +edit;
        $("#form-slot").innerHTML = this.form(this.data.positions.find((p) => p.id === +edit));
        this.bindForm();
        $("#pos-details").open = true;
        return $("#pos-form").scrollIntoView({ behavior: "smooth", block: "center" });
      }
      const planLot = b.dataset.delete && this.data.positions.find((p) => p.id === +b.dataset.delete)?.plan_id;
      if (b.dataset.delete && confirm(planLot
        ? "Diesen Sparplan-Kauf löschen? Er wird danach nicht wieder gebucht (z. B. wenn die Ausführung ausfiel)."
        : "Position wirklich löschen?")) {
        await api(`/api/positions/${b.dataset.delete}`, { method: "DELETE" });
        this.editing = null;
        toast("Position gelöscht");
        return await VIEWS.money();
      }
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },

  /** Steuerrücklage je Portfolio: zählt nicht zum Vermögen, wird nur von "verfügbar" abgezogen. */
  reserveForm(ps) {
    const pid = ps[0].portfolio_id;
    const r = (this.data.tax_reserves || []).find((x) => x.id === pid);
    const amount = r ? r.tax_reserve : 0;
    return `<details class="reserve-edit"><summary>Steuern: ${eur(amount)}</summary>
      <form class="form reserve-form" data-pid="${pid}">
        <label>Rücklage (€)<input name="amount" inputmode="decimal" required value="${String(amount).replace(".", ",")}"></label>
        <label>Zweck<input name="note" value="${esc(r?.tax_reserve_note || "")}" placeholder="z. B. Abgeltungsteuer 2026"></label>
        <button class="primary">Speichern</button>
      </form></details>`;
  },

  async saveReserve(form) {
    const fd = new FormData(form);
    const amount = Number(String(fd.get("amount")).trim().replace(",", "."));
    if (!Number.isFinite(amount) || amount < 0) return toast("Rücklage: bitte eine Zahl ab 0");
    try {
      await post(`/api/portfolios/${form.dataset.pid}/tax-reserve`, { amount, note: fd.get("note") || null });
      toast("Steuerrücklage gespeichert");
      await VIEWS.money();
    } catch (err) { if (err.message !== "auth") toast(err.message); }
  },

  /** Der Server lädt die Kurshistorie nach dem Speichern im Hintergrund; kurz danach neu zeichnen. */
  historySoon() {
    [5000, 15000].forEach((ms) => setTimeout(() => {
      if (current === "money" && $("#hist")) this.history().catch(() => {});
    }, ms));
  },

    toggleMax(card) {
    const on = !card.classList.contains("max");
    card.classList.toggle("max", on);
    card.querySelector("[data-fin=max]").textContent = on ? "✕ Schließen" : "⛶ Vergrößern";
    document.body.classList.toggle("noscroll", on);
    if (card.id === "card-hist") this.history().catch(showError);
  },
};

Object.assign(VIEWS, {
  async money(force = false) {
    if (!Finance.data) view.innerHTML = `<h1>${tx("Finanzen")}</h1><p class="empty">Kurse werden geladen …</p>`;
    await Finance.load(force);
    const d = Finance.data;
    if (Finance.focus && !d.positions.some((p) => p.portfolio === Finance.focus)) Finance.focus = null;
    const groups = {};
    d.positions.forEach((p) => (groups[p.portfolio] ||= []).push(p));
    view.innerHTML = `
      <h1>${tx("Finanzen")}</h1>
      ${Finance.worth(d)}
      ${d.positions.length ? `
      <div class="fin-grid">
        <section class="panel chart-card" id="card-alloc" style="--accent:var(--orange)">
          <header class="ptitle"><span>◆ Verteilung</span><button data-fin="max">⛶ Vergrößern</button></header>
          <div id="alloc-head" class="chart-head"></div>
          <div id="alloc"></div>
        </section>
        <section class="panel chart-card" id="card-hist" style="--accent:var(--cyan)">
          <header class="ptitle"><span>Vermögensverlauf</span><button data-fin="max">⛶ Vergrößern</button></header>
          <div id="hist-head" class="chart-head"></div>
          <div id="hist"><p class="empty">Lade …</p></div>
          <div id="hist-notes"></div>
          <button class="ghost" data-fin="sync">Kurshistorie laden</button>
        </section>
      </div>
      <h2>Positionen</h2>
      ${Object.entries(groups).map(([name, ps]) => `<div class="pos-group"><h3>${Skin.portfolioIcon(name, ps)}${esc(name)} ·
        ${eur(ps.reduce((s, p) => s + (p.value || 0), 0))}</h3>${Finance.reserveForm(ps)}${Finance.positionTable(ps)}</div>`).join("")}` :
      `<p class="empty">Noch keine Positionen. Lege unten die erste an oder importiere eine CSV.</p>`}
      ${Finance.plansSection()}
      <h2>Pflegen</h2>
      <details id="pos-details" ${d.positions.length ? "" : "open"}><summary>Position anlegen</summary><div id="form-slot">${Finance.form()}</div></details>
      <details><summary>CSV importieren</summary>
        <p class="muted">Spalten: portfolio;name;ticker;isin;quantity;entry_price;manual_price;currency;asset_class;region;bought_at
          (Kaufdatum als JJJJ-MM-TT, Dezimalkomma erlaubt, manual_price leer = Kurs holen)</p>
        <form class="form" id="csv-form"><textarea name="csv" placeholder="CSV hier einfügen"></textarea><button class="primary">Importieren</button></form>
      </details>
      <details><summary>Steuerrücklagen importieren</summary>
        <p class="muted">Spalten: portfolio;tax_reserve;note. Nur bestehende Portfolios; ein unbekannter Name bricht den ganzen Import ab.</p>
        <form class="form" id="reserve-csv-form"><textarea name="csv" placeholder="portfolio;tax_reserve;note"></textarea><button class="primary">Importieren</button></form>
      </details>`;
    view.onclick = (e) => Finance.click(e);
    view.onsubmit = (e) => {
      if (!e.target.matches(".reserve-form")) return;
      e.preventDefault();
      Finance.saveReserve(e.target);
    };
    if (d.positions.length) {
      Finance.allocation();
      Finance.history().catch(showError);
    }
    Finance.bindForm();
    Finance.bindPlanForm();
    $("#csv-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const r = await post("/api/portfolio/import", { csv: new FormData(e.target).get("csv") });
        toast(`${r.imported} Positionen importiert, Kurshistorie wird geladen`);
        await VIEWS.money();
        Finance.historySoon();
      } catch (err) { toast(err.message); }
    });
    $("#reserve-csv-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const r = await post("/api/portfolio/import-tax-reserves", { csv: new FormData(e.target).get("csv") });
        toast(`${r.imported} Steuerrücklagen übernommen`);
        await VIEWS.money();
      } catch (err) { toast(err.message); }
    });
  },
});

document.addEventListener("keydown", (e) => {
  const card = $(".chart-card.max");
  if (e.key === "Escape" && card) Finance.toggleMax(card);
});

</script>
  <script>
"use strict";

// Gesundheit: Schlaf (Dauer + Qualität), Essen (grob als Text), Sport. Eintragen per Sprache,
// Formular oder direkt aus der Push-Mitteilung (öffnet /?log=sleep bzw. /?log=food).
const MEAL_LABEL = { "frühstück": "Frühstück", mittag: "Mittag", abend: "Abend", snack: "Snack", tag: "Über den Tag" };
const QUALITY = ["mies", "schlecht", "okay", "gut", "super"];
const fmtH = (h) => (h == null ? "–" : `${h.toLocaleString("de-DE", { maximumFractionDigits: 1 })} Std`);

/** Balken je Nacht mit Ziellinie. Fehlende Nächte bleiben als Lücke sichtbar (nie geschätzt). */
function sleepChart(series, target) {
  const W = 560, H = 170, L = 30, B = 22, T = 10;
  const max = Math.max(10, target + 1, ...series.map((s) => s.hours || 0));
  const y = (h) => T + (H - T - B) * (1 - h / max);
  const bw = (W - L) / series.length;
  const ticks = [0, 4, 8, 12].filter((t) => t <= max);
  return `<svg class="sleep-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schlaf der letzten ${series.length} Nächte, Ziel ${fmtH(target)}">
    ${ticks.map((t) => `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="sc-grid"/><text x="${L - 6}" y="${y(t) + 4}" class="sc-axis" text-anchor="end">${t}</text>`).join("")}
    ${series.map((s, i) => {
      const x = L + i * bw + bw * 0.18, w = bw * 0.64, d = new Date(s.date + "T12:00");
      const label = `<text x="${x + w / 2}" y="${H - 6}" class="sc-axis" text-anchor="middle">${WD[(d.getDay() + 6) % 7]}</text>`;
      if (s.hours == null) return `${label}<rect x="${x}" y="${y(0) - 2}" width="${w}" height="2" class="sc-gap"><title>${esc(fmtDate(s.date))}: nicht erfasst</title></rect>`;
      return `${label}<rect x="${x}" y="${y(s.hours)}" width="${w}" height="${y(0) - y(s.hours)}" rx="2" class="sc-bar">
        <title>${esc(fmtDate(s.date))}: ${fmtH(s.hours)}${s.quality ? `, ${QUALITY[s.quality - 1]}` : ""}${s.bed ? ` (${s.bed}–${s.wake})` : ""}</title></rect>`;
    }).join("")}
    <line x1="${L}" x2="${W}" y1="${y(target)}" y2="${y(target)}" class="sc-target"/>
    <text x="${W - 4}" y="${y(target) - 5}" class="sc-axis" text-anchor="end">Ziel ${fmtH(target)}</text>
  </svg>`;
}

const Health = {
  data: null,

  async load() { this.data = await api("/api/wellness"); },

  byDay(list) {
    const out = {};
    list.forEach((x) => (out[x.date] ||= []).push(x));
    return Object.entries(out);
  },

  render() {
    const d = this.data, s = d.sleep, last = s.last;
    const t = todayIso();
    const lastBed = last?.bed || "23:00", lastWake = last?.wake || "06:30";
    view.innerHTML = `
      <h1>${tx("Gesundheit")}</h1>
      <p class="sub">Schlaf, Essen, Sport. Schneller per Sprache: „7 Stunden geschlafen, gut“, „Mittag Döner und Salat“, „45 Minuten laufen“.</p>
      <div class="school-stats">
        <div class="stat"><small>Letzte Nacht</small><b>${fmtH(last?.date === t ? last.hours : null)}</b>
          <span class="muted">${last?.date === t ? (last.quality ? QUALITY[last.quality - 1] : "Qualität offen") : "noch nicht eingetragen"}</span></div>
        <div class="stat"><small>Schnitt 7 Nächte</small><b>${fmtH(s.avg7)}</b>
          <span class="muted">${s.debt7 == null ? "keine Daten" : s.debt7 > 0 ? `${fmtH(s.debt7)} unter Ziel` : "Ziel erreicht"}</span></div>
        <div class="stat"><small>Sport diese Woche</small><b>${d.sport.week_sessions} / ${d.sport.target}</b>
          <span class="muted">${d.sport.week_minutes ? fmtMin(d.sport.week_minutes) : d.sport.days_since == null ? "noch nichts" : `zuletzt vor ${d.sport.days_since} T`}</span></div>
        <div class="stat"><small>Essen erfasst</small><b>${d.food.days7} / 7</b><span class="muted">der letzten 7 Tage</span></div>
      </div>

      <div class="quest-grid health-grid">
        <section class="panel" id="sleep-card" style="--accent:var(--violet)">
          <header class="ptitle"><span>☾ Schlaf</span></header>
          ${sleepChart(s.series, s.target)}
          <form class="form" id="sleep-form">
            <div class="two">
              <label class="field">Eingeschlafen<input name="bed_time" type="time" value="${esc(lastBed)}" required></label>
              <label class="field">Aufgewacht<input name="wake_time" type="time" value="${esc(lastWake)}" required></label>
            </div>
            <div class="seg quality" role="radiogroup" aria-label="Wie erholt?">
              ${QUALITY.map((q, i) => `<label><input type="radio" name="quality" value="${i + 1}" ${i === 2 ? "checked" : ""}><span>${i + 1} · ${q}</span></label>`).join("")}
            </div>
            <div class="two"><input name="date" type="date" value="${t}" aria-label="Aufwachtag"><button class="primary">Schlaf speichern</button></div>
          </form>
        </section>

        <section class="panel" id="food-card" style="--accent:var(--orange)">
          <header class="ptitle"><span>🍽 Essen</span></header>
          <form class="form" id="food-form">
            <div class="two"><select name="meal" aria-label="Mahlzeit">${Object.entries(MEAL_LABEL).map(([k, l]) =>
              `<option value="${k}" ${k === this.mealNow() ? "selected" : ""}>${l}</option>`).join("")}</select>
              <input name="date" type="date" value="${t}" aria-label="Tag"></div>
            <div class="form inline"><input name="text" placeholder="z. B. Brötchen mit Käse, Apfel" required autocomplete="off"><button class="primary">+</button></div>
          </form>
          ${d.food.recent.length ? this.byDay(d.food.recent).map(([day, meals]) => `
            <div class="sub-h">${day === t ? "Heute" : esc(fmtDate(day))}</div>
            <ul class="list">${meals.map((m) => `<li><div class="grow"><span class="kind-tag">${esc(MEAL_LABEL[m.meal] || m.meal)}</span> ${esc(m.text)}</div>
              <button class="link" data-del="food:${m.id}" aria-label="Löschen: ${esc(m.text)}">✕</button></li>`).join("")}</ul>`).join("")
            : `<p class="empty">Noch nichts eingetragen. Grob reicht, Kalorien zählt Jarvis bewusst nicht.</p>`}
        </section>

        <section class="panel" id="sport-card" style="--accent:var(--lime)">
          <header class="ptitle"><span>⚡ Sport</span></header>
          <form class="form" id="sport-form">
            <div class="two"><input name="kind" placeholder="z. B. Laufen" list="sport-kinds" required autocomplete="off">
              <select name="minutes" aria-label="Dauer">${[15, 30, 45, 60, 90, 120].map((m) => `<option value="${m}" ${m === 45 ? "selected" : ""}>${fmtMin(m)}</option>`).join("")}</select></div>
            <datalist id="sport-kinds">${[...new Set(["Laufen", "Fußball", "Krafttraining", "Radfahren", "Schwimmen", ...d.sport.recent.map((x) => x.kind)])].map((k) => `<option value="${esc(k)}">`).join("")}</datalist>
            <div class="two"><input name="date" type="date" value="${t}" aria-label="Tag"><button class="primary">Sport speichern</button></div>
          </form>
          ${d.sport.recent.length ? `<ul class="list">${d.sport.recent.slice(0, 8).map((x) => `<li><div class="grow">${esc(x.kind)}${x.minutes ? ` · ${fmtMin(x.minutes)}` : ""}
            <div class="meta">${x.date === t ? "Heute" : esc(fmtDate(x.date))}</div></div>
            <button class="link" data-del="sport:${x.id}" aria-label="Löschen: ${esc(x.kind)}">✕</button></li>`).join("")}</ul>`
            : `<p class="empty">Noch kein Sport eingetragen. Die Sport-Gewohnheit in der Checkliste wird automatisch mit abgehakt.</p>`}
        </section>
      </div>`;
    this.bind();
    this.deepLink();
  },

  mealNow() {
    const h = new Date().getHours();
    return h < 10 ? "frühstück" : h < 15 ? "mittag" : h < 17 ? "snack" : h < 21 ? "abend" : "tag";
  },

  /** Aus der Push-Mitteilung: passendes Formular öffnen und hervorheben. */
  deepLink() {
    const want = new URLSearchParams(location.search).get("log");
    if (!want) return;
    history.replaceState(null, "", location.pathname + location.hash);
    const card = $(`#${want}-card`);
    if (!card) return;
    card.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
    card.classList.add("callout");
    card.querySelector("input:not([type=radio]):not([type=date])")?.focus({ preventScroll: true });
  },

  bind() {
    const form = (id, url, build, msg) => $(id).addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await post(url, build(Object.fromEntries(new FormData(e.target))));
        Sfx.play("coin");
        toast(msg);
        await this.load();
        this.render();
      } catch (err) { showError(err); }
    });
    form("#sleep-form", "/api/wellness/sleep", (f) => ({ ...f, quality: +f.quality }), "Schlaf gespeichert");
    form("#food-form", "/api/wellness/food", (f) => f, "Essen gespeichert");
    form("#sport-form", "/api/wellness/sport", (f) => ({ ...f, minutes: +f.minutes }), "Sport gespeichert");
    view.onclick = async (e) => {
      const del = e.target.closest("[data-del]")?.dataset.del;
      if (!del || !confirm("Eintrag löschen? Das lässt sich nicht rückgängig machen.")) return;
      const [kind, id] = del.split(":");
      try {
        await api(`/api/wellness/${kind}/${id}`, { method: "DELETE" });
        await this.load();
        this.render();
      } catch (err) { showError(err); }
    };
  },
};

Object.assign(VIEWS, {
  async health() {
    await Health.load();
    Health.render();
  },
});

</script>
  <script>
"use strict";

// News: je Rubrik eine Spalte. Oben die Zusammenfassung (Claude, jeder Punkt mit Quellen),
// darunter die neuesten Schlagzeilen. Links öffnen die Originalseite in einem neuen Tab.
const ago = (iso) => {
  if (!iso) return "";
  const min = Math.round((Date.now() - new Date(iso.replace(" ", "T"))) / 60000);  // Safari: "T" statt Leerzeichen
  if (Number.isNaN(min)) return "";
  return min < 60 ? `vor ${Math.max(1, min)} Min` : min < 24 * 60 ? `vor ${Math.round(min / 60)} Std` : fmtDate(iso.slice(0, 10));
};
const extLink = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`;

const News = {
  data: null,

  async load() { this.data = await api("/api/news"); },

  column(c) {
    const pts = c.digest?.points || [];
    return `<section class="panel news-col">
      <header class="ptitle"><span>${esc(c.name)}</span>${c.digest ? `<span class="muted-inv">${esc(ago(c.digest.created_at))}</span>` : ""}</header>
      ${pts.length ? `<ol class="digest">${pts.map((p) => `<li><p>${esc(p.text)}</p>
        <div class="srcs">${p.sources.map((s) => extLink(s.url, esc(s.source))).join("")}</div></li>`).join("")}</ol>`
        : `<p class="empty">${this.data.summaries ? "Noch keine Zusammenfassung – kommt mit dem nächsten Abruf." : "Zusammenfassung braucht den Anthropic-API-Key. Schlagzeilen gibt es trotzdem:"}</p>`}
      <div class="sub-h">Schlagzeilen</div>
      ${c.headlines.length ? `<ul class="headlines">${c.headlines.map((h) => `<li>${extLink(h.url, esc(h.title))}
        <div class="meta">${esc(h.source)} · ${esc(ago(h.published))}</div></li>`).join("")}</ul>`
        : `<p class="empty">Noch nichts abgerufen.</p>`}
    </section>`;
  },

  render() {
    const d = this.data;
    const st = Object.entries(d.status);
    const bad = st.filter(([, v]) => !v.ok);
    const lastAt = st.map(([, v]) => v.at).sort().pop();
    view.innerHTML = `
      <h1>${tx("News")}</h1>
      <p class="sub">${lastAt ? `Abgerufen ${esc(ago(lastAt))} aus ${st.length - bad.length} von ${st.length} Quellen.` : "Noch kein Abruf."}
        <button class="link" id="news-refresh">Jetzt abrufen</button> · <a href="#settings">Quellen ändern</a></p>
      ${bad.length ? `<p class="rec warning"><span class="grow">Nicht erreichbar: ${bad.map(([k, v]) => `${esc(k)} (${esc(v.error)})`).join("; ")}</span></p>` : ""}
      <div class="news-grid">${d.categories.map((c) => this.column(c)).join("")}</div>`;
    $("#news-refresh").onclick = async (e) => {
      e.target.disabled = true;
      e.target.textContent = "ruft ab …";
      try {
        await post("/api/news/refresh");
        await this.load();
        this.render();
      } catch (err) { showError(err); e.target.disabled = false; e.target.textContent = "Jetzt abrufen"; }
    };
  },
};

Object.assign(VIEWS, {
  async news() {
    await News.load();
    News.render();
  },
});

</script>
  <script>
"use strict";

Skin.apply();

// Leertaste = Aufnahme starten/stoppen, Escape = abbrechen (nur auf dem HUD, nicht beim Tippen)
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {  // schließt, was gerade offen ist: Jarvis-Overlay, dann Detailansicht
    if (!$("#jarvis-overlay").hidden) { Dock.close(); return; }
    if (Hud.open) { Hud.closeDetail(); return; }
  }
  if (current !== "today" || !$("#mic") || e.target.closest("input, textarea, select, button, [contenteditable]")) return;
  if (Hud.open) return;  // Details offen: Leertaste nicht fürs Mikro
  if (e.code === "Space") { e.preventDefault(); Voice.toggle(); }
  if (e.key === "Escape") Voice.cancel();
});
window.addEventListener("hashchange", () => { current = location.hash.slice(1) || "today"; render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && current === "money") render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
render();

</script>
